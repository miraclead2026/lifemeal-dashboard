const moveToTrash = (d, type, id) => {
  const trash = d.trash || [];
  const payload = { outputs: [], plans: [], subplans: [], checklists: [], budgets: [], kpiLogs: [], mainKpi: null };
  let outputs = d.outputs, plans = d.plans, subplans = d.subplans, checklists = d.checklists;
  let budgets = d.budgets || [], kpiLogs = d.kpiLogs || [], mainKpis = d.mainKpis || [];
  let label = '';
  if (type === 'output') {
    const o = outputs.find(x => x.id === id); if (!o) return d;
    const pIds = plans.filter(p => p.outputId === id).map(p => p.id);
    const sIds = subplans.filter(s => pIds.includes(s.planId)).map(s => s.id);
    payload.outputs = outputs.filter(x => x.id === id);
    payload.plans = plans.filter(p => p.outputId === id);
    payload.subplans = subplans.filter(s => pIds.includes(s.planId));
    payload.checklists = checklists.filter(c => sIds.includes(c.subplanId));
    payload.kpiLogs = kpiLogs.filter(l => pIds.includes(l.planId));
    payload.budgets = budgets.filter(b => b.outputId === id || pIds.includes(b.planId) || sIds.includes(b.subplanId));
    label = '프로젝트 · ' + outLabel(o);
    outputs = outputs.filter(x => x.id !== id);
    plans = plans.filter(p => p.outputId !== id);
    subplans = subplans.filter(s => !pIds.includes(s.planId));
    checklists = checklists.filter(c => !sIds.includes(c.subplanId));
    kpiLogs = kpiLogs.filter(l => !pIds.includes(l.planId));
    budgets = budgets.filter(b => !(b.outputId === id || pIds.includes(b.planId) || sIds.includes(b.subplanId)));
  } else if (type === 'plan') {
    const p = plans.find(x => x.id === id); if (!p) return d;
    const sIds = subplans.filter(s => s.planId === id).map(s => s.id);
    payload.plans = plans.filter(x => x.id === id);
    payload.subplans = subplans.filter(s => s.planId === id);
    payload.checklists = checklists.filter(c => sIds.includes(c.subplanId));
    payload.kpiLogs = kpiLogs.filter(l => l.planId === id);
    payload.budgets = budgets.filter(b => b.planId === id || sIds.includes(b.subplanId));
    label = '실행계획 · ' + p.name;
    plans = plans.filter(x => x.id !== id);
    subplans = subplans.filter(s => s.planId !== id);
    checklists = checklists.filter(c => !sIds.includes(c.subplanId));
    kpiLogs = kpiLogs.filter(l => l.planId !== id);
    budgets = budgets.filter(b => !(b.planId === id || sIds.includes(b.subplanId)));
  } else if (type === 'subplan') {
    const s = subplans.find(x => x.id === id); if (!s) return d;
    payload.subplans = subplans.filter(x => x.id === id);
    payload.checklists = checklists.filter(c => c.subplanId === id);
    payload.kpiLogs = kpiLogs.filter(l => l.subplanId === id);
    payload.budgets = budgets.filter(b => b.subplanId === id);
    label = '세부실행계획 · ' + s.name;
    subplans = subplans.filter(x => x.id !== id);
    checklists = checklists.filter(c => c.subplanId !== id);
    kpiLogs = kpiLogs.filter(l => l.subplanId !== id);
    budgets = budgets.filter(b => b.subplanId !== id);
  } else if (type === 'budget') {
    const b = budgets.find(x => x.id === id); if (!b) return d;
    payload.budgets = budgets.filter(x => x.id === id);
    const nm = budgetNames(d, b);
    label = '예산 · ' + (nm.detail || b.vendor) + ' ' + won(itemTotal(b));
    budgets = budgets.filter(x => x.id !== id);
  } else if (type === 'mainKpi') {
    const mk = mainKpis.find(x => x.id === id); if (!mk) return d;
    payload.mainKpi = mk;
    label = '메인 KPI · ' + mk.name;
    mainKpis = mainKpis.filter(x => x.id !== id);
  } else return d;
  const entry = { id: Date.now(), type, label, deletedAt: TODAY, payload };
  return { ...d, outputs, plans, subplans, checklists, budgets, kpiLogs, mainKpis, trash: [entry, ...trash] };
};

const pad = n => String(n).padStart(2, '0');
const monthRange = (offset) => { const d = new Date(TODAY + 'T00:00:00'); let y = d.getFullYear(); let m = d.getMonth() + offset; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; const lastDay = new Date(y, m + 1, 0).getDate(); return { start: `${y}-${pad(m + 1)}-01`, end: `${y}-${pad(m + 1)}-${pad(lastDay)}`, key: `${y}-${pad(m + 1)}` }; };
const daysInMonth = key => { const [y, m] = key.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const dateDiff = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000) + 1;
const monthsInRange = (start, end) => {
  const res = []; let cur = start.slice(0, 7); const endKey = end.slice(0, 7); let guard = 0;
  while (cur <= endKey && guard < 36) {
    const [y, m] = cur.split('-').map(Number);
    const mStart = `${y}-${pad(m)}-01`;
    const mEnd = `${y}-${pad(m)}-${pad(new Date(y, m, 0).getDate())}`;
    const segStart = start > mStart ? start : mStart;
    const segEnd = end < mEnd ? end : mEnd;
    res.push({ key: cur, days: dateDiff(segStart, segEnd), totalDays: daysInMonth(cur) });
    let nm = m + 1, ny = y; if (nm > 12) { nm = 1; ny++; } cur = `${ny}-${pad(nm)}`; guard++;
  }
  return res;
};

        <div style={{ fontWeight: 700, fontSize: 13, color: G, marginBottom: 7 }}>1. 출력 프로젝트</div>
        <Toggle mode={oMode} setMode={setOMode} opts={[{ v: 'exist', l: '기존 선택' }, { v: 'new', l: '+ 새로 추가' }]} />
        {oMode === 'exist' ? <Sel value={oSel} onChange={setOSel} ph="선택..." opts={data.outputs.map(o => ({ v: o.id, l: o.code + ' · ' + o.name }))} /> :
          <div style={{ background: '#F9FAFB', borderRadius: 10, padding: 12, border: '1px solid #EEF0F2' }}>
            <Lbl c="분류" /><div style={{ display: 'flex', gap: 6, marginBottom: 8, flexWrap: 'wrap' }}>{data.categories.map((cat, i) => <button key={cat.name} onClick={() => setOCls(cat.name)} style={{ padding: '7px 12px', borderRadius: 8, border: 'none', cursor: 'pointer', fontSize: 12, fontWeight: 600, background: oCls === cat.name ? CAT_PALETTE[i % CAT_PALETTE.length] : '#E5E7EB', color: oCls === cat.name ? 'white' : '#374151' }}>{cat.name}</button>)}<button onClick={() => setShowNewCat(!showNewCat)} style={{ padding: '7px 12px', borderRadius: 8, border: '1px dashed ' + G, cursor: 'pointer', fontSize: 12, fontWeight: 600, background: showNewCat ? G : 'white', color: showNewCat ? 'white' : G }}>+ 분류 추가</button></div>
            {showNewCat && <div style={{ background: 'white', borderRadius: 8, padding: 10, border: '1px solid #A7F3D0', marginBottom: 8 }}><div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap: 6, marginBottom: 6 }}><div><Lbl c="분류 제목" /><Inp value={newCatName} onChange={setNewCatName} placeholder="예: 이벤트" /></div><div><Lbl c="분류 코드" /><Inp value={newCatPrefix} onChange={setNewCatPrefix} placeholder="예: E" /></div></div><div style={{ fontSize: 11, color: '#6B7280', marginBottom: 8 }}>코드 뒤 번호(-1, -2…)는 자동 부여됩니다. 예: 코드 "E" → E-1</div><div style={{ display: 'flex', gap: 6 }}><Btn onClick={addCategory} style={{ flex: 1, padding: '7px 0', fontSize: 12 }}>분류 추가</Btn><Btn v="secondary" onClick={() => setShowNewCat(false)} style={{ padding: '7px 14px', fontSize: 12 }}>취소</Btn></div></div>}
            <div style={{ marginBottom: 8 }}><Badge label={newCode} color={catColor} /></div>
            <Inp value={oName} onChange={setOName} placeholder="출력 프로젝트명" />
          </div>}
      </div>
      <div>
        <div style={{ fontWeight: 700, fontSize: 13, color: G, marginBottom: 7 }}>2. 실행계획</div>
        <Toggle mode={pMode} setMode={setPMode} opts={[{ v: 'exist', l: '기존 선택' }, { v: 'new', l: '+ 새로 추가' }]} />
        {pMode === 'exist' ? <Sel value={pSel} onChange={setPSel} ph="선택..." opts={availPlans.map(p => ({ v: p.id, l: p.name }))} /> :
          <div style={{ background: '#F9FAFB', borderRadius: 10, padding: 12, border: '1px solid #EEF0F2' }}><Inp value={pName} onChange={setPName} placeholder="실행계획명" /><DateBlock title="실행계획" d={pDate} set={setPDate} depOpts={depOpts} /></div>}
      </div>
      <div>
        <div style={{ fontWeight: 700, fontSize: 13, color: G, marginBottom: 7 }}>3. 세부 실행계획 <span style={{ fontWeight: 400, color: '#9CA3AF', fontSize: 11 }}>(선택)</span></div>
        <Toggle mode={sMode} setMode={setSMode} opts={[{ v: 'none', l: '없음' }, { v: 'exist', l: '기존 선택' }, { v: 'new', l: '+ 새로 추가' }]} />
        {sMode === 'exist' && <Sel value={sSel} onChange={setSSel} ph="선택..." opts={availSubs.map(s => ({ v: s.id, l: s.name }))} />}
        {sMode === 'new' && <div style={{ background: '#F9FAFB', borderRadius: 10, padding: 12, border: '1px solid #EEF0F2' }}><Inp value={sName} onChange={setSName} placeholder="세부 실행계획명" /><DateBlock title="세부실행계획" d={sDate} set={setSDate} depOpts={depOpts} /></div>}
      </div>
      {(sMode === 'new' || sMode === 'exist') && (
        <div>
          <div style={{ fontWeight: 700, fontSize: 13, color: G, marginBottom: 7 }}>4. 체크리스트</div>
          {checks.map((c, i) => <div key={i} style={{ display: 'flex', gap: 6, marginBottom: 6 }}><input value={c} onChange={e => setChecks(checks.map((x, j) => j === i ? e.target.value : x))} placeholder={'항목 ' + (i + 1)} style={{ flex: 1, padding: '8px 9px', borderRadius: 8, border: '1px solid #D1D5DB', fontSize: 13 }} /><button onClick={() => setChecks(checks.filter((_, j) => j !== i))} style={{ border: 'none', background: '#F3F4F6', borderRadius: 8, color: '#9CA3AF', cursor: 'pointer', width: 34, fontSize: 16 }}>×</button></div>)}
          <Btn v="ghost" onClick={() => setChecks([...checks, ''])} style={{ padding: '5px 0', fontSize: 12 }}>+ 항목 추가</Btn>
        </div>
      )}
      <div>
        <label style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 13, fontWeight: 700, color: G, cursor: 'pointer' }}><input type="checkbox" checked={kpiOn} onChange={e => setKpiOn(e.target.checked)} /> KPI 등록</label>
        {kpiOn && <KpiInput value={kpi} onChange={setKpi} existingTargets={{}} />}
      </div>
      <div>
        <Lbl c="담당자 (다중 선택)" />
        <div style={{ marginBottom: 12 }}><MemberMulti selected={owner} onToggle={m => setOwner(owner.includes(m) ? owner.filter(x => x !== m) : [...owner, m])} /></div>
        <SupportEditor support={support} setSupport={setSupport} />
      </div>
      <div style={{ display: 'flex', gap: 8 }}><Btn onClick={submit} style={{ flex: 1 }}>업무 추가</Btn><Btn v="secondary" onClick={onClose}>취소</Btn></div>
    </ModalShell>
  );
}

function EditModal({ target, data, setData, onClose, onSwitch }) {
  const kind = target.kind;
  const item = kind === 'output' ? data.outputs.find(o => o.id === target.id)
    : kind === 'plan' ? data.plans.find(p => p.id === target.id)
    : data.subplans.find(s => s.id === target.id);
  if (!item) return null;

  const [name, setName] = useState(item.name);
  const [owner, setOwner] = useState(ownersOf(item));
  const [stage, setStage] = useState(item.stage || '예정'), [hold, setHold] = useState(!!(item.hold));
  const [support, setSupport] = useState(item.support || []);
  const [ds, setDs] = useState(item.dep ? { start: '', due: item.due || '', useDep: true, depId: (item.dep.kind === 'plan' ? 'plan-' : 'sub-') + item.dep.id, depDays: String(item.dep.days || '') } : { start: item.start || '', due: item.due || '', useDep: false, depId: '', depDays: '' });
  const [kpiOn, setKpiOn] = useState(!!(item.kpi)), [kpi, setKpi] = useState(() => { if (item.kpi) { const mk = Object.keys(item.kpi.targets || {}); const mo = mk[0] || TODAY.slice(0, 7); const tv = (item.kpi.targets || {})[mo]; return { name: item.kpi.name, unit: item.kpi.unit, month: mo, target: String(tv != null ? tv : (item.kpi.target || '')) }; } return { name: '', unit: kind === 'output' ? '원' : '%', month: TODAY.slice(0, 7), target: '' }; });
  const [confirmDel, setConfirmDel] = useState(false);
  const [newChild, setNewChild] = useState('');

  const currentPlan = kind === 'subplan' ? data.plans.find(p => p.id === item.planId) : null;
  const currentOutput = currentPlan ? data.outputs.find(o => o.id === currentPlan.outputId) : null;
  const [showOutputChg, setShowOutputChg] = useState(false);
  const [newOutputId, setNewOutputId] = useState(currentOutput ? String(currentOutput.id) : '');
  const [newPlanId, setNewPlanId] = useState(currentPlan ? String(currentPlan.id) : '');
  const chgPlans = data.plans.filter(p => p.outputId === Number(newOutputId));

  const [showFile, setShowFile] = useState(false);
  const currentFiles = kind === 'subplan' ? ((data.subplans.find(s => s.id === item.id) || {}).files || []) : [];
  const depOpts = buildDepOpts(data).filter(o => o.v !== (kind === 'plan' ? 'plan-' : 'sub-') + item.id);

  const childPlans = kind === 'output' ? data.plans.filter(p => p.outputId === item.id) : [];
  const childSubs = kind === 'plan' ? data.subplans.filter(s => s.planId === item.id) : [];

  const mkKpi = () => kpiOn ? buildKpi(kpi, item.kpi) : null;

  const save = () => {
    if (!name.trim()) { alert('이름 입력'); return; }
    if (kind === 'output') {
      setData(d => ({ ...d, outputs: d.outputs.map(o => o.id === item.id ? { ...o, name: name.trim(), kpi: mkKpi() } : o) }));
      onClose(); return;
    }
    const dep = parseDep(ds);
    const f = { name: name.trim(), owner, support: support.slice(), start: dep ? '' : ds.start, due: dep ? addDays(TODAY, dep.days) : ds.due, dep, resolved: false };
    if (kind === 'subplan') {
      f.stage = stage;
      if (stage === '완료' && !item.completedAt) f.completedAt = TODAY;
      if (showOutputChg && newPlanId) f.planId = Number(newPlanId);
    }
    if (kind === 'plan') { f.kpi = mkKpi(); f.hold = hold; }
    setData(d => resolveAll(kind === 'plan' ? { ...d, plans: d.plans.map(p => p.id === item.id ? { ...p, ...f } : p) } : { ...d, subplans: d.subplans.map(s => s.id === item.id ? { ...s, ...f } : s) }));
    onClose();
  };

  const del = () => { setData(d => moveToTrash(d, kind, item.id)); onClose(); };

  const addChildPlan = () => { if (!newChild.trim()) return; setData(d => ({ ...d, nid: d.nid + 1, plans: [...d.plans, { id: d.nid + 1, outputId: item.id, name: newChild.trim(), start: '', due: '', owner: ['현수'], support: [], kpi: null, dep: null, resolved: false, hold: false }] })); setNewChild(''); };
  const addChildSub = () => { if (!newChild.trim()) return; setData(d => ({ ...d, nid: d.nid + 1, subplans: [...d.subplans, { id: d.nid + 1, planId: item.id, name: newChild.trim(), stage: '예정', start: '', due: '', owner: (ownersOf(item).length ? ownersOf(item) : ['현수']), support: [], dep: null, resolved: false, files: [], perfRecorded: false }] })); setNewChild(''); };

  const titleMap = { output: '출력 프로젝트 수정', plan: '실행계획 수정', subplan: '세부실행계획 수정' };
  const kpiBlock = (
    <div>
      <label style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 13, fontWeight: 700, color: G, cursor: 'pointer' }}><input type="checkbox" checked={kpiOn} onChange={e => setKpiOn(e.target.checked)} /> KPI {kind === 'output' ? '(프로젝트 단위)' : ''}</label>
      {kpiOn && <><KpiInput value={kpi} onChange={setKpi} existingTargets={(item.kpi && item.kpi.targets) || {}} /><div style={{ fontSize: 11, color: '#9CA3AF', marginTop: 6 }}>※ 달성값은 [업무 성과] 탭의 성과 기록으로 집계됩니다{kind === 'output' ? '. 프로젝트 KPI는 소속 실행계획 KPI들을 합산합니다' : ''}</div></>}
    </div>
  );

  return (
    <ModalShell title={titleMap[kind]} onClose={onClose}>
      <div><Lbl c="이름" /><Inp value={name} onChange={setName} /></div>

      {kind === 'subplan' && (
        <div>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 6 }}>
            <Lbl c="연결된 출력/실행계획" />
            <button onClick={() => setShowOutputChg(!showOutputChg)} style={{ fontSize: 11, padding: '3px 10px', borderRadius: 6, border: '1px solid ' + G, background: showOutputChg ? G : 'white', color: showOutputChg ? 'white' : G, cursor: 'pointer', fontWeight: 600 }}>출력 연결 변경</button>
          </div>
          {!showOutputChg ? (
            <div style={{ fontSize: 12, color: '#374151', background: '#F9FAFB', padding: '8px 10px', borderRadius: 8 }}>
              {currentOutput ? outLabel(currentOutput) : '없음'} {currentPlan ? '▸ ' + currentPlan.name : ''}
            </div>
          ) : (
            <div style={{ background: '#F0F7F2', borderRadius: 10, padding: 12, border: '1px solid #A7F3D0' }}>
              <div style={{ marginBottom: 8 }}><Lbl c="출력 프로젝트" /><Sel value={newOutputId} onChange={v => { setNewOutputId(v); setNewPlanId(''); }} opts={data.outputs.map(o => ({ v: String(o.id), l: outLabel(o) }))} ph="선택..." /></div>
              <div><Lbl c="실행계획" /><Sel value={newPlanId} onChange={setNewPlanId} opts={chgPlans.map(p => ({ v: String(p.id), l: p.name }))} ph="선택..." /></div>
            </div>
          )}
        </div>
      )}

      {kind === 'subplan' && <div><Lbl c="상태" /><div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>{STAGES.map(st => <button key={st} onClick={() => setStage(st)} style={{ padding: '7px 12px', borderRadius: 8, border: 'none', cursor: 'pointer', fontSize: 12, fontWeight: 600, background: stage === st ? stC(st) : '#E5E7EB', color: stage === st ? 'white' : '#374151' }}>{st}</button>)}</div></div>}
      {kind === 'plan' && <div><Lbl c="보류" /><label onClick={() => setHold(!hold)} style={{ display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer', background: hold ? '#F1F5F9' : '#FAFAFA', border: '1.5px solid ' + (hold ? '#94A3B8' : '#E5E7EB'), borderRadius: 10, padding: '10px 14px' }}><div style={{ width: 20, height: 20, borderRadius: 4, border: '2px solid ' + (hold ? '#94A3B8' : '#D1D5DB'), background: hold ? '#94A3B8' : 'white', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>{hold ? <span style={{ color: 'white', fontSize: 12, fontWeight: 900 }}>✓</span> : null}</div><div><div style={{ fontSize: 13, fontWeight: 700 }}>⏸ 보류로 표시</div><div style={{ fontSize: 11, color: '#9CA3AF' }}>보류 탭에서 별도 관리</div></div></label></div>}

      {kind !== 'output' && <div><Lbl c="담당자 (다중 선택)" /><MemberMulti selected={owner} onToggle={m => setOwner(owner.includes(m) ? owner.filter(x => x !== m) : [...owner, m])} /></div>}
      {kind !== 'output' && <SupportEditor support={support} setSupport={setSupport} />}
      {kind !== 'output' && <DateBlock title={kind === 'plan' ? '실행계획' : '세부실행계획'} d={ds} set={setDs} depOpts={depOpts} />}

      {(kind === 'plan' || kind === 'output') && kpiBlock}

      {kind === 'output' && (
        <div style={{ background: '#F9FAFB', borderRadius: 10, padding: 12, border: '1px solid #EEF0F2' }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: G, marginBottom: 8 }}>📋 실행계획 ({childPlans.length})</div>
          {childPlans.length === 0 ? <div style={{ fontSize: 12, color: '#9CA3AF', marginBottom: 8 }}>등록된 실행계획이 없습니다</div> :
            childPlans.map(p => { const subs = data.subplans.filter(s => s.planId === p.id); const done = subs.filter(s => s.stage === '완료').length; return (
              <div key={p.id} style={{ display: 'flex', alignItems: 'center', gap: 8, background: 'white', borderRadius: 8, padding: '8px 10px', marginBottom: 5, border: '1px solid #E5E7EB' }}>
                <div style={{ flex: 1 }}><div style={{ fontSize: 12, fontWeight: 600 }}>{p.name}{p.kpi ? ' 🎯' : ''}{p.hold ? ' ⏸' : ''}</div><div style={{ fontSize: 10, color: '#9CA3AF' }}>{ownerAv(p)} {ownerNm(p)} · 세부 {done}/{subs.length}</div></div>
                <EditBtn onClick={() => onSwitch && onSwitch({ kind: 'plan', id: p.id })} />
              </div>
            ); })}
          <div style={{ display: 'flex', gap: 6, marginTop: 8 }}>
            <input value={newChild} onChange={e => setNewChild(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') addChildPlan(); }} placeholder="새 실행계획명" style={{ flex: 1, padding: '8px 9px', borderRadius: 8, border: '1px solid #D1D5DB', fontSize: 13 }} />
            <Btn v="gold" onClick={addChildPlan} style={{ padding: '8px 14px' }}>+ 추가</Btn>
          </div>
        </div>
      )}

      {kind === 'plan' && (
        <div style={{ background: '#F9FAFB', borderRadius: 10, padding: 12, border: '1px solid #EEF0F2' }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: G, marginBottom: 8 }}>📋 세부 실행계획 ({childSubs.length})</div>
          {childSubs.length === 0 ? <div style={{ fontSize: 12, color: '#9CA3AF', marginBottom: 8 }}>등록된 세부 실행계획이 없습니다</div> :
            childSubs.map(s => (
              <div key={s.id} style={{ display: 'flex', alignItems: 'center', gap: 8, background: 'white', borderRadius: 8, padding: '8px 10px', marginBottom: 5, border: '1px solid #E5E7EB' }}>
                <span style={{ fontSize: 10, padding: '1px 6px', borderRadius: 6, background: stC(s.stage), color: 'white' }}>{s.stage}</span>
                <div style={{ flex: 1, fontSize: 12, fontWeight: 600 }}>{s.name}</div>
                <span style={{ fontSize: 10, color: G }}>{ownerAv(s)}</span>
                <EditBtn onClick={() => onSwitch && onSwitch({ kind: 'subplan', id: s.id })} />
              </div>
            ))}
          <div style={{ display: 'flex', gap: 6, marginTop: 8 }}>
            <input value={newChild} onChange={e => setNewChild(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') addChildSub(); }} placeholder="새 세부 실행계획명" style={{ flex: 1, padding: '8px 9px', borderRadius: 8, border: '1px solid #D1D5DB', fontSize: 13 }} />
            <Btn v="gold" onClick={addChildSub} style={{ padding: '8px 14px' }}>+ 추가</Btn>
          </div>
        </div>
      )}

      {kind === 'subplan' && (
        <div style={{ background: '#F9FAFB', borderRadius: 10, padding: 12, border: '1px solid #EEF0F2' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: G }}>📎 첨부 파일 {currentFiles.length > 0 ? `(${currentFiles.length})` : ''}</div>
            <Btn v="gold" onClick={() => setShowFile(true)} style={{ padding: '5px 12px', fontSize: 12 }}>+ 파일 추가</Btn>
          </div>
          {currentFiles.length === 0 ? (
            <div style={{ fontSize: 12, color: '#9CA3AF', textAlign: 'center', padding: '10px 0' }}>첨부된 파일이 없습니다</div>
          ) : currentFiles.map(f => (
            <div key={f.id} style={{ display: 'flex', alignItems: 'center', gap: 8, background: 'white', borderRadius: 8, padding: '7px 10px', marginBottom: 5, border: '1px solid #E5E7EB' }}>
              <span>{f.name.match(/\.(png|jpg|jpeg|gif|webp)$/i) ? '🖼️' : '📄'}</span>
              <div style={{ flex: 1 }}><div style={{ fontSize: 12, fontWeight: 600 }}>{f.name}</div><div style={{ fontSize: 10, color: '#9CA3AF' }}>{fmtSize(f.size)} · {f.uploadedAt}</div></div>
              {f.driveUrl && <a href={f.driveUrl} target="_blank" rel="noreferrer" style={{ fontSize: 11, color: '#4285F4', fontWeight: 600, textDecoration: 'none' }}>열기</a>}
            </div>
          ))}
        </div>
      )}

      <div style={{ display: 'flex', gap: 8 }}><Btn onClick={save} style={{ flex: 1 }}>저장</Btn><Btn v="secondary" onClick={onClose}>취소</Btn>{confirmDel ? <Btn v="danger" onClick={del}>휴지통으로 이동</Btn> : <Btn v="secondary" onClick={() => setConfirmDel(true)} style={{ color: '#EF4444' }}>삭제</Btn>}</div>
      {showFile && <FileModal subId={item.id} data={data} setData={setData} onClose={() => setShowFile(false)} />}
    </ModalShell>
  );
}

function TabTeam({ data }) {
  const all = data.plans.map(p => ({ ...p })).concat(data.subplans.map(s => ({ ...s })));
  const heldTotal = data.plans.filter(p => p.hold).length + data.subplans.filter(s => s.stage === '보류').length;
  return (
    <div style={{ padding: 20 }}>
      <div style={{ fontSize: 17, fontWeight: 700, color: G, marginBottom: 4 }}>팀 현황</div>
      <div style={{ fontSize: 12, color: '#6B7280', marginBottom: 16 }}>{TODAY} 기준</div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(240px,1fr))', gap: 12 }}>
        {MEMBERS.map(m => {
          const owned = all.filter(x => ownersOf(x).includes(m)); const supp = all.filter(x => x.support && x.support.some(s => s.m === m));
          const subCnt = data.subplans.filter(s => ownersOf(s).includes(m)).length; const done = data.subplans.filter(s => ownersOf(s).includes(m) && s.stage === '완료').length;

function TabWeekly({ data, setData, onEdit }) {
  const [filter, setFilter] = useState('전체'), [offset, setOffset] = useState(0), [exp, setExp] = useState(null), [dragOver, setDragOver] = useState(null);
  const monday = (() => { const d = new Date(TODAY); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd + offset * 7); return d; })();
  const weekDates = DAYS.map((_, i) => { const x = new Date(monday); x.setDate(monday.getDate() + i); return x.toISOString().slice(0, 10); });
  const diffDays = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
  const toggleChk = id => setData(d => ({ ...d, checklists: d.checklists.map(c => c.id === id ? { ...c, done: !c.done } : c) }));
  const planName = id => { const p = data.plans.find(x => x.id === id); return p ? p.name : ''; };
  const onDragStart = (e, s, isSpan) => {
    e.stopPropagation();
    const dur = isSpan ? diffDays(s.start, s.due) : 0;
    e.dataTransfer.setData('sub-id', String(s.id));
    e.dataTransfer.setData('sub-type', isSpan ? 'span' : 'day');
    e.dataTransfer.setData('sub-dur', String(dur));
  };
  const handleDrop = (e, targetDate) => {
    e.preventDefault(); e.stopPropagation();
    const id = Number(e.dataTransfer.getData('sub-id'));
    const type = e.dataTransfer.getData('sub-type');
    const dur = Number(e.dataTransfer.getData('sub-dur') || '0');
    if (!id || !targetDate) return;
    setDragOver(null);
    setData(d => ({ ...d, subplans: d.subplans.map(s => {
      if (s.id !== id) return s;
      if (type === 'span') return { ...s, start: targetDate, due: addDays(targetDate, dur) };
      return { ...s, due: targetDate };
    }) }));
  };
  const handleUnassignedDrop = e => {
    e.preventDefault();
    const id = Number(e.dataTransfer.getData('sub-id'));
    if (!id) return;
    setDragOver(null);
    setData(d => ({ ...d, subplans: d.subplans.map(s => s.id === id ? { ...s, start: '', due: '' } : s) }));
  };
  const subs = data.subplans.filter(s => s.stage !== '보류' && matchOwner(s, filter));
  const spanning = subs.filter(s => s.start && s.due && s.start !== s.due && s.start <= weekDates[6] && s.due >= weekDates[0]);
  const getDayItems = date => subs.filter(s => { if (s.start && s.due && s.start !== s.due) return false; return s.due === date; });
  const unassigned = subs.filter(s => !s.due);

    const p = data.plans.find(x => x.id === s.planId);
    const o = p ? data.outputs.find(x => x.id === p.outputId) : null;
    const oKey = o ? outLabel(o) : '기타';
    const pKey = p ? p.name : '기타';

    grouped[oKey][pKey].push(s);
  });
  const renderMini = (s, hideParent = false) => {
    const chks = data.checklists.filter(c => c.subplanId === s.id); const cd = chks.filter(c => c.done).length;
    const isSpan = !!(s.start && s.due && s.start !== s.due); const files = s.files || [];

          {files.length > 0 && <span style={{ fontSize: 9, color: '#4285F4' }}>📎{files.length}</span>}
        </div>
        {exp === s.id && chks.length > 0 && <div style={{ background: '#F9FAFB', borderRadius: 6, padding: 6, marginTop: 6 }}>{chks.map(c => <div key={c.id} onClick={() => toggleChk(c.id)} style={{ display: 'flex', alignItems: 'center', gap: 5, padding: '3px 0', cursor: 'pointer' }}><Chk on={c.done} /><span style={{ fontSize: 10, color: c.done ? '#9CA3AF' : '#374151', textDecoration: c.done ? 'line-through' : 'none' }}>{c.text}</span></div>)}</div>}

        <div style={{ fontSize: 17, fontWeight: 700, color: G }}>데일리 / 주간 업무</div>

        </div>

                onDrop={e => handleDrop(e, date)}>
                {(() => {
                  let h = 0;
                  spanning.forEach((s, idx) => {
                    const sc = s.start <= weekDates[0] ? 0 : weekDates.indexOf(s.start);

                  });

                })()}

                  {getDayItems(date).map(s => renderMini(s))}
                </div>
              </div>
            ))}
            {spanning.map((s, idx) => {
              const sc = s.start <= weekDates[0] ? 0 : weekDates.indexOf(s.start);
              const ec = s.due >= weekDates[6] ? 6 : weekDates.indexOf(s.due);

              const dur = diffDays(s.start, s.due);

              return (
                <div key={s.id} draggable onDragStart={e => onDragStart(e, s, true)}

                  <Badge label={s.stage} color={stC(s.stage)} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 13, fontWeight: 700, color: '#111', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{s.name}</div>
                    <div style={{ fontSize: 10, color: '#6B7280' }}>{ownerAv(s)} · {s.start.slice(5)}~{s.due.slice(5)} ({dur}일){chks.length > 0 ? ` · ☑ ${cd}/${chks.length}` : ''}</div>

        <div style={{ fontSize: 13, fontWeight: 700, color: '#6B7280', marginBottom: 14 }}>미배정 ({unassigned.length}) <span style={{ fontWeight: 400, fontSize: 11 }}>· 날짜 칸으로 드래그해서 배정 / 달력→미배정 드래그로 해제</span></div>
        {unassigned.length === 0 ? <div style={{ fontSize: 12, color: '#9CA3AF' }}>모든 항목에 날짜가 배정되었습니다.</div> :

                    <div style={{ padding: 8 }}>{tasks.map(s => renderMini(s, true))}</div>

                ))}
              </div>
            </div>

      </div>
    </div>
  );

                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  {inp(value, setValue, 'number', '예: 120')}
                  <span style={{ fontSize: 12, color: '#6B7280', whiteSpace: 'nowrap' }}>{plan.kpi.unit}</span>
                </div>
              </div>
              <div>
                <div style={{ fontSize: 11, color: '#6B7280', marginBottom: 4 }}>달성 기간</div>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr auto 1fr', alignItems: 'center', gap: 8 }}>
                  {inp(pStart, setPStart, 'date')}<span style={{ color: '#9CA3AF' }}>~</span>{inp(pEnd, setPEnd, 'date')}
                </div>
                <div style={{ fontSize: 11, color: '#8B5CF6', marginTop: 6 }}>※ KPI 탭에서 이 기간이 집계 범위에 포함되면 자동 합산됩니다</div>
              </div>

            </div>

          <div style={{ background: '#F9FAFB', borderRadius: 10, padding: 12, border: '1px solid #EEF0F2' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10 }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: G }}>📎 보고서용 자료 {files.length > 0 ? `(${files.length})` : ''}</div>
              <Btn v="gold" onClick={() => setShowFile(true)} style={{ padding: '5px 12px', fontSize: 12 }}>+ 파일 추가</Btn>
            </div>

              files.map(f => (
                <div key={f.id} style={{ background: 'white', borderRadius: 8, padding: '8px 10px', marginBottom: 6, border: '1px solid #E5E7EB' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <span>{f.name.match(/\.(png|jpg|jpeg|gif|webp)$/i) ? '🖼️' : '📄'}</span>
                    <div style={{ flex: 1 }}><div style={{ fontSize: 12, fontWeight: 600 }}>{f.name}</div><div style={{ fontSize: 10, color: '#9CA3AF' }}>{fmtSize(f.size)}</div></div>
                    {f.driveUrl && <a href={f.driveUrl} target="_blank" rel="noreferrer" style={{ fontSize: 11, color: '#4285F4', fontWeight: 600, textDecoration: 'none' }}>열기</a>}
                  </div>
                  {f.desc && <div style={{ fontSize: 11, color: '#6B7280', marginTop: 6, background: '#F9FAFB', borderRadius: 6, padding: '5px 8px' }}>💬 {f.desc}</div>}
                </div>
              ))
            }
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <Btn onClick={save} style={{ flex: 1 }}>성과 기록 저장</Btn>
            <Btn v="secondary" onClick={onClose}>취소</Btn>
          </div>
        </div>
      </div>
      {showFile && <FileModal subId={subId} data={data} setData={setData} onClose={() => setShowFile(false)} />}
    </div>
  );
}

function TabPerformance({ data, setData, onRecord }) {
  const [filter, setFilter] = useState('전체');
  const completed = data.subplans.filter(s => s.stage === '완료' && matchOwner(s, filter));
  const recorded = completed.filter(s => s.perfRecorded);
  const notRecorded = completed.filter(s => !s.perfRecorded);
  const planOf = id => data.plans.find(p => p.id === id);
  const outOf = pid => { const p = planOf(pid); return p ? data.outputs.find(o => o.id === p.outputId) : null; };
  const logOf = subId => (data.kpiLogs || []).find(l => l.subplanId === subId);
  const renderCard = (s, isRecorded) => {
    const plan = planOf(s.planId); const out = outOf(s.planId);
    const log = logOf(s.id); const files = s.files || [];
    return (
      <Card key={s.id} style={{ marginBottom: 10, borderLeft: '4px solid ' + (isRecorded ? '#10B981' : '#F59E0B') }}>
        <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10 }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 11, color: '#9CA3AF', marginBottom: 3 }}>{out ? outLabel(out) : ''} ▸ {plan ? plan.name : ''}</div>
            <div style={{ fontSize: 14, fontWeight: 700 }}>{s.name}</div>
            <div style={{ fontSize: 11, color: '#6B7280', marginTop: 4 }}>{ownerAv(s)} {ownerNm(s)} · 완료 {s.completedAt || '미기록'}</div>
            {isRecorded && log && plan && plan.kpi && (
              <div style={{ marginTop: 10, background: '#F0F7F2', borderRadius: 8, padding: '8px 12px' }}>
                <div style={{ fontSize: 12, fontWeight: 700, color: G }}>🎯 {plan.kpi.name}: {log.value.toLocaleString()} {plan.kpi.unit}</div>
                <div style={{ fontSize: 11, color: '#6B7280', marginTop: 2 }}>달성기간 {log.periodStart} ~ {log.periodEnd}</div>
              </div>
            )}
            {isRecorded && files.length > 0 && (
              <div style={{ marginTop: 8 }}>
                {files.map(f => (
                  <div key={f.id} style={{ fontSize: 11, color: '#4285F4', marginBottom: 3 }}>
                    📎 {f.name}{f.desc ? <span style={{ color: '#9CA3AF' }}> — {f.desc}</span> : ''}
                  </div>
                ))}
              </div>
            )}
          </div>
          <button onClick={() => onRecord(s.id)} style={{ padding: '7px 14px', background: isRecorded ? 'white' : G, color: isRecorded ? G : 'white', border: '1px solid ' + G, borderRadius: 8, fontWeight: 600, cursor: 'pointer', fontSize: 12, whiteSpace: 'nowrap' }}>
            {isRecorded ? '기록 수정' : '📊 성과 기록'}
          </button>
        </div>
      </Card>
    );
  };
  return (
    <div style={{ padding: 20 }}>
      <div style={{ fontSize: 17, fontWeight: 700, color: G, marginBottom: 14 }}>업무 성과</div>
      <FilterBar value={filter} onChange={setFilter} />
      <div style={{ marginBottom: 24 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 }}>
          <span style={{ fontSize: 14, fontWeight: 700, color: '#92400E' }}>⏳ 성과 기록 전</span>
          <Badge label={notRecorded.length + '건'} color="#F59E0B" />
        </div>
        {notRecorded.length === 0 ? <Card style={{ textAlign: 'center', padding: 30, color: '#9CA3AF', fontSize: 13 }}>기록할 완료 업무가 없습니다</Card> : notRecorded.map(s => renderCard(s, false))}
      </div>
      <div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 }}>
          <span style={{ fontSize: 14, fontWeight: 700, color: '#10B981' }}>✅ 성과 기록 후</span>
          <Badge label={recorded.length + '건'} color="#10B981" />
        </div>
        {recorded.length === 0 ? <Card style={{ textAlign: 'center', padding: 30, color: '#9CA3AF', fontSize: 13 }}>아직 기록된 성과가 없습니다</Card> : recorded.map(s => renderCard(s, true))}
      </div>
    </div>
  );
}

function TabKpi({ data, setData }) {
  const [pStart, setPStart] = useState(monthRange(0).start);
  const [pEnd, setPEnd] = useState(monthRange(0).end);
  const [expanded, setExpanded] = useState(null);
  const [editLink, setEditLink] = useState(null);
  const mainKpis = data.mainKpis || [];
  const logs = data.kpiLogs || [];
  const rangeMonths = monthsInRange(pStart, pEnd);
  const isSingleMonth = rangeMonths.length === 1;
  const sumForPlan = planId => logs.filter(l => l.planId === planId && l.periodStart <= pEnd && l.periodEnd >= pStart).reduce((a, l) => a + l.value, 0);
  const logsForPlan = planId => logs.filter(l => l.planId === planId && l.periodStart <= pEnd && l.periodEnd >= pStart);
  const plansOfOutput = oid => data.plans.filter(p => p.outputId === oid);
  const sumForOutput = oid => plansOfOutput(oid).reduce((a, p) => a + sumForPlan(p.id), 0);
  const outOf = pid => { const p = data.plans.find(x => x.id === pid); return p ? data.outputs.find(o => o.id === p.outputId) : null; };
  const effTarget = kpi => { const t = (kpi && kpi.targets) || {}; const keys = Object.keys(t); if (keys.length) { return rangeMonths.reduce((acc, mo) => { const v = t[mo.key] || 0; return isSingleMonth ? v : acc + (mo.totalDays ? v / mo.totalDays * mo.days : 0); }, 0); } return Number(kpi && kpi.target) || 0; };

  const presetDays = days => { setPStart(addDay(TODAY, -days)); setPEnd(TODAY); };
  const presetMonth = offset => { const r = monthRange(offset); setPStart(r.start); setPEnd(r.end); };
  const isActivePreset = (s, e) => pStart === s && pEnd === e;

  const setMainMonth = (mkId, key, val) => setData(d => ({ ...d, mainKpis: d.mainKpis.map(mk => mk.id === mkId ? { ...mk, targets: { ...(mk.targets || {}), [key]: Number(val) || 0 } } : mk) }));
  const setOutMonth = (oid, key, val) => setData(d => ({ ...d, outputs: d.outputs.map(o => o.id === oid && o.kpi ? { ...o, kpi: { ...o.kpi, targets: { ...(o.kpi.targets || {}), [key]: Number(val) || 0 } } } : o) }));
  const setPlanMonth = (pid, key, val) => setData(d => ({ ...d, plans: d.plans.map(p => p.id === pid && p.kpi ? { ...p, kpi: { ...p.kpi, targets: { ...(p.kpi.targets || {}), [key]: Number(val) || 0 } } } : p) }));
  const toggleLink = (mkId, planId) => setData(d => ({ ...d, mainKpis: d.mainKpis.map(mk => { if (mk.id !== mkId) return mk; const cur = mk.linkedPlanIds || []; return { ...mk, linkedPlanIds: cur.includes(planId) ? cur.filter(x => x !== planId) : [...cur, planId] }; }) }));
  const addManual = mkId => setData(d => ({ ...d, mainKpis: d.mainKpis.map(mk => mk.id === mkId ? { ...mk, manuals: [...(mk.manuals || []), { id: Date.now(), value: 0, note: '' }] } : mk) }));
  const updManual = (mkId, mId, field, val) => setData(d => ({ ...d, mainKpis: d.mainKpis.map(mk => mk.id === mkId ? { ...mk, manuals: (mk.manuals || []).map(m => m.id === mId ? { ...m, [field]: field === 'value' ? (Number(val) || 0) : val } : m) } : mk) }));
  const delManual = (mkId, mId) => setData(d => ({ ...d, mainKpis: d.mainKpis.map(mk => mk.id === mkId ? { ...mk, manuals: (mk.manuals || []).filter(m => m.id !== mId) } : mk) }));

  const kpiPlansAll = data.plans.filter(p => p.kpi);
  const kpiOutputs = data.outputs.filter(o => o.kpi || data.plans.some(p => p.outputId === o.id && p.kpi));

  const TargetEditor = ({ targets, onSet, unit }) => (
    <div style={{ marginBottom: 12 }}>
      <div style={{ fontSize: 11, fontWeight: 600, color: '#6B7280', marginBottom: 6 }}>🎯 월별 목표 설정</div>
      {isSingleMonth ? (
        <div style={{ background: '#F0F7F2', borderRadius: 8, padding: '10px 12px' }}>
          <div style={{ fontSize: 11, color: '#6B7280', marginBottom: 6 }}>{rangeMonths[0].key} 목표 ({unit})</div>
          <input type="number" value={(targets || {})[rangeMonths[0].key] || ''} onChange={e => onSet(rangeMonths[0].key, e.target.value)} placeholder="이 달 목표 입력" style={{ width: 200, padding: '8px', borderRadius: 8, border: '1px solid #D1D5DB', fontSize: 13, boxSizing: 'border-box' }} />
        </div>
      ) : (
        <div style={{ background: '#FFF7ED', borderRadius: 8, padding: '10px 12px', border: '1px solid #FED7AA' }}>
          <div style={{ fontSize: 12, color: '#92400E', fontWeight: 600, marginBottom: 6 }}>⚠️ 여러 월에 걸친 기간 — 월별 목표는 '이번 달/지난 달' 단일 월 선택 후 입력하세요</div>
          {rangeMonths.map(mo => (
            <div key={mo.key} style={{ fontSize: 11, color: '#78350F', marginBottom: 3 }}>{mo.key}: 월목표 {((targets || {})[mo.key] || 0).toLocaleString()} × {mo.days}/{mo.totalDays}일 = {Math.round(((targets || {})[mo.key] || 0) / mo.totalDays * mo.days).toLocaleString()}</div>
          ))}
        </div>
      )}
    </div>
  );

  const KpiHeader = ({ title, achieved, target, unit, openKey, accent, sub }) => {
    const pr = pct(achieved, target); const done = target > 0 && pr >= 100; const open = expanded === openKey;
    return (
      <div onClick={() => setExpanded(open ? null : openKey)} style={{ cursor: 'pointer' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap', marginBottom: 10 }}>
          <div style={{ flex: '1 1 200px' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}><span style={{ fontSize: 15, fontWeight: 800 }}>{title}</span><span style={{ fontSize: 11, color: '#9CA3AF' }}>{open ? '▲' : '▼'}</span></div>
            {sub && <div style={{ fontSize: 11, color: '#6B7280', marginTop: 2 }}>{sub}</div>}
          </div>
          <div style={{ textAlign: 'right' }}>
            <div style={{ fontSize: 20, fontWeight: 800, color: done ? '#10B981' : accent }}>{achieved.toLocaleString()}</div>
            <div style={{ fontSize: 11, color: '#9CA3AF' }}>/ {Math.round(target).toLocaleString()} {unit}</div>
          </div>
          {done && <Badge label="✓ 달성" color="#10B981" />}
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{ flex: 1 }}><Bar v={achieved} m={target || 1} /></div>
          <span style={{ fontSize: 13, fontWeight: 700, color: done ? '#10B981' : pr < 70 ? '#EF4444' : '#F59E0B', minWidth: 45, textAlign: 'right' }}>{target > 0 ? pr : 0}%</span>
        </div>
      </div>
    );
  };

  return (
    <div style={{ padding: 20 }}>
      <div style={{ fontSize: 17, fontWeight: 700, color: G, marginBottom: 14 }}>KPI 관리</div>

      <Card style={{ marginBottom: 16 }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: G, marginBottom: 10 }}>📅 집계 기간</div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr auto 1fr', alignItems: 'center', gap: 8, marginBottom: 10 }}>
          {inp(pStart, setPStart, 'date')}<span style={{ color: '#9CA3AF' }}>~</span>{inp(pEnd, setPEnd, 'date')}
        </div>
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
          {[['이번 달', () => presetMonth(0), monthRange(0)], ['지난 달', () => presetMonth(-1), monthRange(-1)]].map(([l, fn, r]) => (
            <button key={l} onClick={fn} style={{ padding: '5px 12px', borderRadius: 20, border: '1px solid ' + (isActivePreset(r.start, r.end) ? G : '#E5E7EB'), background: isActivePreset(r.start, r.end) ? G : 'white', color: isActivePreset(r.start, r.end) ? 'white' : '#374151', cursor: 'pointer', fontSize: 12, fontWeight: 600 }}>{l}</button>
          ))}
          {[['최근 7일', 7], ['최근 30일', 30], ['최근 90일', 90]].map(([l, dd]) => {
            const act = isActivePreset(addDay(TODAY, -dd), TODAY);
            return <button key={l} onClick={() => presetDays(dd)} style={{ padding: '5px 12px', borderRadius: 20, border: '1px solid ' + (act ? G : '#E5E7EB'), background: act ? G : 'white', color: act ? 'white' : '#374151', cursor: 'pointer', fontSize: 12, fontWeight: 600 }}>{l}</button>;
          })}
        </div>
      </Card>

      <div style={{ marginBottom: 24 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10 }}>
          <span style={{ fontSize: 14, fontWeight: 800, color: GO }}>⭐ 메인 KPI</span>
          <span style={{ fontSize: 11, color: '#9CA3AF' }}>전사 전체 목표</span>
        </div>
        {mainKpis.map(mk => {
          const linkedIds = mk.linkedPlanIds || [];
          const linked = linkedIds.map(pid => data.plans.find(p => p.id === pid)).filter(Boolean);
          const linkedSum = linkedIds.reduce((a, pid) => a + sumForPlan(pid), 0);
          const manuals = mk.manuals || [];
          const manualSum = manuals.reduce((a, m) => a + (m.value || 0), 0);
          const achieved = linkedSum + manualSum;
          const target = effTarget(mk);
          const linking = editLink === mk.id;
          return (
            <Card key={mk.id} style={{ marginBottom: 10, borderLeft: '4px solid ' + GO }}>
              <KpiHeader title={mk.name} achieved={achieved} target={target} unit={mk.unit} openKey={'main-' + mk.id} accent={GO} sub={`연결 ${linked.length}개${manuals.length > 0 ? ` · 수동 ${manuals.length}건` : ''}`} />
              {expanded === 'main-' + mk.id && (
                <div style={{ marginTop: 12, borderTop: '1px solid #F3F4F6', paddingTop: 12 }}>
                  <div style={{ display: 'flex', justifyContent: 'flex-end', marginBottom: 10 }}><button onClick={() => setData(d => moveToTrash(d, 'mainKpi', mk.id))} style={{ padding: '4px 10px', borderRadius: 6, border: '1px solid #EF4444', background: 'white', color: '#EF4444', cursor: 'pointer', fontSize: 11, fontWeight: 600 }}>🗑 이 메인 KPI 삭제 (휴지통)</button></div>
                  <TargetEditor targets={mk.targets} onSet={(k, v) => setMainMonth(mk.id, k, v)} unit={mk.unit} />
                  <div style={{ display: 'flex', gap: 8, marginBottom: 14, flexWrap: 'wrap' }}>
                    <div style={{ flex: 1, minWidth: 130, background: '#F0F7F2', borderRadius: 8, padding: '8px 12px' }}><div style={{ fontSize: 10, color: '#6B7280' }}>연결 KPI 합산</div><div style={{ fontSize: 15, fontWeight: 700, color: G }}>{linkedSum.toLocaleString()}</div></div>
                    <div style={{ flex: 1, minWidth: 130, background: '#FAF6EE', borderRadius: 8, padding: '8px 12px' }}><div style={{ fontSize: 10, color: '#6B7280' }}>수동 입력 합계</div><div style={{ fontSize: 15, fontWeight: 700, color: GO }}>{manualSum.toLocaleString()}</div></div>
                  </div>
                  <div style={{ marginBottom: 14 }}>
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 6 }}>
                      <div style={{ fontSize: 11, fontWeight: 600, color: '#6B7280' }}>✏️ 수동 입력 ({mk.unit})</div>
                      <button onClick={() => addManual(mk.id)} style={{ fontSize: 11, padding: '3px 10px', borderRadius: 6, border: 'none', background: GO, color: 'white', cursor: 'pointer', fontWeight: 600 }}>+ 추가</button>
                    </div>
                    {manuals.length === 0 ? <div style={{ fontSize: 12, color: '#9CA3AF' }}>직접 입력한 값이 없습니다</div> :
                      manuals.map(m => (
                        <div key={m.id} style={{ display: 'flex', gap: 6, marginBottom: 6, alignItems: 'flex-start' }}>
                          <input type="number" value={m.value || ''} onChange={e => updManual(mk.id, m.id, 'value', e.target.value)} placeholder="값" style={{ width: 100, padding: '8px', borderRadius: 8, border: '1px solid #D1D5DB', fontSize: 13, boxSizing: 'border-box', flexShrink: 0 }} />
                          <input value={m.note || ''} onChange={e => updManual(mk.id, m.id, 'note', e.target.value)} placeholder="설명 (예: 오프라인 팝업 매출)" style={{ flex: 1, padding: '8px', borderRadius: 8, border: '1px solid #D1D5DB', fontSize: 13, boxSizing: 'border-box' }} />
                          <button onClick={() => delManual(mk.id, m.id)} style={{ border: 'none', background: '#F3F4F6', borderRadius: 8, color: '#9CA3AF', cursor: 'pointer', width: 34, height: 35, fontSize: 16, flexShrink: 0 }}>×</button>
                        </div>
                      ))}
                  </div>
                  <div>
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
                      <div style={{ fontSize: 11, fontWeight: 600, color: '#6B7280' }}>🔗 연결된 실행계획 KPI ({linked.length})</div>
                      <button onClick={() => setEditLink(linking ? null : mk.id)} style={{ fontSize: 11, padding: '3px 10px', borderRadius: 6, border: '1px solid ' + G, background: linking ? G : 'white', color: linking ? 'white' : G, cursor: 'pointer', fontWeight: 600 }}>{linking ? '완료' : 'KPI 연결 편집'}</button>
                    </div>
                    {linking ? (
                      <div style={{ background: '#F9FAFB', borderRadius: 8, padding: 10 }}>
                        {kpiPlansAll.length === 0 ? <div style={{ fontSize: 12, color: '#9CA3AF' }}>연결 가능한 KPI가 없습니다</div> :
                          kpiPlansAll.map(p => { const on = linkedIds.includes(p.id); const out = outOf(p.id); return (
                            <label key={p.id} onClick={() => toggleLink(mk.id, p.id)} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '6px 4px', cursor: 'pointer' }}>

        {kpiOutputs.map(o => {

                  planKpis.map(p => {

                      <Card key={p.id} style={{ marginBottom: 8 }}>

                          <div style={{ marginTop: 12, borderTop: '1px solid #F3F4F6', paddingTop: 12 }}>
                            <TargetEditor targets={p.kpi.targets} onSet={(k, v) => setPlanMonth(p.id, k, v)} unit={p.kpi.unit} />
                            {plogs.length > 0 ? (
                              <div>
                                <div style={{ fontSize: 11, fontWeight: 600, color: '#6B7280', marginBottom: 6 }}>이 기간 기여 업무 ({plogs.length}건)</div>
                                {plogs.map(l => { const sub = data.subplans.find(s => s.id === l.subplanId); return (
                                  <div key={l.id} style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12, padding: '4px 0' }}>
                                    <span style={{ flex: 1, color: '#374151' }}>{sub ? sub.name : '삭제된 업무'}</span>
                                    <span style={{ fontSize: 11, color: '#9CA3AF' }}>{l.periodStart.slice(5)}~{l.periodEnd.slice(5)}</span>
                                    <span style={{ fontWeight: 700, color: G }}>+{l.value.toLocaleString()}</span>
                                  </div>
                                ); })}

                          </div>
                        )}
                      </Card>
                    );
                  })}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

  const outName = id => outLabel(data.outputs.find(o => o.id === id));

          <div style={{ marginBottom: 20 }}>

          </div>

          </div>
        </>
      )}
    </div>
  );
}

const VAT_OPTS = ['별도', '포함'], PAY_OPTS = ['세금계산서', '카드결제'], BSTATUS = ['기안전', '기안완료', '결제완료'];
const bStatusC = s => ({ '기안전': '#9CA3AF', '기안완료': '#3B82F6', '결제완료': '#10B981' }[s] || '#9CA3AF');

function TabBudget({ data, setData }) {
  const [showAdd, setShowAdd] = useState(false);
  const budgets = data.budgets || [];
  const month = TODAY.slice(0, 7);
  const monthTotal = budgets.filter(b => b.date.slice(0, 7) === month).reduce((a, b) => a + itemTotal(b), 0);
  const weeks = {}; budgets.forEach(b => { const k = weekKeyOf(b.date); (weeks[k] = weeks[k] || []).push(b); });
  const weekKeys = Object.keys(weeks).sort().reverse();
  const cycleStatus = id => setData(d => ({ ...d, budgets: d.budgets.map(b => b.id === id ? { ...b, status: BSTATUS[(BSTATUS.indexOf(b.status) + 1) % BSTATUS.length] } : b) }));
  const del = id => setData(d => moveToTrash(d, 'budget', id));
  return (
    <div style={{ padding: 20 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 14 }}>
        <div style={{ fontSize: 17, fontWeight: 700, color: G }}>예산 관리</div>
        <button onClick={() => setShowAdd(true)} style={{ marginLeft: 'auto', padding: '7px 14px', borderRadius: 8, border: 'none', cursor: 'pointer', fontSize: 12, fontWeight: 600, background: GO, color: 'white' }}>+ 예산 추가</button>
      </div>
      <SCards items={[{ label: '이번 달 총 예산', value: won(monthTotal), color: G }, { label: '전체 항목', value: budgets.length + '건', color: '#6B7280' }, { label: '기안전', value: budgets.filter(b => b.status === '기안전').length + '건', color: '#9CA3AF' }, { label: '결제완료', value: budgets.filter(b => b.status === '결제완료').length + '건', color: '#10B981' }]} />
      {!budgets.length ? (<Card style={{ textAlign: 'center', padding: 40, color: '#9CA3AF' }}><div style={{ fontSize: 34, marginBottom: 10 }}>💰</div><div>등록된 예산이 없습니다</div></Card>) :
        weekKeys.map(wk => { const list = weeks[wk]; const sub = list.reduce((a, b) => a + itemTotal(b), 0); const end = addDays(wk, 6); return (<Card key={wk} style={{ padding: 0, overflow: 'hidden', marginBottom: 16 }}><div style={{ display: 'flex', alignItems: 'center', padding: '10px 14px', background: '#F7FBF8', borderBottom: '1px solid #EEF0F2' }}><span style={{ fontSize: 13, fontWeight: 700, color: G }}>{wk.slice(5)} ~ {end.slice(5)} 주간</span><span style={{ marginLeft: 'auto', fontSize: 12, fontWeight: 700, color: G }}>{won(sub)}</span></div><div style={{ overflowX: 'auto' }}><table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 12, minWidth: 600 }}><thead><tr style={{ background: '#FAFAFA' }}>{['일자', '세부항목', '업체', '금액', '결제방법', '상태', ''].map(h => <th key={h} style={{ padding: '8px 10px', textAlign: 'left', color: '#6B7280', fontSize: 11, fontWeight: 600 }}>{h}</th>)}</tr></thead><tbody>{list.map(b => { const n = budgetNames(data, b); return (<tr key={b.id} style={{ borderBottom: '1px solid #F3F4F6' }}><td style={{ padding: '8px 10px', color: '#6B7280' }}>{b.date.slice(5)}</td><td style={{ padding: '8px 10px', fontWeight: 600 }}>{n.detail}</td><td style={{ padding: '8px 10px' }}>{b.vendor}</td><td style={{ padding: '8px 10px' }}>{won(itemTotal(b))}</td><td style={{ padding: '8px 10px' }}>{b.payMethod}</td><td style={{ padding: '8px 10px' }}><span onClick={() => cycleStatus(b.id)} style={{ cursor: 'pointer', fontSize: 11, padding: '2px 8px', borderRadius: 10, background: bStatusC(b.status), color: 'white', fontWeight: 600 }}>{b.status}</span></td><td style={{ padding: '8px 10px' }}><button onClick={() => del(b.id)} style={{ border: 'none', background: 'none', color: '#D1D5DB', cursor: 'pointer', fontSize: 15 }}>×</button></td></tr>); })}</tbody></table></div></Card>); })}
      {showAdd && <BudgetAddModal data={data} setData={setData} onClose={() => setShowAdd(false)} />}
    </div>
  );
}

function BudgetAddModal({ data, setData, onClose }) {
  const [outId, setOutId] = useState(''), [planId, setPlanId] = useState(''), [vendor, setVendor] = useState(''), [amount, setAmount] = useState(''), [vat, setVat] = useState('별도'), [pay, setPay] = useState('세금계산서'), [status, setStatus] = useState('기안전'), [date, setDate] = useState(TODAY);
  const plans = data.plans.filter(p => p.outputId === Number(outId));

    setData(d => ({ ...d, nid: d.nid + 1, budgets: [...(d.budgets || []), { id: d.nid + 1, outputId: Number(outId), planId: planId ? Number(planId) : null, subplanId: null, checklistId: null, vendor: vendor.trim(), amount: Number(amount), vat, payMethod: pay, account: '', status, date, memo: '' }] }));
    onClose();
  };
  const seg = (val, set, opts) => <div style={{ display: 'flex', gap: 6 }}>{opts.map(o => <button key={o} onClick={() => set(o)} style={{ flex: 1, padding: '8px 0', borderRadius: 8, border: 'none', cursor: 'pointer', fontSize: 12, fontWeight: 600, background: val === o ? G : '#E5E7EB', color: val === o ? 'white' : '#374151' }}>{o}</button>)}</div>;
  return (
    <ModalShell title="예산 추가" onClose={onClose}>

      <div><Lbl c="실행계획 (선택)" /><Sel value={planId} onChange={setPlanId} ph="선택..." opts={plans.map(p => ({ v: p.id, l: p.name }))} /></div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}><div><Lbl c="결제 업체" /><Inp value={vendor} onChange={setVendor} placeholder="업체명" /></div><div><Lbl c="금액 (원)" /><Inp type="number" value={amount} onChange={setAmount} placeholder="공급가" /></div></div>
      <div><Lbl c="VAT" />{seg(vat, setVat, VAT_OPTS)}</div>
      <div><Lbl c="결제방법" />{seg(pay, setPay, PAY_OPTS)}</div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}><div><Lbl c="상태" /><Sel value={status} onChange={setStatus} opts={BSTATUS} /></div><div><Lbl c="일자" /><Inp type="date" value={date} onChange={setDate} /></div></div>
      <div style={{ display: 'flex', gap: 8 }}><Btn onClick={submit} style={{ flex: 1 }}>추가</Btn><Btn v="secondary" onClick={onClose}>취소</Btn></div>
    </ModalShell>
  );
}

function TabTrash({ data, setData }) {
  const trash = data.trash || [];
  const [confirmId, setConfirmId] = useState(null);
  const [confirmEmpty, setConfirmEmpty] = useState(false);
  const typeIcon = { output: '📁', plan: '📋', subplan: '📝', budget: '💰', mainKpi: '⭐' };
  const summary = p => {
    p = p || {};
    const parts = [];
    if ((p.outputs || []).length) parts.push(`프로젝트 ${p.outputs.length}`);
    if ((p.plans || []).length) parts.push(`실행계획 ${p.plans.length}`);
    if ((p.subplans || []).length) parts.push(`세부 ${p.subplans.length}`);
    if ((p.checklists || []).length) parts.push(`체크 ${p.checklists.length}`);
    if ((p.kpiLogs || []).length) parts.push(`성과기록 ${p.kpiLogs.length}`);
    if ((p.budgets || []).length) parts.push(`예산 ${p.budgets.length}건`);
    if (p.mainKpi) parts.push('메인KPI');
    return parts.join(' · ') || '항목 없음';
  };
  return (
    <div style={{ padding: 20 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 4 }}>
        <div style={{ fontSize: 17, fontWeight: 700, color: '#64748B' }}>🗑 휴지통</div>
        {trash.length > 0 && <span style={{ background: '#94A3B8', color: 'white', borderRadius: 20, padding: '2px 10px', fontSize: 12, fontWeight: 700 }}>{trash.length}</span>}
        {trash.length > 0 && (confirmEmpty
          ? <div style={{ marginLeft: 'auto', display: 'flex', gap: 6 }}><Btn v="danger" onClick={() => { setData(d => ({ ...d, trash: [] })); setConfirmEmpty(false); }} style={{ padding: '6px 12px', fontSize: 12 }}>전체 영구삭제</Btn><Btn v="secondary" onClick={() => setConfirmEmpty(false)} style={{ padding: '6px 12px', fontSize: 12 }}>취소</Btn></div>
          : <button onClick={() => setConfirmEmpty(true)} style={{ marginLeft: 'auto', padding: '6px 12px', borderRadius: 8, border: '1px solid #EF4444', background: 'white', color: '#EF4444', cursor: 'pointer', fontSize: 12, fontWeight: 600 }}>휴지통 비우기</button>)}
      </div>
      <div style={{ fontSize: 12, color: '#9CA3AF', marginBottom: 14 }}>삭제된 항목은 여기 보관됩니다. 복원하면 관련 데이터(세부·체크리스트·예산·성과기록)까지 함께 되살아납니다.</div>
      {trash.length === 0 ? (
        <Card style={{ textAlign: 'center', padding: 56, color: '#9CA3AF' }}><div style={{ fontSize: 44, marginBottom: 12 }}>🗑</div><div>휴지통이 비어 있습니다</div></Card>
      ) : (
        trash.map(t => (
          <Card key={t.id} style={{ marginBottom: 10, borderLeft: '4px solid #94A3B8', padding: '12px 14px' }}>
            <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10 }}>
              <span style={{ fontSize: 20 }}>{typeIcon[t.type] || '🗑'}</span>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 700, fontSize: 14, color: '#475569' }}>{t.label}</div>
                <div style={{ fontSize: 11, color: '#9CA3AF', marginTop: 3 }}>삭제일 {t.deletedAt} · 포함: {summary(t.payload)}</div>
              </div>
              <div style={{ display: 'flex', gap: 6, flexShrink: 0 }}>
                <button onClick={() => setData(d => {

              </div>
            </div>
          </Card>
        ))
      )}
    </div>
  );
}

function App() {
  const [tab, setTab] = useState(0);
  const [data, setData] = useState(null);
  const [ready, setReady] = useState(false);
  const [modal, setModal] = useState(false);
  const [editT, setEditT] = useState(null);
  const [recordId, setRecordId] = useState(null);
  const [sync, setSync] = useState('loading');
  const [syncErr, setSyncErr] = useState('');
  const pendingRef = useRef(null);
  const lastSavedRef = useRef(null);
  const initDoneRef = useRef(false);

  useEffect(() => {
    const ref = db.ref(DB_PATH);
    ref.on('value', snap => {
      const remote = snap.val();
      const remoteStr = remote ? JSON.stringify(remote) : null;
      if (!initDoneRef.current) {
        initDoneRef.current = true;
        if (remote && remote.nid) { const m = migrateData(remote); setData(m); lastSavedRef.current = JSON.stringify(m); }
        else { setData(INIT); lastSavedRef.current = null; }
        setReady(true); setSync('ok');
      } else {
        if (remote && remote.nid && remoteStr !== lastSavedRef.current) { const m = migrateData(remote); setData(m); lastSavedRef.current = JSON.stringify(m); }
      }
    }, err => { setSyncErr(err.message); setSync('error'); if (!initDoneRef.current) { initDoneRef.current = true; setData(INIT); setReady(true); } });
    return () => ref.off('value');
  }, []);

  useEffect(() => {
    if (!ready || !data) return;
    const str = JSON.stringify(data);
    if (str === lastSavedRef.current) return;
    if (pendingRef.current) clearTimeout(pendingRef.current);
    setSync('saving');
    pendingRef.current = setTimeout(() => {
      lastSavedRef.current = str;
      db.ref(DB_PATH).set(data).then(() => setSync('ok')).catch(e => { setSync('error'); setSyncErr(e.message || '저장 실패'); lastSavedRef.current = null; });
    }, 800);
  }, [data, ready]);

  const heldCount = data ? data.plans.filter(p => p.hold).length + data.subplans.filter(s => s.stage === '보류').length : 0;
  const trashCount = data ? (data.trash || []).length : 0;
  const TABS = [
    { icon: '👥', label: '팀 현황', C: TabTeam },
    { icon: '📈', label: '프로젝트 진행 상황', C: TabProgress },
    { icon: '🗂️', label: '칸반', C: TabKanban },
    { icon: '📅', label: '데일리/주간', C: TabWeekly },
    { icon: '🏆', label: '업무 성과', C: TabPerformance },
    { icon: '📊', label: 'KPI', C: TabKpi },
    { icon: '⏸', label: '보류', C: TabHold, badge: heldCount },
    { icon: '💰', label: '예산', C: TabBudget },
    { icon: '🗑', label: '휴지통', C: TabTrash, badge: trashCount },
  ];

  if (!ready || !data) return (
    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: BG }}>
      <div style={{ textAlign: 'center', color: '#6B7280' }}><div style={{ fontSize: 44, marginBottom: 12 }}>🌿</div><div style={{ fontSize: 15, fontWeight: 600, marginBottom: 6 }}>Firebase에서 불러오는 중...</div><div style={{ fontSize: 12, color: '#9CA3AF' }}>LIFEMEAL 팀 대시보드</div></div>
    </div>
  );

  const TabC = TABS[tab].C;
  return (
    <div style={{ minHeight: '100vh', background: BG }}>
      <div style={{ background: G, color: 'white', padding: '12px 20px', display: 'flex', alignItems: 'center', gap: 12, boxShadow: '0 2px 8px rgba(0,0,0,0.2)', flexWrap: 'wrap' }}>
        <span style={{ fontSize: 22 }}>🌿</span>
        <div><div style={{ fontSize: 16, fontWeight: 800 }}>통합 팀 대시보드</div><div style={{ fontSize: 11, opacity: 0.7 }}>LIFEMEAL · Firebase 실시간 연동</div></div>
        <div style={{ marginLeft: 'auto', display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
          <SyncBadge status={sync} errMsg={syncErr} />
          {MEMBERS.map(m => <div key={m} style={{ width: 30, height: 30, borderRadius: '50%', background: GO, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, border: '2px solid rgba(255,255,255,0.25)' }}>{AV[m]}</div>)}
          {heldCount > 0 && <div onClick={() => setTab(6)} style={{ background: '#94A3B8', borderRadius: 20, padding: '4px 10px', fontSize: 11, fontWeight: 700, cursor: 'pointer' }}>⏸ {heldCount}</div>}
          <button onClick={() => setModal(true)} style={{ padding: '8px 16px', borderRadius: 8, border: 'none', background: 'white', color: G, fontWeight: 700, fontSize: 13, cursor: 'pointer' }}>+ 업무 추가하기</button>
        </div>
      </div>
      <div style={{ background: 'white', boxShadow: '0 1px 4px rgba(0,0,0,0.07)', overflowX: 'auto' }}>
        <div style={{ display: 'flex', minWidth: 'max-content' }}>
          {TABS.map((t, i) => <button key={i} onClick={() => setTab(i)} style={{ padding: '11px 18px', border: 'none', cursor: 'pointer', fontSize: 13, fontWeight: tab === i ? 700 : 500, color: tab === i ? G : '#6B7280', background: 'transparent', borderBottom: tab === i ? '2.5px solid ' + G : '2.5px solid transparent', display: 'flex', alignItems: 'center', gap: 5, whiteSpace: 'nowrap' }}>{t.icon} {t.label}{t.badge > 0 ? <span style={{ background: '#94A3B8', color: 'white', borderRadius: 10, padding: '1px 6px', fontSize: 10, fontWeight: 700 }}>{t.badge}</span> : null}</button>)}
        </div>
      </div>
      <div style={{ maxWidth: 1400, margin: '0 auto' }}>
        <TabC data={data} setData={setData} onEdit={t => setEditT(t)} onRecord={id => setRecordId(id)} />
      </div>
      {modal && <AddModal data={data} setData={setData} onClose={() => setModal(false)} />}
      {editT && <EditModal key={editT.kind + '-' + editT.id} target={editT} data={data} setData={setData} onClose={() => setEditT(null)} onSwitch={t => setEditT(t)} />}
      {recordId && <PerfModal subId={recordId} data={data} setData={setData} onClose={() => setRecordId(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
