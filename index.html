//   1) 서버에 updates 가 아예 없으면(첫 진입) 시드 전부를 쓴다.
//   2) 있으면 addedRev > 저장된 updatesRev 인 시드만, 그리고 같은 id 가 아직 없을 때만 끼운다.
//   3) 끼울 때 pinned 는 반드시 false — 사람이 고정해 둔 안내를 새 시드가 뺏으면 안 된다.
function mergeUpdates(stored, storedRev) {
  if (stored === undefined || stored === null) return DEFAULT_UPDATES.slice();
  const list = Array.isArray(stored) ? stored.slice() : [];
  const have = {};
  list.forEach(n => { if (n && n.id != null) have[String(n.id)] = true; });
  const add = DEFAULT_UPDATES
    .filter(n => (n.addedRev || 0) > storedRev && !have[String(n.id)])
    .map(n => ({ ...n, pinned: false }));
  if (!add.length) return list;
  return add.concat(list).sort((a, b) => String((b && b.date) || '').localeCompare(String((a && a.date) || '')));
}

const chkOrderKey = x => String(x.subplanId == null ? 'm' : x.subplanId) + '|' + (x.date || '');
const sameChkGroup = (list, aId, bId) => { const x = (list || []).find(t => t.id === aId), y = (list || []).find(t => t.id === bId); return !!(x && y && chkOrderKey(x) === chkOrderKey(y)); };
const moveChkInGroup = (d, fromId, toId) => ({ ...d, checklists: moveSiblingToBy(d.checklists, fromId, toId, chkOrderKey) });
const WDNM = ['일', '월', '화', '수', '목', '금', '토'];
const dateWd = date => { try { const w = WDNM[new Date(date + 'T00:00:00').getDay()]; return w || ''; } catch (e) { return ''; } };

// ── 반복업무(루틴) ────────────────────────────────────────────────
// freq: daily(매일) | weekly(매주 요일) | biweekly(격주 요일) | monthly(매월 n일) | everyN(N일마다)
const FREQ_OPTS = [['daily', '매일'], ['weekly', '매주 (요일 지정)'], ['biweekly', '격주 (2주에 한 번)'], ['monthly', '매월 (날짜 지정)'], ['everyN', 'N일마다']];
const routineDesc = r => {
  if (!r) return '';
  const ds = (r.days || []).slice().sort((a, b) => a - b).map(i => WDNM[i]).join('·');
  if (r.freq === 'daily') return '매일';
  if (r.freq === 'weekly') return '매주 ' + (ds ? ds + '요일' : '(요일 미지정)');
  if (r.freq === 'biweekly') return '격주 ' + (ds ? ds + '요일' : '(요일 미지정)');
  if (r.freq === 'monthly') return '매월 ' + (Number(r.dom) || 1) + '일';
  if (r.freq === 'everyN') return (Math.max(1, Number(r.everyN) || 1)) + '일마다';
  return '';
};
const dayGap = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
const routineHits = (r, date) => {
  if (!r || r.active === false || !date) return false;
  if (r.start && date < r.start) return false;
  if (r.end && date > r.end) return false;
  const base = r.start || date;
  let wd = 0; try { wd = new Date(date + 'T00:00:00').getDay(); } catch (e) { return false; }
  if (r.freq === 'daily') return true;
  if (r.freq === 'weekly') return (r.days || []).indexOf(wd) >= 0;
  if (r.freq === 'biweekly') { if ((r.days || []).indexOf(wd) < 0) return false; return (Math.abs(Math.round(dayGap(weekKeyOf(base), weekKeyOf(date)) / 7)) % 2) === 0; }
  if (r.freq === 'monthly') return Number(date.slice(8, 10)) === (Number(r.dom) || 1);
  if (r.freq === 'everyN') { const n = Math.max(1, Number(r.everyN) || 1); const g = dayGap(base, date); return g >= 0 && g % n === 0; }
  return false;
};
const rlKey = (rid, date) => 'r' + rid + '_' + date;
const routineDone = (data, rid, date) => !!((data.routineLogs || {})[rlKey(rid, date)]);
const toggleRoutineDone = (d, rid, date, who) => { const k = rlKey(rid, date); const logs = { ...(d.routineLogs || {}) }; if (logs[k]) delete logs[k]; else logs[k] = { by: who || '', at: TODAY }; return { ...d, routineLogs: logs }; };
const routineOwned = (r, owner) => !owner || ownersOf(r).length === 0 || ownersOf(r).indexOf(owner) >= 0;
const routinesFor = (data, owner, date) => (data.routines || []).filter(r => routineHits(r, date) && routineOwned(r, owner));
// 기한(해당 날짜)이 지났는데 완료 체크가 안 된 반복업무 목록. upto 이전 span일을 훑는다.
const routineMisses = (data, owner, upto, span) => {
  const out = []; const end = addDays(upto || TODAY, -1); const n = span || 30;
  for (let i = 0; i < n; i++) { const dt = addDays(end, -i); routinesFor(data, owner, dt).forEach(r => { if (!routineDone(data, r.id, dt)) out.push({ r: r, date: dt }); }); }
  return out.sort((a, b) => a.date < b.date ? 1 : -1);
};

// 목록 안에서 행을 잡아 끌어 순서를 바꾸는 공용 훅. arm(id) 를 붙인 곳을 눌러야 그 행이 드래그된다(입력칸 텍스트 선택 보호).
// canDrop(from, to) 를 주면 그 조건을 만족하는 행에만 놓을 수 있다(조건 밖의 행은 강조도 안 되고 놓아도 무시).
function useDragOrder(onMove, canDrop) {
  const [dragId, setDragId] = useState(null);
  const [overId, setOverId] = useState(null);
  const [armId, setArmId] = useState(null);
  const reset = () => { setDragId(null); setOverId(null); setArmId(null); };
  const ok = (from, to) => from != null && from !== to && (!canDrop || canDrop(from, to) === true);
  const arm = id => ({ onMouseDown: () => setArmId(id), onMouseUp: () => setArmId(null), onTouchStart: () => setArmId(id) });
  const row = id => ({
    draggable: armId === id,
    onDragStart: e => { setDragId(id); try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(id)); } catch (err) {} },
    onDragOver: e => { if (dragId == null) return; if (!ok(dragId, id)) { e.stopPropagation(); if (overId != null) setOverId(null); return; } e.preventDefault(); if (overId !== id) setOverId(id); },
    onDragLeave: () => setOverId(o => (o === id ? null : o)),
    onDrop: e => { e.preventDefault(); e.stopPropagation(); const from = dragId; reset(); if (ok(from, id)) onMove(from, id); },
    onDragEnd: reset
  });
  const hl = id => (dragId === id ? { opacity: 0.4 } : (overId === id && ok(dragId, id)) ? { border: '1px solid ' + GO, boxShadow: 'inset 0 0 0 1px ' + GO } : null);
  return { arm, row, hl, dragId, overId };
}

// 드래그 중에 화면(또는 모달) 위/아래 끝에 가까워지면 자동으로 스크롤한다.
// 브라우저는 드래그 중 마우스 휠을 굴리면 드래그를 취소해 버리므로, 아래쪽 목록에서 위쪽 달력으로 끌어 올릴 때 반드시 필요하다.
function useDragAutoScroll() {
  useEffect(() => {
    const EDGE = 130, MAX = 26;
    let vy = 0, box = null, raf = 0, on = false;
    const scrollableUnder = node => {
      let n = node && node.nodeType === 3 ? node.parentElement : node;
      while (n && n.nodeType === 1 && n !== document.body && n !== document.documentElement) {
        let oy = '';
        try { oy = window.getComputedStyle(n).overflowY; } catch (e) { oy = ''; }
        if ((oy === 'auto' || oy === 'scroll') && n.scrollHeight > n.clientHeight + 4) return n;
        n = n.parentElement;
      }
      return null;
    };
    const step = () => {
      raf = 0;
      if (!on || !vy) return;
      if (box) { const b4 = box.scrollTop; box.scrollTop = b4 + vy; if (box.scrollTop === b4) window.scrollBy(0, vy); }
      else window.scrollBy(0, vy);
      raf = requestAnimationFrame(step);
    };
    const kick = () => { if (!raf && on && vy) raf = requestAnimationFrame(step); };
    const onOver = e => {
      on = true;
      const y = e.clientY;
      if (typeof y !== 'number') return;
      const el = scrollableUnder(e.target);
      let top = 0, bot = window.innerHeight || 0;
      if (el) { const r = el.getBoundingClientRect(); top = r.top; bot = r.bottom; }
      box = el;
      const dT = y - top, dB = bot - y;
      if (dT < EDGE) vy = -Math.ceil(MAX * Math.min(1, Math.max(0, EDGE - dT) / EDGE));
      else if (dB < EDGE) vy = Math.ceil(MAX * Math.min(1, Math.max(0, EDGE - dB) / EDGE));
      else vy = 0;
      kick();
    };
    const stop = () => { on = false; vy = 0; box = null; if (raf) { cancelAnimationFrame(raf); raf = 0; } };
    document.addEventListener('dragover', onOver, true);
    document.addEventListener('drop', stop, true);
    document.addEventListener('dragend', stop, true);
    window.addEventListener('blur', stop);
    return () => {
      document.removeEventListener('dragover', onOver, true);
      document.removeEventListener('drop', stop, true);
      document.removeEventListener('dragend', stop, true);
      window.removeEventListener('blur', stop);
      stop();
    };
  }, []);
}

const pad = n => String(n).padStart(2, '0');
const monthRange = (offset) => { const d = new Date(TODAY + 'T00:00:00'); let y = d.getFullYear(); let m = d.getMonth() + offset; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; const lastDay = new Date(y, m + 1, 0).getDate(); return { start: `${y}-${pad(m + 1)}-01`, end: `${y}-${pad(m + 1)}-${pad(lastDay)}`, key: `${y}-${pad(m + 1)}` }; };
const daysInMonth = key => { const [y, m] = key.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const dateDiff = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000) + 1;
const monthsInRange = (start, end) => {
  const res = []; let cur = start.slice(0, 7); const endKey = end.slice(0, 7); let guard = 0;
  while (cur <= endKey && guard < 36) {
    const [y, m] = cur.split('-').map(Number);
    const mStart = `${y}-${pad(m)}-01`;
    const mEnd = `${y}-${pad(m)}-${pad(new Date(y, m, 0).getDate())}`;
    const segStart = start > mStart ? start : mStart;
    const segEnd = end < mEnd ? end : mEnd;
    res.push({ key: cur, days: dateDiff(segStart, segEnd), totalDays: daysInMonth(cur) });
    let nm = m + 1, ny = y; if (nm > 12) { nm = 1; ny++; } cur = `${ny}-${pad(nm)}`; guard++;
  }
  return res;
};

            <div style={{ display: 'flex', gap: 5 }}>
              {WDNM.map((w, i) => { const on = days.indexOf(i) >= 0; return <button key={w} onClick={() => toggleDay(i)} style={{ flex: 1, padding: '9px 0', borderRadius: 8, border: 'none', cursor: 'pointer', fontSize: 16, fontWeight: 800, background: on ? G : 'white', color: on ? 'white' : (i === 0 ? '#D9483B' : (i === 6 ? '#2D5FE0' : '#3A3631')) }}>{w}</button>; })}
            </div>
          </div>

        {freq === 'everyN' && <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}><span style={{ fontSize: 16, color: '#3A3631' }}>시작일부터</span><div style={{ width: 90 }}><Inp type="number" value={everyN} onChange={setEveryN} placeholder="2" /></div><span style={{ fontSize: 16, color: '#3A3631' }}>일마다</span></div>}

        <div><Lbl c="종료일 (선택 · 비우면 계속 반복)" /><input type="date" value={end} onChange={e => setEnd(e.target.value)} style={{ width: '100%', padding: '8px 9px', borderRadius: 8, border: '1px solid #E3E0DC', fontSize: 17, fontFamily: 'inherit' }} /></div>

}

// 반복업무 목록 패널 (프로젝트 진행 상황 탭 상단 · 홈 등에서 재사용)

          })}

}

function LinkStatusModal({ kind, item, data, setData, onClose }) {
  const isPlan = kind === 'plan';

    if (isPlan) { const o = (data.outputs || []).find(x => x.id === id); return o ? { id: id, label: outLabel(o), sub: o.type || '' } : null; }

function MemberModal({ data, setData, onClose }) {
  const list = data.members && data.members.length ? data.members : DEFAULT_MEMBERS;
  const [nm, setNm] = useState('');
  const [rl, setRl] = useState('');
  const [av, setAv] = useState('👤');
  const AVS = ['🌿', '📦', '👤', '🍀', '⭐', '🔥', '💡', '🎯', '🚀', '🌸', '☕', '🦊'];
  const workCount = m => data.plans.filter(p => ownersOf(p).includes(m)).length + data.subplans.filter(s => ownersOf(s).includes(m)).length + data.plans.filter(p => (p.support || []).some(s => s.m === m)).length + data.subplans.filter(s => (s.support || []).some(x => x.m === m)).length;
  const add = () => { const n = nm.trim(); if (!n) { alert('이름을 입력하세요'); return; } if (list.some(m => m.name === n)) { alert('이미 있는 팀원입니다'); return; } setData(d => ({ ...d, members: [...(d.members && d.members.length ? d.members : DEFAULT_MEMBERS), { name: n, role: rl.trim(), av }] })); setNm(''); setRl(''); setAv('👤'); };
  const upd = (name, key, val) => setData(d => ({ ...d, members: (d.members && d.members.length ? d.members : DEFAULT_MEMBERS).map(m => m.name === name ? { ...m, [key]: val } : m) }));
  const del = m => { const c = workCount(m.name); if (c > 0) { alert('"' + m.name + '"님은 담당/서포트 중인 업무가 ' + c + '건 있어 삭제할 수 없습니다.\n먼저 담당자를 변경한 뒤 삭제해주세요.'); return; } if (list.length <= 1) { alert('팀원이 최소 1명은 있어야 합니다'); return; } if (!confirm('"' + m.name + '"님을 팀원 목록에서 삭제할까요?')) return; setData(d => ({ ...d, members: (d.members && d.members.length ? d.members : DEFAULT_MEMBERS).filter(x => x.name !== m.name) })); };
  return (
    <ModalShell title="👥 팀원 관리" onClose={onClose}>

function ChecklistModal({ chkId, data, setData, onClose }) {
  const [memoOpen, setMemoOpen] = useState(null);
  const c = (data.checklists || []).find(x => x.id === chkId);
  if (!c) return null;
  const sub = data.subplans.find(s => s.id === c.subplanId);
  const plan = sub ? data.plans.find(p => p.id === sub.planId) : null;
  const out = plan ? data.outputs.find(o => o.id === plan.outputId) : null;
  const solo = isSoloChk(c);
  const tone = chkTone(c);
  const chks = solo ? [c] : sortChksByDate((data.checklists || []).filter(x => x.subplanId === c.subplanId));
  const chkDrag = useDragOrder((from, to) => setData(d => moveChkInGroup(d, from, to)), (from, to) => sameChkGroup(data.checklists, from, to));
  const toggleDone = id => setData(d => ({ ...d, checklists: d.checklists.map(x => x.id === id ? { ...x, done: !x.done, doneAt: !x.done ? TODAY : null } : x) }));
  const setText = (id, text) => setData(d => ({ ...d, checklists: d.checklists.map(x => x.id === id ? { ...x, text } : x) }));
  const setOwner = (id, m) => setData(d => ({ ...d, checklists: d.checklists.map(x => x.id === id ? { ...x, owner: toggleIn(ownersOf(x), m) } : x) }));
  const setDate = (id, date) => setData(d => applyChklDate(d, id, date));
  const setMemo = (id, memo) => setData(d => ({ ...d, checklists: d.checklists.map(x => x.id === id ? { ...x, memo } : x) }));
  const del = id => { if (!confirm('이 체크리스트를 삭제할까요?')) return; setData(d => ({ ...d, checklists: d.checklists.filter(x => x.id !== id) })); if (id === chkId) onClose && onClose(); };
  const addChk = () => setData(d => ({ ...d, nid: d.nid + 1, checklists: [...d.checklists, { id: d.nid + 1, subplanId: c.subplanId, text: '', done: false, date: c.date || '', owner: [], memo: '' }] }));
  return (
    <ModalShell title={solo ? (tone.icon + ' ' + tone.name + ' 항목') : '체크리스트'} onClose={onClose}>
      <div style={{ background: '#F5F4F2', borderRadius: 10, padding: 12, border: '1px solid #EDEBE7' }}>
        <div style={{ fontSize: 15, fontWeight: 700, color: solo ? tone.fg : G, marginBottom: 6 }}>{solo ? (tone.icon + ' ' + tone.name + ' 체크리스트') : '소속 세부실행계획'}</div>
        {sub ? (
          <div>
            <div style={{ fontSize: 15, color: '#A29C95', marginBottom: 6 }}>{out ? outLabel(out) : ''}{plan ? ' ▸ ' + plan.name : ''}</div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
              <Badge label={sub.stage} color={stC(sub.stage)} />
              <span style={{ fontSize: 18, fontWeight: 700 }}>{sub.name}</span>
            </div>
            <div style={{ fontSize: 16, color: '#6E6863', marginTop: 6 }}>마감일: {sub.due || '미정'}</div>
          </div>
        ) : <div style={{ fontSize: 16.5, color: '#A29C95', lineHeight: 1.5 }}>{solo ? '세부실행계획에 연결되지 않은 개별 항목입니다. 이 창에서는 이 항목만 수정합니다.' : '연결된 세부실행계획이 없습니다'}</div>}
      </div>
      <div style={{ marginTop: 14 }}>
        <div style={{ fontSize: 15, fontWeight: 700, color: solo ? tone.fg : G, marginBottom: 7 }}>{solo ? (tone.icon + ' ' + tone.name) : '체크리스트'} <span style={{ color: '#A29C95', fontWeight: 400 }}>({chks.filter(x => x.done).length}/{chks.length})</span></div>
        {chks.length > 1 && <div style={{ fontSize: 15, color: '#A29C95', marginBottom: 8, lineHeight: 1.5 }}>실행일이 빠른 순으로 자동 정렬됩니다(미정은 맨 뒤). 같은 날짜끼리는 왼쪽 ⠿ 를 잡고 끌어서 순서를 바꿀 수 있어요.</div>}
        {chks.map((x, xi) => {
          const over = !!(x.date && sub && sub.due && x.date > sub.due);
          const isCur = x.id === chkId;
          const dk = x.date || '';
          const newGrp = xi === 0 || (chks[xi - 1].date || '') !== dk;
          const grpCnt = chks.filter(y => (y.date || '') === dk).length;
          return (
            <React.Fragment key={x.id}>
            {newGrp && !solo && (
              <div style={{ display: 'flex', alignItems: 'center', gap: 7, margin: xi === 0 ? '0 0 5px' : '12px 0 5px' }}>
                <span style={{ fontSize: 15.5, fontWeight: 800, color: dk ? G : '#A29C95', flexShrink: 0 }}>{dk ? dk + ' (' + dateWd(dk) + ')' : '📥 실행일 미정'}</span>
                <span style={{ fontSize: 14, color: '#A29C95', flexShrink: 0 }}>{grpCnt}건</span>
                <span style={{ flex: 1, height: 1, background: '#EDEBE7' }} />
              </div>
            )}
            <div {...chkDrag.row(x.id)} style={{ marginBottom: 6, border: '1px solid ' + (isCur ? (solo ? tone.fg : G) : '#E3E0DC'), borderRadius: 9, padding: 9, background: isCur ? (solo ? tone.soft : '#FBFDFB') : 'white', ...chkDrag.hl(x.id) }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 7, flexWrap: 'wrap' }}>
                {grpCnt > 1 && <span {...chkDrag.arm(x.id)} title="여기를 잡고 끌어서 같은 날짜 안에서 순서 변경" style={{ cursor: 'grab', color: '#C4BDB4', fontSize: 18, lineHeight: 1, flexShrink: 0, userSelect: 'none' }}>⠿</span>}
                <span onClick={() => toggleDone(x.id)} style={{ cursor: 'pointer', display: 'flex', flexShrink: 0 }}><Chk on={x.done} /></span>
                <input value={x.text} onChange={e => setText(x.id, e.target.value)} placeholder="체크리스트 명" style={{ flex: 1, minWidth: 110, fontSize: 17, fontWeight: 600, padding: '6px 8px', border: '1px solid #E3E0DC', borderRadius: 7, outline: 'none', color: x.done ? '#A29C95' : '#1A1614', textDecoration: x.done ? 'line-through' : 'none', fontFamily: 'inherit' }} />
                <button onClick={() => setMemoOpen(o => o === x.id ? null : x.id)} title="메모" style={{ border: 'none', background: (x.memo || memoOpen === x.id) ? '#EEF4EC' : 'transparent', borderRadius: 6, cursor: 'pointer', fontSize: 17, padding: '3px 5px', lineHeight: 1, color: x.memo ? '#1FA463' : '#A29C95', flexShrink: 0 }}>📝</button>
                <button onClick={() => del(x.id)} style={{ border: 'none', background: 'none', color: '#E53935', cursor: 'pointer', fontSize: 19, lineHeight: 1, flexShrink: 0 }}>×</button>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap', marginTop: 6 }}>
                <OwnerChips selected={ownersOf(x)} onToggle={m => setOwner(x.id, m)} sm />
                <input type="date" value={x.date || ''} onChange={e => setDate(x.id, e.target.value)} title="실행일" style={{ fontSize: 15, padding: '4px 6px', border: '1px solid ' + (over ? '#FCA5A5' : '#E3E0DC'), borderRadius: 6, color: x.date ? '#3A3631' : '#A29C95' }} />
                {over ? <span style={{ fontSize: 14, color: '#DC2626', fontWeight: 700 }}>⚠ 마감초과</span> : null}
              </div>
              {memoOpen === x.id && <textarea value={x.memo || ''} onChange={e => setMemo(x.id, e.target.value)} placeholder="메모 입력" style={{ width: '100%', minHeight: 52, marginTop: 6, padding: '7px 9px', border: '1px solid #CDE3C6', borderRadius: 7, fontSize: 16, boxSizing: 'border-box', resize: 'vertical', fontFamily: 'inherit', lineHeight: 1.5, color: '#3A3631' }} />}
            </div>
            </React.Fragment>
          );
        })}
        {!solo && <button onClick={addChk} style={{ width: '100%', marginTop: 4, padding: '9px', borderRadius: 8, border: '1.5px dashed ' + G, cursor: 'pointer', fontSize: 16.5, fontWeight: 700, background: 'white', color: G }}>+ 체크리스트 추가</button>}
      </div>
      <Btn v="secondary" onClick={onClose} style={{ width: '100%', marginTop: 14 }}>닫기</Btn>
    </ModalShell>
  );
}

// ── 회의 추가 (회의명 · 참석자 · 시간) index_136 ──────────────────
function MeetingAddModal({ data, setData, date, onClose, editing }) {
  const ed = editing || null;
  const [title, setTitle] = useState(ed ? (ed.text || '') : '');
  const [att, setAtt] = useState(ed ? ownersOf(ed) : []);
  const [guests, setGuests] = useState(ed ? (ed.meetGuests || '') : '');
  const [time, setTime] = useState(ed ? (ed.meetTime || '') : '10:00');
  const [mdate, setMdate] = useState((ed && ed.date) || date || TODAY);
  const [place, setPlace] = useState(ed ? (ed.meetPlace || '') : '');
  const save = () => {
    if (!title.trim()) { alert('회의명을 입력하세요'); return; }
    if (!att.length && !guests.trim()) { alert('참석자를 선택하거나 외부 참석자를 입력하세요'); return; }
    if (!mdate) { alert('회의 날짜를 선택하세요'); return; }
    const patch = { text: title.trim(), owner: att.slice(), meetGuests: guests.trim(), meetTime: time, meetPlace: place.trim(), date: mdate, kind: 'meeting' };
    setData(d => {
      if (ed) return { ...d, checklists: d.checklists.map(c => c.id === ed.id ? { ...c, ...patch } : c) };
      const id = d.nid + 1;
      return { ...d, nid: id, checklists: [...d.checklists, { id: id, subplanId: null, standalone: true, done: false, memo: '', meetingId: '', ...patch }] };
    });
    onClose();
  };
  const inSt = { width: '100%', padding: '8px 9px', borderRadius: 8, border: '1px solid #E3E0DC', fontSize: 17, fontFamily: 'inherit', color: '#1A1614' };
  return (
    <ModalShell title={ed ? '🗓 회의 수정' : '🗓 회의 추가'} onClose={onClose}>
      <div style={{ background: CHK_TONE.meeting.soft, border: '1px solid ' + CHK_TONE.meeting.line, borderRadius: 10, padding: '9px 12px', fontSize: 15, color: CHK_TONE.meeting.fg, fontWeight: 600 }}>
        회의명 · 참석자 · 시간을 적어두면, 회의가 지난 뒤 <b>회의록이 등록되지 않았을 때</b> 업무날짜 상단에 알림으로 떠요.
      </div>
      <div><Lbl c="회의명" /><Inp value={title} onChange={setTitle} placeholder="예: 8월 KPI 목표 점검 회의" /></div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8 }}>
        <div><Lbl c="날짜" /><input type="date" value={mdate} onChange={e => setMdate(e.target.value)} style={inSt} /></div>
        <div><Lbl c="시간" /><input type="time" value={time} onChange={e => setTime(e.target.value)} style={inSt} /></div>
        <div><Lbl c="장소 (선택)" /><Inp value={place} onChange={setPlace} placeholder="회의실 · 화상 등" /></div>
      </div>
      <div>
        <Lbl c="참석자 (내부 멤버)" />
        <div style={{ marginTop: 4 }}><OwnerChips selected={att} onToggle={m => setAtt(toggleIn(att, m))} /></div>
      </div>
      <div><Lbl c="외부 참석자 (선택 · 쉼표로 구분)" /><Inp value={guests} onChange={setGuests} placeholder="예: 뿌리깊은 김팀장, 대행사 이과장" /></div>
      <div style={{ display: 'flex', gap: 8 }}>
        <Btn onClick={save} style={{ flex: 1 }}>{ed ? '수정 저장' : '회의 추가'}</Btn>
        <Btn v="secondary" onClick={onClose}>취소</Btn>
      </div>
    </ModalShell>
  );
}

// ── 회의록 등록 (회의 체크리스트 ↔ 회의 탭 연동) index_136 ─────────
function MeetingNoteModal({ data, setData, chk, onClose }) {
  const existing = meetingNoteOf(data, chk);
  const [title, setTitle] = useState(existing ? (existing.title || '') : (chk.text || ''));
  const [mdate, setMdate] = useState(existing ? (existing.date || '') : (chk.date || TODAY));
  const [att, setAtt] = useState(existing ? (existing.attendees || []).join(', ') : ownersOf(chk).concat(chk.meetGuests ? chk.meetGuests.split(',').map(s => s.trim()).filter(Boolean) : []).join(', '));
  const [body, setBody] = useState(existing ? stripHtml(existing.summaryHtml) : '');
  const save = () => {
    if (!body.trim()) { alert('회의 내용을 입력하세요'); return; }
    const html = body.split('\n').map(l => '<p>' + (escHtml(l) || '&nbsp;') + '</p>').join('');
    const mid = chk.meetingId || ('mtg' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36));
    const rec = { id: mid, date: mdate || chk.date || TODAY, title: title.trim() || '회의', attendees: att.split(',').map(s => s.trim()).filter(Boolean), summaryHtml: html, appliedActions: [], source: 'dashboard' };
    setData(d => ({ ...d, meetings: [...(d.meetings || []).filter(m => m.id !== mid), rec], checklists: d.checklists.map(c => c.id === chk.id ? { ...c, meetingId: mid, done: true } : c) }));
    onClose();
  };
  return (
    <ModalShell title="📝 회의록 등록" onClose={onClose}>
      <div style={{ background: CHK_TONE.meeting.soft, border: '1px solid ' + CHK_TONE.meeting.line, borderRadius: 10, padding: '9px 12px', fontSize: 15, color: CHK_TONE.meeting.fg, fontWeight: 600 }}>
        등록하면 [🗓 회의] 탭 목록에 바로 올라가고, 이 회의 항목은 완료 처리됩니다.
      </div>
      <div><Lbl c="회의명" /><Inp value={title} onChange={setTitle} placeholder="회의명" /></div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 2fr', gap: 8 }}>
        <div><Lbl c="날짜" /><input type="date" value={mdate} onChange={e => setMdate(e.target.value)} style={{ width: '100%', padding: '8px 9px', borderRadius: 8, border: '1px solid #E3E0DC', fontSize: 17, fontFamily: 'inherit' }} /></div>
        <div><Lbl c="참석자 (쉼표로 구분)" /><Inp value={att} onChange={setAtt} placeholder="윤희, 현수" /></div>
      </div>
      <div>
        <Lbl c="회의 내용 · 결정사항" />
        <textarea value={body} onChange={e => setBody(e.target.value)} placeholder={'논의 내용과 결정사항을 줄바꿈으로 적어주세요.\n예) 8월 목표 1.6억 확정\n예) 브랜드검색광고 예산 증액 검토'} style={{ width: '100%', minHeight: 180, padding: '10px 11px', borderRadius: 9, border: '1px solid #E3E0DC', fontSize: 16.5, lineHeight: 1.6, fontFamily: 'inherit', color: '#1A1614', resize: 'vertical' }} />
      </div>
      <div style={{ display: 'flex', gap: 8 }}>
        <Btn onClick={save} style={{ flex: 1 }}>회의록 등록</Btn>
        <Btn v="secondary" onClick={onClose}>취소</Btn>
      </div>
    </ModalShell>
  );
}

function DayDetailModal({ date, data, setData, onEdit, onClose, owner }) {
  const [newText, setNewText] = useState('');
  const [newOwners, setNewOwners] = useState([]);
  const [newSub, setNewSub] = useState('');
  const [showOther, setShowOther] = useState(false);
  const [addMeet, setAddMeet] = useState(false);
  const [noteFor, setNoteFor] = useState(null);
  const [editMeet, setEditMeet] = useState(null);
  const subOf = id => (data.subplans || []).find(s => s.id === id);
  const planOf = id => (data.plans || []).find(p => p.id === id);
  const outOf = id => (data.outputs || []).find(o => o.id === id);
  const okOwner = x => !owner || ownersOf(x).indexOf(owner) >= 0;
  const okChk = c => !owner || chkOwners(data, c).indexOf(owner) >= 0;
  const dayChks = sortChksByDate((data.checklists || []).filter(c => c.date === date && okChk(c)));
  const manual = topFirst(dayChks.filter(isSoloChk));
  const linked = dayChks.filter(c => !isSoloChk(c));
  // 반복업무 (index_136) — 이 날짜에 해당하는 반복업무 + 지난 미완료
  const dayRoutines = routinesFor(data, owner, date);
  const missedRoutines = routineMisses(data, owner, date, 30);
  const needNotes = pendingMeetingNotes(data, owner, date);
  const chkDrag = useDragOrder((from, to) => setData(d => moveChkInGroup(d, from, to)), (from, to) => sameChkGroup(data.checklists, from, to));
  const mainIds = [];
  const push = id => { if (id && mainIds.indexOf(id) < 0) mainIds.push(id); };
  linked.forEach(c => push(c.subplanId));
  (data.subplans || []).forEach(s => { if ((s.start === date || s.due === date) && okOwner(s)) push(s.id); });
  const others = (data.subplans || []).filter(s => mainIds.indexOf(s.id) < 0 && s.start && s.due && s.start < date && date < s.due && okOwner(s));
  const doneCnt = dayChks.filter(c => c.done).length;
  const WDN = ['일', '월', '화', '수', '목', '금', '토'];
  const wd = WDN[new Date(date + 'T00:00:00').getDay()] || '';
  const toggleDone = id => setData(d => ({ ...d, checklists: d.checklists.map(x => x.id === id ? { ...x, done: !x.done, doneAt: !x.done ? TODAY : null } : x) }));
  const addChk = kind => {
    const t = newText.trim(); if (!t) return;
    const meet = kind === 'meeting';
    const sid = (!meet && newSub) ? Number(newSub) : null;
    setData(d => { const id = d.nid + 1; return applyChklDate({ ...d, nid: id, checklists: [...d.checklists, { id, subplanId: sid, standalone: !sid, kind: meet ? 'meeting' : 'task', text: t, done: false, date: '', owner: newOwners.slice(), memo: '' }] }, id, date); });
    setNewText(''); setNewOwners([]);
  };
  const jump = t => { onClose && onClose(); onEdit && onEdit(t); };
  const miniBtn = { border: '1px solid #E3E0DC', background: 'white', borderRadius: 6, color: '#6E6863', cursor: 'pointer', fontSize: 14.5, padding: '2px 8px', fontWeight: 600, flexShrink: 0, fontFamily: 'inherit' };
  const selSt = { fontSize: 15.5, padding: '6px 8px', border: '1px solid #D8D3CC', borderRadius: 7, background: 'white', color: '#3A3631', fontFamily: 'inherit' };
  const tree = ids => {
    const g = [];
    ids.forEach(id => {
      const s = subOf(id); if (!s) return;
      const p = planOf(s.planId); const o = p ? outOf(p.outputId) : null;
      const oK = o ? o.id : 0; const pK = p ? p.id : 0;
      let go = g.find(x => x.key === oK); if (!go) { go = { key: oK, out: o, plans: [] }; g.push(go); }
      let gp = go.plans.find(x => x.key === pK); if (!gp) { gp = { key: pK, plan: p, subs: [] }; go.plans.push(gp); }
      gp.subs.push(s);
    });
    return g;
  };
  const subOpts = (data.subplans || []).map(s => { const p = planOf(s.planId); const o = p ? outOf(p.outputId) : null; return { id: s.id, label: (o ? o.code + ' ' : '') + (p ? p.name + ' ▸ ' : '') + s.name }; });
  const rank = id => mainIds.indexOf(id) >= 0 ? 0 : 1;
  subOpts.sort((a, b) => rank(a.id) - rank(b.id));

        {isMeetingChk(c) && (meetingNoteOf(data, c)

          : <button onClick={e => { e.stopPropagation(); setNoteFor(c); }} style={{ border: 'none', background: '#B91C1C', color: 'white', borderRadius: 6, padding: '3px 10px', fontSize: 14, fontWeight: 800, cursor: 'pointer', fontFamily: 'inherit', flexShrink: 0 }}>📝 회의록 등록</button>)}
        {over && <span style={{ fontSize: 14.5, color: '#DC2626', fontWeight: 700, flexShrink: 0 }} title={'마감일(' + s.due + ') 초과'}>⚠</span>}
      </div>
    );
  };
  const subRow = s => {
    const cs = linked.filter(c => c.subplanId === s.id);

  const renderTree = g => g.map(go => (

          <button onClick={() => addChk('task')} title="수동 체크리스트로 추가" style={{ fontSize: 16, fontWeight: 700, padding: '7px 15px', borderRadius: 7, border: 'none', background: CHK_TONE.task.fg, color: 'white', cursor: 'pointer', flexShrink: 0, fontFamily: 'inherit' }}>📌 추가</button>
          <button onClick={() => setAddMeet(true)} title="회의명 · 참석자 · 시간을 적어 회의를 추가합니다" style={{ fontSize: 16, fontWeight: 700, padding: '7px 15px', borderRadius: 7, border: 'none', background: CHK_TONE.meeting.fg, color: 'white', cursor: 'pointer', flexShrink: 0, fontFamily: 'inherit' }}>🗓 회의 추가</button>
        </div>
        <div style={{ marginTop: 7 }}><OwnerChips selected={newOwners} onToggle={m => setNewOwners(o => toggleIn(o, m))} /></div>
        <div style={{ marginTop: 6, fontSize: 14.5, color: '#6E6863' }}>※ 회의는 <b>회의명 · 참석자 · 시간</b>을 입력하는 전용 창으로 추가됩니다.</div>
      </div>
      <Btn v="secondary" onClick={onClose} style={{ width: '100%' }}>닫기</Btn>
      {addMeet && <MeetingAddModal data={data} setData={setData} date={date} onClose={() => setAddMeet(false)} />}
      {editMeet && <MeetingAddModal data={data} setData={setData} date={date} editing={editMeet} onClose={() => setEditMeet(null)} />}
      {noteFor && <MeetingNoteModal data={data} setData={setData} chk={noteFor} onClose={() => setNoteFor(null)} />}
    </ModalShell>
  );
}

// 주간 / 월간 주요 업무 모아보기 — 담당자별 (index_134)
function RoundupModal({ data, start, end, label, initialOwner, onEdit, onClose }) {
  const NOOWN = '담당 없음';
  const [only, setOnly] = useState(initialOwner || '');
  const [proj, setProj] = useState('');
  const jump = t => { onClose && onClose(); onEdit && onEdit(t); };
  const miniBtn = { border: '1px solid #E3E0DC', background: 'white', borderRadius: 6, color: '#6E6863', cursor: 'pointer', fontSize: 14, padding: '1px 7px', fontWeight: 600, flexShrink: 0, fontFamily: 'inherit' };
  const subOf = id => (data.subplans || []).find(s => s.id === id);
  const planOf = id => (data.plans || []).find(p => p.id === id);
  const outOf = id => (data.outputs || []).find(o => o.id === id);

  const rSubs = (data.subplans || []).filter(s => inPeriod(s, start, end));
  const rChks = (data.checklists || []).filter(c => c.date && c.date >= start && c.date <= end);
  const rPlans = (data.plans || []).filter(p => inPeriod(p, start, end) || rSubs.some(s => isLinkedPlan(s, p.id)));

  const names = MEMBERS.concat([NOOWN]);
  const B = {}; names.forEach(n => { B[n] = { plans: [], subs: [], chks: [] }; });
  const put = (k, it, own) => { const list = (own && own.length) ? own.filter(m => B[m]) : []; (list.length ? list : [NOOWN]).forEach(m => B[m][k].push(it)); };
  rPlans.forEach(p => put('plans', p, ownersOf(p)));
  rSubs.forEach(s => put('subs', s, ownersOf(s)));
  rChks.forEach(c => put('chks', c, chkOwners(data, c)));

  const cnt = b => b.plans.length + b.subs.length + b.chks.length;
  const shown = names.filter(n => (!only || n === only) && cnt(B[n]) > 0);

  // ── 프로젝트별 분류 (index_135) — 다중연결(extraOutputIds / extraPlanIds)까지 포함해 프로젝트마다 담는다
  const NOOUT = '0';
  const outIdsOfPlan = p => { if (!p) return []; const a = []; if (p.outputId) a.push(p.outputId); extraOuts(p).forEach(x => { if (x && a.indexOf(x) < 0) a.push(x); }); return a; };
  const outIdsOfSub = s => { const a = []; const add = pid => outIdsOfPlan(planOf(pid)).forEach(x => { if (a.indexOf(x) < 0) a.push(x); }); add(s.planId); extraPlans(s).forEach(add); return a; };
  const outIdsOfChk = c => { const s = c.subplanId ? subOf(c.subplanId) : null; return s ? outIdsOfSub(s) : []; };
  const PJ = {}; const pKeys = [];
  const pput = (oid, k, it) => { const kk = String(oid); if (!PJ[kk]) { PJ[kk] = { plans: [], subs: [], chks: [] }; pKeys.push(kk); } PJ[kk][k].push(it); };
  const spreadP = (ids, k, it) => { (ids.length ? ids : [NOOUT]).forEach(oid => pput(oid, k, it)); };
  rPlans.forEach(p => spreadP(outIdsOfPlan(p), 'plans', p));
  rSubs.forEach(s => spreadP(outIdsOfSub(s), 'subs', s));
  rChks.forEach(c => spreadP(outIdsOfChk(c), 'chks', c));
  const pShown = []; (data.outputs || []).forEach(o => { if (PJ[String(o.id)]) pShown.push(String(o.id)); }); pKeys.forEach(k => { if (pShown.indexOf(k) < 0) pShown.push(k); });
  // 담당자 칩이 눌려 있으면 프로젝트 카드 안에서도 그 담당자 몫만 남긴다(교차 필터)
  const ownOK = (it, isChk) => { if (!only) return true; const own = (isChk ? chkOwners(data, it) : ownersOf(it)).filter(m => MEMBERS.indexOf(m) >= 0); return only === NOOWN ? own.length === 0 : own.indexOf(only) >= 0; };
  const filtOwn = b => ({ plans: b.plans.filter(x => ownOK(x)), subs: b.subs.filter(x => ownOK(x)), chks: b.chks.filter(x => ownOK(x, true)) });
  const ALL = { plans: rPlans, subs: rSubs, chks: rChks };

  const chkLine = c => {
    const tn = chkTone(c); const solo = isSoloChk(c);
    return (
      <div key={'c' + c.id} style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 4, padding: '5px 8px', borderRadius: 7, background: c.done ? '#F5F4F2' : (solo ? tn.bg : '#FBFDFB'), borderStyle: 'solid', borderWidth: solo ? '1px 1px 1px 3px' : '1px', borderColor: (() => { const b = c.done ? '#E3E0DC' : (solo ? tn.bd : '#CDE3C6'); return solo ? [b, b, b, tn.fg].join(' ') : b; })() }}>
        <span style={{ flexShrink: 0, width: 10, height: 10, borderRadius: '50%', border: '1.5px solid ' + (c.done ? '#1FA463' : '#B8B2AA'), background: c.done ? '#1FA463' : 'transparent' }} />
        <span style={{ fontSize: 14, color: '#A29C95', flexShrink: 0 }}>{c.date}</span>
        {solo && <span style={{ fontSize: 14, fontWeight: 800, color: tn.fg, flexShrink: 0 }}>{tn.icon} {tn.name}</span>}
        <span style={{ flex: 1, minWidth: 0, fontSize: 16, color: c.done ? '#A29C95' : '#3A3631', textDecoration: c.done ? 'line-through' : 'none', wordBreak: 'break-all' }}>{c.text}</span>
        {ownersOf(c).length > 1 && <span style={{ fontSize: 14, color: '#6E6863', flexShrink: 0 }} title={'공동 담당 ' + ownerNm(c)}>👥 {ownersOf(c).length}</span>}
        {c.memo && <span style={{ fontSize: 14, flexShrink: 0 }} title={c.memo}>📝</span>}
      </div>
    );
  };

  const bucketBody = (b, pin) => {
    // 이 담당자 몫의 세부 + (기간 밖이라도) 체크리스트가 붙어있는 세부를 모아 프로젝트▸실행계획▸세부 트리로
    // pin 이 있으면(프로젝트별 보기) 트리를 그 프로젝트 하나로 고정하고 📁 헤더는 카드 제목이 대신하므로 생략
    const subIds = [];
    b.subs.forEach(s => { if (subIds.indexOf(s.id) < 0) subIds.push(s.id); });
    b.chks.forEach(c => { if (c.subplanId && subIds.indexOf(c.subplanId) < 0) subIds.push(c.subplanId); });
    const tree = [];
    subIds.forEach(id => {
      const s = subOf(id); if (!s) return;
      const p = planOf(s.planId); const o = pin ? pin.out : (p ? outOf(p.outputId) : null);
      const oK = o ? o.id : 0, pK = p ? p.id : 0;
      let go = tree.find(x => x.key === oK); if (!go) { go = { key: oK, out: o, plans: [] }; tree.push(go); }
      let gp = go.plans.find(x => x.key === pK); if (!gp) { gp = { key: pK, plan: p, subs: [] }; go.plans.push(gp); }
      gp.subs.push(s);
    });
    // 기간 안에 걸린 실행계획 중 위 트리에 안 뜬 것(세부 없이 본인이 담당)
    const planIdsInTree = []; tree.forEach(go => go.plans.forEach(gp => { if (gp.plan) planIdsInTree.push(gp.plan.id); }));
    const lonePlans = b.plans.filter(p => planIdsInTree.indexOf(p.id) < 0);
    const soloChks = b.chks.filter(isSoloChk);
    return (
      <div>
        {tree.map(go => (
          <div key={'o' + go.key} style={{ marginTop: 8 }}>
            {!pin && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
              <span style={{ fontSize: 16, fontWeight: 800, color: G }}>📁 {go.out ? outLabel(go.out) : '연결된 출력 프로젝트 없음'}</span>
              {go.out && <button onClick={() => jump({ kind: 'output', id: go.out.id })} style={miniBtn}>수정</button>}
            </div>)}
            {go.plans.map(gp => (
              <div key={'p' + gp.key} style={{ marginLeft: 6, marginTop: 5 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
                  <span style={{ fontSize: 15.5, fontWeight: 700, color: '#6E6863' }}>▸ {gp.plan ? gp.plan.name : '연결된 실행계획 없음'}</span>
                  {gp.plan && <button onClick={() => jump({ kind: 'plan', id: gp.plan.id })} style={miniBtn}>수정</button>}
                </div>
                {gp.subs.map(s => (
                  <div key={'s' + s.id} style={{ marginLeft: 6, marginTop: 5, paddingLeft: 9, borderLeft: '2px solid #EDEBE7' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
                      <Badge label={s.stage} color={stC(s.stage)} />
                      <span style={{ fontSize: 16.5, fontWeight: 700, color: s.stage === '완료' ? '#A29C95' : '#1A1614' }}>{s.name}</span>
                      <span style={{ fontSize: 14, color: '#A29C95' }}>{(s.start || '미정') + ' ~ ' + (s.due || '미정')}</span>
                      <button onClick={() => jump({ kind: 'subplan', id: s.id })} style={{ ...miniBtn, marginLeft: 'auto' }}>수정</button>
                    </div>
                    {b.chks.filter(c => c.subplanId === s.id).map(c => chkLine(c))}
                  </div>
                ))}
              </div>
            ))}
          </div>
        ))}
        {lonePlans.length > 0 && (
          <div style={{ marginTop: 8 }}>
            <div style={{ fontSize: 15, fontWeight: 700, color: '#6E6863', marginBottom: 3 }}>▸ 이 기간 진행 실행계획</div>
            {lonePlans.map(p => { const o = outOf(p.outputId); return (
              <div key={'lp' + p.id} style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 4, padding: '5px 8px', borderRadius: 7, background: '#FAFAF9', border: '1px solid #EDEBE7', flexWrap: 'wrap' }}>
                <span style={{ fontSize: 14, color: '#A29C95' }}>{o ? o.code : ''}</span>
                <span style={{ fontSize: 16, fontWeight: 700 }}>{p.name}</span>
                <span style={{ fontSize: 14, color: '#A29C95' }}>{(p.start || '미정') + ' ~ ' + (p.due || '미정')}</span>
                <button onClick={() => jump({ kind: 'plan', id: p.id })} style={{ ...miniBtn, marginLeft: 'auto' }}>수정</button>
              </div>); })}
          </div>
        )}
        {soloChks.length > 0 && (
          <div style={{ marginTop: 8 }}>
            <div style={{ fontSize: 15, fontWeight: 700, color: '#6E6863', marginBottom: 3 }}>· 세부계획 없는 개별 항목</div>
            {soloChks.map(c => chkLine(c))}
          </div>
        )}
      </div>
    );
  };

  const filterBtn = active => ({ display: 'inline-flex', alignItems: 'center', gap: 3, padding: '3px 9px', borderRadius: 15, fontSize: 15, fontWeight: 600, cursor: 'pointer', border: '1px solid ' + (active ? G : '#E3E0DC'), background: active ? G : 'white', color: active ? 'white' : '#6E6863', fontFamily: 'inherit' });
  return (
    <ModalShell title={label} onClose={onClose}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap', background: '#F5F4F2', borderRadius: 10, padding: '10px 13px', border: '1px solid #EDEBE7' }}>
        <span style={{ fontSize: 16.5, fontWeight: 700, color: G }}>{start} ~ {end}</span>
        <span style={{ fontSize: 15.5, color: '#6E6863' }}>· 실행계획 {rPlans.length}건 · 세부 {rSubs.length}건 · 체크리스트 {rChks.length}건</span>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 4, flexWrap: 'wrap' }}>
        <span style={{ fontSize: 15, color: '#6E6863', fontWeight: 600, marginRight: 2 }}>담당자별</span>
        <button onClick={() => setOnly('')} style={filterBtn(!only)}>전체</button>
        {MEMBERS.map(m => <button key={m} onClick={() => setOnly(only === m ? '' : m)} style={filterBtn(only === m)}><span style={{ fontSize: 16 }}>{AV[m]}</span> {m}</button>)}
        <button onClick={() => setOnly(only === NOOWN ? '' : NOOWN)} style={filterBtn(only === NOOWN)}>{NOOWN}</button>
      </div>
      {pShown.length > 0 && (
      <div style={{ display: 'flex', alignItems: 'center', gap: 4, flexWrap: 'wrap' }}>
        <span style={{ fontSize: 15, color: '#6E6863', fontWeight: 600, marginRight: 2 }}>프로젝트별</span>
        <button onClick={() => setProj('')} style={filterBtn(!proj)}>전체</button>
        {pShown.map(k => { const o = k === NOOUT ? null : outOf(Number(k)); const b = PJ[k]; const nm = o ? outLabel(o) : '프로젝트 미연결';
          return <button key={'pf' + k} onClick={() => setProj(proj === k ? '' : k)} title={nm + ' — 실행계획 ' + b.plans.length + ' · 세부 ' + b.subs.length + ' · 체크리스트 ' + b.chks.length} style={filterBtn(proj === k)}>📁 {nm} <span style={{ fontSize: 13.5, opacity: 0.72 }}>{cnt(b)}</span></button>; })}
      </div>)}
      <div style={{ fontSize: 14.5, color: '#A29C95', lineHeight: 1.5 }}>{(!only && !proj) ? '전체 보기에서는 기간에 걸친 프로젝트·실행계획·체크리스트를 그대로 보여줍니다. 위에서 담당자나 프로젝트를 누르면 그 분류로 묶어 봅니다.' : '담당자가 여러 명이면 각 담당자 밑에 모두 표시됩니다. 체크리스트에 담당자가 없으면 소속 세부실행계획의 담당자로 분류돼요. 담당자와 프로젝트를 함께 누르면 교차(그 프로젝트 안의 그 담당자 몫)로 보입니다.'}</div>
      {proj ? (() => {
        const o = proj === NOOUT ? null : outOf(Number(proj)); const b = filtOwn(PJ[proj] || { plans: [], subs: [], chks: [] });
        if (cnt(b) === 0) return <div style={{ fontSize: 16, color: '#A29C95', textAlign: 'center', padding: '18px 0' }}>이 프로젝트에 해당하는 업무가 없습니다.</div>;
        return (
          <div style={{ border: '1px solid #E3E0DC', borderRadius: 10, padding: '11px 13px' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 7, flexWrap: 'wrap', paddingBottom: 7, borderBottom: '1.5px solid #EDEBE7' }}>
              <span style={{ fontSize: 22 }}>📁</span>
              <span style={{ fontSize: 18, fontWeight: 800, color: G }}>{o ? outLabel(o) : '프로젝트 미연결'}</span>
              {only && <span style={{ fontSize: 15.5, fontWeight: 700, color: '#6E6863' }}>· {only === NOOWN ? '❔' : (AV[only] || '')} {only} 담당</span>}
              <span style={{ fontSize: 15, color: '#6E6863' }}>실행계획 {b.plans.length} · 세부 {b.subs.length} · 체크리스트 {b.chks.filter(c => c.done).length}/{b.chks.length}</span>
              {o && <button onClick={() => jump({ kind: 'output', id: o.id })} style={{ ...miniBtn, marginLeft: 'auto' }}>수정</button>}
            </div>
            {bucketBody(b, { out: o })}
          </div>);
      })() : only ? (
        shown.length === 0 ? <div style={{ fontSize: 16, color: '#A29C95', textAlign: 'center', padding: '18px 0' }}>이 기간에 진행하는 업무가 없습니다.</div> :
        shown.map(n => { const b = B[n]; return (
          <div key={n} style={{ border: '1px solid #E3E0DC', borderRadius: 10, padding: '11px 13px' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 7, flexWrap: 'wrap', paddingBottom: 7, borderBottom: '1.5px solid #EDEBE7' }}>
              <span style={{ fontSize: 22 }}>{n === NOOWN ? '❔' : (AV[n] || '')}</span>
              <span style={{ fontSize: 18, fontWeight: 800, color: G }}>{n}</span>
              <span style={{ fontSize: 15, color: '#6E6863' }}>실행계획 {b.plans.length} · 세부 {b.subs.length} · 체크리스트 {b.chks.filter(c => c.done).length}/{b.chks.length}</span>
            </div>
            {bucketBody(b)}
          </div>); })
      ) : (
        cnt(ALL) === 0 ? <div style={{ fontSize: 16, color: '#A29C95', textAlign: 'center', padding: '18px 0' }}>이 기간에 진행하는 업무가 없습니다.</div> :
        <div style={{ border: '1px solid #E3E0DC', borderRadius: 10, padding: '11px 13px' }}>{bucketBody(ALL)}</div>
      )}
      <Btn v="secondary" onClick={onClose} style={{ width: '100%' }}>닫기</Btn>
    </ModalShell>
  );
}

function TeamCalendar({ data, setData, onEdit }) {
  const [ym, setYm] = useState(TODAY.slice(0, 7));
  const [dragOver, setDragOver] = useState(null);
  const [openChk, setOpenChk] = useState(null);
  const [openDay, setOpenDay] = useState(null);
  const [ownerFilter, setOwnerFilter] = useState('');
  const setDate = (id, date) => setData(d => applyChklDate(d, id, date));
  const isManual = isSoloChk;
  const [newText, setNewText] = useState('');
  const [newOwners, setNewOwners] = useState([]);
  const [newMeet, setNewMeet] = useState('');
  const [newMeetOwners, setNewMeetOwners] = useState([]);
  const [roundup, setRoundup] = useState(null);
  const [expDays, setExpDays] = useState({});
  const [meetDay, setMeetDay] = useState(null);
  const toggleExp = date => setExpDays(o => ({ ...o, [date]: !o[date] }));
  const addSolo = (kind, text, owners, reset) => { const t = (text || '').trim(); if (!t) return; setData(d => ({ ...d, nid: d.nid + 1, checklists: [...d.checklists, { id: d.nid + 1, subplanId: null, standalone: true, kind, text: t, done: false, date: '', owner: (owners || []).slice(), memo: '' }] })); reset(); };
  const addManual = () => addSolo('task', newText, newOwners, () => { setNewText(''); setNewOwners([]); });
  const addMeeting = () => addSolo('meeting', newMeet, newMeetOwners, () => { setNewMeet(''); setNewMeetOwners([]); });
  const navBtnSmall = { width: 28, height: 28, borderRadius: 6, border: '1px solid #E3E0DC', background: 'white', cursor: 'pointer', fontSize: 18, color: '#3A3631', display: 'inline-flex', alignItems: 'center', justifyContent: 'center' };
  const filterBtn = active => ({ display: 'inline-flex', alignItems: 'center', gap: 3, padding: '3px 9px', borderRadius: 15, fontSize: 15, fontWeight: 600, cursor: 'pointer', border: '1px solid ' + (active ? G : '#E3E0DC'), background: active ? G : 'white', color: active ? 'white' : '#6E6863' });
  const [yy, mm] = ym.split('-').map(Number);
  const firstDow = new Date(yy, mm - 1, 1).getDay();
  const dim = new Date(yy, mm, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push(null);
  for (let dd = 1; dd <= dim; dd++) cells.push(ym + '-' + String(dd).padStart(2, '0'));
  while (cells.length % 7 !== 0) cells.push(null);
  const visible = c => !ownerFilter || ownersOf(c).indexOf(ownerFilter) >= 0;
  const chksByDate = {};
  (data.checklists || []).forEach(c => { if (c.date && visible(c)) (chksByDate[c.date] = chksByDate[c.date] || []).push(c); });
  const subOf = id => data.subplans.find(s => s.id === id);

e}/{rToday.length}</span><span style={{ fontSize: 13.5, color: '#B45309', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{rToday.filter(r => !routineDone(data, r.id, TODAY)).map(r => r.name).join(', ')}</span></div>}<button onClick={e => { e.stopPropagation(); setTodayFor(m); }} title={TODAY + ' 기준 ' + m + ' 담당 업무를 모아 봅니다'} style={{ width: '100%', marginBottom: 9, padding: '7px 0', borderRadius: 8, border: '1px solid ' + G, background: 'white', color: G, cursor: 'pointer', fontSize: 15.5, fontWeight: 700, fontFamily: 'inherit' }}>📆 금일 업무보기</button><Bar v={done} m={subCnt || 1} h={5} /><div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginTop: 12 }}><div style={{ textAlign: 'center', background: '#F5F4F2', borderRadius: 8, padding: '8px 4px' }}><div style={{ fontSize: 22, fontWeight: 700, color: G }}>{owned.length}</div><div style={{ fontSize: 14, color: '#6E6863' }}>담당</div></div><div style={{ textAlign: 'center', background: '#FAF6EE', borderRadius: 8, padding: '8px 4px' }}><div style={{ fontSize: 22, fontWeight: 700, color: GO }}>{supp.length}</div><div style={{ fontSize: 14, color: '#6E6863' }}>서포트</div></div></div></Card>);

function TabWeekly({ data, setData, onEdit }) {

    const sc = s.start <= weekDates[0] ? 0 : weekDates.indexOf(s.start);

    const m = spanMeta[i];

    laneOf[i] = k;

          <EditBtn onClick={() => onEdit({ kind: 'subplan', id: s.id })} />
        </div>
        <div style={{ display: 'flex', gap: 5, marginTop: 4, flexWrap: 'wrap', alignItems: 'center' }}>
          <span style={{ fontSize: 13, padding: '1px 5px', borderRadius: 6, background: stC(s.stage), color: 'white' }}>{s.stage}</span>
          <span style={{ fontSize: 13, color: G }}>{ownerAv(s)}</span>
          {chks.length > 0 && <span style={{ fontSize: 13, color: '#6E6863' }}>☑ {cd}/{chks.length}</span>}
          {files.length > 0 && <span style={{ fontSize: 13, color: '#2D5FE0' }}>📎{files.length}</span>}
        </div>
        {!colChk[s.id] && <div style={{ background: '#F5F4F2', borderRadius: 6, padding: 6, marginTop: 6 }}>{chks.map(c => <div key={c.id} onClick={() => toggleChk(c.id)} style={{ display: 'flex', alignItems: 'center', gap: 5, padding: '3px 0', cursor: 'pointer' }}><Chk on={c.done} /><span style={{ fontSize: 14, color: c.done ? '#A29C95' : '#3A3631', textDecoration: c.done ? 'line-through' : 'none' }}>{c.text}</span></div>)}<div style={{ display: 'flex', gap: 4, marginTop: chks.length ? 5 : 0 }}><input value={newChk[s.id] || ''} draggable={false} onMouseDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} onChange={e => setNewChk(n => ({ ...n, [s.id]: e.target.value }))} onKeyDown={e => { if (e.key === 'Enter') addChk(s.id); }} placeholder="+ 체크 추가" style={{ flex: 1, fontSize: 14, padding: '3px 6px', border: '1px solid #E3E0DC', borderRadius: 5, outline: 'none', minWidth: 0 }} /><button onClick={e => { e.stopPropagation(); addChk(s.id); }} style={{ fontSize: 14, padding: '3px 8px', border: 'none', background: G, color: 'white', borderRadius: 5, cursor: 'pointer', fontWeight: 600 }}>추가</button></div></div>}
      </Card>
    );
  };
  const ymd = (y, m, d) => y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  const shiftMonthDate = (ds, n) => { const d = new Date(ds + 'T00:00:00'); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last)); return ymd(d.getFullYear(), d.getMonth() + 1, d.getDate()); };
  const mStartD = new Date(monthStart + 'T00:00:00');
  const RANGE_DAYS = 30;
  const mDates = [];
  for (let i = 0; i < RANGE_DAYS; i++) { const d = new Date(mStartD); d.setDate(mStartD.getDate() + i); mDates.push(ymd(d.getFullYear(), d.getMonth() + 1, d.getDate())); }
  const mLeadWd = (mStartD.getDay() + 6) % 7;
  const monthCells = [];
  for (let i = 0; i < mLeadWd; i++) monthCells.push(null);
  mDates.forEach(dt => monthCells.push(dt));
  while (monthCells.length % 7 !== 0) monthCells.push(null);
  const monthWeeks = []; for (let i = 0; i < monthCells.length; i += 7) monthWeeks.push(monthCells.slice(i, i + 7));
  const monthEnd = mDates[mDates.length - 1];
  const monthItemsOf = date => subs.filter(s => s.due === date);
  const navBtn = { border: '1px solid #E3E0DC', background: 'white', borderRadius: 6, cursor: 'pointer', padding: '4px 10px' };
  return (
    <div style={{ padding: 20 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 14, flexWrap: 'wrap' }}>
        <div style={{ fontSize: 21, fontWeight: 700, color: G }}>데일리 / 주간 업무</div>
        <div style={{ display: 'flex', gap: 6, marginLeft: 'auto', alignItems: 'center', flexWrap: 'wrap' }}>
          <button onClick={() => setMonthView(v => !v)} style={{ ...navBtn, background: monthView ? G : 'white', color: monthView ? 'white' : '#3A3631', fontWeight: 600 }}>{monthView ? '주간 보기' : '📅 월간 보기'}</button>
          {monthView ? (<>
            <span style={{ fontSize: 15, color: '#6E6863' }}>조회 시작일</span>
            <input type="date" value={monthStart} onChange={e => { if (e.target.value) setMonthStart(e.target.value); }} style={{ padding: '4px 8px', borderRadius: 6, border: '1px solid #E3E0DC', fontSize: 16 }} />
            <button onClick={() => setMonthStart(shiftMonthDate(monthStart, -1))} style={navBtn}>◀</button>
            <span style={{ fontSize: 16, color: '#6E6863', minWidth: 120, textAlign: 'center' }}>{monthStart.slice(5)} ~ {monthEnd.slice(5)} (30일)</span>
            <button onClick={() => setMonthStart(shiftMonthDate(monthStart, 1))} style={navBtn}>▶</button>
          </>) : (<>
            <button onClick={() => setOffset(offset - 1)} style={navBtn}>◀</button>
            <span style={{ fontSize: 16, color: '#6E6863', minWidth: 110, textAlign: 'center' }}>{weekDates[0].slice(5)} ~ {weekDates[6].slice(5)}{offset === 0 ? ' (이번 주)' : ''}</span>
            <button onClick={() => setOffset(offset + 1)} style={navBtn}>▶</button>
          </>)}
        </div>
      </div>
      <FilterBar value={filter} onChange={setFilter} />
      {monthView && (
        <div style={{ marginBottom: 16 }}>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,minmax(0,1fr))', gap: 6, marginBottom: 6 }}>
            {DAYS.map(day => <div key={day} style={{ textAlign: 'center', fontWeight: 700, fontSize: 16, color: G, padding: '4px 0' }}>{day}</div>)}
          </div>
          {monthWeeks.map((wk, wi) => (
            <div key={wi} style={{ display: 'grid', gridTemplateColumns: 'repeat(7,minmax(0,1fr))', gap: 6, marginBottom: 6 }}>
              {wk.map((date, di) => {
                if (!date) return <div key={di} style={{ minHeight: 92, background: '#FAFAFA', borderRadius: 8 }} />;
                const items = monthItemsOf(date);
                const isToday = date === TODAY, isSel = date === monthStart;
                return (
                  <div key={di} onClick={() => setMonthStart(date)}
                    onDragOver={e => { e.preventDefault(); setDragOver('m' + date); }}
                    onDragLeave={e => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOver(null); }}
                    onDrop={e => handleDrop(e, date)}
                    style={{ minHeight: 92, background: dragOver === 'm' + date ? '#E8F4EE' : 'white', border: '1px solid ' + (isSel ? G : isToday ? GO : '#EDEBE7'), borderRadius: 8, padding: 6, cursor: 'pointer', overflow: 'hidden' }}>
                    <div style={{ fontSize: 15, fontWeight: 700, color: isSel ? G : isToday ? GO : '#3A3631', marginBottom: 4 }}>{date.slice(8) === '01' ? Number(date.slice(5, 7)) + '월 1' : Number(date.slice(8))}{isSel ? ' ·시작' : isToday ? ' ·오늘' : ''}</div>
                    {items.slice(0, 4).map(s => <div key={s.id} style={{ fontSize: 13, padding: '2px 5px', borderRadius: 5, background: stC(s.stage), color: 'white', marginBottom: 3, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{s.name}</div>)}
                    {items.length > 4 && <div style={{ fontSize: 13, color: '#A29C95' }}>+{items.length - 4}건</div>}
                  </div>
                );
              })}
            </div>
          ))}
          <div style={{ fontSize: 15, color: '#A29C95', marginTop: 4 }}>날짜를 클릭하면 그 날부터 한 달(30일)로 조회 기간이 바뀝니다.</div>
        </div>
      )}
      <div style={{ overflowX: 'auto', marginBottom: 16, display: monthView ? 'none' : 'block' }}>
        <div style={{ minWidth: 1000 }}>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,minmax(0,1fr))', gap: 8, marginBottom: 8 }}>
            {DAYS.map((day, i) => (
              <div key={day} style={{ background: weekDates[i] === TODAY ? GO : G, color: 'white', borderRadius: 8, padding: '7px 0', textAlign: 'center', fontWeight: 700, fontSize: 16 }}>
                {day} <span style={{ opacity: 0.7, fontSize: 14 }}>{weekDates[i].slice(5)}</span>
              </div>
            ))}
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,minmax(0,1fr))', gap: 8 }}>
            {weekDates.map((date, i) => (
              <div key={'dc' + i} style={{ gridColumn: i + 1, gridRow: 1, minWidth: 0 }}
                onDragOver={e => { e.preventDefault(); setDragOver('c' + i); }}
                onDragLeave={e => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOver(null); }}
                onDrop={e => handleDrop(e, date)}>
                {(() => { const h = colReserve(i); return h > 0 ? <div style={{ height: h }} /> : null; })()}
                <div style={{ minHeight: 70, padding: 4, borderRadius: 8, background: dragOver === 'c' + i ? '#E8F4EE' : 'transparent', border: dragOver === 'c' + i ? '2px dashed ' + G : '2px solid transparent', transition: 'all 0.15s' }}>
                  {getDayItems(date).map(s => renderMini(s))}
                </div>
              </div>
            ))}
            {spanning.map((s, idx) => {
              const sc = s.start <= weekDates[0] ? 0 : weekDates.indexOf(s.start);
              const ec = s.due >= weekDates[6] ? 6 : weekDates.indexOf(s.due);
              if (sc < 0 || ec < 0 || sc > ec) return null;
              const dur = diffDays(s.start, s.due);
              const chks = data.checklists.filter(c => c.subplanId === s.id); const cd = chks.filter(c => c.done).length;
              return (
                <div key={s.id} ref={el => (spanRefs.current[s.id] = el)} draggable onDragStart={e => onDragStart(e, s, true)}
                  style={{ gridColumn: `${sc + 1} / ${ec + 2}`, gridRow: 1, alignSelf: 'start', marginTop: laneTop[laneOf[idx]], position: 'relative', zIndex: 2, background: 'white', border: '1.5px solid ' + stC(s.stage), borderLeft: '5px solid ' + stC(s.stage), borderRadius: 10, padding: '6px 12px', display: 'flex', flexDirection: 'column', gap: 4, boxShadow: '0 2px 8px rgba(0,0,0,0.1)', cursor: 'grab' }}>
                  <div style={{ display: 'flex', alignItems: 'flex-start', gap: 8 }}>
                    <Badge label={s.stage} color={stC(s.stage)} />
                    <div style={{ flex: 1, minWidth: 0, cursor: 'pointer' }} onClick={() => setColChk(cc => ({ ...cc, [s.id]: !cc[s.id] }))}>
                      <div style={{ fontSize: 17, fontWeight: 700, color: '#1A1614', whiteSpace: 'normal', wordBreak: 'break-word', lineHeight: 1.25 }}>{s.name}</div>
                      <div style={{ fontSize: 14, color: '#6E6863' }}>{ownerAv(s)} · {s.start.slice(5)}~{s.due.slice(5)} ({dur}일){chks.length > 0 ? ` · ☑ ${cd}/${chks.length}` : ''}</div>
                    </div>
                    <EditBtn onClick={() => onEdit({ kind: 'subplan', id: s.id })} />
                  </div>
                  {!colChk[s.id] && <div style={{ background: '#F5F4F2', borderRadius: 6, padding: 6 }}>{chks.map(c => <div key={c.id} onClick={() => toggleChk(c.id)} style={{ display: 'flex', alignItems: 'center', gap: 5, padding: '3px 0', cursor: 'pointer' }}><Chk on={c.done} /><span style={{ fontSize: 14, color: c.done ? '#A29C95' : '#3A3631', textDecoration: c.done ? 'line-through' : 'none' }}>{c.text}</span></div>)}<div style={{ display: 'flex', gap: 4, marginTop: chks.length ? 5 : 0 }}><input value={newChk[s.id] || ''} draggable={false} onMouseDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} onChange={e => setNewChk(n => ({ ...n, [s.id]: e.target.value }))} onKeyDown={e => { if (e.key === 'Enter') addChk(s.id); }} placeholder="+ 체크 추가" style={{ flex: 1, fontSize: 14, padding: '3px 6px', border: '1px solid #E3E0DC', borderRadius: 5, outline: 'none', minWidth: 0 }} /><button onClick={e => { e.stopPropagation(); addChk(s.id); }} style={{ fontSize: 14, padding: '3px 8px', border: 'none', background: G, color: 'white', borderRadius: 5, cursor: 'pointer', fontWeight: 600 }}>추가</button></div></div>}
                </div>
              );
            })}
          </div>
        </div>
      </div>
      <div onDragOver={e => { e.preventDefault(); setDragOver('un'); }} onDragLeave={() => setDragOver(null)} onDrop={handleUnassignedDrop}
        style={{ background: dragOver === 'un' ? '#E8F4EE' : '#F5F4F2', border: '1px dashed ' + (dragOver === 'un' ? G : '#D1D5DB'), borderRadius: 10, padding: 14, transition: 'all 0.15s' }}>
        <div style={{ fontSize: 17, fontWeight: 700, color: '#6E6863', marginBottom: 14 }}>미배정 ({unassigned.length}) <span style={{ fontWeight: 400, fontSize: 15 }}>· 날짜 칸으로 드래그해서 배정 / 달력→미배정 드래그로 해제</span></div>
        {unassigned.length === 0 ? <div style={{ fontSize: 16, color: '#A29C95' }}>모든 항목에 날짜가 배정되었습니다.</div> :
          Object.entries(grouped).map(([oKey, plans]) => (
            <div key={oKey} style={{ marginBottom: 16 }}>
              <div style={{ background: G, color: 'white', borderRadius: '8px 8px 0 0', padding: '8px 14px', fontSize: 16, fontWeight: 700 }}>📦 {oKey}</div>
              <div style={{ display: 'flex', border: '1px solid ' + G, borderTop: 'none', borderRadius: '0 0 8px 8px', overflowX: 'auto' }}>
                {Object.entries(plans).map(([pKey, tasks], pIdx, arr) => (
                  <div key={pKey} style={{ flex: '0 0 200px', borderRight: pIdx < arr.length - 1 ? '1px solid #E3E0DC' : 'none', background: 'white' }}>
                    <div style={{ background: '#E8F4EE', color: G, padding: '6px 10px', fontSize: 15, fontWeight: 700, borderBottom: '1px solid #D1FAE5' }}>▸ {pKey}</div>
                    <div style={{ padding: 8 }}>{tasks.map(s => renderMini(s, true))}</div>
                  </div>
                ))}
              </div>
            </div>
          ))}
      </div>
    </div>
  );
}

function PerfModal({ subId, data, setData, onClose }) {
  const sub = data.subplans.find(s => s.id === subId);
  const plan = sub ? data.plans.find(p => p.id === sub.planId) : null;
  const out = plan ? data.outputs.find(o => o.id === plan.outputId) : null;
  const planKpis = (plan && plan.kpis) || [];
  const hasKpi = planKpis.length > 0;
  const myLogs = (data.kpiLogs || []).filter(l => l.subplanId === subId);
  const first = myLogs[0];
  const [values, setValues] = useState(() => { const v = {}; myLogs.forEach(l => { v[l.kpiId || ('k' + l.planId)] = String(l.value); }); return v; });
  const [pStart, setPStart] = useState(first ? first.periodStart : addDay(TODAY, -30));
  const [pEnd, setPEnd] = useState(first ? first.periodEnd : TODAY);
  const [note, setNote] = useState(first ? first.note : '');
  const [showFile, setShowFile] = useState(false);
  const files = (data.subplans.find(s => s.id === subId) || {}).files || [];
  if (!sub) return null;
  const save = () => {
    setData(d => {
      let logs = (d.kpiLogs || []).filter(l => l.subplanId !== subId);
      planKpis.forEach(k => { const val = values[k.id]; if (val !== '' && val != null && !isNaN(Number(val))) logs = [...logs, { id: Date.now() + Math.floor(Math.random() * 1000), subplanId: subId, planId: plan.id, kpiId: k.id, value: Number(val), periodStart: pStart, periodEnd: pEnd, note, recordedAt: TODAY }]; });
      return { ...d, kpiLogs: logs, subplans: d.subplans.map(s => s.id === subId ? { ...s, perfRecorded: true } : s) };
    });
    onClose();
  };
  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'flex-start', justifyContent: 'center', zIndex: 100, padding: '24px 12px', overflowY: 'auto' }}>
      <div style={{ background: 'white', borderRadius: 16, width: '100%', maxWidth: 520, boxShadow: '0 10px 40px rgba(0,0,0,0.3)' }}>
        <div style={{ background: G, color: 'white', padding: '14px 20px', borderRadius: '16px 16px 0 0', display: 'flex', alignItems: 'center' }}>
          <span style={{ fontWeight: 800, fontSize: 19 }}>📊 성과 기록하기</span>
          <button onClick={onClose} style={{ marginLeft: 'auto', background: 'none', border: 'none', color: 'white', fontSize: 26, cursor: 'pointer' }}>×</button>
        </div>
        <div style={{ padding: 20, display: 'flex', flexDirection: 'column', gap: 16, maxHeight: '80vh', overflowY: 'auto' }}>
          <div style={{ background: '#F5F4F2', borderRadius: 10, padding: 12 }}>
            <div style={{ fontSize: 15, color: '#A29C95', marginBottom: 3 }}>{out ? outLabel(out) : ''} ▸ {plan ? plan.name : ''}</div>
            <div style={{ fontSize: 18, fontWeight: 700 }}>{sub.name}</div>
            <div style={{ fontSize: 15, color: '#6E6863', marginTop: 4 }}>{ownerAv(sub)} {ownerNm(sub)} · 완료일 {sub.completedAt || '미기록'}</div>
          </div>
          {hasKpi ? (
            <div style={{ background: '#F5F4F2', borderRadius: 10, padding: 14, border: '1px solid #A7F3D0' }}>
              <div style={{ fontSize: 17, fontWeight: 700, color: G, marginBottom: 10 }}>🎯 KPI 달성 기록 (KPI별 입력)</div>
              {planKpis.map(k => (
                <div key={k.id} style={{ background: 'white', borderRadius: 8, padding: '10px 12px', marginBottom: 8 }}>
                  <div style={{ fontSize: 16, color: '#3A3631', marginBottom: 6 }}><strong>{k.name}</strong> <span style={{ color: '#A29C95' }}>(기본목표 {(k.target || 0).toLocaleString()} {k.unit})</span></div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <input type="number" value={values[k.id] || ''} onChange={e => setValues(v => ({ ...v, [k.id]: e.target.value }))} placeholder="달성값 (비우면 미기록)" style={{ flex: 1, padding: '8px', borderRadius: 8, border: '1px solid #E3E0DC', fontSize: 17, boxSizing: 'border-box' }} />
                    <span style={{ fontSize: 16, color: '#6E6863', whiteSpace: 'nowrap' }}>{k.unit}</span>
                  </div>
                </div>
              ))}
              <div style={{ marginTop: 4 }}>
                <div style={{ fontSize: 15, color: '#6E6863', marginBottom: 4 }}>달성 기간 (KPI 공통)</div>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr auto 1fr', alignItems: 'center', gap: 8 }}>
                  {inp(pStart, setPStart, 'date')}<span style={{ color: '#A29C95' }}>~</span>{inp(pEnd, setPEnd, 'date')}
                </div>
                <div style={{ fontSize: 15, color: '#8B5CF6', marginTop: 6 }}>※ KPI 탭에서 이 기간이 집계 범위에 포함되면 자동 합산됩니다</div>
              </div>
            </div>
          ) : (
            <div style={{ background: '#FFF7ED', borderRadius: 10, padding: 12, border: '1px solid #FED7AA', fontSize: 16, color: '#92400E' }}>
              이 업무의 실행계획에는 등록된 KPI가 없습니다. KPI 없이 파일·설명만 기록할 수 있어요.
            </div>
          )}
          <div style={{ background: '#F5F4F2', borderRadius: 10, padding: 12, border: '1px solid #EDEBE7' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10 }}>
              <div style={{ fontSize: 17, fontWeight: 700, color: G }}>📎 보고서용 자료 {files.length > 0 ? `(${files.length})` : ''}</div>
              <Btn v="gold" onClick={() => setShowFile(true)} style={{ padding: '5px 12px', fontSize: 16 }}>+ 파일 추가</Btn>
            </div>
            {files.length === 0 ? <div style={{ fontSize: 16, color: '#A29C95' }}>첨부된 파일이 없습니다</div> :
              files.map(f => (
                <div key={f.id} style={{ background: 'white', borderRadius: 8, padding: '8px 10px', marginBottom: 6, border: '1px solid #E3E0DC' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <span>{f.name.match(/\.(png|jpg|jpeg|gif|webp)$/i) ? '🖼️' : '📄'}</span>
                    <div style={{ flex: 1 }}><div style={{ fontSize: 16, fontWeight: 600 }}>{f.name}</div><div style={{ fontSize: 14, color: '#A29C95' }}>{fmtSize(f.size)}</div></div>
                    {f.driveUrl && <a href={f.driveUrl} target="_blank" rel="noreferrer" style={{ fontSize: 15, color: '#2D5FE0', fontWeight: 600, textDecoration: 'none' }}>열기</a>}
                    <button onClick={() => { if (!confirm('이 첨부를 목록에서 삭제할까요? (드라이브 원본 파일은 유지됩니다)')) return; setData(d => ({ ...d, subplans: d.subplans.map(s => s.id === subId ? { ...s, files: (s.files || []).filter(x => x.id !== f.id) } : s) })); }} style={{ border: 'none', background: 'none', color: '#E53935', cursor: 'pointer', fontSize: 16, fontWeight: 700 }}>삭제</button>
                  </div>
                  {f.desc && <div style={{ fontSize: 15, color: '#6E6863', marginTop: 6, background: '#F5F4F2', borderRadius: 6, padding: '5px 8px' }}>💬 {f.desc}</div>}
                </div>
              ))
            }
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <Btn onClick={save} style={{ flex: 1 }}>성과 기록 저장</Btn>
            <Btn v="secondary" onClick={onClose}>취소</Btn>
          </div>
        </div>
      </div>
      {showFile && <FileModal subId={subId} data={data} setData={setData} onClose={() => setShowFile(false)} />}
    </div>
  );
}

function TabPerformance({ data, setData, onRecord }) {
  const [filter, setFilter] = useState('전체');
  const completed = data.subplans.filter(s => s.stage === '완료' && matchOwner(s, filter));
  const recorded = completed.filter(s => s.perfRecorded);
  const notRecorded = completed.filter(s => !s.perfRecorded);
  const planOf = id => data.plans.find(p => p.id === id);
  const outOf = pid => { const p = planOf(pid); return p ? data.outputs.find(o => o.id === p.outputId) : null; };
  const logsOf = subId => (data.kpiLogs || []).filter(l => l.subplanId === subId);
  const renderCard = (s, isRecorded) => {
    const plan = planOf(s.planId); const out = outOf(s.planId);

function NumInput({ value, onCommit, placeholder, style }) {
  const [v, setV] = useState(value == null || value === '' ? '' : String(value));
  const focused = useRef(false);
  useEffect(() => { if (!focused.current) setV(value == null || value === '' ? '' : String(value)); }, [value]);
  return <input type="number" value={v} onFocus={e => { focused.current = true; e.target.select(); }} onChange={e => setV(e.target.value)} onBlur={() => { focused.current = false; onCommit(v); }} onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); }} placeholder={placeholder} style={style} />;
}
function buildDailyPeriods(dates) {
  const ds = dates.slice().sort();
  const DOW2 = ['일', '월', '화', '수', '목', '금', '토'];
  const months = {}, weeks = {}, days = [];
  ds.forEach(d => {
    const m = d.slice(0, 7);
    if (!months[m]) months[m] = { key: m, s: m + '-01', e: m + '-31', label: m };
    const dt = new Date(d + 'T00:00:00');
    const mon = addDays(d, -((dt.getDay() + 6) % 7));
    if (!weeks[mon]) weeks[mon] = { key: mon, s: mon, e: addDays(mon, 6), label: mon.slice(5).replace('-', '/') + ' ~ ' + addDays(mon, 6).slice(5).replace('-', '/') + ' 주간' };
    days.push({ key: d, s: d, e: d, label: d + ' (' + DOW2[dt.getDay()] + ')' });
  });
  const desc = o => Object.values(o).sort((a, b) => b.key.localeCompare(a.key));
  return { month: desc(months), week: desc(weeks), day: days.reverse() };
}
