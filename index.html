      : 'add:' + (a.planId || '') + ':' + ((a.fields && a.fields.name) || '').trim();
    const groups = {};
    allDocs.forEach(dc => { const ap = appliedOf(dc.id); (dc.actions || []).forEach(a => { const k = keyOf(a); (groups[k] = groups[k] || []).push({ a, doc: dc, date: dc.date || '', applied: ap.indexOf(a.id) >= 0 }); }); });
    const cards = []; const traces = [];
    Object.keys(groups).forEach(k => {
      const arr = groups[k];
      const pend = arr.filter(x => !x.applied);
      if (!pend.length) return;
      const srcC = {}, srcF = {};
      arr.forEach(x => { Object.keys(x.a.changes || {}).forEach(f => { srcC[f] = x; }); Object.keys(x.a.fields || {}).forEach(f => { srcF[f] = x; }); });
      const contrib = pend.filter(x => Object.keys(x.a.changes || {}).some(f => srcC[f] === x) || Object.keys(x.a.fields || {}).some(f => srcF[f] === x) || (Object.keys(x.a.changes || {}).length === 0 && Object.keys(x.a.fields || {}).length === 0 && x === pend[pend.length - 1]));
      pend.filter(x => contrib.indexOf(x) < 0).forEach(x => {
        let by = '';
        Object.keys(x.a.changes || {}).forEach(f => { if (srcC[f] !== x && srcC[f].date > by) by = srcC[f].date; });
        Object.keys(x.a.fields || {}).forEach(f => { if (srcF[f] !== x && srcF[f].date > by) by = srcF[f].date; });
        traces.push({ x, by });
      });
      if (!contrib.length) return;
      const latest = contrib[contrib.length - 1];
      const mc = {}, mf = {}, cSrc = {}, fSrc = {};
      Object.keys(srcC).forEach(f => { if (!srcC[f].applied) { mc[f] = srcC[f].a.changes[f]; cSrc[f] = srcC[f].date; } });
      Object.keys(srcF).forEach(f => { mf[f] = srcF[f].a.fields[f]; fSrc[f] = srcF[f].date; });
      const action = { ...latest.a, id: '__mix__' + k, changes: Object.keys(mc).length ? mc : latest.a.changes, fields: Object.keys(mf).length ? mf : latest.a.fields, needsConfirm: contrib.some(x => !!x.a.needsConfirm), note: contrib.map(x => (contrib.length > 1 ? (x.date || '').slice(5).replace('-', '/') + ' · ' : '') + (x.a.note || '')).filter(Boolean).join('  /  ') };
      cards.push({ key: k, action, contrib, pend, cSrc, multi: contrib.length > 1, latestDate: latest.date || '' });
    });

    traces.sort((x, y) => (y.x.date || '').localeCompare(x.x.date || ''));
    return { cards, traces };
  })();

  const opColor = { add: '#1FA463', edit: '#2D5FE0' };
  const opLabel = { add: '＋ 추가', edit: '✎ 수정' };
  const levelLabel = { subplan: '세부실행계획', plan: '실행계획', kpi: 'KPI', memo: '메모' };

  // ===== 목록 화면 =====
  if (!openId) {

      <div style={{ padding: 20 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 14, flexWrap: 'wrap' }}>

        {status === 'loading' && <Card style={{ textAlign: 'center', padding: 30, color: '#A29C95' }}>불러오는 중…</Card>}

            <div style={{ flex: 1, minWidth: 0 }}><div style={{ fontSize: 18, fontWeight: 700, color: G }}>{m.title}</div></div>
            {m.source === 'firebase' && <span style={{ fontSize: 14, fontWeight: 700, color: '#2D5FE0', background: '#EFF6FF', borderRadius: 5, padding: '2px 7px' }}>수정됨</span>}
            <span style={{ color: '#A29C95', fontSize: 22 }}>›</span>
          </Card>
        ))}

        <div style={{ display: 'flex', alignItems: 'center', gap: 8, margin: '24px 0 10px', flexWrap: 'wrap' }}>
          <div style={{ fontSize: 19, fontWeight: 800, color: G }}>📥 대시보드 입력</div>
          <span style={{ fontSize: 15, color: '#A29C95' }}>모든 회의의 미반영 결정을 합친 최종 목록 · 같은 항목은 최신 회의 기준</span>
        </div>
        {!inbox && <Card style={{ textAlign: 'center', padding: 24, color: '#A29C95' }}>통합 목록 준비 중…</Card>}
        {inbox && inbox.cards.length === 0 && inbox.traces.length === 0 && <Card style={{ textAlign: 'center', padding: 24, color: '#A29C95' }}>반영 대기 중인 항목이 없습니다 🎉</Card>}
        {inbox && (inbox.cards.length > 0 || inbox.traces.length > 0) && (
          <Card>
            <div style={{ display: 'flex', gap: 6, marginBottom: 12, flexWrap: 'wrap' }}>
              {['전체'].concat(MEMBERS).concat(['공통확인']).map(f => { const cnt = inbox.cards.filter(cd => { if (f === '전체') return true; const os = actOwner(cd.action); return f === '공통확인' ? os.length === 0 : os.includes(f); }).length; const on = inboxF === f; return <button key={f} onClick={() => setInboxF(f)} style={{ padding: '5px 12px', borderRadius: 20, border: 'none', cursor: 'pointer', fontSize: 16, fontWeight: 600, background: on ? G : '#E3E0DC', color: on ? 'white' : '#3A3631' }}>{f === '전체' ? '전체' : f === '공통확인' ? '🤝 공통확인' : AV[f] + ' ' + f} ({cnt})</button>; })}
            </div>
            {(() => { const fc = inbox.cards.filter(cd => { if (inboxF === '전체') return true; const os = actOwner(cd.action); return inboxF === '공통확인' ? os.length === 0 : os.includes(inboxF); }); return fc.length === 0 ? <div style={{ fontSize: 16, color: '#A29C95' }}>해당 항목이 없습니다</div> : fc.map(cd => { const act = cd.action; const aos = actOwner(act); return (
              <div key={cd.key} style={{ border: '1px solid #EDEBE7', background: 'white', borderRadius: 10, padding: 12, marginBottom: 8 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap', marginBottom: 4 }}>
                  <span style={{ fontSize: 14, fontWeight: 800, color: 'white', background: opColor[act.op] || '#6E6863', borderRadius: 5, padding: '2px 7px' }}>{opLabel[act.op] || act.op}</span>
                  <span style={{ fontSize: 14, fontWeight: 700, color: '#6E6863', background: '#F5F4F2', borderRadius: 5, padding: '2px 7px' }}>{levelLabel[act.level] || act.level}</span>
                  {act.outputCode && <span style={{ fontSize: 14, fontWeight: 700, color: '#6E6863' }}>{act.outputCode}{act.planName ? ' · ' + act.planName : ''}</span>}
                  {aos.length > 0 ? <span style={{ fontSize: 14, fontWeight: 700, color: G }}>{aos.map(m2 => AV[m2] || '').join('')} {aos.join(',')}</span> : <span style={{ fontSize: 14, fontWeight: 700, color: '#A29C95' }}>🤝 공통</span>}
                  {act.needsConfirm && <span style={{ fontSize: 14, fontWeight: 700, color: '#E08700', background: '#FEF3C7', borderRadius: 5, padding: '2px 7px' }}>확인 필요</span>}
                  <span style={{ marginLeft: 'auto', fontSize: 14, fontWeight: 700, color: '#6E6863' }}>{cd.contrib.map(x => '🗓 ' + (x.date || '').slice(5).replace('-', '/')).join(' ')}{cd.multi ? ' 병합' : ''}</span>
                </div>
                <div style={{ fontSize: 17, fontWeight: 700, color: G }}>
                  {act.level === 'kpi' ? (act.kpiName + ' 목표') : act.op === 'edit' ? (act.subplanName || act.planName || '') : (act.fields ? act.fields.name || act.fields.memo : '')}
                </div>
                {act.op === 'edit' && act.level === 'kpi' && act.changes && act.changes.target && (
                  <div style={{ marginTop: 6, background: '#F8F7F5', borderRadius: 8, padding: '8px 10px', fontSize: 16 }}><span style={{ color: '#6E6863' }}>목표 ({act.changes.target.period})</span> &nbsp;<span style={{ color: '#2D5FE0', fontWeight: 700 }}>{Number(act.changes.target.to).toLocaleString()}원</span></div>
                )}
                {act.op === 'edit' && act.level !== 'kpi' && act.changes && Object.keys(act.changes).length > 0 && (
                  <div style={{ marginTop: 6, background: '#F8F7F5', borderRadius: 8, padding: '8px 10px', fontSize: 16 }}>
                    {Object.keys(act.changes).map(k2 => { const kn = { stage: '상태', name: '이름', due: '마감일', start: '시작일', owner: '담당자' }[k2] || k2; const c2 = act.changes[k2]; return (
                      <div key={k2} style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '2px 0' }}><span style={{ color: '#6E6863', minWidth: 44 }}>{kn}</span><span style={{ color: '#A29C95', textDecoration: 'line-through' }}>{c2.from != null ? String(c2.from) : '(없음)'}</span><span style={{ color: '#A29C95' }}>→</span><span style={{ color: '#2D5FE0', fontWeight: 700 }}>{String(c2.to)}</span>{cd.multi && cd.cSrc[k2] && <span style={{ fontSize: 14, color: '#A29C95' }}>({(cd.cSrc[k2] || '').slice(5).replace('-', '/')})</span>}</div>
                    ); })}
                  </div>
                )}
                {act.note && <div style={{ fontSize: 15, color: '#A29C95', marginTop: 6 }}>{act.note}</div>}
                <div style={{ marginTop: 8 }}><Btn onClick={() => setActModal({ action: act, pairs: cd.pend.map(x => ({ doc: x.doc, actId: x.a.id })) })} style={{ fontSize: 16, padding: '6px 14px' }}>{act.op === 'add' ? (act.level === 'memo' ? '확인' : '이 항목 추가') : '이 변경 적용'}</Btn></div>
              </div>
            ); }); })()}
            {inbox.traces.length > 0 && (
              <div style={{ marginTop: 12, borderTop: '1px dashed #E3E0DC', paddingTop: 10 }}>
                {inbox.traces.map((t, i) => { const a2 = t.x.a; const nm = a2.subplanName || a2.planName || (a2.fields && a2.fields.name) || a2.kpiName || ''; const brief = Object.keys(a2.changes || {}).map(k3 => { const kn = { stage: '상태', name: '이름', due: '마감일', start: '시작일', owner: '담당자' }[k3] || k3; const cc = a2.changes[k3]; return kn + '→' + (cc && cc.to != null ? (typeof cc.to === 'object' ? JSON.stringify(cc.to) : String(cc.to)) : ''); }).join(', '); return (
                  <div key={i} style={{ fontSize: 15, color: '#A29C95', padding: '3px 0' }}>🔄 <span style={{ textDecoration: 'line-through' }}>{(t.x.date || '').slice(5).replace('-', '/')} · {nm}{brief ? ' (' + brief + ')' : ''}</span> — <b>{(t.by || '').slice(5).replace('-', '/')}</b> 회의 결정으로 대체됨</div>
                ); })}
              </div>
            )}
          </Card>
        )}

        {actModal && <MeetingActionModal action={actModal.action} data={data} setData={setData} onApplied={() => markAppliedPairs(actModal.pairs)} onClose={() => setActModal(null)} />}
      </div>
    );
  }

  // ===== 상세 화면 =====
  const doc = openDoc;
  return (
    <div style={{ padding: 20 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 14, flexWrap: 'wrap' }}>
        <button onClick={() => { setOpenId(null); setOpenDoc(null); setEditMode(false); }} style={{ border: '1px solid #E3E0DC', background: 'white', borderRadius: 8, padding: '6px 12px', cursor: 'pointer', fontSize: 16, color: '#6E6863', fontWeight: 600 }}>← 목록</button>
        <div style={{ marginLeft: 'auto', display: 'flex', gap: 8 }}>
          {!editMode && doc && doc !== 'loading' && doc !== 'error' && <Btn v="gold" onClick={startEdit}>수정하기</Btn>}
          {editMode && <Btn v="secondary" onClick={cancelEdit}>취소</Btn>}
          {editMode && <Btn v="gold" onClick={saveEdit}>완료</Btn>}
        </div>
      </div>

      {doc === 'loading' && <Card style={{ textAlign: 'center', padding: 30, color: '#A29C95' }}>회의록 불러오는 중…</Card>}
      {doc === 'error' && <Card style={{ textAlign: 'center', padding: 30, color: '#E53935' }}>회의록을 불러오지 못했어요</Card>}

      {doc && doc !== 'loading' && doc !== 'error' && (<>
        <Card style={{ marginBottom: 16 }}>
          {editMode ? (<>
            <div><Lbl c="회의 제목" /><Inp value={editTitle} onChange={setEditTitle} /></div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 2fr', gap: 10, marginTop: 8 }}>
              <div><Lbl c="날짜" /><Inp type="date" value={editDate} onChange={setEditDate} /></div>
              <div><Lbl c="참여자 (쉼표로 구분)" /><Inp value={editAtt} onChange={setEditAtt} placeholder="이수영 대표, 윤희, 현수" /></div>
            </div>
          </>) : (<>
            <div style={{ fontSize: 22, fontWeight: 800, color: G }}>{doc.title}</div>
            <div style={{ fontSize: 16, color: '#6E6863', marginTop: 6 }}>{doc.date}{doc.attendees && doc.attendees.length ? ' · ' + doc.attendees.join(', ') : ''}</div>
          </>)}
          {editMode && <div style={{ fontSize: 15, color: '#2D5FE0', marginTop: 6 }}>✎ 편집 모드 — 완료를 누르면 저장됩니다.</div>}
        </Card>

        <Card style={{ marginBottom: 16 }}>
          <div style={{ fontSize: 17, fontWeight: 700, color: G, marginBottom: 10 }}>📄 회의 내용</div>
          {editMode ? (<>
            <div contentEditable suppressContentEditableWarning ref={editRef} dangerouslySetInnerHTML={{ __html: editHtml }} style={{ minHeight: 200, fontSize: 17, color: '#3A3631', lineHeight: 1.7, border: '1px solid #2D5FE0', borderRadius: 9, padding: 14, outline: 'none' }} />
            <div style={{ fontSize: 15, color: '#A29C95', marginTop: 6 }}>💡 위 내용을 그대로 클릭해서 글자를 고칠 수 있어요. 완료를 누르면 저장됩니다.</div>
          </>) : (
            <div style={{ fontSize: 17, color: '#3A3631', lineHeight: 1.7 }} dangerouslySetInnerHTML={{ __html: doc.summaryHtml || '' }} />
          )}
        </Card>

        <Card>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 }}>
            <div style={{ fontSize: 17, fontWeight: 700, color: G }}>🔗 이 회의의 결정 사항 (기록)</div>
            <span style={{ fontSize: 15, color: '#A29C95' }}>{(doc.actions || []).length}건 · 반영은 목록 화면의 📥 대시보드 입력에서</span>
          </div>
          <div style={{ display: 'flex', gap: 6, marginBottom: 12, flexWrap: 'wrap' }}>
            {['전체'].concat(MEMBERS).concat(['공통확인']).map(f => { const cnt = (doc.actions || []).filter(act => { if (f === '전체') return true; const os = actOwner(act); return f === '공통확인' ? os.length === 0 : os.includes(f); }).length; const on = ownerF === f; return <button key={f} onClick={() => setOwnerF(f)} style={{ padding: '5px 12px', borderRadius: 20, border: 'none', cursor: 'pointer', fontSize: 16, fontWeight: 600, background: on ? G : '#E3E0DC', color: on ? 'white' : '#3A3631' }}>{f === '전체' ? '전체' : f === '공통확인' ? '🤝 공통확인' : AV[f] + ' ' + f} ({cnt})</button>; })}
          </div>
          {(() => { const fActs = (doc.actions || []).filter(act => { if (ownerF === '전체') return true; const os = actOwner(act); return ownerF === '공통확인' ? os.length === 0 : os.includes(ownerF); }); return fActs.length === 0 ? <div style={{ fontSize: 16, color: '#A29C95' }}>{ownerF === '전체' ? '반영할 항목이 없습니다' : '해당 담당자 항목이 없습니다'}</div> :
            fActs.map(act => { const done = appliedSet.indexOf(act.id) >= 0; const aos = actOwner(act); return (
              <div key={act.id} style={{ border: '1px solid ' + (done ? '#A7F3D0' : '#EDEBE7'), background: done ? '#F0FDF4' : 'white', borderRadius: 10, padding: 12, marginBottom: 8 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap', marginBottom: 4 }}>
                  <span style={{ fontSize: 14, fontWeight: 800, color: 'white', background: opColor[act.op] || '#6E6863', borderRadius: 5, padding: '2px 7px' }}>{opLabel[act.op] || act.op}</span>

function ProjectOrderModal({ data, setData, onClose }) {

  const [rows, setRows] = useState(() => [...data.outputs].map(o => ({ id: o.id, name: o.name, type: o.type })).sort((a, b) => catOrder(a.type) - catOrder(b.type)));
  const prefixOf = t => { const c = cats.find(x => x.name === t); return c ? c.prefix : 'X'; };
  const preview = (() => { const cnt = {}, m = {}; rows.forEach(r => { cnt[r.type] = (cnt[r.type] || 0) + 1; m[r.id] = prefixOf(r.type) + '-' + cnt[r.type]; }); return m; })();
  const move = (id, dir) => setRows(rs => { const idx = rs.findIndex(r => r.id === id); if (idx < 0) return rs; const type = rs[idx].type; const same = rs.map((r, i) => r.type === type ? i : -1).filter(i => i >= 0); const pos = same.indexOf(idx) + dir; if (pos < 0 || pos >= same.length) return rs; const arr = rs.slice(); const a = idx, b = same[pos], t = arr[a]; arr[a] = arr[b]; arr[b] = t; return arr; });
  const changeCat = (id, newType) => setRows(rs => { const row = rs.find(r => r.id === id); if (!row || !newType || row.type === newType) return rs; const without = rs.filter(r => r.id !== id); let last = -1; without.forEach((r, i) => { if (r.type === newType) last = i; }); const arr = without.slice(); arr.splice(last + 1, 0, { ...row, type: newType }); return arr; });

  const arrowBtn = { width: 26, height: 22, border: '1px solid #E3E0DC', background: 'white', borderRadius: 6, cursor: 'pointer', fontSize: 13, color: '#6E6863' };

      {groups.map(g => (

function VendorManagerModal({ data, setData, onClose }) {

  const payments = data.payments || [];
  const budgets = data.budgets || [];
  const reg = data.vendors || [];
  const itemTot = b => (b.items || []).reduce((a, i) => a + (Number(i.amount) || 0), 0) || Number(b.amount) || 0;
  const vendors = (() => {
    const m = {};
    const ensure = v => { if (!m[v]) m[v] = { vendor: v, paid: 0, cnt: 0, appr: 0, bcnt: 0, last: '', registered: false }; return m[v]; };
    reg.forEach(v => { ensure(v).registered = true; });
    payments.forEach(p => { const x = ensure(p.vendor || '(미지정)'); x.paid += Number(p.amount) || 0; x.cnt++; if ((p.paidDate || '') > x.last) x.last = p.paidDate || ''; });
    budgets.forEach(b => { const x = ensure(b.vendor || '(미지정)'); x.bcnt++; if (b.status === '기안완료' || b.status === '결제완료') x.appr += itemTot(b); });
    return Object.values(m).sort((a, b) => (b.cnt + b.bcnt) - (a.cnt + a.bcnt) || b.paid - a.paid || (a.vendor < b.vendor ? -1 : 1));
  })();

  const delPayment = p => { if (!confirm('[' + (p.paidDate || '-') + '] ' + won(Number(p.amount) || 0) + ' 결제 기록을 삭제할까요?\n(드라이브 영수증 파일은 유지됩니다)')) return; setData(d => ({ ...d, payments: (d.payments || []).filter(x => x.id !== p.id) })); };
  return (
    <ModalShell title={sel ? '🏢 ' + sel : '🏢 업체 관리'} onClose={onClose}>
      {!sel ? (
        <div>

          <div style={{ display: 'flex', gap: 6, marginBottom: 10 }}>
            <input value={newVendor} onChange={ev => setNewVendor(ev.target.value)} onKeyDown={ev => { if (ev.key === 'Enter') addVendor(); }} placeholder="새 업체명 입력" style={{ flex: 1, padding: '8px 11px', borderRadius: 8, border: '1px solid #E3E0DC', fontSize: 13, boxSizing: 'border-box' }} />
            <button onClick={addVendor} style={{ padding: '0 14px', borderRadius: 8, border: 'none', background: GO, color: 'white', cursor: 'pointer', fontSize: 12, fontWeight: 700, whiteSpace: 'nowrap' }}>+ 추가</button>
          </div>
          {vendors.length === 0 ? <div style={{ fontSize: 12, color: '#A29C95', padding: '16px 0', textAlign: 'center' }}>등록된 업체가 없습니다</div> : (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 6, maxHeight: 400, overflowY: 'auto' }}>
              {vendors.map(v => { const used = v.cnt > 0 || v.bcnt > 0; return (
                <div key={v.vendor} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '9px 11px', background: used ? '#F8F7F5' : 'white', border: '1px solid ' + (used ? '#E3E0DC' : '#EDEBE7'), borderRadius: 9 }}>

                    <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>

                    </div>
                    <div style={{ fontSize: 10.5, color: '#A29C95', marginTop: 2 }}>{used ? ('결제 ' + v.cnt + '건' + (v.bcnt ? ' · 기안 ' + v.bcnt + '건' : '') + (v.last ? ' · 최근 ' + v.last : '')) : '결제·기안 기록 없음'}</div>

        </div>

          <div style={{ display: 'flex', gap: 10, marginBottom: 10 }}>
            <div style={{ flex: 1, background: '#ECFDF5', borderRadius: 9, padding: 10, textAlign: 'center' }}><div style={{ fontSize: 10.5, color: '#1FA463' }}>총 결제 ({hist.length}건)</div><div style={{ fontSize: 15, fontWeight: 800, color: '#1FA463' }}>{won(histTotal)}</div></div>
          </div>
          {hist.length === 0 ? <div style={{ fontSize: 12, color: '#A29C95', padding: '16px 0', textAlign: 'center' }}>결제 기록이 없습니다</div> : (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 6, maxHeight: 380, overflowY: 'auto' }}>
              {hist.map(p => { const items = (p.coveredBudgetIds || []).map(id => budgets.find(b => b.id === id)).filter(Boolean); return (
                <div key={p.id} style={{ border: '1px solid #EDEBE7', borderRadius: 9, padding: '9px 11px' }}>

                    {p.payMethod ? <span style={{ fontSize: 10.5, color: '#6E6863' }}>{p.payMethod}</span> : null}
                    {p.project ? <span style={{ fontSize: 9.5, color: '#6E6863', background: '#F5F4F2', border: '1px solid #E3E0DC', borderRadius: 5, padding: '1px 6px' }}>{p.project}</span> : null}
                    <span style={{ marginLeft: 'auto', fontSize: 14, fontWeight: 800, color: '#1FA463' }}>{won(Number(p.amount) || 0)}</span>
                  </div>
                  {items.length > 0 ? <div style={{ fontSize: 10.5, color: '#6E6863', marginTop: 4 }}>기안 연결: {items.map(b => budgetNames(data, b).detail).join(', ')}</div> : null}
                  {p.memo ? <div style={{ fontSize: 10.5, color: '#6E6863', marginTop: 4 }}>💬 {p.memo}</div> : null}
                  <div style={{ display: 'flex', gap: 8, marginTop: 7, alignItems: 'center' }}>
                    {p.receiptUrl ? <a href={p.receiptUrl} target="_blank" rel="noreferrer" style={{ fontSize: 10.5, color: '#2D5FE0', fontWeight: 700, textDecoration: 'none' }}>🧾 영수증</a> : <span style={{ fontSize: 10.5, color: '#C4BFB9' }}>영수증 없음</span>}
                    <button onClick={() => delPayment(p)} style={{ marginLeft: 'auto', border: '1px solid #FCA5A5', background: 'white', color: '#E53935', borderRadius: 6, cursor: 'pointer', fontSize: 10.5, fontWeight: 700, padding: '3px 10px' }}>🗑 삭제</button>
                  </div>
                </div>

            </div>
          )}
          <div style={{ fontSize: 10, color: '#A29C95', marginTop: 8, lineHeight: 1.5 }}>⚠ 실결제 삭제는 되돌릴 수 없습니다(휴지통 미적용). 드라이브 영수증 파일은 유지됩니다.</div>
        </div>
      )}
      <div style={{ display: 'flex', gap: 8, marginTop: 12 }}><Btn v="secondary" onClick={onClose} style={{ flex: 1 }}>닫기</Btn></div>
    </ModalShell>
  );
}

function TabSchedule({ data, setData }) {
  const [copied, setCopied] = useState(null);
  const [selRule, setSelRule] = useState(null);
  const [selProd, setSelProd] = useState(null);
  const [byDate, setByDate] = useState(false);
  const [showCancelled, setShowCancelled] = useState(false);
  const [edit, setEdit] = useState(null);
  const [bEdit, setBEdit] = useState({ key: null, val: '' });
  const scheds = data.messageSchedules || {};
  const entries = Object.entries(scheds);
  const isSafeCode = c => typeof c === 'string' && /^LM\d[\w-]*$/i.test(c) && !c.includes('@') && c.length <= 24;
  const sendCodes = sd => { const its = sd.items || []; if (its.length) { const all = []; its.forEach(it => (it.codes || []).forEach(c => all.push(c))); return all; } return sd.codes || []; };
  const STATUS = ['예약', '발송대기', '발송완료'];
  const isCancelled = st => st === '발송취소';
  const isPending = st => { const s = st || '예약'; return s !== '발송완료' && s !== '발송취소'; };
  const stMeta = s => s === '발송완료' ? { bg: '#ECFDF5', bd: '#A7F3D0', tx: '#047857' } : s === '발송대기' ? { bg: '#FFFBEB', bd: '#FDE68A', tx: '#B45309' } : s === '발송취소' ? { bg: '#F5F4F2', bd: '#D5D2CE', tx: '#8A8580' } : { bg: '#EFF6FF', bd: '#BFDBFE', tx: '#2563EB' };
  const pname = it => it.displayName || it.productName || '(상품명 없음)';
  const PROD_NO = { '라이프밀 데일리': 1, '황성주 박사의 영양식': 2, '황성주 박사의 1일 1생식': 3, '프로틴 골드 HIGH5': 4, '황성주 박사의 발효건강식': 5, '황성주 박사의 닥터 샐러드': 6 };
  const prodNo = nm => { if (PROD_NO[nm]) return PROD_NO[nm]; const k = Object.keys(PROD_NO).find(x => nm && (nm.indexOf(x) >= 0 || x.indexOf(nm) >= 0)); return k ? PROD_NO[k] : null; };
  const couponCode = (seg, nm, date) => { const no = prodNo(nm); const pr = seg && seg.priority != null ? seg.priority : null; if (no == null || pr == null || !date) return null; const d = String(date).replace(/-/g, '').slice(2); return 'P' + pr + '-' + no + '-' + d; };
  const benefitKey = nm => { const no = prodNo(nm); return no != null ? 'no:' + no : 'nm:' + (nm || ''); };
  const benefitOf = (seg, nm) => (((seg && seg.benefitNames) || {})[benefitKey(nm)] || {}).name || '';
  const mmdd = ds => { if (!ds) return ''; const p = String(ds).split('-'); return p.length >= 3 ? p[1] + '/' + p[2] : String(ds); };
  const thisMon = (() => { const d = new Date(TODAY + 'T00:00:00'); const g = d.getDay(); d.setDate(d.getDate() + (g === 0 ? -6 : 1 - g)); return d.toISOString().slice(0, 10); })();
  const flagged = entries.flatMap(([segId, seg]) => (seg.sends || []).filter(sd => sendCodes(sd).some(c => !isSafeCode(c))).map(sd => ({ segName: seg.segmentName || segId, date: sd.date })));

                        <button onClick={() => copyCodes(dt.codes, ckey)} disabled={safeCount === 0} style={{ fontSize: 11, fontWeight: 700, color: copied === ckey ? '#047857' : 'white', background: copied === ckey ? '#ECFDF5' : (safeCount === 0 ? '#C4BFB9' : G), border: copied === ckey ? '1px solid #A7F3D0' : 'none', borderRadius: 6, padding: '4px 12px', cursor: safeCount === 0 ? 'default' : 'pointer' }}>{copied === ckey ? '✓ 복사됨 · 터미널에 붙여넣기' : '📋 조회 명령 복사'}</button>
                        <span style={{ fontSize: 10.5, color: '#A29C95' }}>{safeCount.toLocaleString()}개 코드</span>
                        {(() => { const cc = couponCode(cur, curProd.name, sd.date); return cc ? <span style={{ fontSize: 9, color: '#C4BFB9', fontFamily: 'monospace' }} title="내부 구분용 · 복사 대상 아님">내부 {cc}</span> : null; })()}
                        {dt.codes.length > 0 ? (
                          <details style={{ marginLeft: 'auto' }}>
                            <summary style={{ fontSize: 10.5, color: '#2563EB', cursor: 'pointer', fontWeight: 600 }}>코드 보기</summary>
                            <div style={{ marginTop: 5, maxHeight: 140, overflowY: 'auto', background: '#F8F7F5', border: '1px solid #E3E0DC', borderRadius: 7, padding: '7px 9px', fontSize: 10.5, color: '#3A3631', fontFamily: 'monospace', lineHeight: 1.7, wordBreak: 'break-all' }}>{dt.codes.map((c, x) => isSafeCode(c) ? <span key={x} style={{ marginRight: 8 }}>{c}</span> : <span key={x} style={{ marginRight: 8, color: '#DC2626', fontWeight: 700 }}>🔒숨김</span>)}</div>
                          </details>
                        ) : null}
                      </div> : null}
                    </div>
                  );
                })}
              </div>
              <div style={{ fontSize: 10.5, color: '#6E6863', background: '#F5F4F2', border: '1px solid #E3E0DC', borderRadius: 7, padding: '6px 9px', marginTop: 8, lineHeight: 1.5 }}>💻 <b>조회 명령 복사</b> → 터미널(run_lookup.bat)에 붙여넣으면 <b>lookup.py가 코드를 네이버ID로 복원</b>해 클립보드에 담아줍니다. → 톡톡에서 Ctrl+V로 예약 발송.</div>
              {cur.updatedAt ? <div style={{ fontSize: 9.5, color: '#A29C95', textAlign: 'right', marginTop: 6 }}>갱신 {cur.updatedAt}</div> : null}
            </Card>
          ); })() : null}
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════
// 판단 대기 — AI가 사람에게 묻는 단일 창구   (index_141, 2026-08-06)
// 설계 원장 : 볼트 70_에이전트/판단 큐 설계.md  (이 코드와 볼트가 다르면 볼트가 맞다)
//
// [왜 /dashboard 가 아니라 별도 노드인가]
//   /dashboard 는 팀이 손으로 넣는 실행계획·예산·KPI 다. 저장이 통짜 set() 이고
//   rev 가드가 걸려 있어서, 다른 주체가 끼어들어 한 필드만 고치는 걸 전제하지 않는다.
//   판단 카드는 정반대다 — 에이전트가 만들고, 사람이 한 필드만 건드리고, 또 다른
//   에이전트가 실행 표시를 남긴다. 성격이 다르므로 /decisions 로 분리했고,
//   이 화면은 set() 을 절대 쓰지 않고 update() 로 자기 몫 필드만 덮는다.
//
// [쓰기 경계 — 한 필드는 한 주체만]
//   에이전트        : 카드 생성 · status:pending
//   대시보드(여기)  : answer · answerNote · answeredAt · status→answered · snoozedUntil
//                    · snoozeCount · applyNow · applyAskedAt
//                    · status→discarded · discardedAt · discardNote  ← 이 10개뿐 (허브 승인)
//   폐기는 '답하지 않고 내리는 것'이라 answer 계열을 쓰지 않는다. 답이 없는데 answerNote 만
//   차 있으면 나중에 기록만 보는 사람이 '답한 카드'로 읽는다 — 그래서 사유는 별도 필드다.
//   실행 에이전트   : appliedAt · status→applied · applyNow/applyAskedAt 해제
//                    · applyError · applyErrorAt
//   applyNow 는 '대시보드가 켜고 에이전트가 끈다'는 점에서 유일하게 양쪽이 만지는 필드다.
//   그래서 대시보드는 true 만 쓰고 false 를 쓰지 않는다 — 끄는 건 처리한 쪽의 몫이다.
//   applyAskedAt 도 같은 짝이다. 켤 때 함께 쓰고, 끄는 건 안 한다.
//   그래서 expired 는 서버에 쓰지 않는다. 30일이 지났다는 '사실'을 화면에서 계산해
//   표시만 한다(카드 자동 삭제 금지와 같은 이유 — 데이터는 손대지 않는다).
//
// [보류 = snoozedUntil (index_142, 허브 승인)]
//   예전엔 보류를 answer:'hold' + status:'answered' 로 저장했다. 그러면 카드가
//   대기에서 빠지고 질문이 영영 사라진다 — 보류의 의도("나중에 다시 물어봐라")와 반대다.
//   지금은 status 를 pending 그대로 두고 snoozedUntil(ISO) 만 쓴다. 그 날짜가 지나면
//   아무도 아무것도 하지 않아도 대기 목록으로 스스로 돌아온다(화면 계산이라 배치가 필요 없다).
//   쓰기 주체는 여전히 대시보드 하나뿐이라 경계 원칙은 그대로다.
// ═══════════════════════════════════════════════════════════════════════════
const DEC_DOMAINS = ['광고', '상품', '고객', 'CS', '운영'];

// /decisions 구독. /dashboard 상태 트리와 완전히 분리돼 있어서 기존 탭에 영향이 없다.
function useDecisions() {
  const [state, setState] = useState({ list: null, err: '', meta: null });
  useEffect(() => {
    let ref = null;
    try { ref = db.ref(DEC_PATH); } catch (e) { setState({ list: [], err: (e && e.message) || '연결 실패' }); return; }
    const cb = ref.on('value', snap => {
      const v = (snap && snap.val()) || {};
      const out = [];
      // [index_152] 밑줄로 시작하는 키는 카드가 아니라 설정이다(_meta 등).
      //   이걸 안 걸러내면 _meta 노드가 생기는 순간 유령 카드 한 장이 대기 목록에 뜨고
      //   대기 건수도 하나 늘어난다. 자동화PC가 노드를 만들기 전에 막아 둔다.
      Object.keys(v).forEach(k => {
        if (String(k).charAt(0) === '_') return;
        const c = v[k];
        if (!c || typeof c !== 'object') return;
        out.push({ ...c, id: c.id || k, _key: k });
      });
      out.sort((a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
      setState({ list: out, err: '', meta: (v && v._meta) || null });
    }, e => setState({ list: [], err: (e && e.message) || '읽기 실패', meta: null }));
    return () => { try { ref.off('value', cb); } catch (e) {} };
  }, []);
  return state;
}

    // 볼트 기록에는 아무 표시가 없으면, 나중에 이 기록만 보는 사람이 반영된 줄로 읽는다.
    // 이유는 둘로 갈린다 — 선택지 밖의 답이었거나, 그 선택지에 실행 명세가 없거나.

  const kpiDefs = [
    { re: /매출/, label: '매출', val: mtd.rev, fmt: manF },
    { re: /roas/i, label: 'ROAS', val: roasOf(mAd.spend, mAd.rev), fmt: v => v + '%', low: true },
    { re: /객단가/, label: '객단가', val: mtd.ord ? Math.round(mtd.rev / mtd.ord) : 0, fmt: wonF },
    { re: /방문/, label: '방문', val: mtd.vis, fmt: nf },
    { re: /CRM|고객/i, label: 'CRM', val: null, fmt: nf, manual: true },
  ].map(d => { const k = kpiFind(d.re); return { ...d, kpi: k, target: kTarget(k) }; }).filter(d => d.kpi);
  const kpiBad = kpiDefs.filter(d => !d.manual && (d.target == null || d.target === 0));

  // ── 담당자 한 줄 (insights[wkS]) ──
  const ins = ((data.insights || {})[wkS]) || {};
  const insSet = (f, v) => setData(d => ({ ...d, insights: { ...(d.insights || {}), [wkS]: { ...((d.insights || {})[wkS] || {}), [f]: v } } }));
  const noteRow = (noteKey, who, ph) => (
    <div style={{ borderTop: '1px dashed #E3E0DC', marginTop: 12, paddingTop: 10, display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(250px,1fr))', gap: 8 }}>
      <div><div style={{ fontSize: 10.5, fontWeight: 800, color: '#6E6863', marginBottom: 4 }}>{who} 한 줄 ✍️</div>
        <textarea data-wr2-note={noteKey} value={ins[noteKey + '_note'] || ''} onChange={e => insSet(noteKey + '_note', e.target.value)} rows={2} placeholder={ph}
          style={{ width: '100%', boxSizing: 'border-box', border: '1px solid ' + (ins[noteKey + '_note'] ? '#EEECE8' : '#FDE68A'), background: ins[noteKey + '_note'] ? '#FBFAF9' : '#FFFBEB', borderRadius: 8, padding: '7px 10px', fontSize: 11.5, fontFamily: 'inherit', resize: 'vertical', lineHeight: 1.55 }} /></div>
      <div><div style={{ fontSize: 10.5, fontWeight: 800, color: '#6E6863', marginBottom: 4 }}>💬 피드백</div>
        <textarea data-wr2-reply={noteKey} value={ins[noteKey + '_reply'] || ''} onChange={e => insSet(noteKey + '_reply', e.target.value)} rows={2} placeholder="담당자 한 줄에 대한 방향·의견"
          style={{ width: '100%', boxSizing: 'border-box', border: '1px solid #E4DDFA', background: '#F7F5FE', borderRadius: 8, padding: '7px 10px', fontSize: 11.5, fontFamily: 'inherit', resize: 'vertical', lineHeight: 1.55, color: '#4C3A99' }} /></div>
    </div>
  );

  // ── 결과 한 줄 (subplan.resultNote) ──
  const saveRes = () => { if (!resEdit) return; const { id, text } = resEdit; setData(d => ({ ...d, subplans: (d.subplans || []).map(s => s.id === id ? { ...s, resultNote: text.trim() } : s) })); setResEdit(null); };

  // ── 점검 목록 ──
  const noRes = doneWk.filter(s => !(s.resultNote || '').trim());
  const emptyNotes = [['sales', '매출'], ['ads', '광고'], ['content', '콘텐츠']].filter(([k]) => !(ins[k + '_note'] || '').trim());
  const checks = [];
  if (noRes.length) checks.push({ tag: '결과 미기록', c: '#DC2626', bg: '#FEF2F2', nm: '완료 ' + noRes.length + '건에 결과 한 줄 붙이기', act: '아래 완료 목록에서 →', go: () => { const el = document.querySelector('[data-wr2-donecol]'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } });
  if (emptyNotes.length) checks.push({ tag: '보고 미완성', c: '#DC2626', bg: '#FEF2F2', nm: emptyNotes.map(x => x[1]).join('·') + ' 블록 담당자 한 줄 비어 있음', act: '쓰기 →', go: () => { const el = document.querySelector('[data-wr2-note="' + emptyNotes[0][0] + '"]'); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.focus(); } } });
  kwMiss.forEach(k => checks.push({ tag: '트렌드 미반영', c: '#B45309', bg: '#FFF7ED', nm: "'" + k.keyword + "' 콘텐츠 기획 없음 (콘텐츠 자리 판정)", act: '계획에 추가 →', go: () => goTab && goTab('프로젝트 진행 상황') }));
  if (overdue.length) checks.push({ tag: '기한 초과', c: '#B45309', bg: '#FFF7ED', nm: '기한 지난 미완료 ' + overdue.length + '건 정리 (완료/보류/폐기)', act: '목록 →', go: () => setOdOpen(true) });
  if (kpiBad.length) checks.push({ tag: 'KPI 설정', c: '#2D5FE0', bg: '#EFF6FF', nm: kpiBad.map(d => "'" + d.kpi.name + "'").join('·') + ' 목표가 비어 있거나 0', act: 'KPI 탭 →', go: () => goTab && goTab('KPI') });

  const tile = (l, v, d, vc) => (
    <div data-wr2-tile style={{ flex: 1, minWidth: 128, border: '1px solid #E3E0DC', borderRadius: 10, padding: '9px 12px' }}>
      <div style={{ fontSize: 10.5, color: '#6E6863' }}>{l}</div>
      <div style={{ fontSize: 18, fontWeight: 800, marginTop: 1, color: vc || '#1A1614' }}>{v}</div>
      {d ? <div style={{ marginTop: 1 }}>{d}</div> : null}
    </div>
  );
  const thumbTile = (src, cap, star, sq, key) => (
    <div key={key} style={{ flex: 1, aspectRatio: sq ? '1' : '3/4', background: '#E8E4DE', borderRadius: 9, position: 'relative', overflow: 'hidden', minWidth: 0 }}>
      <img data-wr2-thumb src={imgSrc(src)} alt="" loading="lazy" onError={e => { e.target.style.display = 'none'; }} style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
      {star ? <span style={{ position: 'absolute', top: 5, left: 5, fontSize: 9, fontWeight: 800, color: '#1A1614', background: '#FDE68A', borderRadius: 5, padding: '1px 5px' }}>{star}</span> : null}
      <span style={{ position: 'absolute', bottom: 0, left: 0, right: 0, fontSize: 9, fontWeight: 700, color: 'white', background: 'rgba(0,0,0,.55)', padding: '2px 5px', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{cap}</span>
    </div>
  );
  const wiRow = (s, done) => {
    const res = (s.resultNote || '').trim();
    return (
      <div key={s.id} style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12, color: '#3A3631', padding: '3px 0 3px 8px', borderLeft: '2px solid #EEECE8', marginLeft: 4, flexWrap: 'wrap' }}>
        {done ? <span style={{ color: '#047857', fontWeight: 800 }}>✓</span> : <span style={{ fontSize: 9.5, fontWeight: 700, border: '1px solid #E3E0DC', borderRadius: 5, padding: '0 5px', background: '#fff', color: s.due && s.due < TODAY ? '#DC2626' : (s.stage === '진행중' ? '#047857' : '#3A3631') }}>{s.due && s.due < TODAY ? '기한 ' + String(s.due).slice(5) : s.stage}</span>}
        <span data-wr2-item onClick={() => onEdit && onEdit({ kind: 'subplan', id: s.id })} style={{ cursor: 'pointer', fontWeight: 600 }}>{s.name}</span>
        <span style={{ fontSize: 10, color: '#A29C95' }}>{ownerAv(s)}{!done && s.due && s.due >= TODAY ? ' ~' + String(s.due).slice(5) : ''}</span>
        {done ? (resEdit && resEdit.id === s.id ? (
          <span style={{ display: 'inline-flex', gap: 4, alignItems: 'center', marginLeft: 'auto', minWidth: 180, flex: 1 }}>
            <input data-wr2-resinput autoFocus value={resEdit.text} onChange={e => setResEdit({ id: s.id, text: e.target.value })} onKeyDown={e => { if (e.key === 'Enter') saveRes(); }} placeholder="이 일이 뭘 바꿨나 — 한 줄"
              style={{ flex: 1, border: '1px solid #CFE0D8', borderRadius: 7, padding: '4px 8px', fontSize: 11, fontFamily: 'inherit' }} />
            <button data-wr2-ressave onClick={saveRes} style={{ border: 0, background: '#1B4D3E', color: 'white', borderRadius: 6, padding: '4px 9px', fontSize: 10.5, fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit' }}>저장</button>
          </span>
        ) : (
          res ? <span data-wr2-res onClick={() => setResEdit({ id: s.id, text: res })} title={res} style={{ marginLeft: 'auto', fontSize: 10.5, color: '#047857', fontWeight: 700, cursor: 'pointer', maxWidth: 220, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>→ {res}</span>
            : <button data-wr2-resadd onClick={() => setResEdit({ id: s.id, text: '' })} style={{ marginLeft: 'auto', border: '1px dashed #FCA5A5', background: '#FFF6F6', color: '#DC2626', borderRadius: 6, padding: '2px 8px', fontSize: 10, fontWeight: 800, cursor: 'pointer', fontFamily: 'inherit' }}>결과 한 줄 없음 — 쓰기</button>
        )) : null}
      </div>
    );
  };
  const chkToggle = id => setData(d => ({ ...d, checklists: (d.checklists || []).map(c => c.id === id ? { ...c, done: !c.done, doneAt: !c.done ? TODAY : null } : c) }));
  const chkRow = c => (
    <div key={c.id} data-wr2-chk={c.done ? 'on' : 'off'} onClick={() => chkToggle(c.id)} title={c.done ? '클릭하면 체크 해제' : '클릭하면 완료 체크'} style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 11.5, padding: '2px 0 2px 26px', cursor: 'pointer' }}>
      <span style={{ fontSize: 12.5, color: c.done ? '#047857' : '#C9C3BC', fontWeight: 800 }}>{c.done ? '☑' : '☐'}</span>
      <span style={{ color: c.done ? '#3A3631' : '#8A837C' }}>{c.text}</span>
      {c.done && c.doneAt ? <span style={{ fontSize: 9.5, color: '#A29C95' }}>{String(c.doneAt).slice(5)}</span> : null}
    </div>
  );
  const progRow = s => {
    const mine = (data.checklists || []).filter(c => c.subplanId === s.id);
    const wkOn = mine.filter(c => c.done && c.doneAt && c.doneAt >= wkS && c.doneAt <= wkWorkE);
    const off = mine.filter(c => !c.done);
    return (
      <div key={'p' + s.id}>
        {wiRow(s, false)}
        {wkOn.map(chkRow)}
        {off.slice(0, 3).map(chkRow)}
        {off.length > 3 ? <div style={{ fontSize: 10, color: '#A29C95', paddingLeft: 26 }}>+ 미체크 {off.length - 3}건</div> : null}
      </div>
    );
  };
  const projHead = o => (
    <div style={{ display: 'flex', alignItems: 'center', gap: 7, marginBottom: 4 }}>
      <span style={{ fontSize: 10.5, fontWeight: 800, color: '#1B4D3E', background: '#EAF1EE', border: '1px solid #CFE0D8', borderRadius: 6, padding: '1px 7px' }}>{o ? o.code : '—'}</span>
      <span style={{ fontSize: 12, fontWeight: 800 }}>{o ? o.name : '(프로젝트 미지정)'}</span>
    </div>
  );

  const headline = cw ? (
    <span>매출 <b style={{ color: '#1B4D3E' }}>{manF(gv('revenue'))}원{sum.revenue && sum.revenue.deltaPct != null ? ' (' + (sum.revenue.deltaPct > 0 ? '▲' : '▼') + Math.abs(sum.revenue.deltaPct) + '%)' : ''}</b> · 방문 <b style={{ color: '#1B4D3E' }}>{nf(gv('visitors'))}{sum.visitors && sum.visitors.deltaPct != null ? ' (' + (sum.visitors.deltaPct > 0 ? '▲' : '▼') + Math.abs(sum.visitors.deltaPct) + '%)' : ''}</b>{ads ? <span>. ROAS <b style={{ color: wkRoas >= 330 ? '#047857' : '#DC2626' }}>{wkRoas}%</b>{wkRoas < 330 ? ' — 목표(330%) 미달' : ''}</span> : null}{checks.length ? <span> · 점검 <b style={{ color: '#B45309' }}>{checks.length}건</b></span> : null}</span>
  ) : <span style={{ color: '#A29C95' }}>매출 주간 데이터를 불러오면 요약이 채워집니다.</span>;

  return (
    <div style={{ padding: '16px 20px', maxWidth: 1080, margin: '0 auto' }}>
      {/* ── 헤더 ── */}
      <Card>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
          <div style={{ fontSize: 20, fontWeight: 800, color: G }}>📋 주간 보고</div>
          <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 6, background: '#F7F6F4', border: '1px solid #E3E0DC', borderRadius: 999, padding: '3px 8px', fontSize: 12 }}>
            <button data-wr2-prev onClick={() => setWIdx(i => Math.min(i + 1, Math.max(0, weeks.length - 1)))} style={{ border: 0, background: 'transparent', cursor: 'pointer', fontSize: 13, color: '#6E6863' }}>◀</button>
            <b>{wkLabel}</b>
            <button data-wr2-next onClick={() => setWIdx(i => Math.max(i - 1, 0))} style={{ border: 0, background: 'transparent', cursor: 'pointer', fontSize: 13, color: '#6E6863' }}>▶</button>
          </div>
        </div>
        <div style={{ fontSize: 13.5, marginTop: 10, color: '#3A3631', lineHeight: 1.6 }}>{headline}</div>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginTop: 12 }}>
          {tile('매출', cw ? manF(gv('revenue')) : '—', dch(sum.revenue))}
          {tile('주문 / 객단가', cw ? nf(gv('orders')) + '건' : '—', sum.aov ? <span style={{ fontSize: 10.5 }}>객단가 {wonF(gv('aov'))} {dch(sum.aov)}</span> : null)}
          {tile('방문', cw ? nf(gv('visitors')) : '—', dch(sum.visitors))}
          {tile('ROAS (목표 330%)', ads ? wkRoas + '%' : '—', ads ? <span style={{ fontSize: 10.5, fontWeight: 700, color: wkRoas >= 330 ? '#047857' : '#DC2626' }}>{wkRoas >= 330 ? '달성' : '미달'}</span> : null, ads && wkRoas < 330 ? '#DC2626' : undefined)}
        </div>
        {kpiDefs.length ? (
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginTop: 10, borderTop: '1px dashed #E7E4E0', paddingTop: 11 }}>
            {kpiDefs.map((d, i) => {
              const p = d.manual || d.val == null || !d.target ? 0 : Math.min(100, Math.round(d.val / d.target * 100));
              return (
                <div key={i} data-wr2-kpi style={{ flex: 1, minWidth: 150 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 10.5, color: '#6E6863' }}>
                    <span>{month.slice(5)}월 {d.label} 목표 {d.target ? (d.label === '매출' ? manF(d.target) : nf(d.target) + (d.kpi.unit || '')) : '미설정'}</span>
                    <b style={{ color: d.manual ? '#B45309' : '#1A1614' }}>{d.manual ? '수동 입력' : d.fmt(d.val) + ' 누적'}</b>
                  </div>
                  <div style={{ height: 6, background: '#EEF1EF', borderRadius: 4, marginTop: 4, overflow: 'hidden' }}><div style={{ height: 6, borderRadius: 4, width: p + '%', background: d.low && p < 100 ? '#DC2626' : '#1B4D3E' }} /></div>
                </div>
              );
            })}
          </div>
        ) : null}
      </Card>

      {/* ── ① 성과 ── */}
      {secHead('① 성과', '#1B4D3E', '매출 · 광고 · 콘텐츠', '인사이트 추출의 세 축', null)}

      {/* 매출 */}
      <div data-wr2-perf="sales" style={perfBox}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 9, marginBottom: 12, flexWrap: 'wrap' }}>
          <span style={{ fontSize: 18 }}>💵</span><span style={{ fontSize: 15.5, fontWeight: 800 }}>매출</span>
          <button onClick={() => goTab && goTab('매출')} style={{ marginLeft: 'auto', border: 0, background: 'transparent', color: '#1B4D3E', fontSize: 11, fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit' }}>자세히 → 매출 탭</button>
        </div>
        {cw ? (
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(240px,1fr))', gap: 14 }}>
            <div>
              {colHead('주간 요약')}
              <div style={{ display: 'flex', gap: 14, flexWrap: 'wrap', marginBottom: 8 }}>
                <div><div style={{ fontSize: 22, fontWeight: 800 }}>{wonF(gv('revenue'))}</div><div style={{ fontSize: 10.5, color: '#6E6863' }}>매출 {dch(sum.revenue)}</div></div>
                <div><div style={{ fontSize: 22, fontWeight: 800 }}>{nf(gv('orders'))}건</div><div style={{ fontSize: 10.5, color: '#6E6863' }}>주문 {dch(sum.orders)}</div></div>
              </div>
              <div>
                {mrRow('객단가', <span>{wonF(gv('aov'))} {dch(sum.aov)}</span>, 'a')}
                {mrRow('환불', <span style={{ color: '#DC2626' }}>{wonF(gv('refund'))} {dch(sum.refund, true)}</span>, 'b')}
                {mrRow('방문', <span>{nf(gv('visitors'))}명 {dch(sum.visitors)}</span>, 'c')}
              </div>
            </div>
            <div>
              {colHead('채널 TOP 3 (매출 귀속)')}
              <div>{chTop.map((c, i) => mrRow(<span><span style={{ fontSize: 10, fontWeight: 800, color: '#A29C95', marginRight: 4 }}>{i + 1}</span>{c.name}</span>, <span>{manF(c.revenue)} · {chSum ? Math.round((c.revenue || 0) / chSum * 1000) / 10 : 0}%</span>, i))}</div>
            </div>
            <div>
              {colHead('상품 TOP 3')}
              <div>{prTop.map((p, i) => mrRow(<span><span style={{ fontSize: 10, fontWeight: 800, color: '#A29C95', marginRight: 4 }}>{i + 1}</span>{p.name}</span>, manF(p.revenue), i))}</div>
            </div>
          </div>
        ) : <div style={{ fontSize: 12, color: '#A29C95' }}>매출 데이터(naver-sales.json) 불러오는 중이거나 없습니다.</div>}
        {noteRow('sales', '📦 담당자', '잘된 것 · 아쉬운 것 · 다음 — 한 줄')}
      </div>

      {/* 광고 */}
      <div data-wr2-perf="ads" style={perfBox}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 9, marginBottom: 12, flexWrap: 'wrap' }}>
          <span style={{ fontSize: 18 }}>📣</span><span style={{ fontSize: 15.5, fontWeight: 800 }}>광고 — 네이버 + 인스타</span>
          <span style={{ display: 'inline-flex', gap: 8, marginLeft: 'auto' }}>
            <button onClick={() => goTab && goTab('광고')} style={{ border: 0, background: 'transparent', color: '#1B4D3E', fontSize: 11, fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit' }}>광고 탭 →</button>
            <button onClick={() => goTab && goTab('인스타 광고')} style={{ border: 0, background: 'transparent', color: '#1B4D3E', fontSize: 11, fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit' }}>인스타 광고 탭 →</button>
          </span>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px,1fr))', gap: 14 }}>
          <div>
            {colHead('네이버 (주간)')}
            {ads ? (
              <div>
                <div style={{ display: 'flex', gap: 14, flexWrap: 'wrap', marginBottom: 6 }}>
                  <div><div style={{ fontSize: 22, fontWeight: 800 }}>{manF(adAgg.spend)}원</div><div style={{ fontSize: 10.5, color: '#6E6863' }}>광고비</div></div>
                  <div><div style={{ fontSize: 22, fontWeight: 800, color: wkRoas >= 330 ? '#047857' : '#DC2626' }}>{wkRoas}%</div><div style={{ fontSize: 10.5, color: '#6E6863' }}>ROAS · 전환매출 {manF(adAgg.rev)}</div></div>
                </div>
                <div style={{ margin: '2px 0 8px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 10.5, color: '#6E6863', marginBottom: 3 }}><span>ROAS</span><span>목표 330%</span></div>
                  <div style={{ height: 8, background: '#EEF1EF', borderRadius: 5, overflow: 'hidden' }}><div style={{ height: 8, width: Math.min(100, Math.round(wkRoas / 330 * 100)) + '%', background: wkRoas >= 330 ? '#047857' : '#DC2626', borderRadius: 5 }} /></div>
                </div>
                {mrRow('디스플레이', <span>{manF(adAgg.ch.display.spend)} · ROAS {roasOf(adAgg.ch.display.spend, adAgg.ch.display.rev)}%</span>, 'd')}
                {mrRow('검색', <span>{manF(adAgg.ch.search.spend)} · ROAS {roasOf(adAgg.ch.search.spend, adAgg.ch.search.rev)}%</span>, 'e')}
                {lowGroups.map((g, i) => mrRow(<span style={{ color: '#DC2626' }}>⚠ 저효율: {g.name}</span>, <span style={{ color: '#DC2626' }}>{manF(g.spend)} · {g.roas}%</span>, 'l' + i))}
              </div>
            ) : <div style={{ fontSize: 12, color: '#A29C95' }}>광고 데이터(naver-ads.json) 불러오는 중이거나 없습니다.</div>}
          </div>
          <div>
            {colHead('인스타 광고 — 라이브 소재 ' + (iads && iads.window ? '(' + iads.window + ')' : ''))}
            {iAdsArr.length ? (
              <div>
                <div style={{ display: 'flex', gap: 6 }}>{iThumbs.map((a, i) => thumbTile(a.thumb, (a.name || '').slice(0, 16), a === iBest ? '★ CTR ' + (a.ctr || 0).toFixed(2) + '%' : null, false, 'ia' + i))}</div>
                <div style={{ marginTop: 7 }}>
                  {mrRow('지출 / 도달', manF(iSpend) + ' · ' + nf(iReach), 'f')}
                  {iTop && (iTop.ctr || 0) < iAvgCtr ? mrRow(<span style={{ color: '#B45309' }}>⚠ 지출 최대 소재가 평균 CTR 밑</span>, <span style={{ color: '#B45309' }}>{(iTop.ctr || 0).toFixed(2)}% · 교체 검토</span>, 'g') : null}
                </div>
              </div>

        })}
      </div>

      <div style={{ fontSize: 10.5, color: '#A29C95', marginTop: 14, lineHeight: 1.6 }}>출처: Meta 광고 API · 계정 lifemealXmiracle. {status === 'seed' ? 'data/insta-ads.json 이 올라오면 이 화면이 실데이터로 자동 갱신됩니다.' : ''}</div>

  );
}

              </div>
              <div style={{ display: 'flex', gap: 14, alignItems: 'center', flexWrap: 'wrap', justifyContent: 'flex-end' }}>
                <div style={{ textAlign: 'right' }}><div style={{ fontSize: 9.5, color: '#A29C95' }}>판매</div><div style={{ fontSize: 12.5, fontWeight: 700 }}>{num(p.salesCnt)}개</div></div>
                <div style={{ textAlign: 'right', minWidth: 72 }}><div style={{ fontSize: 9.5, color: '#A29C95' }}>매출</div><div style={{ fontSize: 12.5, fontWeight: 700 }}>{won(p.salesAmount)}</div></div>
                <div style={{ textAlign: 'right', minWidth: 66 }}><div style={{ fontSize: 9.5, color: '#A29C95' }}>수수료</div><div style={{ fontSize: 12.5, fontWeight: 700, color: GOLD }}>{won(p.commissionAmount)}</div></div>
                <div style={{ textAlign: 'right', minWidth: 46 }}><div style={{ fontSize: 9.5, color: '#A29C95' }}>수수료율</div><div style={{ fontSize: 13, fontWeight: 800, color: rateCol }}>{r.toFixed(1)}%</div></div>

      <div style={{ fontSize: 10.5, color: '#A29C95', marginTop: 14, lineHeight: 1.6 }}>출처: 네이버 브랜드커넥트(쇼핑커넥트) 어필리에이트. {meta.basis || ''} · 매출은 스마트스토어 총매출에 포함(별도 가산 아님) · 유입은 직유입과 집계기준 상이(클릭 vs 세션)·단순 차감 불가.{status === 'seed' ? ' data/shopping-connect.json 이 올라오면 실데이터로 자동 갱신됩니다.' : ''}</div>
    </div>
  );
}

function TabProductSeo() {

                <div style={{ fontSize: 10.5, color: '#A29C95', marginBottom: 4 }}>선두: {sh(c.leader)}</div>
                {(c.products || []).map((pp, pi) => <div key={pi} style={{ display: 'flex', justifyContent: 'space-between', gap: 8, fontSize: 11.5, color: '#3A3631', padding: '2px 0', borderTop: pi ? '1px dotted #EDEBE7' : 'none' }}><span style={{ minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{sh(pp.product)}</span><span style={{ flexShrink: 0, fontWeight: 700, color: pp.rank <= 10 ? '#047857' : (pp.rank >= 100 ? '#B45309' : '#3A3631') }}>{rk(pp.rank)}</span></div>)}

            {(noTraffic.length || noRank.length) ? (
              <React.Fragment>
                {noTraffic.length ? <div style={{ marginBottom: 6 }}><div style={{ fontSize: 11.5, color: '#B45309', marginBottom: 3 }}>순위는 있는데 유입 0 ({noTraffic.length}) — 상품명이 검색과 안 맞음</div>{noTraffic.slice(0, 8).map((x, idx) => <div key={idx} style={{ fontSize: 11.5, color: '#3A3631' }}>· 「{x.query}」 {rk(x.rank)} · {sh(x.product)}</div>)}{noTraffic.length > 8 ? <div style={{ fontSize: 11, color: '#A29C95' }}>… 외 {noTraffic.length - 8}건</div> : null}</div> : null}
                {noRank.length ? <div><div style={{ fontSize: 11.5, color: '#2563EB', marginBottom: 3 }}>유입은 있는데 순위 없음 ({noRank.length})</div>{noRank.slice(0, 8).map((x, idx) => <div key={idx} style={{ fontSize: 11.5, color: '#3A3631' }}>· 「{x.query}」 {sh(x.product)}{x.visits7d != null ? ' · 방문 ' + x.visits7d : ''}</div>)}</div> : null}
              </React.Fragment>
            ) : empty('순위 vs 유입 데이터 없음')}

            <div style={{ fontSize: 12, fontWeight: 700, color: '#6E6863', margin: '10px 0 6px' }}>카테고리 순위 14일 추이</div>
            {catTrend.length ? catTrend.map((t, ti) => {

              const last = series[series.length - 1];
              const d14 = t.delta14;
              return (
                <div key={ti} style={{ fontSize: 11.5, color: '#3A3631', padding: '4px 0', borderTop: ti ? '1px dotted #EDEBE7' : 'none' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', gap: 8 }}><span style={{ minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{sh(t.product)}</span><span style={{ flexShrink: 0, fontWeight: 700, color: (d14 != null && d14 < 0) ? '#DC2626' : ((d14 != null && d14 > 0) ? '#047857' : '#6E6863') }}>{last ? rk(last.rank) : '—'}{d14 != null ? ' (' + (d14 > 0 ? '+' : '') + d14 + ')' : ''}</span></div>
                  <div style={{ fontSize: 10.5, color: '#A29C95' }}>{t.category}</div>
                </div>
              );
            }) : empty('카테고리 추이 없음')}

            {movers.length ? <div style={{ marginTop: 8 }}><div style={{ fontSize: 12, fontWeight: 700, color: '#6E6863', marginBottom: 4 }}>순위 급변 (어제 대비 20위↑)</div>{movers.map((m, mi) => <div key={mi} style={{ fontSize: 11.5, color: '#3A3631' }}>· 「{m.query || ''}」 {sh(m.product)}{(m.from != null && m.to != null) ? ' ' + m.from + '위→' + m.to + '위' : ''}{m.delta != null ? ' (' + (m.delta > 0 ? '+' : '') + m.delta + ')' : ''}</div>)}</div> : null}
          </div>
        </PsSection>

        <PsSection title="🔬 진행 중 실험" sub="기준선 대비 현재 · 동시에 하나만 바꾼다">
          <div data-ps-section="experiments">
            {experiments.length ? experiments.map((e, ei) => (
              <div key={e.id || ei} style={{ border: '1px solid #E3E0DC', borderRadius: 9, padding: '10px 12px', marginBottom: 7 }}>

                  {e.progress ? <span style={{ fontSize: 11, color: '#6E6863' }}>{(typeof e.progress === 'object') ? ('관측 ' + (e.progress.asOf || '') + (e.progress.detail && typeof e.progress.detail === 'object' ? ' · ' + Object.keys(e.progress.detail).length + '개 추적' : '')) : e.progress}</span> : null}
                </div>
                {e['변수'] ? <div style={{ fontSize: 12, color: '#3A3631', marginBottom: 2 }}><b>바꾼 것</b> {e['변수']}</div> : null}
                {(e.before || e.after) ? <div style={{ fontSize: 11.5, color: '#6E6863', marginBottom: 2 }}>{e.before ? <span style={{ textDecoration: 'line-through' }}>{sh(e.before)}</span> : null}{e.after ? <span> → <b style={{ color: '#1A1614' }}>{sh(e.after)}</b></span> : null}</div> : null}
                {Array.isArray(e['뺀단어']) && e['뺀단어'].length ? <div style={{ fontSize: 11.5, color: '#8E2018', marginBottom: 2 }}>뺀 단어: {e['뺀단어'].join(' · ')}</div> : null}
                {e['이유'] ? <div style={{ fontSize: 11.5, color: '#6E6863', marginBottom: 2 }}>{e['이유']}</div> : null}
                <div style={{ fontSize: 11, color: '#A29C95', marginTop: 3 }}>{e.changedAt ? '변경 ' + String(e.changedAt).slice(0, 10) : ''}{e.changedBy ? ' · ' + e.changedBy : ''}{e.baselineDate ? ' · 기준선 ' + e.baselineDate : ''}</div>
                {e['관측메모'] ? <div style={{ fontSize: 11, color: '#A29C95', marginTop: 2 }}>{e['관측메모']}</div> : null}
              </div>
            )) : empty('진행 중 실험 없음')}
          </div>
        </PsSection>

        <PsSection title="⚠️ 리스크" sub="질병표방·타사 브랜드·자사 경쟁">
          <div data-ps-section="risks">
            {risks.length ? risks.map((r, ri) => {
              const lv = LV[r.level] || LV.mid;
              return (
                <div key={ri} style={{ display: 'flex', alignItems: 'flex-start', gap: 8, border: '1px solid ' + lv.bd, borderRadius: 8, padding: '8px 11px', marginBottom: 6, background: lv.bg }}>
                  <span style={{ fontSize: 10.5, fontWeight: 800, color: lv.tx, background: 'white', border: '1px solid ' + lv.bd, borderRadius: 6, padding: '1px 7px', flexShrink: 0 }}>{lv.l}</span>
                  <div><div style={{ fontSize: 12.5, fontWeight: 700, color: '#1A1614' }}>{r.item}{r.status ? <span style={{ fontWeight: 400, color: lv.tx }}> · {r.status}</span> : null}</div>{r.why ? <div style={{ fontSize: 11.5, color: '#6E6863' }}>{r.why}</div> : null}{r.note ? <div style={{ fontSize: 11, color: '#A29C95', marginTop: 2 }}>{r.note}</div> : null}</div>
                </div>
              );
            }) : empty('현재 리스크 없음')}
          </div>
        </PsSection>

        <PsSection title="🎯 목표 대비 현재">
          <div data-ps-section="goals">
            {goals.length ? goals.map((g, gi) => {
              const cur = Number(g.current), tgt = Number(g.target);
              const lowerBetter = !isNaN(cur) && !isNaN(tgt) && tgt < cur;
              const pctv = (!isNaN(cur) && !isNaN(tgt) && tgt > 0 && !lowerBetter) ? Math.min(100, Math.round(cur / tgt * 100)) : null;
              return (
                <div key={gi} style={{ marginBottom: 10 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12.5, marginBottom: 3 }}><span style={{ fontWeight: 700, color: '#3A3631' }}>{g.metric}</span><span style={{ color: '#6E6863' }}>{g.current} → 목표 {g.target}{lowerBetter ? ' (낮을수록↑)' : (pctv != null ? ' (' + pctv + '%)' : '')}</span></div>
                  {pctv != null ? <div style={{ height: 8, background: '#EDEBE7', borderRadius: 5, overflow: 'hidden' }}><div style={{ width: pctv + '%', height: '100%', background: pctv >= 100 ? '#1FA463' : (pctv >= 60 ? GO : '#E08700') }} /></div> : <div style={{ fontSize: 11, color: '#B45309' }}>격차 {(!isNaN(cur) && !isNaN(tgt)) ? Math.abs(cur - tgt) : '—'}</div>}
                  {g.note ? <div style={{ fontSize: 11, color: '#A29C95', marginTop: 2 }}>{g.note}</div> : null}
                </div>
              );
            }) : empty('설정된 목표 없음')}
          </div>
        </PsSection>

        <PsSection title="📋 다음 계획" sub="날짜별 할 일">
          <div data-ps-section="plan">
            {nextPlan.length ? nextPlan.map((pl, pi) => <div key={pi} style={{ fontSize: 12.5, color: '#3A3631', marginBottom: 4 }}>· <b>{pl.when || '미정'}</b> — {pl.what}</div>) : empty('예정된 계획 없음')}
          </div>
        </PsSection>

        <div style={{ fontSize: 10.5, color: '#A29C95', marginTop: 12, lineHeight: 1.55 }}>순위는 스마트스토어센터 상품 순위 진단(진단 상품 대상 · statDate 하루 늦음), 나머지는 스토어 분석에서 자동화PC가 매일 <b>data/product-seo.json</b>으로 냅니다. 상품 변경은 스마트스토어에서 사람이 직접 하고(그룹상품은 API로 못 바꿈) 여기선 실험으로 추적합니다.</div>
      </React.Fragment>
      )}
    </div>
  );
}

function PowerlinkBidLog() {
  const [log, setLog] = React.useState(null);
  const [status, setStatus] = React.useState('loading');
  const [open, setOpen] = React.useState({ 0: true });   // 최신(0)만 펼침
  React.useEffect(() => {
    let alive = true;
    ghFetch('data/bid-log.json').then(r => (r.ok ? r.json() : null)).then(j => { if (!alive) return; if (j && Array.isArray(j.days)) { setLog(j); setStatus('ok'); } else setStatus('none'); }).catch(() => { if (alive) setStatus('none'); });
    return () => { alive = false; };
  }, []);
  const md = v => { const m = String(v || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? (parseInt(m[2], 10) + '/' + parseInt(m[3], 10)) : String(v || ''); };
  const won = n => (n == null ? '—' : Number(n).toLocaleString());
  const pctC = (st, dp) => (st === '인하' || (dp != null && dp < 0)) ? '#DC2626' : '#047857';
  const days = (log && Array.isArray(log.days)) ? log.days : [];

  return (
    <Card style={{ marginTop: 16 }}>
      <div data-bl-panel style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap', marginBottom: 10 }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: G }}>🧾 입찰 자동조정 이력</div>
        <span style={{ fontSize: 11, color: '#A29C95' }}>최근 30일 · 5분 모터가 조정한 내역 · 최신순</span>
        {log && log.updatedAt ? <span style={{ marginLeft: 'auto', fontSize: 11, color: '#A29C95' }}>갱신 {String(log.updatedAt).slice(0, 16).replace('T', ' ')}</span> : null}
      </div>
      {status === 'loading' ? <div style={{ fontSize: 12, color: '#A29C95', padding: '8px 0' }}>불러오는 중…</div> : null}
      {(status === 'none' || (status === 'ok' && days.length === 0)) ? <div data-bl-empty style={{ fontSize: 12, color: '#6E6863', background: '#F5F4F2', border: '1px solid #E3E0DC', borderRadius: 8, padding: '12px 14px', lineHeight: 1.6 }}>아직 입찰 조정 이력이 없습니다. 자동화PC가 <b>data/bid-log.json</b> 을 올리면 날짜별로 나타납니다. <span style={{ color: '#A29C95' }}>(없음 — 오류가 아닙니다)</span></div> : null}
      {status === 'ok' && days.length > 0 ? (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
          {days.map((day, di) => {
            const changes = Array.isArray(day.changes) ? day.changes : [];
            const flags = Array.isArray(day.reviewFlags) ? day.reviewFlags : [];
            const up = changes.filter(c => c.status === '증액').length;
            const down = changes.filter(c => c.status === '인하').length;
            const del = flags.length || (day.summary && day.summary.deleteReview) || 0;
            const isOpen = !!open[di];
            return (
              <div key={day.date || di} data-bl-day={day.date} style={{ border: '1px solid #E3E0DC', borderRadius: 9, overflow: 'hidden' }}>
                <div data-bl-header={day.date} onClick={() => setOpen(o => { const m = Object.assign({}, o); m[di] = !m[di]; return m; })} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '10px 12px', cursor: 'pointer', background: isOpen ? '#F0F4F1' : 'white', flexWrap: 'wrap' }}>
                  <span style={{ fontSize: 12, color: '#A29C95' }}>{isOpen ? '▾' : '▸'}</span>
                  <span style={{ fontSize: 13.5, fontWeight: 800, color: '#1A1614' }}>{md(day.date)}</span>
                  <span style={{ fontSize: 12.5, color: '#3A3631' }}>· {changes.length}건 조정</span>
                  <span style={{ fontSize: 11.5, color: '#6E6863' }}>(증액 {up}{down ? ' · 인하 ' + down : ''}{del ? ' · 삭제검토 ' + del : ''})</span>
                  {day.committed === false ? <span style={{ fontSize: 10.5, fontWeight: 700, color: '#B45309', background: '#FFFBEB', border: '1px solid #FDE68A', borderRadius: 6, padding: '1px 6px' }}>미반영</span> : null}
                </div>
                {isOpen ? (
                  <div style={{ padding: '4px 12px 12px' }}>
                    <div style={{ overflowX: 'auto' }}>
                      <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 11.5 }}>
                        <thead><tr style={{ color: '#A29C95', textAlign: 'left' }}>
