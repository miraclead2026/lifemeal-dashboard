// ── FileUploadModal ────────────────────────────────────────────────────────
function FileUploadModal({ subplanId, data, setData, onClose }) {
  const [dragOver, setDragOver] = useState(false);
  const [file, setFile] = useState(null);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState('');
  const [manualUrl, setManualUrl] = useState('');
  const MAX = 5 * 1024 * 1024;

  const sub = data.subplans.find(s => s.id === subplanId);
  const plan = sub ? data.plans.find(p => p.id === sub.planId) : null;
  const output = plan ? data.outputs.find(o => o.id === plan.outputId) : null;
  const folderPath = `라이프밀/업무첨부/${output ? outLabel(output) : '기타'}/${plan ? plan.name : '기타'}`;

  const handleFile = f => { if (f) setFile(f); };
  const onDrop = e => { e.preventDefault(); setDragOver(false); handleFile(e.dataTransfer.files[0]); };
  const isLarge = file && file.size > MAX;

  const upload = async () => {
    if (!file || isLarge) return;
    setBusy(true); setMsg('');
    const reader = new FileReader();
    reader.onload = async ev => {
      const base64 = ev.target.result.split(',')[1];
      const mediaType = file.type || 'application/octet-stream';
      const isImg = mediaType.startsWith('image/');
      const instruction = `구글드라이브에 "${folderPath}" 경로의 폴더를 찾거나 생성하고, "${file.name}" 파일을 업로드해 주세요. 업로드 후 공유 링크를 알려주세요.`;
      try {
        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'claude-sonnet-4-6', max_tokens: 1000,
            messages: [{ role: 'user', content: isImg
              ? [{ type: 'image', source: { type: 'base64', media_type: mediaType, data: base64 } }, { type: 'text', text: instruction }]
              : [{ type: 'text', text: instruction + '\n\n[파일: ' + file.name + ', 크기: ' + fmtSize(file.size) + ']' }]
            }],
            mcp_servers: [{ type: 'url', url: 'https://drivemcp.googleapis.com/mcp/v1', name: 'google-drive' }]
          })
        });
        const d = await res.json();
        const text = (d.content || []).filter(c => c.type === 'text').map(c => c.text).join('');
        const urlMatch = text.match(/https:\/\/drive\.google\.com\/\S+/);
        const driveUrl = urlMatch ? urlMatch[0].replace(/[).,]+$/, '') : '';
        addFile(file.name, file.size, driveUrl || '', text);
        setMsg(driveUrl ? '✅ 업로드 완료!' : '✅ 처리됨 · ' + text.slice(0, 80));
      } catch (e) { setMsg('❌ 오류: ' + e.message); }
      setBusy(false);
    };
    reader.readAsDataURL(file);
  };

  const addFile = (name, size, driveUrl, note) => {
    const f = { id: Date.now(), name, size, driveUrl, uploadedAt: TODAY, note: note || '' };
    setData(prev => ({ ...prev, subplans: prev.subplans.map(s => s.id === subplanId ? { ...s, files: [...(s.files || []), f] } : s) }));
  };

  const addManual = () => {
    if (!manualUrl.trim()) return;
    addFile(file ? file.name : '첨부파일', file ? file.size : 0, manualUrl.trim(), '수동 등록');
    onClose();
  };

  const delFile = id => setData(prev => ({ ...prev, subplans: prev.subplans.map(s => s.id === subplanId ? { ...s, files: (s.files || []).filter(f => f.id !== id) } : s) }));
  const currentFiles = (data.subplans.find(s => s.id === subplanId) || {}).files || [];

  return (

const blankDate = { start: '', due: '', useDep: false, depId: '', depDays: '' };

function AddModal({ data, setData, onClose }) {
  const [oMode, setOMode] = useState('exist'), [oSel, setOSel] = useState(''), [oCls, setOCls] = useState(data.categories[0]?.name || 'MD출력'), [oName, setOName] = useState('');
  const [pMode, setPMode] = useState('exist'), [pSel, setPSel] = useState(''), [pName, setPName] = useState(''), [pDate, setPDate] = useState(blankDate);
  const [sMode, setSMode] = useState('none'), [sSel, setSSel] = useState(''), [sName, setSName] = useState(''), [sDate, setSDate] = useState(blankDate);
  const [checks, setChecks] = useState(['']);
  const [kpiOn, setKpiOn] = useState(false), [kpi, setKpi] = useState({ name: '', target: '', current: '', unit: '%' });
  const [owner, setOwner] = useState('현수'), [support, setSupport] = useState([]);
  const depOpts = buildDepOpts(data);
  const newCode = oMode === 'new' ? genCode(data.outputs, data.categories, oCls) : '';
  const catIdx = data.categories.findIndex(c => c.name === oCls);
  const catColor = catIdx >= 0 ? CAT_PALETTE[catIdx % CAT_PALETTE.length] : '#6B7280';
  const availPlans = data.plans.filter(p => p.outputId === Number(oSel));
  const availSubs = data.subplans.filter(s => s.planId === Number(pSel));
  const existingPlan = pMode === 'exist' ? data.plans.find(p => p.id === Number(pSel)) : null;

  const submit = () => {
    let id = data.nid; const next = () => ++id;
    const nd = { ...data, outputs: [...data.outputs], plans: [...data.plans], subplans: [...data.subplans], checklists: [...data.checklists] };
    let outputId;
    if (oMode === 'new') { if (!oName.trim()) { alert('출력 프로젝트명 입력'); return; } outputId = next(); nd.outputs.push({ id: outputId, code: newCode, type: oCls, name: oName.trim() }); }
    else { if (!oSel) { alert('출력 프로젝트 선택'); return; } outputId = Number(oSel); }
    let planId;
    if (pMode === 'new') { if (!pName.trim()) { alert('실행계획명 입력'); return; } planId = next(); const dep = parseDep(pDate); nd.plans.push({ id: planId, outputId, name: pName.trim(), start: dep ? '' : pDate.start, due: dep ? addDays(TODAY, dep.days) : pDate.due, owner, support: sMode === 'new' ? [] : support.slice(), kpi: kpiOn ? { name: kpi.name, target: Number(kpi.target), current: Number(kpi.current), unit: kpi.unit } : null, dep, resolved: false, hold: false }); }
    else { if (!pSel) { alert('실행계획 선택'); return; } planId = Number(pSel); if (kpiOn && !(existingPlan && existingPlan.kpi)) nd.plans = nd.plans.map(p => p.id === planId ? { ...p, kpi: { name: kpi.name, target: Number(kpi.target), current: Number(kpi.current), unit: kpi.unit } } : p); }
    let subId = null;
    if (sMode === 'new') { if (!sName.trim()) { alert('세부실행계획명 입력'); return; } subId = next(); const dep = parseDep(sDate); nd.subplans.push({ id: subId, planId, name: sName.trim(), stage: '예정', start: dep ? '' : sDate.start, due: dep ? addDays(TODAY, dep.days) : sDate.due, owner, support: support.slice(), dep, resolved: false, files: [] }); }
    else if (sMode === 'exist') { subId = Number(sSel); }
    if (subId) checks.filter(c => c.trim()).forEach(c => nd.checklists.push({ id: next(), subplanId: subId, text: c.trim(), done: false }));
    nd.nid = id; setData(resolveAll(nd)); onClose();
  };

    <div style={{ display: 'flex', gap: 6, marginBottom: 6 }}>

    </div>
  );

  return (
    <ModalShell title="업무 추가하기" onClose={onClose}>
      <div>
        <div style={{ fontWeight: 700, fontSize: 13, color: G, marginBottom: 7 }}>1. 출력 프로젝트</div>
        <Toggle mode={oMode} setMode={setOMode} opts={[{ v: 'exist', l: '기존 선택' }, { v: 'new', l: '+ 새로 추가' }]} />
        {oMode === 'exist' ? <Sel value={oSel} onChange={setOSel} ph="선택..." opts={data.outputs.map(o => ({ v: o.id, l: o.code + ' · ' + o.name }))} /> :
          <div style={{ background: '#F9FAFB', borderRadius: 10, padding: 12, border: '1px solid #EEF0F2' }}>
            <Lbl c="분류" /><div style={{ display: 'flex', gap: 6, marginBottom: 8, flexWrap: 'wrap' }}>{data.categories.map((cat, i) => <button key={cat.name} onClick={() => setOCls(cat.name)} style={{ padding: '7px 12px', borderRadius: 8, border: 'none', cursor: 'pointer', fontSize: 12, fontWeight: 600, background: oCls === cat.name ? CAT_PALETTE[i % CAT_PALETTE.length] : '#E5E7EB', color: oCls === cat.name ? 'white' : '#374151' }}>{cat.name}</button>)}</div>
            <div style={{ marginBottom: 8 }}><Badge label={newCode} color={catColor} /></div>
            <Inp value={oName} onChange={setOName} placeholder="출력 프로젝트명" />
          </div>}
      </div>
      <div>
        <div style={{ fontWeight: 700, fontSize: 13, color: G, marginBottom: 7 }}>2. 실행계획</div>
        <Toggle mode={pMode} setMode={setPMode} opts={[{ v: 'exist', l: '기존 선택' }, { v: 'new', l: '+ 새로 추가' }]} />
        {pMode === 'exist' ? <Sel value={pSel} onChange={setPSel} ph="선택..." opts={availPlans.map(p => ({ v: p.id, l: p.name }))} /> :
          <div style={{ background: '#F9FAFB', borderRadius: 10, padding: 12, border: '1px solid #EEF0F2' }}><Inp value={pName} onChange={setPName} placeholder="실행계획명" /><DateBlock title="실행계획" d={pDate} set={setPDate} depOpts={depOpts} /></div>}
      </div>
      <div>
        <div style={{ fontWeight: 700, fontSize: 13, color: G, marginBottom: 7 }}>3. 세부 실행계획 <span style={{ fontWeight: 400, color: '#9CA3AF', fontSize: 11 }}>(선택)</span></div>
        <Toggle mode={sMode} setMode={setSMode} opts={[{ v: 'none', l: '없음' }, { v: 'exist', l: '기존 선택' }, { v: 'new', l: '+ 새로 추가' }]} />
        {sMode === 'exist' && <Sel value={sSel} onChange={setSSel} ph="선택..." opts={availSubs.map(s => ({ v: s.id, l: s.name }))} />}
        {sMode === 'new' && <div style={{ background: '#F9FAFB', borderRadius: 10, padding: 12, border: '1px solid #EEF0F2' }}><Inp value={sName} onChange={setSName} placeholder="세부 실행계획명" /><DateBlock title="세부실행계획" d={sDate} set={setSDate} depOpts={depOpts} /></div>}
      </div>
      {(sMode === 'new' || sMode === 'exist') && (
        <div>
          <div style={{ fontWeight: 700, fontSize: 13, color: G, marginBottom: 7 }}>4. 체크리스트</div>
          {checks.map((c, i) => <div key={i} style={{ display: 'flex', gap: 6, marginBottom: 6 }}><input value={c} onChange={e => setChecks(checks.map((x, j) => j === i ? e.target.value : x))} placeholder={'항목 ' + (i + 1)} style={{ flex: 1, padding: '8px 9px', borderRadius: 8, border: '1px solid #D1D5DB', fontSize: 13 }} /><button onClick={() => setChecks(checks.filter((_, j) => j !== i))} style={{ border: 'none', background: '#F3F4F6', borderRadius: 8, color: '#9CA3AF', cursor: 'pointer', width: 34, fontSize: 16 }}>×</button></div>)}
          <Btn v="ghost" onClick={() => setChecks([...checks, ''])} style={{ padding: '5px 0', fontSize: 12 }}>+ 항목 추가</Btn>
        </div>
      )}
      <div>
        <label style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 13, fontWeight: 700, color: G, cursor: 'pointer' }}><input type="checkbox" checked={kpiOn} onChange={e => setKpiOn(e.target.checked)} /> KPI 등록</label>
        {kpiOn && <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr 1fr 1fr', gap: 6, marginTop: 8 }}><Inp value={kpi.name} onChange={v => setKpi({ ...kpi, name: v })} placeholder="KPI명" /><Inp type="number" value={kpi.target} onChange={v => setKpi({ ...kpi, target: v })} placeholder="목표" /><Inp type="number" value={kpi.current} onChange={v => setKpi({ ...kpi, current: v })} placeholder="현재" /><Inp value={kpi.unit} onChange={v => setKpi({ ...kpi, unit: v })} placeholder="단위" /></div>}
      </div>
      <div>
        <Lbl c="담당자" />
        <div style={{ display: 'flex', gap: 6, marginBottom: 12 }}>{MEMBERS.map(m => <button key={m} onClick={() => setOwner(m)} style={{ flex: 1, padding: '8px 0', borderRadius: 8, border: 'none', cursor: 'pointer', fontSize: 13, fontWeight: 600, background: owner === m ? G : '#E5E7EB', color: owner === m ? 'white' : '#374151' }}>{AV[m]} {m}</button>)}</div>
        <SupportEditor support={support} setSupport={setSupport} />
      </div>
      <div style={{ display: 'flex', gap: 8 }}><Btn onClick={submit} style={{ flex: 1 }}>업무 추가</Btn><Btn v="secondary" onClick={onClose}>취소</Btn></div>
    </ModalShell>
  );
}

// ── EditModal (출력연결변경 + 파일첨부 추가) ────────────────────────────────
function EditModal({ target, data, setData, onClose }) {
  const kind = target.kind;
  const item = kind === 'plan' ? data.plans.find(p => p.id === target.id) : data.subplans.find(s => s.id === target.id);
  if (!item) return null;

  const [name, setName] = useState(item.name), [owner, setOwner] = useState(item.owner);
  const [stage, setStage] = useState(item.stage || '예정'), [hold, setHold] = useState(!!(item.hold));
  const [support, setSupport] = useState(item.support || []);
  const [ds, setDs] = useState(item.dep ? { start: '', due: item.due || '', useDep: true, depId: (item.dep.kind === 'plan' ? 'plan-' : 'sub-') + item.dep.id, depDays: String(item.dep.days || '') } : { start: item.start || '', due: item.due || '', useDep: false, depId: '', depDays: '' });
  const [kpiOn, setKpiOn] = useState(!!(item.kpi)), [kpi, setKpi] = useState(item.kpi ? { name: item.kpi.name, target: String(item.kpi.target), current: String(item.kpi.current), unit: item.kpi.unit } : { name: '', target: '', current: '', unit: '%' });
  const [confirmDel, setConfirmDel] = useState(false);

  // 출력 연결 변경 (세부실행계획 전용)
  const currentPlan = kind === 'subplan' ? data.plans.find(p => p.id === item.planId) : null;
  const currentOutput = currentPlan ? data.outputs.find(o => o.id === currentPlan.outputId) : null;
  const [showOutputChg, setShowOutputChg] = useState(false);
  const [newOutputId, setNewOutputId] = useState(currentOutput ? String(currentOutput.id) : '');
  const [newPlanId, setNewPlanId] = useState(currentPlan ? String(currentPlan.id) : '');
  const chgPlans = data.plans.filter(p => p.outputId === Number(newOutputId));

  // 파일 첨부 모달
  const [showFile, setShowFile] = useState(false);
  const currentFiles = kind === 'subplan' ? ((data.subplans.find(s => s.id === item.id) || {}).files || []) : [];

  const depOpts = buildDepOpts(data).filter(o => o.v !== (kind === 'plan' ? 'plan-' : 'sub-') + item.id);

  const save = () => {
    if (!name.trim()) { alert('이름 입력'); return; }
    const dep = parseDep(ds);
    const f = { name: name.trim(), owner, support: support.slice(), start: dep ? '' : ds.start, due: dep ? addDays(TODAY, dep.days) : ds.due, dep, resolved: false };
    if (kind === 'subplan') {
      f.stage = stage;
      if (showOutputChg && newPlanId) f.planId = Number(newPlanId);
    }
    if (kind === 'plan') { f.kpi = kpiOn ? { name: kpi.name, target: Number(kpi.target), current: Number(kpi.current), unit: kpi.unit } : null; f.hold = hold; }
    setData(d => resolveAll(kind === 'plan' ? { ...d, plans: d.plans.map(p => p.id === item.id ? { ...p, ...f } : p) } : { ...d, subplans: d.subplans.map(s => s.id === item.id ? { ...s, ...f } : s) }));
    onClose();
  };

      {showFile && <FileUploadModal subplanId={item.id} data={data} setData={setData} onClose={() => setShowFile(false)} />}
    </ModalShell>
  );
}

tton> : <div style={{ display: 'flex', gap: 4 }}><button onClick={() => move(s.id, -1)} disabled={stage === '예정'} style={{ flex: 1, padding: '4px 0', fontSize: 10, border: '1px solid #E5E7EB', borderRadius: 6, cursor: 'pointer', background: 'white' }}>◀</button><button onClick={() => move(s.id, 1)} disabled={stage === '완료'} style={{ flex: 1, padding: '4px 0', fontSize: 10, border: '1px solid #E5E7EB', borderRadius: 6, cursor: 'pointer', background: 'white' }}>▶</button></div>}</Card>); })}</div>);

// ── TabWeekly (v7 최종: 통합 그리드 + 기간 스팬 통째 드래그) ──────────────
function TabWeekly({ data, setData, onEdit }) {
  const [filter, setFilter] = useState('전체'), [offset, setOffset] = useState(0), [exp, setExp] = useState(null), [dragOver, setDragOver] = useState(null);
  const monday = (() => { const d = new Date(TODAY); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd + offset * 7); return d; })();
  const weekDates = DAYS.map((_, i) => { const x = new Date(monday); x.setDate(monday.getDate() + i); return x.toISOString().slice(0, 10); });
  const diffDays = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
  const toggleChk = id => setData(d => ({ ...d, checklists: d.checklists.map(c => c.id === id ? { ...c, done: !c.done } : c) }));
  const planName = id => { const p = data.plans.find(x => x.id === id); return p ? p.name : ''; };

  const onDragStart = (e, s, isSpan) => {
    e.stopPropagation();
    const dur = isSpan ? diffDays(s.start, s.due) : 0;
    e.dataTransfer.setData('sub-id', String(s.id));
    e.dataTransfer.setData('sub-type', isSpan ? 'span' : 'day');
    e.dataTransfer.setData('sub-dur', String(dur));
  };
  const handleDrop = (e, targetDate) => {
    e.preventDefault(); e.stopPropagation();
    const id = Number(e.dataTransfer.getData('sub-id'));
    const type = e.dataTransfer.getData('sub-type');
    const dur = Number(e.dataTransfer.getData('sub-dur') || '0');
    if (!id || !targetDate) return;
    setDragOver(null);
    setData(d => ({ ...d, subplans: d.subplans.map(s => {
      if (s.id !== id) return s;
      if (type === 'span') return { ...s, start: targetDate, due: addDays(targetDate, dur) };
      return { ...s, due: targetDate };
    }) }));
  };
  const handleUnassignedDrop = e => {
    e.preventDefault();
    const id = Number(e.dataTransfer.getData('sub-id'));
    if (!id) return;
    setDragOver(null);
    setData(d => ({ ...d, subplans: d.subplans.map(s => s.id === id ? { ...s, start: '', due: '' } : s) }));
  };

  const subs = data.subplans.filter(s => s.stage !== '보류' && matchOwner(s, filter));
  const spanning = subs.filter(s => s.start && s.due && s.start !== s.due && s.start <= weekDates[6] && s.due >= weekDates[0]);
  const getDayItems = date => subs.filter(s => { if (s.start && s.due && s.start !== s.due) return false; return s.due === date; });
  const unassigned = subs.filter(s => !s.due);

  const grouped = {};
  unassigned.forEach(s => {
    const p = data.plans.find(x => x.id === s.planId);
    const o = p ? data.outputs.find(x => x.id === p.outputId) : null;
    const oKey = o ? outLabel(o) : '기타';
    const pKey = p ? p.name : '기타';
    if (!grouped[oKey]) grouped[oKey] = {};
    if (!grouped[oKey][pKey]) grouped[oKey][pKey] = [];
    grouped[oKey][pKey].push(s);
  });

  const renderMini = (s, hideParent = false) => {
    const chks = data.checklists.filter(c => c.subplanId === s.id); const cd = chks.filter(c => c.done).length;
    const isSpan = !!(s.start && s.due && s.start !== s.due); const files = s.files || [];
    return (
      <Card key={s.id} draggable onDragStart={e => onDragStart(e, s, isSpan)} style={{ marginBottom: 6, padding: 8, cursor: 'grab' }}>
        {!hideParent && <div style={{ fontSize: 9, color: '#9CA3AF', marginBottom: 3 }}>{planName(s.planId)}</div>}
        <div style={{ display: 'flex', gap: 4, alignItems: 'flex-start' }}>
          <div style={{ fontSize: 11, fontWeight: 600, flex: 1, lineHeight: 1.3, cursor: 'pointer' }} onClick={() => setExp(exp === s.id ? null : s.id)}>{s.name}</div>
          <EditBtn onClick={() => onEdit({ kind: 'subplan', id: s.id })} />
        </div>
        <div style={{ display: 'flex', gap: 5, marginTop: 4, flexWrap: 'wrap', alignItems: 'center' }}>
          <span style={{ fontSize: 9, padding: '1px 5px', borderRadius: 6, background: stC(s.stage), color: 'white' }}>{s.stage}</span>
          <span style={{ fontSize: 9, color: G }}>{AV[s.owner]}</span>
          {chks.length > 0 && <span style={{ fontSize: 9, color: '#6B7280' }}>☑ {cd}/{chks.length}</span>}
          {files.length > 0 && <span style={{ fontSize: 9, color: '#4285F4' }}>📎{files.length}</span>}
        </div>
        {exp === s.id && chks.length > 0 && <div style={{ background: '#F9FAFB', borderRadius: 6, padding: 6, marginTop: 6 }}>{chks.map(c => <div key={c.id} onClick={() => toggleChk(c.id)} style={{ display: 'flex', alignItems: 'center', gap: 5, padding: '3px 0', cursor: 'pointer' }}><Chk on={c.done} /><span style={{ fontSize: 10, color: c.done ? '#9CA3AF' : '#374151', textDecoration: c.done ? 'line-through' : 'none' }}>{c.text}</span></div>)}</div>}
      </Card>
    );
  };

  const navBtn = { border: '1px solid #E5E7EB', background: 'white', borderRadius: 6, cursor: 'pointer', padding: '4px 10px' };
  return (
    <div style={{ padding: 20 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 14, flexWrap: 'wrap' }}>
        <div style={{ fontSize: 17, fontWeight: 700, color: G }}>데일리 / 주간 업무</div>
        <div style={{ display: 'flex', gap: 6, marginLeft: 'auto' }}>
          <button onClick={() => setOffset(offset - 1)} style={navBtn}>◀</button>
          <span style={{ fontSize: 12, color: '#6B7280', minWidth: 110, textAlign: 'center' }}>{weekDates[0].slice(5)} ~ {weekDates[6].slice(5)}{offset === 0 ? ' (이번 주)' : ''}</span>
          <button onClick={() => setOffset(offset + 1)} style={navBtn}>▶</button>
        </div>
      </div>

            </div>
          ))}
      </div>
    </div>
  );
}

// ── App ────────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState(0);
  const [data, setData] = useState(null);
  const [ready, setReady] = useState(false);
  const [modal, setModal] = useState(false);
  const [editT, setEditT] = useState(null);
  const [sync, setSync] = useState('loading');
  const [syncErr, setSyncErr] = useState('');
  const pendingRef = useRef(null);
  const lastSavedRef = useRef(null);
  const initDoneRef = useRef(false);

  useEffect(() => {
    const ref = db.ref('/dashboard');
    ref.on('value', snap => {
      const remote = snap.val();
      const remoteStr = remote ? JSON.stringify(remote) : null;
      if (!initDoneRef.current) {
        initDoneRef.current = true;
        if (remote && remote.nid) { const m = migrateData(remote); setData(m); lastSavedRef.current = JSON.stringify(m); }
        else { setData(INIT); lastSavedRef.current = null; }
        setReady(true); setSync('ok');
      } else {
        if (remote && remote.nid && remoteStr !== lastSavedRef.current) { const m = migrateData(remote); setData(m); lastSavedRef.current = JSON.stringify(m); }
      }
    }, err => { setSyncErr(err.message); setSync('error'); if (!initDoneRef.current) { initDoneRef.current = true; setData(INIT); setReady(true); } });
    return () => ref.off('value');
  }, []);

  useEffect(() => {
    if (!ready || !data) return;
    const str = JSON.stringify(data);
    if (str === lastSavedRef.current) return;
    if (pendingRef.current) clearTimeout(pendingRef.current);
    setSync('saving');
    pendingRef.current = setTimeout(() => {
      lastSavedRef.current = str;
      db.ref('/dashboard').set(data).then(() => setSync('ok')).catch(e => { setSync('error'); setSyncErr(e.message || '저장 실패'); lastSavedRef.current = null; });
    }, 800);
  }, [data, ready]);

  const heldCount = data ? data.plans.filter(p => p.hold).length + data.subplans.filter(s => s.stage === '보류').length : 0;
  const TABS = [
    { icon: '👥', label: '팀 현황', C: TabTeam },
    { icon: '📈', label: '프로젝트 진행 상황', C: TabProgress },
    { icon: '🗂️', label: '칸반', C: TabKanban },
    { icon: '📅', label: '데일리/주간', C: TabWeekly },
    { icon: '📊', label: 'KPI', C: TabKpi },
    { icon: '⏸', label: '보류', C: TabHold, badge: heldCount },
    { icon: '💰', label: '예산', C: TabBudget },
  ];

  if (!ready || !data) return (
    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: BG }}>
      <div style={{ textAlign: 'center', color: '#6B7280' }}><div style={{ fontSize: 44, marginBottom: 12 }}>🌿</div><div style={{ fontSize: 15, fontWeight: 600, marginBottom: 6 }}>Firebase에서 불러오는 중...</div><div style={{ fontSize: 12, color: '#9CA3AF' }}>LIFEMEAL 팀 대시보드</div></div>
    </div>
  );

  const TabC = TABS[tab].C;
  return (
    <div style={{ minHeight: '100vh', background: BG }}>
      <div style={{ background: G, color: 'white', padding: '12px 20px', display: 'flex', alignItems: 'center', gap: 12, boxShadow: '0 2px 8px rgba(0,0,0,0.2)', flexWrap: 'wrap' }}>
        <span style={{ fontSize: 22 }}>🌿</span>
        <div><div style={{ fontSize: 16, fontWeight: 800 }}>통합 팀 대시보드</div><div style={{ fontSize: 11, opacity: 0.7 }}>LIFEMEAL · Firebase 실시간 연동</div></div>
        <div style={{ marginLeft: 'auto', display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
          <SyncBadge status={sync} errMsg={syncErr} />
          {MEMBERS.map(m => <div key={m} style={{ width: 30, height: 30, borderRadius: '50%', background: GO, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, border: '2px solid rgba(255,255,255,0.25)' }}>{AV[m]}</div>)}
          {heldCount > 0 && <div onClick={() => setTab(5)} style={{ background: '#94A3B8', borderRadius: 20, padding: '4px 10px', fontSize: 11, fontWeight: 700, cursor: 'pointer' }}>⏸ {heldCount}</div>}
          <button onClick={() => setModal(true)} style={{ padding: '8px 16px', borderRadius: 8, border: 'none', background: 'white', color: G, fontWeight: 700, fontSize: 13, cursor: 'pointer' }}>+ 업무 추가하기</button>
        </div>
      </div>
      <div style={{ background: 'white', boxShadow: '0 1px 4px rgba(0,0,0,0.07)', overflowX: 'auto' }}>
        <div style={{ display: 'flex', minWidth: 'max-content' }}>
          {TABS.map((t, i) => <button key={i} onClick={() => setTab(i)} style={{ padding: '11px 18px', border: 'none', cursor: 'pointer', fontSize: 13, fontWeight: tab === i ? 700 : 500, color: tab === i ? G : '#6B7280', background: 'transparent', borderBottom: tab === i ? '2.5px solid ' + G : '2.5px solid transparent', display: 'flex', alignItems: 'center', gap: 5, whiteSpace: 'nowrap' }}>{t.icon} {t.label}{t.badge > 0 ? <span style={{ background: '#94A3B8', color: 'white', borderRadius: 10, padding: '1px 6px', fontSize: 10, fontWeight: 700 }}>{t.badge}</span> : null}</button>)}
        </div>
      </div>
      <div style={{ maxWidth: 1400, margin: '0 auto' }}>
        <TabC data={data} setData={setData} onEdit={t => setEditT(t)} />
      </div>
      {modal && <AddModal data={data} setData={setData} onClose={() => setModal(false)} />}
      {editT && <EditModal target={editT} data={data} setData={setData} onClose={() => setEditT(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
