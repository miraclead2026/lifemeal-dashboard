            <button data-pay-exp-last onClick={() => { const d = new Date(); const y = d.getFullYear(), m = d.getMonth(); const f = new Date(y, m - 1, 1), l = new Date(y, m, 0); const fmt = x => x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); setExpS(fmt(f)); setExpE(fmt(l)); setExpMsg(''); }}
              style={{ padding: '6px 10px', borderRadius: 7, border: '1px solid #E3E0DC', background: 'white', color: '#6E6863', fontSize: 11.5, fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit' }}>지난 달</button>
            <button data-pay-exp-clear onClick={() => { setExpS(''); setExpE(''); setExpMsg(''); }}
              style={{ padding: '6px 10px', borderRadius: 7, border: '1px solid #E3E0DC', background: 'white', color: '#6E6863', fontSize: 11.5, fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit' }}>기간 지우기</button>
            {(() => {
              const rows = shownPays.filter(p => (!expS || (p.paidDate && p.paidDate >= expS)) && (!expE || (p.paidDate && p.paidDate <= expE)));
              const label = (expS || expE) ? ((expS || '처음') + '_' + (expE || '끝')) : '전체';
              return (
                <React.Fragment>
                  <button data-pay-exp-go disabled={!rows.length}
                    onClick={() => { const e = downloadText(payCsvText(data, rows), '실결제_' + label + '.csv'); setExpMsg(e ? ('내려받기에 실패했습니다 — ' + e) : (rows.length + '건을 내려받았습니다.')); }}
                    style={{ marginLeft: 'auto', padding: '6px 14px', borderRadius: 7, border: 'none', background: rows.length ? G : '#D8D4CF', color: 'white', fontSize: 11.5, fontWeight: 800, cursor: rows.length ? 'pointer' : 'not-allowed', fontFamily: 'inherit' }}>
                    CSV 내려받기 ({rows.length}건)
                  </button>
                </React.Fragment>
              );
            })()}
          </div>
          <div style={{ fontSize: 10.5, color: '#A29C95', marginTop: 7, lineHeight: 1.6 }}>
            결제일 기준입니다. 기간을 비우면 <b>지금 필터에 걸린 전체</b>가 나갑니다. 엑셀에서 바로 열리는 형식(UTF-8)입니다.
            <br /><b>대시보드에 없어서 빈 칸으로 나가는 항목</b> — {PAY_CSV_EMPTY.map(x => x.col).join(' · ')}. 지어내지 않고 비워 둡니다.
          </div>
          {expMsg ? <div data-pay-exp-msg style={{ fontSize: 11.5, fontWeight: 700, color: G, marginTop: 6 }}>{expMsg}</div> : null}
        </Card>
        {!shownPays.length ? (<Card style={{ textAlign: 'center', padding: 40, color: '#A29C95' }}><div style={{ fontSize: 34, marginBottom: 10 }}>🧾</div><div>{fPOn ? '필터 조건에 맞는 실결제가 없습니다' : '등록된 실결제 기록이 없습니다'}</div><div style={{ fontSize: 12, marginTop: 6 }}>{fPOn ? '조건을 바꾸거나 초기화해 보세요' : '프로젝트와 업체를 선택하고 결제 금액을 입력해 기록하세요'}</div>{fPOn ? <button onClick={() => setFP({ q: '', proj: '', vendor: '', pay: '', card: '' })} style={{ marginTop: 10, padding: '6px 14px', borderRadius: 7, border: '1px solid #E3E0DC', background: 'white', color: G, fontSize: 12, fontWeight: 700, cursor: 'pointer' }}>필터 초기화</button> : null}</Card>) :
          payKeys.map(k => { const list = payGroups[k]; const sub = list.reduce((a, p) => a + (Number(p.amount) || 0), 0); return (
            <Card key={k} style={{ padding: 0, overflow: 'hidden', marginBottom: 16 }}>
              <div style={{ display: 'flex', alignItems: 'center', padding: '10px 14px', background: '#F8F7F5', borderBottom: '1px solid #EDEBE7' }}><span style={{ fontSize: 13, fontWeight: 700, color: G }}>{k}</span><span style={{ marginLeft: 'auto', fontSize: 12, fontWeight: 700, color: G }}>{won(sub)}</span></div>
              <div style={{ padding: 12 }}>{list.map(p => { const items = (p.coveredBudgetIds || []).map(id => budgets.find(b => b.id === id)).filter(Boolean); return (
                <div key={p.id} style={{ border: '1px solid #EDEBE7', borderRadius: 10, padding: 12, marginBottom: 8 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
                    <span style={{ fontSize: 14, fontWeight: 700 }}>{p.vendor}</span>
                    <span style={{ fontSize: 11, color: '#6E6863' }}>{p.payMethod}</span>
                    {p.cardId ? <span style={{ fontSize: 10, fontWeight: 700, color: '#7C5CD6', background: '#F3EEFE', border: '1px solid #E4DAF7', borderRadius: 5, padding: '2px 7px' }}>💳 {cardLabel(data, p.cardId) || '카드'}</span> : null}
                    {(() => { const po = (data.outputs || []).find(o => String(o.id) === String(p.projectId)); return po ? <Badge label={outLabel(po)} color={G} /> : <span style={{ fontSize: 10, fontWeight: 700, color: '#B45309', background: '#FFFBEB', border: '1px solid #FDE68A', borderRadius: 5, padding: '2px 7px' }}>⚠ 프로젝트 미지정</span>; })()}
                    <span style={{ marginLeft: 'auto', fontSize: 15, fontWeight: 800, color: '#1FA463' }}>{won(Number(p.amount) || 0)}</span>
                  </div>
                  {items.length > 0 && <div style={{ fontSize: 11, color: '#6E6863', marginTop: 6 }}>기안 연결: {items.map(b => { const n = budgetNames(data, b); return n.detail; }).join(', ')}</div>}
                  {p.memo && <div style={{ fontSize: 11, color: '#6E6863', marginTop: 4, background: '#F5F4F2', borderRadius: 6, padding: '5px 8px' }}>💬 {p.memo}</div>}
                  <div style={{ display: 'flex', gap: 6, marginTop: 10, alignItems: 'center' }}>
                    {p.receiptUrl ? <a href={p.receiptUrl} target="_blank" rel="noreferrer" style={{ fontSize: 11, color: '#2D5FE0', fontWeight: 700, textDecoration: 'none' }}>🧾 영수증 열기</a> : <span style={{ fontSize: 11, color: '#A29C95' }}>영수증 없음</span>}
                    <button onClick={() => setEditPay(p)} style={{ marginLeft: 'auto', border: '1px solid #E3E0DC', background: 'white', borderRadius: 6, color: '#6E6863', cursor: 'pointer', fontSize: 10, padding: '3px 9px', fontWeight: 600 }}>수정</button>
                    <button onClick={() => delPay(p.id)} style={{ border: 'none', background: 'none', color: '#E53935', cursor: 'pointer', fontSize: 11, fontWeight: 700 }}>삭제</button>
                  </div>
                </div>); })}</div>
            </Card>); })}
      </>)}

      {showAdd && <BudgetFormModal data={data} setData={setData} onClose={() => setShowAdd(false)} />}
      {showVendorMgr && <VendorManagerModal data={data} setData={setData} onClose={() => setShowVendorMgr(false)} />}
      {showCardMgr && <CardManagerModal data={data} setData={setData} onClose={() => setShowCardMgr(false)} />}
      {showCardUse && <CardUsageModal data={data} monthKey={monthKey} onClose={() => setShowCardUse(false)} />}
      {showDraft && <DraftModal data={data} setData={setData} onClose={() => setShowDraft(false)} />}
      {editB && <BudgetFormModal data={data} setData={setData} edit={editB} onClose={() => setEditB(null)} />}
      {showPay && <PaymentModal data={data} setData={setData} onClose={() => setShowPay(false)} />}
      {editPay && <PaymentModal data={data} setData={setData} edit={editPay} onClose={() => setEditPay(null)} />}
    </div>
  );
}

function PaymentModal({ data, setData, edit, onClose }) {
  const e = edit || {};
  const budgetVendors = [...new Set((data.budgets || []).map(b => b.vendor).filter(Boolean))];
  const regVendors = data.vendors || [];
  const allVendors = [...new Set([...regVendors, ...budgetVendors])].sort();
  const [vendor, setVendor] = useState(e.vendor || allVendors[0] || '');
  const [newVendor, setNewVendor] = useState('');
  const [addingVendor, setAddingVendor] = useState(false);
  const [amount, setAmount] = useState(e.amount != null ? String(e.amount) : '');
  const [payMethod, setPayMethod] = useState(e.payMethod || '세금계산서');
  const [projectId, setProjectId] = useState(e.projectId != null && e.projectId !== '' ? String(e.projectId) : '');
  const [cardId, setCardId] = useState(e.cardId != null && e.cardId !== '' ? String(e.cardId) : '');
  const cards = data.cards || [];
  const [paidDate, setPaidDate] = useState(e.paidDate || TODAY);
  const [memo, setMemo] = useState(e.memo || '');
  const [receiptUrl, setReceiptUrl] = useState(e.receiptUrl || '');
  const [receiptName, setReceiptName] = useState(e.receiptName || '');
  const [receiptFile, setReceiptFile] = useState(null);
  const [uploading, setUploading] = useState(false);
  const [upErr, setUpErr] = useState('');
  const projectName = vendor || '미지정';
  const projOut = (data.outputs || []).find(o => String(o.id) === projectId) || null;
  const keepCov = (e.coveredBudgetIds || []).slice();
  const confirmAddVendor = () => { const v = newVendor.trim(); if (!v) return; if (allVendors.indexOf(v) < 0) setData(d => ({ ...d, vendors: [...(d.vendors || []), v] })); setVendor(v); setNewVendor(''); setAddingVendor(false); };
  const seg = (val, set, opts) => <div style={{ display: 'flex', gap: 6 }}>{opts.map(o => <button key={o} onClick={() => set(o)} style={{ flex: 1, padding: '8px 0', borderRadius: 8, border: 'none', cursor: 'pointer', fontSize: 12, fontWeight: 600, background: val === o ? G : '#E3E0DC', color: val === o ? 'white' : '#3A3631' }}>{o}</button>)}</div>;
  const pickReceipt = async file => {
    if (!file) return;
    setUploading(true); setUpErr('');
    try {
      const folderId = await driveDeepFolder(['라이프밀', '영수증', projectName || '미지정']);
      const r = await driveUploadFile(file, folderId);
      setReceiptUrl(r.link); setReceiptName(file.name); setReceiptFile(null);
    } catch (err) { setUpErr(err.message || '업로드 실패'); } finally { setUploading(false); }
  };
  const save = () => {
    if (!projectId) { alert('프로젝트를 선택하세요'); return; }
    if (!vendor) { alert('업체를 선택하세요'); return; }
    if (!amount || Number(amount) <= 0) { alert('결제 금액을 입력하세요'); return; }
    if (payMethod === '카드결제' && cards.length > 0 && !cardId) { alert('결제 카드를 선택하세요'); return; }
    const fields = { vendor, amount: Number(amount), payMethod, paidDate, projectId: Number(projectId), cardId: payMethod === '카드결제' && cardId ? Number(cardId) : null, coveredBudgetIds: keepCov, receiptUrl, receiptName, project: projectName, memo: memo.trim() };
    if (edit) setData(d => ({ ...d, payments: (d.payments || []).map(p => p.id === edit.id ? { ...p, ...fields } : p) }));
    else setData(d => ({ ...d, payments: [{ id: Date.now(), createdAt: TODAY, ...fields }, ...(d.payments || [])] }));
    onClose();
  };
  return (
    <ModalShell title={edit ? '실결제 수정' : '실결제 추가'} onClose={onClose}>
      <div>
        <Lbl c="프로젝트 (필수)" />
        <Sel value={projectId} onChange={setProjectId} ph="프로젝트 선택..." opts={(data.outputs || []).map(o => ({ v: o.id, l: outLabel(o) }))} />
        <div style={{ fontSize: 11, color: '#A29C95', marginTop: 5, lineHeight: 1.5 }}>이 결제는 선택한 프로젝트의 <b>업체별 사용내역</b>에 그대로 쌓입니다. 같은 업체라도 다른 프로젝트에는 절대 넘어가지 않아요.</div>
      </div>
      <div>
        <Lbl c="결제 업체 (필수)" />
        {addingVendor ? (
          <div style={{ display: 'flex', gap: 6 }}>
            <input value={newVendor} onChange={ev => setNewVendor(ev.target.value)} onKeyDown={ev => { if (ev.key === 'Enter') confirmAddVendor(); }} placeholder="새 업체명 입력" autoFocus style={{ flex: 1, padding: '9px 11px', borderRadius: 9, border: '1px solid #E3E0DC', fontSize: 13, boxSizing: 'border-box' }} />
            <button onClick={confirmAddVendor} style={{ padding: '0 14px', borderRadius: 9, border: 'none', background: G, color: 'white', cursor: 'pointer', fontSize: 12, fontWeight: 700 }}>추가</button>
            <button onClick={() => { setAddingVendor(false); setNewVendor(''); }} style={{ padding: '0 12px', borderRadius: 9, border: '1px solid #E3E0DC', background: 'white', color: '#6E6863', cursor: 'pointer', fontSize: 12 }}>취소</button>
          </div>
        ) : (
          <div style={{ display: 'flex', gap: 6 }}>
            <div style={{ flex: 1 }}><Sel value={vendor} onChange={setVendor} ph="업체 선택..." opts={allVendors.map(v => ({ v, l: v }))} /></div>
            <button onClick={() => setAddingVendor(true)} style={{ padding: '0 14px', borderRadius: 9, border: '1px dashed ' + G, background: 'white', color: G, cursor: 'pointer', fontSize: 12, fontWeight: 700, whiteSpace: 'nowrap' }}>+ 새 업체</button>
          </div>
        )}
        {allVendors.length === 0 && !addingVendor && <div style={{ fontSize: 11, color: '#A29C95', marginTop: 5 }}>등록된 업체가 없습니다. [+ 새 업체]로 추가하세요.</div>}
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}><div><Lbl c="실결제 금액 (원)" /><MoneyInput value={amount} onChange={setAmount} placeholder="실제 결제 금액" /></div><div><Lbl c="결제일" /><Inp type="date" value={paidDate} onChange={setPaidDate} /></div></div>
      <div><Lbl c="결제방법" />{seg(payMethod, setPayMethod, PAY_OPTS)}</div>
      {payMethod === '카드결제' && (
        <div>
          <Lbl c="결제 카드" />
          {cards.length === 0 ? <div style={{ fontSize: 11.5, color: '#B45309', background: '#FFFBEB', border: '1px solid #FDE68A', borderRadius: 9, padding: '9px 11px' }}>등록된 카드가 없습니다. 예산 탭 상단 [💳 카드 관리]에서 먼저 카드를 추가하세요.</div>
            : <Sel value={cardId} onChange={setCardId} ph="카드 선택..." opts={cards.map(c => ({ v: c.id, l: c.name + (c.issuer ? ' · ' + c.issuer : '') + (c.limit ? ' · 한도 ' + won(Number(c.limit)) : '') }))} />}
        </div>
      )}
      <div>
        <Lbl c="영수증" />
        {receiptUrl ? (
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, background: '#F5F4F2', border: '1px solid #A7F3D0', borderRadius: 9, padding: '8px 10px' }}>
            <span style={{ fontSize: 16 }}>🧾</span>
            <div style={{ flex: 1, fontSize: 12, fontWeight: 600, wordBreak: 'break-all' }}>{receiptName || '영수증'}</div>
            <a href={receiptUrl} target="_blank" rel="noreferrer" style={{ fontSize: 11, color: '#2D5FE0', fontWeight: 600, textDecoration: 'none' }}>열기</a>
            <button onClick={() => { setReceiptUrl(''); setReceiptName(''); }} style={{ border: 'none', background: 'none', color: '#E53935', cursor: 'pointer', fontSize: 12, fontWeight: 700 }}>제거</button>
          </div>
        ) : (<>
          <div onClick={() => { if (!uploading) document.getElementById('rcpt-input').click(); }} style={{ border: '2px dashed #D1D5DB', borderRadius: 10, padding: 18, textAlign: 'center', cursor: uploading ? 'default' : 'pointer', background: '#F5F4F2' }}>
            <div style={{ fontSize: 24, marginBottom: 4 }}>🧾</div>
            <div style={{ fontSize: 13, color: '#6E6863', fontWeight: 600 }}>{receiptFile ? receiptFile.name : '클릭해서 영수증 파일 선택'}</div>
            <div style={{ fontSize: 11, color: '#A29C95', marginTop: 3 }}>{receiptFile ? fmtSize(receiptFile.size) : '이미지 · PDF 등'}</div>
            <input id="rcpt-input" type="file" disabled={uploading} onChange={ev => { const f = ev.target.files && ev.target.files[0]; if (f) setReceiptFile(f); ev.target.value = ''; }} style={{ display: 'none' }} />
          </div>
          {receiptFile && (
            <div style={{ background: '#F5F4F2', borderRadius: 10, padding: 12, border: '1px solid #A7F3D0', marginTop: 8, display: 'flex', flexDirection: 'column', gap: 8 }}>
              <div style={{ fontSize: 11, color: '#6E6863' }}>드라이브 라이프밀/영수증/{projectName || '미지정'} 폴더에 저장됩니다 (처음 한 번 구글 로그인 필요)</div>
              {upErr ? <div style={{ fontSize: 11, color: '#E53935', background: '#FEF2F2', borderRadius: 8, padding: '7px 10px' }}>⚠ {upErr}</div> : null}
              <div style={{ display: 'flex', gap: 6 }}>
                <button onClick={() => pickReceipt(receiptFile)} disabled={uploading} style={{ flex: 1, padding: 11, background: uploading ? '#A29C95' : '#2D5FE0', color: 'white', border: 'none', borderRadius: 8, fontWeight: 700, fontSize: 13, cursor: uploading ? 'default' : 'pointer' }}>{uploading ? '업로드 중…' : '📤 드라이브에 업로드'}</button>
                {!uploading && <button onClick={() => { setReceiptFile(null); setUpErr(''); }} style={{ padding: '11px 14px', background: 'white', color: '#6E6863', border: '1px solid #E3E0DC', borderRadius: 8, fontWeight: 600, fontSize: 12, cursor: 'pointer' }}>취소</button>}
              </div>
            </div>
          )}
        </>)}
        <div style={{ fontSize: 11, color: '#A29C95', marginTop: 6 }}>※ 처음 한 번 구글 로그인이 필요해요.</div>
      </div>
      <div><Lbl c="비고 (선택)" /><Inp value={memo} onChange={setMemo} placeholder="메모" /></div>
      <div style={{ display: 'flex', gap: 8 }}><Btn onClick={save} style={{ flex: 1 }}>{edit ? '저장' : '추가'}</Btn><Btn v="secondary" onClick={onClose}>취소</Btn></div>
    </ModalShell>
  );
}

function DraftModal({ data, setData, onClose }) {
  const [start, setStart] = useState(addDays(TODAY, -14));
  const [end, setEnd] = useState(TODAY);
  const [checked, setChecked] = useState({});
  const [memos, setMemos] = useState({});
  const [markDone, setMarkDone] = useState(true);
  const [saving, setSaving] = useState(false);
  const [saveErr, setSaveErr] = useState('');
  const [savedLink, setSavedLink] = useState('');
  const items = (data.budgets || []).filter(b => b.status === '기안전' && b.date >= start && b.date <= end);
  const selected = items.filter(b => checked[b.id]);
  const total = selected.reduce((a, b) => a + itemTotal(b), 0);
  const make = () => {
    if (!selected.length) { alert('기안서에 포함할 항목을 선택하세요'); return; }
    const invalid = selected.find(b => b.payMethod === '세금계산서' && !(b.account || '').trim());
    if (invalid) { alert('입금계좌가 등록되지않아 기안서 작성이 불가능합니다'); return; }
    const heads = ['프로젝트명', '실행계획명', '세부항목', '업체', '금액', '결제방법', '입금계좌', '비고'];
    const rows = selected.map(b => { const n = budgetNames(data, b); return [n.project, n.plan, n.detail, b.vendor, won(itemTotal(b)), b.payMethod, b.account || '-', (memos[b.id] || '').trim() || '-']; });
    const w = window.open('', '_blank');
    if (!w) { alert('팝업이 차단되었습니다. 팝업 허용 후 다시 시도하세요.'); return; }
    const css = '@page{size:A4 landscape;margin:14mm}body{font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;color:#1A1614;padding:0}h1{font-size:18px;margin:0 0 4px}.sub{color:#6E6863;font-size:12px;margin-bottom:14px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{border:1px solid #999;padding:6px 8px;text-align:left;vertical-align:top}th{background:#1A1614;color:#fff}tfoot td{font-weight:700;background:#FFFFFF}@media print{.noprint{display:none}}';
    const body = '<h1>예산 기안서</h1><div class="sub">기간 ' + start + ' ~ ' + end + ' · 총 ' + selected.length + '건 · 합계 ' + won(total) + '</div><table><thead><tr>' + heads.map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') + '</tbody><tfoot><tr><td colspan="4">합계</td><td>' + won(total) + '</td><td colspan="3"></td></tr></tfoot></table><button class="noprint" onclick="window.print()" style="margin-top:18px;padding:9px 18px;border:none;border-radius:8px;background:#1A1614;color:#fff;font-weight:600;cursor:pointer">인쇄 / PDF로 저장</button>';
    w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>예산 기안서</title><style>' + css + '</style></head><body>' + body + '</body></html>');
    w.document.close();
    if (markDone) setData(d => ({ ...d, budgets: d.budgets.map(b => checked[b.id] ? { ...b, status: '기안완료', memo: (memos[b.id] || '').trim() } : b) }));
    onClose();
  };
  const buildDocHtml = () => {
    const heads = ['프로젝트명', '실행계획명', '세부항목', '업체', '금액', '결제방법', '입금계좌', '비고'];
    const th = heads.map(h => '<td style="background:#1A1614;color:#ffffff;font-weight:bold;padding:6px;">' + h + '</td>').join('');
    const trs = selected.map(b => { const n = budgetNames(data, b); const r = [n.project, n.plan, n.detail, b.vendor, won(itemTotal(b)), b.payMethod, b.account || '-', (memos[b.id] || '').trim() || '-']; return '<tr>' + r.map(c => '<td style="padding:6px;">' + String(c) + '</td>').join('') + '</tr>'; }).join('');
    return '<html><head><meta charset="utf-8"></head><body><h2>예산 기안서</h2><p>기간 ' + start + ' ~ ' + end + ' &middot; 총 ' + selected.length + '건 &middot; 합계 ' + won(total) + '</p><table border="1" cellspacing="0" cellpadding="6" style="border-collapse:collapse;font-size:11px;width:100%;"><tr>' + th + '</tr>' + trs + '<tr><td colspan="4" style="font-weight:bold;padding:6px;">합계</td><td style="font-weight:bold;padding:6px;">' + won(total) + '</td><td colspan="3"></td></tr></table></body></html>';
  };
  const saveToDrive = async () => {
    if (!selected.length) { alert('기안서에 포함할 항목을 선택하세요'); return; }
    const invalid = selected.find(b => b.payMethod === '세금계산서' && !(b.account || '').trim());
    if (invalid) { alert('입금계좌가 등록되지않아 기안서 작성이 불가능합니다'); return; }
    setSaving(true); setSaveErr(''); setSavedLink('');
    try {
      const folderId = await driveBaseFolder('기안서');
      const r = await driveSaveDraftPdf(buildDocHtml(), '예산기안서_' + start + '_' + end, folderId);
      setSavedLink(r.pdfLink);
      if (markDone) setData(d => ({ ...d, budgets: d.budgets.map(b => checked[b.id] ? { ...b, status: '기안완료', memo: (memos[b.id] || '').trim() } : b) }));
    } catch (e) { setSaveErr(e.message || '저장 실패'); } finally { setSaving(false); }
  };
  return (
    <ModalShell title="기안서 만들기" onClose={onClose}>
      <div><Lbl c="기안서를 만들 기간을 선택하세요" /><div style={{ display: 'grid', gridTemplateColumns: '1fr auto 1fr', alignItems: 'center', gap: 8 }}><Inp type="date" value={start} onChange={setStart} /><span style={{ color: '#A29C95' }}>~</span><Inp type="date" value={end} onChange={setEnd} /></div></div>
      <div>
        <div style={{ fontSize: 12, fontWeight: 700, color: G, marginBottom: 8 }}>기안전 예산 ({items.length}건)</div>
        {!items.length ? <div style={{ fontSize: 12, color: '#A29C95', padding: '12px 0' }}>선택한 기간에 기안전 상태의 예산이 없습니다.</div> : null}
        {items.map(b => { const n = budgetNames(data, b); const on = !!checked[b.id]; const noAcc = b.payMethod === '세금계산서' && !(b.account || '').trim(); return (
          <div key={b.id} style={{ border: '1px solid #EDEBE7', borderRadius: 10, padding: 10, marginBottom: 8, background: on ? '#F6FBF7' : 'white' }}>
            <div onClick={() => setChecked({ ...checked, [b.id]: !on })} style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer' }}>
              <Chk on={on} />
              <div style={{ flex: 1 }}><div style={{ fontSize: 12, fontWeight: 600 }}>{n.detail} <span style={{ color: '#A29C95', fontWeight: 400 }}>· {b.vendor}</span></div><div style={{ fontSize: 11, color: '#6E6863' }}>{n.project} · {won(itemTotal(b))} · {b.payMethod}{noAcc ? ' · ⚠ 입금계좌 없음' : ''}</div></div>
              <span style={{ fontSize: 11, color: '#A29C95' }}>{b.date.slice(5)}</span>
            </div>
            {on ? (<div style={{ marginTop: 8 }}><input value={memos[b.id] || ''} onChange={e => setMemos({ ...memos, [b.id]: e.target.value })} placeholder="비고 입력 (선택)" style={{ width: '100%', padding: '7px 9px', borderRadius: 8, border: '1px solid #E3E0DC', fontSize: 12, boxSizing: 'border-box' }} />{noAcc ? <div style={{ fontSize: 11, color: '#E53935', marginTop: 4 }}>※ 세금계산서인데 입금계좌가 없습니다 — 예산 수정에서 먼저 등록하세요.</div> : null}</div>) : null}
          </div>); })}
      </div>
      {selected.length ? <div style={{ fontSize: 12, color: '#3A3631', fontWeight: 600 }}>선택 {selected.length}건 · 합계 {won(total)}</div> : null}
      <label style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12, color: '#3A3631', cursor: 'pointer' }}><input type="checkbox" checked={markDone} onChange={e => setMarkDone(e.target.checked)} /> 기안서 생성 후 선택 항목을 '기안완료'로 변경</label>
      {savedLink ? <div style={{ background: '#F5F4F2', border: '1px solid #A7F3D0', borderRadius: 10, padding: '10px 12px', fontSize: 12, color: G }}>✅ 라이프밀/기안서 폴더에 저장됐어요. <a href={savedLink} target="_blank" rel="noreferrer" style={{ color: '#2D5FE0', fontWeight: 700, textDecoration: 'none' }}>PDF 열기 →</a></div> : null}
      {saveErr ? <div style={{ background: '#FEF2F2', borderRadius: 10, padding: '10px 12px', fontSize: 12, color: '#E53935' }}>⚠ {saveErr}</div> : null}
      <div style={{ fontSize: 11, color: '#A29C95' }}>※ 처음 한 번 구글 로그인이 필요해요. 드라이브 라이프밀/기안서 폴더에 PDF로 저장됩니다.</div>
      <div style={{ display: 'flex', gap: 8 }}><Btn v="gold" onClick={saveToDrive} disabled={saving} style={{ flex: 1 }}>{saving ? '저장 중…' : '📤 드라이브에 저장 (PDF)'}</Btn><Btn v="secondary" onClick={make}>🖨 인쇄</Btn><Btn v="secondary" onClick={onClose}>닫기</Btn></div>
    </ModalShell>
  );
}

    if (edit) setData(d => ({ ...d, budgets: d.budgets.map(b => b.id === edit.id ? { ...b, ...fields } : b) }));
    else setData(d => ({ ...d, nid: d.nid + 1, budgets: [...(d.budgets || []), { id: d.nid + 1, subplanId: null, checklistId: null, memo: '', ...fields }] }));

  return (
    <ModalShell title={edit ? '예산 수정' : '예산 추가'} onClose={onClose}>
      <div><Lbl c="출력 프로젝트" /><Sel value={outId} onChange={v => { setOutId(v); setPlanId(''); }} ph="선택..." opts={data.outputs.map(o => ({ v: o.id, l: o.code + ' · ' + o.name }))} /></div>
      <div><Lbl c="실행계획 (선택)" /><Sel value={planId} onChange={setPlanId} ph="선택..." opts={plans.map(p => ({ v: p.id, l: p.name }))} /></div>
      <div><Lbl c="구분" />{seg(kind, setKind, ['일반', '정기'])}</div>

            <button onClick={confirmAddVendor} style={{ padding: '0 14px', borderRadius: 9, border: 'none', background: G, color: 'white', cursor: 'pointer', fontSize: 12, fontWeight: 700 }}>추가</button>
            <button onClick={() => { setAddingVendor(false); setNewVendor(''); }} style={{ padding: '0 12px', borderRadius: 9, border: '1px solid #E3E0DC', background: 'white', color: '#6E6863', cursor: 'pointer', fontSize: 12 }}>취소</button>
          </div>
        ) : (
          <div style={{ display: 'flex', gap: 6 }}>
            <div style={{ flex: 1 }}><Sel value={vendor} onChange={setVendor} ph="업체 선택..." opts={allVendors.map(v => ({ v, l: v }))} /></div>
            <button onClick={() => setAddingVendor(true)} style={{ padding: '0 14px', borderRadius: 9, border: '1px dashed ' + G, background: 'white', color: G, cursor: 'pointer', fontSize: 12, fontWeight: 700, whiteSpace: 'nowrap' }}>+ 새 업체</button>
          </div>
        )}
        {allVendors.length === 0 && !addingVendor && <div style={{ fontSize: 11, color: '#A29C95', marginTop: 5 }}>등록된 업체가 없습니다. [+ 새 업체]로 추가하세요.</div>}
      </div>
      <div><Lbl c="예상 금액 (원)" /><MoneyInput value={amount} onChange={setAmount} placeholder="공급가" /></div>

        </div>

      {status === '결제완료' && <div style={{ background: '#ECFDF5', borderRadius: 10, padding: 12, border: '1px solid #A7F3D0' }}><div style={{ fontSize: 12, fontWeight: 700, color: '#1FA463', marginBottom: 8 }}>✓ 결제 완료 정보</div><div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}><div><Lbl c="결제 완료일" /><Inp type="date" value={paidDate} onChange={setPaidDate} /></div><div><Lbl c="실결제 금액 (선택)" /><MoneyInput value={paidAmount} onChange={setPaidAmount} placeholder="비우면 예상금액 사용" /></div></div><div style={{ fontSize: 11, color: '#6E6863', marginTop: 6 }}>※ 결제완료일 기준으로 월 집계 및 날짜별 표시가 반영됩니다.</div></div>}

    </ModalShell>
  );

function CardManagerModal({ data, setData, onClose }) {
  const cards = data.cards || [];
  const budgets = data.budgets || [];
  const payments = data.payments || [];
  const [name, setName] = useState('');
  const [issuer, setIssuer] = useState('');
  const [limit, setLimit] = useState('');
  const [editId, setEditId] = useState(null);
  const usedCnt = id => payments.filter(p => String(p.cardId) === String(id)).length + budgets.filter(b => String(b.cardId) === String(id)).length;
  const usedSum = id => payments.filter(p => String(p.cardId) === String(id)).reduce((a, p) => a + (Number(p.amount) || 0), 0);
  const reset = () => { setName(''); setIssuer(''); setLimit(''); setEditId(null); };
  const submit = () => {
    const nm = name.trim(); if (!nm) { alert('카드명을 입력하세요'); return; }
    const lim = limit === '' ? null : Number(limit);
    if (editId) { setData(d => ({ ...d, cards: (d.cards || []).map(c => c.id === editId ? { ...c, name: nm, issuer: issuer.trim(), limit: lim } : c) })); reset(); return; }
    if (cards.some(c => c.name === nm)) { alert('이미 있는 카드명입니다'); return; }
    setData(d => ({ ...d, cards: [...(d.cards || []), { id: Date.now(), name: nm, issuer: issuer.trim(), limit: lim }] }));
    reset();
  };
  const startEdit = c => { setEditId(c.id); setName(c.name || ''); setIssuer(c.issuer || ''); setLimit(c.limit != null ? String(c.limit) : ''); };
  const removeCard = c => { if (usedCnt(c.id) > 0) { alert('이 카드로 등록된 기안·실결제가 있어 삭제할 수 없습니다.\n먼저 해당 기록의 카드를 바꿔주세요.'); return; } if (!confirm('"' + c.name + '" 카드를 삭제할까요?')) return; setData(d => ({ ...d, cards: (d.cards || []).filter(x => x.id !== c.id) })); if (editId === c.id) reset(); };
  return (
    <ModalShell title="💳 카드 관리" onClose={onClose}>
      <div style={{ fontSize: 12, color: '#6E6863', lineHeight: 1.5 }}>기안 작성·실결제에서 <b>카드결제</b>를 고르면 여기 등록한 카드를 선택할 수 있어요. 월 한도를 넣으면 [📊 카드별 사용내역]에서 <b>사용가능금액</b>이 계산됩니다.</div>
      <div style={{ background: '#FAFAF9', border: '1px solid #EDEBE7', borderRadius: 10, padding: 11, display: 'flex', flexDirection: 'column', gap: 8 }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: G }}>{editId ? '✏️ 카드 수정' : '+ 새 카드 등록'}</div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
          <div><Lbl c="카드명 (필수)" /><Inp value={name} onChange={setName} placeholder="예) 법인카드 1234" /></div>
          <div><Lbl c="카드사 (선택)" /><Inp value={issuer} onChange={setIssuer} placeholder="예) 신한 / 하나" /></div>
        </div>
        <div><Lbl c="월 한도 (선택)" /><MoneyInput value={limit} onChange={setLimit} placeholder="비우면 한도 없음" /></div>
        <div style={{ display: 'flex', gap: 8 }}><Btn onClick={submit} style={{ flex: 1 }}>{editId ? '저장' : '+ 추가'}</Btn>{editId ? <Btn v="secondary" onClick={reset}>취소</Btn> : null}</div>
      </div>
      {cards.length === 0 ? <div style={{ fontSize: 12, color: '#A29C95', padding: '16px 0', textAlign: 'center' }}>등록된 카드가 없습니다</div> : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 6, maxHeight: 320, overflowY: 'auto' }}>
          {cards.map(c => { const cnt = usedCnt(c.id), sum = usedSum(c.id); return (
            <div key={c.id} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '9px 11px', background: '#F8F7F5', border: '1px solid #E3E0DC', borderRadius: 9 }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
                  <span style={{ fontSize: 13, fontWeight: 700, color: '#1A1614' }}>💳 {c.name}</span>
                  {c.issuer ? <span style={{ fontSize: 10, color: '#6E6863', background: '#EDEBE7', borderRadius: 5, padding: '1px 6px' }}>{c.issuer}</span> : null}
                  {cnt === 0 ? <span style={{ fontSize: 9, fontWeight: 700, color: '#8A8580', background: '#F5F4F2', border: '1px solid #E3E0DC', borderRadius: 5, padding: '1px 6px' }}>사용 안 함</span> : null}
                </div>
                <div style={{ fontSize: 10.5, color: '#A29C95', marginTop: 2 }}>{c.limit ? '월 한도 ' + won(Number(c.limit)) : '한도 미설정'}{cnt > 0 ? ' · 사용 ' + cnt + '건 · 누적 ' + won(sum) : ''}</div>
              </div>
              <button onClick={() => startEdit(c)} style={{ border: '1px solid #E3E0DC', background: 'white', color: '#6E6863', borderRadius: 6, cursor: 'pointer', fontSize: 10.5, fontWeight: 700, padding: '4px 9px' }}>수정</button>
              <button onClick={() => removeCard(c)} style={{ border: '1px solid ' + (cnt > 0 ? '#E3E0DC' : '#FCA5A5'), background: 'white', color: cnt > 0 ? '#C4BFB9' : '#E53935', borderRadius: 6, cursor: 'pointer', fontSize: 10.5, fontWeight: 700, padding: '4px 9px' }}>🗑</button>
            </div>
          ); })}
        </div>
      )}
      <div style={{ display: 'flex', gap: 8 }}><Btn v="secondary" onClick={onClose} style={{ flex: 1 }}>닫기</Btn></div>
    </ModalShell>
  );
}

function CardUsageModal({ data, monthKey, onClose }) {
  const cards = data.cards || [];
  const payments = data.payments || [];
  const [allTime, setAllTime] = useState(false);
  const [open, setOpen] = useState({});
  const inRange = p => allTime ? true : ((p.paidDate || '').slice(0, 7) === monthKey);
  const cardPays = payments.filter(p => inRange(p) && (p.payMethod === '카드결제' || p.cardId));
  const rows = cards.map(c => {
    const list = cardPays.filter(p => String(p.cardId) === String(c.id)).sort((a, b) => (b.paidDate || '') < (a.paidDate || '') ? -1 : 1);
    const used = list.reduce((a, p) => a + (Number(p.amount) || 0), 0);
    const lim = c.limit != null && c.limit !== '' ? Number(c.limit) : null;
    return { c: c, list: list, used: used, lim: lim, left: lim != null ? lim - used : null, pct: lim ? Math.min(100, Math.round(used / lim * 100)) : (used > 0 ? 100 : 0) };
  }).sort((a, b) => b.used - a.used);
  const noCard = cardPays.filter(p => !p.cardId).sort((a, b) => (b.paidDate || '') < (a.paidDate || '') ? -1 : 1);
  const noCardSum = noCard.reduce((a, p) => a + (Number(p.amount) || 0), 0);
  const totalUsed = rows.reduce((a, r) => a + r.used, 0) + noCardSum;
  const totalLimit = rows.reduce((a, r) => a + (r.lim || 0), 0);
  const payRow = p => { const po = (data.outputs || []).find(o => String(o.id) === String(p.projectId)); return (
    <div key={p.id} style={{ display: 'flex', alignItems: 'center', gap: 7, flexWrap: 'wrap', fontSize: 11.5, background: '#FAFAF9', border: '1px solid #F0EEEB', borderRadius: 8, padding: '6px 9px' }}>

                </div>
                <button onClick={() => setAppr(p.id, null)} style={{ marginTop: 7, fontSize: 10, color: '#8A8580', background: 'none', border: 'none', cursor: 'pointer', textDecoration: 'underline', padding: 0 }}>승인 취소</button>
              </div>
            ) : null}
            {rejected ? <div style={{ marginTop: 8, display: 'flex', alignItems: 'center', gap: 8 }}><span style={{ fontSize: 11, color: '#8A8580' }}>반려됨</span><button onClick={() => setAppr(p.id, null)} style={{ fontSize: 10, color: '#2563EB', background: 'none', border: 'none', cursor: 'pointer', textDecoration: 'underline', padding: 0 }}>되돌리기</button></div> : null}
          </div>
        );
      })}
      {proposals.map(pr => {
        const s = stOf(pr.id); const approved = s === 'approved', rejected = s === 'rejected';
        return (
          <div key={pr.id} style={{ border: '1px dashed ' + (approved ? '#6EE7B7' : '#C9B896'), background: approved ? '#F6FEFB' : '#FFFDF6', borderRadius: 10, padding: 11, marginBottom: 8, opacity: rejected ? 0.55 : 1 }}>
            <div style={{ fontSize: 12.5, fontWeight: 700, color: '#92400E' }}>💡 {pr.lineName} 라인 광고그룹 생성 제안</div>
            {pr.keywords && pr.keywords.length ? <div style={{ fontSize: 11, color: '#6E6863', marginTop: 4 }}>키워드: {pr.keywords.join(', ')}</div> : null}
            {pr.evidence ? <div style={{ fontSize: 11, color: '#6E6863', marginTop: 3, lineHeight: 1.5 }}>📊 {pr.evidence}</div> : null}
            {!s ? <div style={{ display: 'flex', gap: 6, marginTop: 9 }}><button onClick={() => setAppr(pr.id, 'approved')} style={okBtn}>승인(생성 예정)</button><button onClick={() => setAppr(pr.id, 'rejected')} style={noBtn}>반려</button></div> :
              <div style={{ marginTop: 8, display: 'flex', alignItems: 'center', gap: 8 }}><span style={{ fontSize: 11, fontWeight: 700, color: approved ? '#047857' : '#8A8580' }}>{approved ? '✓ 승인 — 광고그룹 생성 대상' : '반려됨'}</span><button onClick={() => setAppr(pr.id, null)} style={{ fontSize: 10, color: '#2563EB', background: 'none', border: 'none', cursor: 'pointer', textDecoration: 'underline', padding: 0 }}>{approved ? '취소' : '되돌리기'}</button></div>}
          </div>
        );
      })}
    </div>
  );
}

function ShoppingProposalPanel({ data, setData }) {
  const [sp, setSp] = React.useState(null);
  const [status, setStatus] = React.useState('loading');
  const [later, setLater] = React.useState({});   // [나중에] — 화면에서만 접음(안 씀)
  React.useEffect(() => {
    let alive = true;
    ghFetch('data/shopping-proposals.json')
      .then(r => (r.ok ? r.json() : null))
      .then(j => { if (!alive) return; if (j && Array.isArray(j.cards)) { setSp(j); setStatus('ok'); } else setStatus('none'); })
      .catch(() => { if (alive) setStatus('none'); });
    return () => { alive = false; };
  }, []);
  const appr = data.shoppingApprovals || {};
  // [승인] — 규약(#39): 이 세 필드만 쓴다(파워링크 bidApprovals 와 동일). 5분 모터가 읽어 반영.
  const approve = c => setData(d => ({ ...d, shoppingApprovals: { ...(d.shoppingApprovals || {}), [c.id]: { status: 'approved', approvedAt: new Date().toISOString(), by: '유니' } } }));
  const cancel = id => setData(d => { const a = { ...(d.shoppingApprovals || {}) }; delete a[id]; return { ...d, shoppingApprovals: a }; });
  const won = n => (n == null ? '' : Number(n).toLocaleString() + '원');
  const SEV = { high: { bg: '#FEF2F2', bd: '#FECACA', tx: '#DC2626', l: '중요' }, mid: { bg: '#FFFBEB', bd: '#FDE68A', tx: '#B45309', l: '권장' }, low: { bg: '#F5F4F2', bd: '#E3E0DC', tx: '#6E6863', l: '참고' } };
  const TY = { budget: { l: '예산', c: '#2563EB' }, product_drop: { l: '상품 빼기', c: '#DC2626' }, product_check: { l: '상품 점검', c: '#B45309' }, keyword_harvest: { l: '검색어', c: '#047857' } };
  const AUTO = { budget: 1, product_drop: 1 };   // 승인 시 5분 모터가 계정에 반영하는 유형
  const cards = sp && Array.isArray(sp.cards) ? sp.cards : [];
  const shown = cards.filter(c => !later[c.id]);
  const rules = (sp && sp.rules) || {};
  return (
    <Card style={{ marginTop: 16 }}>
      <div data-ss-panel style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10, flexWrap: 'wrap' }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: G }}>🛒 쇼핑검색 최적화</div>
        <span style={{ fontSize: 11, color: '#A29C95' }}>매일 올라오는 카드 · [승인]하면 5분 안에 반영(예산·상품 빼기), 점검·검색어는 사람이 반영</span>
        {sp ? <span style={{ marginLeft: 'auto', fontSize: 11, color: '#A29C95' }}>{sp.basedOn ? sp.basedOn + ' 기준' : ''}{sp.updatedAt ? ' · 갱신 ' + String(sp.updatedAt).slice(0, 16).replace('T', ' ') : ''}</span> : null}
      </div>
      {status === 'loading' ? <div style={{ fontSize: 12, color: '#A29C95', padding: '10px 0' }}>불러오는 중…</div> : null}
      {(status === 'none' || (status === 'ok' && cards.length === 0)) ? <div data-ss-empty style={{ fontSize: 12, color: '#6E6863', background: '#F5F4F2', border: '1px solid #E3E0DC', borderRadius: 8, padding: '12px 14px', lineHeight: 1.6 }}>오늘 올라온 쇼핑검색 카드가 없습니다. 자동화PC가 <b>data/shopping-proposals.json</b> 을 올리면 여기 4단 카드가 나타납니다. <span style={{ color: '#A29C95' }}>(없음 — 오류가 아닙니다)</span></div> : null}
      {status === 'ok' && cards.length > 0 ? (
        <React.Fragment>
          {shown.length === 0 ? <div style={{ fontSize: 12, color: '#6E6863', marginBottom: 6 }}>오늘 카드는 다 넘겼습니다. 넘긴 카드는 내일 다시 올라옵니다.</div> : null}
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {shown.map(c => {
              const sev = SEV[c.severity] || SEV.low;
              const ty = TY[c.type] || { l: c.type || '', c: '#6E6863' };
              const ap = appr[c.id];
              const isApproved = ap && (ap.status === 'approved' || ap.status === 'applied' || !!ap.appliedAt);
              const isApplied = ap && (ap.status === 'applied' || !!ap.appliedAt);
              const isAuto = !!AUTO[c.type];
              const row = (label, val, strong) => val ? (
                <div style={{ display: 'flex', gap: 8, fontSize: 12.5, lineHeight: 1.55, marginTop: 4 }}>
                  <span style={{ flexShrink: 0, width: 62, color: '#A29C95', fontWeight: 700 }}>{label}</span>
                  <span style={{ flex: 1, minWidth: 0, color: strong ? '#1A1614' : '#3A3631', fontWeight: strong ? 700 : 400 }}>{val}</span>
                </div>
              ) : null;
              return (
                <div key={c.id} data-ss-card={c.id} style={{ border: '1px solid ' + sev.bd, borderLeft: '3px solid ' + sev.tx, borderRadius: 10, padding: '11px 13px', background: 'white' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 7, flexWrap: 'wrap', marginBottom: 4 }}>
                    <span style={{ fontSize: 13.5, fontWeight: 800, color: '#1A1614' }}>{c.title}</span>
                    <span style={{ fontSize: 10.5, fontWeight: 800, color: ty.c, background: '#F5F4F2', border: '1px solid #E3E0DC', borderRadius: 6, padding: '1px 7px' }}>{ty.l}</span>
                    <span data-ss-status={c.status} style={{ fontSize: 10.5, fontWeight: 800, color: sev.tx, background: sev.bg, border: '1px solid ' + sev.bd, borderRadius: 6, padding: '1px 7px' }}>{c.status}</span>
                    {isApproved ? <span data-ss-approved={c.id} style={{ fontSize: 10.5, fontWeight: 800, color: '#047857', background: '#D1FAE5', border: '1px solid #6EE7B7', borderRadius: 6, padding: '1px 7px' }}>{isApplied ? '✅ 적용됨' : '✅ 승인됨'}{(ap.appliedAt || ap.approvedAt) ? ' · ' + String(ap.appliedAt || ap.approvedAt).slice(0, 10) : ''}</span> : null}
                  </div>
                  {row('이렇게', c.action, true)}
                  {row('왜냐하면', c.reason)}
                  {row('효율근거', c.evidence)}
                  {row('다음스텝', c.nextStep)}
                  {isApproved ? (
                    <div style={{ marginTop: 9 }}>
                      <button data-ss-cancel={c.id} onClick={() => cancel(c.id)} style={{ padding: '5px 12px', borderRadius: 8, border: '1px solid #E3E0DC', background: 'white', color: '#6E6863', fontWeight: 700, fontSize: 12, cursor: 'pointer', fontFamily: 'inherit' }}>취소</button>
                      <span style={{ fontSize: 11, color: '#A29C95', marginLeft: 8 }}>{isAuto ? '5분 모터가 아직 안 돌았으면 취소돼요.' : '점검·검색어는 사람이 반영합니다.'}</span>
                    </div>
                  ) : (
                    <div style={{ marginTop: 9, display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
                      <button data-ss-approve={c.id} onClick={() => approve(c)} style={{ padding: '7px 16px', borderRadius: 8, border: 'none', background: G, color: 'white', fontWeight: 800, fontSize: 13, cursor: 'pointer', fontFamily: 'inherit' }}>승인</button>
                      <button data-ss-later={c.id} onClick={() => setLater(o => ({ ...o, [c.id]: 1 }))} style={{ padding: '7px 14px', borderRadius: 8, border: '1px solid #E3E0DC', background: 'white', color: '#6E6863', fontWeight: 700, fontSize: 13, cursor: 'pointer', fontFamily: 'inherit' }}>나중에</button>
                      <span style={{ fontSize: 11, color: '#A29C95' }}>{isAuto ? '승인 시 5분 안에 계정에 반영돼요 · [나중에]는 안 눌러도 내일 다시 올라와요' : '승인은 기록만 — 계정은 사람이 반영해요'}</span>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
          <div style={{ fontSize: 10.5, color: '#A29C95', marginTop: 10, lineHeight: 1.55 }}>목표 ROAS {rules.targetRoas || 330}% · 판정 표본 클릭 {rules.clickGate || 30}회. 승인은 자동화PC의 <b>shoppingApprovals</b>로 넘어가고, 예산·상품 빼기는 5분 모터가 계정에 반영합니다(점검·검색어는 사람 몫). [나중에]는 아무것도 저장하지 않고 다음날 다시 올라옵니다.</div>
        </React.Fragment>
      ) : null}
    </Card>
  );
}

            {rejId === ins.id ? <div style={{ marginTop: 8 }}><input value={rejReason} onChange={e => setRejReason(e.target.value)} placeholder="반려 사유 (예: 계절성/일시적)" style={{ width: '100%', boxSizing: 'border-box', fontSize: 11.5, padding: '6px 8px', border: '1px solid #E3E0DC', borderRadius: 7 }} /><div style={{ display: 'flex', gap: 6, marginTop: 6 }}><button onClick={() => { setFb(ins.id, 'rejected', rejReason, ins.title); setRejId(null); setRejReason(''); }} style={{ fontSize: 11, fontWeight: 700, padding: '5px 12px', borderRadius: 6, border: 'none', background: '#E53935', color: 'white', cursor: 'pointer' }}>반려 저장</button><button onClick={() => { setRejId(null); setRejReason(''); }} style={{ fontSize: 11, padding: '5px 10px', borderRadius: 6, border: '1px solid #E3E0DC', background: 'white', color: '#6E6863', cursor: 'pointer' }}>취소</button></div></div> : <div style={{ display: 'flex', gap: 6, marginTop: 8, alignItems: 'center' }}>{appr ? <span style={{ fontSize: 10.5, fontWeight: 700, color: '#1FA463' }}>✓ 승인됨</span> : <button onClick={() => setFb(ins.id, 'approved', '', ins.title)} style={{ fontSize: 11, fontWeight: 700, padding: '5px 12px', borderRadius: 6, border: '1px solid #A7F3D0', background: '#ECFDF5', color: '#1FA463', cursor: 'pointer' }}>승인</button>}<button onClick={() => { setRejId(ins.id); setRejReason(''); }} style={{ fontSize: 11, fontWeight: 700, padding: '5px 12px', borderRadius: 6, border: '1px solid #E3E0DC', background: 'white', color: '#E53935', cursor: 'pointer' }}>반려</button></div>}

        <svg width={W} height={H} style={{ display: 'block' }}>
          {buckets.map((b, i) => { const x = padL + i * (bw + gap); let yAcc = H - padB; return (<g key={b.key}>{L1ORDER.map(l1 => { const v = b.l1v[l1] || 0; if (!v) return null; const h = (v / maxV) * (H - padB - padT); yAcc -= h; return <rect key={l1} x={x} y={yAcc} width={bw} height={Math.max(0, h)} fill={L1COLOR[l1] || '#CBC4BA'} />; })}<text x={x + bw / 2} y={H - padB + 12} textAnchor="middle" fontSize="8" fill="#A29C95">{blab(b.key)}</text></g>); })}

          {showConv ? buckets.map((b, i) => { const x = padL + i * (bw + gap) + bw / 2; const cv = b.total ? b.orders / b.total * 100 : 0; const y = padT + (1 - cv / maxConv) * (H - padB - padT); return <circle key={'c' + b.key} cx={x} cy={y} r="2.2" fill="#1A1614" />; }) : null}

              <td style={tdR}>{num(R.v)}</td><td style={tdR}>{pctS(R.v ? R.o / R.v * 100 : 0)}</td><td style={tdR}>{num(R.o)}</td>

              <td style={tdR}>{num(k.v)}</td><td style={tdR}>{pctS(k.v ? k.o / k.v * 100 : 0)}</td><td style={tdR}>{num(k.o)}</td>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(150px,1fr))', gap: 8, marginBottom: 16 }}>
        {GROUPS.map(gr => { const c = cur.byGroup[gr[0]] || { v: 0, o: 0 }; const pv = (pri.byGroup[gr[0]] || { v: 0 }).v; const conv = c.v ? c.o / c.v * 100 : 0; const d = (hasPri && !cmpSuppressed) ? gd(c.v, pv) : null; return <div key={gr[0]} style={{ border: '1px solid #EDEBE7', borderLeft: '4px solid ' + gr[1], borderRadius: 9, padding: '9px 11px' }}><div style={{ fontSize: 12, fontWeight: 800, color: gr[1] }}>{gr[0]}</div><div style={{ fontSize: 9, color: '#A29C95', margin: '1px 0 5px', lineHeight: 1.35, minHeight: 22 }}>{gr[2]}</div><div style={{ display: 'flex', alignItems: 'baseline', gap: 5 }}><div style={{ fontSize: 15, fontWeight: 800, color: G }}>{num(c.v)}</div><div style={{ fontSize: 9, color: '#6E6863' }}>방문</div>{d == null ? null : <div style={{ fontSize: 10, fontWeight: 700, marginLeft: 'auto', color: d >= 0 ? '#1FA463' : '#DC2626' }}>{d >= 0 ? '▲' : '▼'}{Math.abs(d)}%</div>}</div><div style={{ fontSize: 10.5, color: '#6E6863' }}>전환 {pctS(conv)} · 결제 {num(c.o)}</div></div>; })}
      </div>

      {vcTot ? <React.Fragment>
        <Sub n="6" t="고객 요약 (기간합계·보조)" d={'순인원 기준 · ' + periodLabel + ' · 고객수는 전체만 신뢰(경로별 합산 금지)'} />
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(110px,1fr))', gap: 8 }}>

        </div>
      </React.Fragment> : null}
    </Card>
  );
}

  const vNavTo = ds => { if (!ds) return; const k = visitKeyOf(vMode === 'custom' ? 'day' : vMode, ds); const ix = vKeys.indexOf(k); if (ix >= 0) setVIdx(vKeys.length - 1 - ix); };

  const OC = metric === 'a14' ? 'a14_order_count' : 'lc_order_count', REV = metric === 'a14' ? 'a14_revenue' : 'lc_revenue';
  const won = n => (Math.round(Number(n) || 0)).toLocaleString() + '원', num = n => (Math.round(Number(n) || 0)).toLocaleString(), pctS = n => (Math.round((Number(n) || 0) * 1000) / 10) + '%';
  const UNID = ['기타', '(알수없음)', '알수없음', '웹사이트', '(direct)', '(not set)'];
  const sf = (arr, f) => arr.reduce((s, r) => s + (Number(r[f]) || 0), 0);
  const delta = (cur, prev) => (!prev ? null : (cur - prev) / prev);
  const isUnid = r => UNID.includes((r.channel_name_raw || '').trim()) || UNID.includes((r.channel_class_l1 || '').trim()) || UNID.includes((r.channel_group_raw || '').trim());
  const groupBy = (arr, keyFn) => { const m = {}; arr.forEach(r => { const k = keyFn(r); (m[k] = m[k] || []).push(r); }); return m; };
  const pk = r => r.period_label || r.period_end || r.date || '?';
  const spanDays = p => (p.start && p.end) ? (new Date(p.end) - new Date(p.start)) / 86400000 : 0;
  const isBaseP = p => (p.role === 'baseline') || /기준|baseline|추세|평균/i.test(p.label || '') || spanDays(p) > 21;
  const pMap = {}; chD.forEach(r => { const k = pk(r); if (!pMap[k]) pMap[k] = { label: k, start: r.period_start, end: r.period_end || r.date, prov: !!r.is_provisional, role: r.period_role }; });
  const periods = Object.values(pMap);
  const baseP = periods.find(isBaseP);
  const nonBase = periods.filter(p => !isBaseP(p)).sort((a, b) => (b.end || '').localeCompare(a.end || ''));
  const curP = periods.find(p => p.role === 'current') || nonBase[0];
  const priP = periods.find(p => p.role === 'prior') || nonBase.filter(p => p !== curP)[0];
  const rowsIn = (arr, p) => p ? arr.filter(r => pk(r) === p.label) : [];
  const ch1 = rowsIn(chD, curP), ch0 = rowsIn(chD, priP);
  const totVisit = sf(ch1, 'visit_count'), unidVisit = sf(ch1.filter(isUnid), 'visit_count');
  const idRate = totVisit ? (totVisit - unidVisit) / totVisit : 0;
  const cuVisit1 = sf(rowsIn(cuD, curP), 'visit_count');
  const captureRate = totVisit ? cuVisit1 / totVisit : 0;
  const kpi = arr => ({ visit: sf(arr, 'visit_count'), rev: sf(arr, REV), ord: sf(arr, OC), spend: sf(arr, 'ad_spend') });
  const k1 = kpi(ch1), k0 = kpi(ch0);
  const chanKey = r => (r.channel_name_raw || r.channel_group_raw || '(미지정)');
  const g1 = groupBy(ch1, chanKey), g0 = groupBy(ch0, chanKey);
  const chanRows = Object.keys(g1).map(k => { const cur = g1[k], prev = g0[k] || []; const visit = sf(cur, 'visit_count'), rv = sf(cur, REV), ord = sf(cur, OC); const pv = sf(prev, 'visit_count'), prv = sf(prev, REV); return { k, visit, rv, ord, dvisit: delta(visit, pv), drev: delta(rv, prv), cvr: visit ? ord / visit : 0, rpv: visit ? rv / visit : 0, l1: (cur[0] || {}).channel_class_l1 }; }).sort((a, b) => b.rv - a.rv);
  const cuKey = r => [r.nt_source, r.nt_medium, r.nt_detail, r.nt_keyword].filter(Boolean).join(' / ') || '(미지정)';
  const cuG = groupBy(rowsIn(cuD, curP), cuKey);
  const cuRows = Object.keys(cuG).map(k => { const cur = cuG[k], r0 = cur[0] || {}; return { k, campaign: r0.campaign_name, placement: r0.placement_name, creative: r0.creative_name, owner: r0.owner, visit: sf(cur, 'visit_count'), ord: sf(cur, OC), rv: sf(cur, REV) }; }).sort((a, b) => b.rv - a.rv);
  const prPMap = {}; prD.forEach(r => { const k = pk(r); if (!prPMap[k]) prPMap[k] = { label: k, start: r.period_start, end: r.period_end || r.date, role: r.period_role, prov: !!r.is_provisional }; });
  const prodP = Object.values(prPMap).sort((a, b) => (b.end || '').localeCompare(a.end || ''))[0] || null;
  const prSel = prodP ? prD.filter(r => pk(r) === prodP.label) : prD;
  const prSpan = (prodP && prodP.start && prodP.end) ? Math.round((new Date(prodP.end) - new Date(prodP.start)) / 86400000) + 1 : 0;
  const mdShort = s => s ? (Number(s.slice(5, 7)) + '/' + Number(s.slice(8, 10))) : '';
  const prodLabel = prodP ? ((prSpan ? '최근 ' + prSpan + '일 · ' : '') + mdShort(prodP.start) + '~' + mdShort(prodP.end)) : '';
  const prG = groupBy(prSel, r => (r.product_id || r.product_name_raw || '(미지정)'));
  const prRows = Object.keys(prG).map(k => { const cur = prG[k], r0 = cur[0] || {}; return { product: r0.product_name_raw || r0.product_id, group: r0.product_group, line: r0.product_line, ord: sf(cur, 'order_count'), rv: sf(cur, 'revenue'), buyers: sf(cur, 'buyer_count') }; }).sort((a, b) => b.rv - a.rv).slice(0, 40);
  const movers = chanRows.filter(r => r.drev != null);
  const up3 = movers.slice().sort((a, b) => b.drev - a.drev).filter(m => m.drev > 0).slice(0, 3);
  const down3 = movers.slice().sort((a, b) => a.drev - b.drev).filter(m => m.drev < 0).slice(0, 3);
  const DChip = ({ v }) => v == null ? <span style={{ fontSize: 10, color: '#C4BEB6' }}>—</span> : <span style={{ fontSize: 10.5, fontWeight: 700, color: v >= 0 ? '#1FA463' : '#DC2626' }}>{v >= 0 ? '▲' : '▼'} {pctS(Math.abs(v))}</span>;
  const Sec = ({ title, desc, children }) => (<Card style={{ marginBottom: 14 }}><div style={{ marginBottom: 10 }}><div style={{ fontSize: 14, fontWeight: 800, color: G }}>{title}</div>{desc ? <div style={{ fontSize: 11, color: '#A29C95', marginTop: 2, lineHeight: 1.5 }}>{desc}</div> : null}</div>{children}</Card>);
  const Empty = ({ what }) => <div style={{ fontSize: 12, color: '#A29C95', background: '#F8F7F5', border: '1px solid #EDEBE7', borderRadius: 8, padding: '12px 14px' }}>{what || '데이터가 아직 없습니다'} — 매출·분석 허브가 <b>data/channel-tracking.json</b>을 push하면 채워집니다.</div>;
  const th = { textAlign: 'left', fontSize: 10.5, fontWeight: 700, color: '#8A8580', padding: '6px 8px', borderBottom: '1.5px solid #E3E0DC', whiteSpace: 'nowrap' };
  const td = { fontSize: 11.5, color: '#3A3631', padding: '6px 8px', borderBottom: '1px solid #F0EEEB', whiteSpace: 'nowrap' };
  const tdR = { ...td, textAlign: 'right' };
  const diagBox = (label, val, warn) => (<div style={{ flex: 1, minWidth: 150, background: warn ? '#FEF2F2' : '#F8F7F5', border: '1px solid ' + (warn ? '#FCA5A5' : '#EDEBE7'), borderRadius: 10, padding: '11px 12px' }}><div style={{ fontSize: 11, color: '#6E6863', marginBottom: 3 }}>{label}</div><div style={{ fontSize: 20, fontWeight: 800, color: warn ? '#DC2626' : G }}>{val}</div></div>);

        <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap' }}>{[['day', '일간'], ['week', '주간'], ['month', '월간'], ['custom', '기간선택']].map(mm => <button key={mm[0]} onClick={() => { setVMode(mm[0]); setVIdx(0); }} style={{ fontSize: 12, fontWeight: 700, padding: '6px 13px', borderRadius: 8, border: 'none', cursor: 'pointer', background: vMode === mm[0] ? G : '#E3E0DC', color: vMode === mm[0] ? 'white' : '#6E6863' }}>{mm[1]}</button>)}</div>

          <button onClick={() => setVIdx(x => Math.max(0, x - 1))} disabled={vIdx <= 0} style={{ width: 28, height: 28, borderRadius: 7, border: '1px solid #E3E0DC', background: 'white', cursor: vIdx <= 0 ? 'default' : 'pointer', opacity: vIdx <= 0 ? 0.4 : 1, color: '#3A3631' }}>▶</button>
          <span style={{ fontSize: 12, fontWeight: 700, color: G }}>{vCurLabel}</span>{vIdx === 0 ? <span style={{ fontSize: 9.5, color: '#A29C95' }}>최신</span> : null}
        </div> : <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}><input type="date" value={vRange.start} min={vDatesAll[0]} max={vRange.end || vDatesAll[vDatesAll.length - 1]} onChange={e => setVRange(st => ({ ...st, start: e.target.value }))} style={{ padding: '5px 8px', border: '1px solid #D8D3CC', borderRadius: 7, fontSize: 11.5 }} /><span style={{ color: '#A29C95' }}>~</span><input type="date" value={vRange.end} min={vRange.start || vDatesAll[0]} max={vDatesAll[vDatesAll.length - 1]} onChange={e => setVRange(st => ({ ...st, end: e.target.value }))} style={{ padding: '5px 8px', border: '1px solid #D8D3CC', borderRadius: 7, fontSize: 11.5 }} /></div>}

      <div style={{ fontSize: 11.5, color: '#6E6863', marginBottom: 10, lineHeight: 1.5 }}>어느 경로로 방문·유입되는지 추적. 위 기간 컨트롤은 <b>방문 인사이트</b> 기준이며, 채널별 성과표는 <b>+14일 기여도</b>로 고정 표시돼요. <span style={{ color: '#B45309' }}>기간이 최근 14일과 겹치면 <b>잠정</b>.</span></div>
      {status === 'ok' && curP ? <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap', fontSize: 11.5, background: '#F5F4F2', border: '1px solid #EDEBE7', borderRadius: 9, padding: '9px 12px', marginBottom: 14 }}>
        <span style={{ fontWeight: 700, color: G }}>비교 기간</span>
        <span style={{ fontWeight: 700 }}>{curP.label}</span>{curP.start ? <span style={{ color: '#8A8580' }}>({curP.start}~{curP.end})</span> : null}{curP.prov ? <span style={{ fontSize: 9.5, fontWeight: 700, color: '#B45309', background: '#FFFBEB', border: '1px solid #FDE68A', borderRadius: 4, padding: '1px 5px' }}>잠정</span> : null}
        <span style={{ color: '#A29C95' }}>vs</span>
        {priP ? <React.Fragment><span style={{ fontWeight: 700 }}>{priP.label}</span>{priP.start ? <span style={{ color: '#8A8580' }}>({priP.start}~{priP.end})</span> : null}{priP.prov ? <span style={{ fontSize: 9.5, fontWeight: 700, color: '#B45309', background: '#FFFBEB', border: '1px solid #FDE68A', borderRadius: 4, padding: '1px 5px' }}>일부 잠정</span> : null}</React.Fragment> : <span style={{ color: '#A29C95' }}>직전 기간 없음</span>}
        {baseP ? <span style={{ marginLeft: 'auto', color: '#8A8580' }}>기준선 {baseP.label}{baseP.start ? ' (' + baseP.start + '~' + baseP.end + ')' : ''}</span> : null}
      </div> : null}
      {status === 'loading' && <div style={{ fontSize: 12, color: '#A29C95' }}>불러오는 중…</div>}
      {status === 'none' && <div style={{ fontSize: 12.5, color: '#A29C95', background: '#F8F7F5', border: '1px solid #EDEBE7', borderRadius: 10, padding: '14px 16px', marginBottom: 14 }}>아직 채널 추적 데이터가 없습니다 — 매출·분석 허브가 <b>data/channel-tracking.json</b>(channel_daily · custom_channel_daily · product_channel_daily)을 push하면 아래 섹션이 자동으로 채워집니다. <b>현재는 골격(빈 상태)</b>입니다.</div>}

      {vdAll.length > 0 ? <VisitPathSection vd={vdAll} vc={vcAll} meta={meta} data={data} setData={setData} mode={vMode} vIdx={vIdx} range={vRange} /> : null}
      <Sec title="0. 추적 정확도 (진단)" desc="유입이 어느 채널인지 얼마나 식별되는지 — 추적이 새는지 한눈에.">
        {chD.length === 0 ? <Empty what="채널 유입 데이터 없음" /> : (
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>

      <Sec title="2. 채널별 성과표" desc="네이버 기본 채널 + 사용자정의 · 원본 채널명 보존 · +14일 기여도 기준(고정)">
        {chanRows.length === 0 ? <Empty what="채널 데이터 없음" /> : (
          <div style={{ overflowX: 'auto' }}><table style={{ width: '100%', borderCollapse: 'collapse', minWidth: 620 }}><thead><tr><th style={th}>채널</th><th style={{ ...th, textAlign: 'right' }}>유입수</th><th style={{ ...th, textAlign: 'right' }}>증감</th><th style={{ ...th, textAlign: 'right' }}>결제금액</th><th style={{ ...th, textAlign: 'right' }}>증감</th><th style={{ ...th, textAlign: 'right' }}>전환율</th><th style={{ ...th, textAlign: 'right' }}>유입당매출</th></tr></thead><tbody>{chanRows.map((r, i) => <tr key={i}><td style={td}>{r.k}{r.l1 ? <span style={{ fontSize: 9, color: '#A29C95', marginLeft: 4 }}>{r.l1}</span> : null}</td><td style={tdR}>{num(r.visit)}</td><td style={tdR}><DChip v={r.dvisit} /></td><td style={tdR}>{won(r.rv)}</td><td style={tdR}><DChip v={r.drev} /></td><td style={tdR}>{pctS(r.cvr)}</td><td style={tdR}>{won(r.rpv)}</td></tr>)}</tbody></table></div>
        )}

        {cuRows.length === 0 ? <div style={{ fontSize: 12, color: '#A29C95', background: '#F8F7F5', border: '1px solid #EDEBE7', borderRadius: 8, padding: '12px 14px' }}><b>nt 추적 링크 미배포</b> — 배포 시 자동 표시됩니다.</div> : (
          <div style={{ overflowX: 'auto' }}><table style={{ width: '100%', borderCollapse: 'collapse', minWidth: 680 }}><thead><tr><th style={th}>nt (source/medium/detail/keyword)</th><th style={th}>캠페인</th><th style={th}>게재위치</th><th style={th}>소재</th><th style={{ ...th, textAlign: 'right' }}>유입</th><th style={{ ...th, textAlign: 'right' }}>결제</th><th style={{ ...th, textAlign: 'right' }}>결제금액</th></tr></thead><tbody>{cuRows.map((r, i) => <tr key={i}><td style={td}>{r.k}</td><td style={td}>{r.campaign || '—'}</td><td style={td}>{r.placement || '—'}</td><td style={td}>{r.creative || '—'}</td><td style={tdR}>{num(r.visit)}</td><td style={tdR}>{num(r.ord)}</td><td style={tdR}>{won(r.rv)}</td></tr>)}</tbody></table></div>

        <div style={{ fontSize: 12, color: '#A29C95', background: '#F8F7F5', border: '1px solid #EDEBE7', borderRadius: 8, padding: '16px', textAlign: 'center', lineHeight: 1.6 }}>

          <div><b>reports.keyword_daily</b>가 연결되면 키워드별 노출·클릭·전환·순위가 여기에 표시됩니다.</div>
        </div>

      <Sec title="5. 매출 증감 기여" desc="비교 기간 · 채널 결제금액 증감 기준">
        {movers.length === 0 ? <Empty what="증감 비교 데이터 없음" /> : (
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(220px,1fr))', gap: 12 }}>
            <div><div style={{ fontSize: 12, fontWeight: 800, color: '#1FA463', marginBottom: 6 }}>▲ 상승 Top 3</div>{up3.length === 0 ? <div style={{ fontSize: 11, color: '#A29C95' }}>없음</div> : up3.map((m, i) => <div key={i} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 12, padding: '6px 9px', background: '#F4FBF7', border: '1px solid #D1FAE5', borderRadius: 7, marginBottom: 4 }}><span style={{ fontWeight: 600 }}>{m.k}</span><span><DChip v={m.drev} /> <span style={{ color: '#8A8580', fontSize: 10.5 }}>{won(m.rv)}</span></span></div>)}</div>
            <div><div style={{ fontSize: 12, fontWeight: 800, color: '#DC2626', marginBottom: 6 }}>▼ 하락 Top 3</div>{down3.length === 0 ? <div style={{ fontSize: 11, color: '#A29C95' }}>없음</div> : down3.map((m, i) => <div key={i} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 12, padding: '6px 9px', background: '#FEF2F2', border: '1px solid #FCA5A5', borderRadius: 7, marginBottom: 4 }}><span style={{ fontWeight: 600 }}>{m.k}</span><span><DChip v={m.drev} /> <span style={{ color: '#8A8580', fontSize: 10.5 }}>{won(m.rv)}</span></span></div>)}</div>
          </div>

    </div>
  );
}

// ── 정기구독 수집 시작일 (index_140, 허브 규칙 【4】) ────────────────────────
// 매출 자동화가 구독 데이터를 모으기 시작한 날. 이 날 이전 구간의 0 은 '진짜 0' 이
// 아니라 '아직 안 모은 값' 이다. 예: 서빙 중이던 파일의 2026-W31(7/27~8/2) 은
// activeSubscribers: 0 이었는데, 이걸 그대로 찍으면 '그 주 구독자 0명' 이라는
// 거짓 정보가 된다. 그래서 구간 전체가 이 날 이전이면 숫자 대신 '—'(미수집) 로 찍는다.
const SUB_START = '2026-08-01';
// 레코드의 실제 날짜 범위를 구한다. daily[] 가 있으면 그게 가장 정확하고,
// 없으면 key 로 역산한다(YYYY-MM-DD / YYYY-MM / YYYY-Www).
function salesRecRange(rec) {
  if (!rec) return ['', ''];
  if (rec.periodStart && rec.periodEnd) return [rec.periodStart, rec.periodEnd];
  const ds = ((rec.daily || []).map(x => x && x.date).filter(Boolean)).sort();
  if (ds.length) return [ds[0], ds[ds.length - 1]];
  const k = String(rec.key || '');
  const f = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  if (/^\d{4}-\d{2}-\d{2}$/.test(k)) return [k, k];
  if (/^\d{4}-\d{2}$/.test(k)) { const y = +k.slice(0, 4), m = +k.slice(5, 7); return [k + '-01', k + '-' + String(new Date(y, m, 0).getDate()).padStart(2, '0')]; }
  const w = k.match(/^(\d{4})-W(\d{1,2})$/);

function aggSalesRange(days, start, end) {
  if (!start || !end || start > end) return null;

  if (!inR.length) return null;

  const conv = cur.vis ? Math.round(cur.ord / cur.vis * 10000) / 100 : 0, pconv = (pr && pr.vis) ? Math.round(pr.ord / pr.vis * 10000) / 100 : null;
  const rb = key => inR.reduce((a, d) => { const x = ((d.summary && d.summary.refund && d.summary.refund.breakdown) || {})[key]; return { amount: a.amount + ((x && x.amount) || 0), count: a.count + ((x && x.count) || 0) }; }, { amount: 0, count: 0 });
  const cancel = rb('cancel'), ret = rb('return'), exch = rb('exchange');

    visitors: mk(cur.vis, pr && pr.vis),
    conversion: { value: conv, deltaValue: pconv == null ? null : Math.round((conv - pconv) * 100) / 100, deltaPct: (pconv == null || pconv === 0) ? null : r1((conv - pconv) / pconv * 100) },
    refund: { value: null, deltaValue: refDelta, deltaPct: refPct, breakdown: { basis: '처리일(취소완료일)', cancel: cancel, return: ret, exchange: exch, total: refTot, deltaValue: refDelta, deltaPct: refPct } }
  };
  const daily = inR.map(d => ({ date: d.key, revenue: ((d.summary && d.summary.revenue) || {}).value || 0 }));
  const chMap = {};
  inR.forEach(d => (d.channels || []).forEach(c => { const k = c.name || '(미지정)'; const m = chMap[k] || (chMap[k] = { name: k, revenue: 0, visitors: 0 }); m.revenue += c.revenue || 0; m.visitors += c.visitors || 0; }));

  const prMap = {};
  inR.forEach(d => (d.products || []).forEach(p => { const k = p.productId || p.name; const m = prMap[k] || (prMap[k] = { name: p.name, productId: p.productId, revenue: 0, qty: 0 }); m.revenue += p.revenue || 0; m.qty += p.qty || 0; }));

}

            : <div style={{ fontSize: 12, color: '#6E6863', lineHeight: 1.6 }}>메인 KPI 이름에 <b>"매출"</b>을 넣으면 네이버 매출이 자동 연동됩니다. 집계기간에 해당하는 일별 매출이 KPI 달성값에 자동 합산돼요. (이번 달 누적: {won2(monthRev)})</div>}
        </Card>
      </>)}
    </div>
  );
}

function MeetingActionModal({ action, data, setData, onApplied, onClose }) {
  const a = action;
  const STAGES = ['예정', '진행중', '검토중', '완료', '보류'];
  const existingSub = a.subplanId ? data.subplans.find(s => s.id === a.subplanId) : null;
  const existingPlan = a.planId ? data.plans.find(p => p.id === a.planId) : null;
  const initPlanId = existingSub ? existingSub.planId : (existingPlan ? existingPlan.id : (a.planId || ''));
  const initPlan = data.plans.find(p => p.id === initPlanId);
  const initOutId = initPlan ? initPlan.outputId : '';

  const chg = a.changes || {}; const fld = a.fields || {};
  const getChg = k => chg[k] ? chg[k].to : undefined;
  const base = existingSub || {};
  const [outId, setOutId] = useState(initOutId ? String(initOutId) : '');
  const [planId, setPlanId] = useState(initPlanId ? String(initPlanId) : '');
  const [name, setName] = useState(a.level === 'plan' ? (existingPlan ? existingPlan.name : (fld.name || a.planName || '')) : (getChg('name') != null ? getChg('name') : (base.name || fld.name || a.subplanName || '')));
  const [stage, setStage] = useState(getChg('stage') != null ? getChg('stage') : (base.stage || fld.stage || '예정'));
  const [owner, setOwner] = useState(getChg('owner') || fld.owner || (existingSub ? ownersOf(existingSub) : (existingPlan ? ownersOf(existingPlan) : [])) || []);
  const [support, setSupport] = useState((existingSub && existingSub.support) || (existingPlan && existingPlan.support) || []);
  const [start, setStart] = useState(getChg('start') != null ? getChg('start') : (base.start || fld.start || (existingPlan ? existingPlan.start : '') || ''));
  const [due, setDue] = useState(getChg('due') != null ? getChg('due') : (base.due || fld.due || (existingPlan ? existingPlan.due : '') || ''));

  // KPI level
  const mkList = (data.mainKpis || []);
  const [mkId, setMkId] = useState(a.mainKpiId && mkList.find(m => String(m.id) === String(a.mainKpiId)) ? String(a.mainKpiId) : (mkList[0] ? String(mkList[0].id) : ''));
  const kpiTarget0 = chg.target ? chg.target.to : '';
  const kpiPeriod0 = chg.target ? (chg.target.period || TODAY.slice(0, 7)) : TODAY.slice(0, 7);
  const [kpiPeriod, setKpiPeriod] = useState(kpiPeriod0);
  const [kpiTarget, setKpiTarget] = useState(kpiTarget0 != null ? String(kpiTarget0) : '');

  const plansInOut = data.plans.filter(p => String(p.outputId) === String(outId));

  const applySubOrPlan = () => {
    if (a.level === 'plan') {
      if (!planId) { alert('실행계획을 선택하세요'); return; }
      setData(d => resolveAll({ ...d, plans: d.plans.map(p => String(p.id) === String(planId) ? { ...p, name: name.trim() || p.name, owner, support, start, due } : p) }));
      onApplied(a.id); onClose(); return;
    }
    // subplan
    if (!planId) { alert('실행계획을 선택하세요'); return; }
    if (existingSub) {
      setData(d => resolveAll({ ...d, subplans: d.subplans.map(s => s.id === existingSub.id ? { ...s, name: name.trim() || s.name, stage, owner, support, start, due, planId: Number(planId), completedAt: stage === '완료' && !s.completedAt ? TODAY : s.completedAt } : s) }));
    } else {
      setData(d => ({ ...d, nid: d.nid + 1, subplans: [...d.subplans, { id: d.nid + 1, planId: Number(planId), name: name.trim(), stage, start, due, owner, support, dep: null, resolved: false, files: [], perfRecorded: false, completedAt: stage === '완료' ? TODAY : undefined, kpis: [] }] }));
    }
    onApplied(a.id); onClose();
  };

  const applyKpi = () => {
    if (!mkId) { alert('메인 KPI를 선택하세요'); return; }
    const val = Number(kpiTarget) || 0;
    setData(d => ({ ...d, mainKpis: (d.mainKpis || []).map(mk => String(mk.id) === String(mkId) ? { ...mk, targets: { ...(mk.targets || {}), [kpiPeriod]: val } } : mk) }));
    onApplied(a.id); onClose();
  };

  const notFound = (a.op === 'edit' && a.level === 'subplan' && !existingSub) || (a.op === 'edit' && a.level === 'plan' && !existingPlan);

  return (
    <ModalShell title={a.op === 'add' ? '세부실행계획 추가' : (a.level === 'kpi' ? 'KPI 목표 반영' : (a.level === 'plan' ? '실행계획 수정' : '세부실행계획 수정'))} onClose={onClose}>
      <div style={{ background: '#F5F4F2', borderRadius: 10, padding: '10px 12px', fontSize: 16, color: '#3A3631', marginBottom: 4 }}>
        <b>회의 근거:</b> {a.note || '-'}{a.needsConfirm ? <span style={{ marginLeft: 6, fontSize: 14, fontWeight: 700, color: '#E08700', background: '#FEF3C7', borderRadius: 5, padding: '1px 6px' }}>확인 필요</span> : null}
      </div>
      {a.op === 'edit' && a.level !== 'kpi' && a.changes && Object.keys(a.changes).length > 0 && (
        <div style={{ background: '#EFF6FF', border: '1px solid #BFDBFE', borderRadius: 8, padding: '8px 11px', fontSize: 16 }}>
          <div style={{ fontWeight: 700, color: '#2D5FE0', marginBottom: 4 }}>변경 내용 (원래 → 변경)</div>
          {Object.keys(a.changes).map(k => { const kn = { stage: '상태', name: '이름', due: '마감일', start: '시작일', owner: '담당자' }[k] || k; const c = a.changes[k]; return (<div key={k} style={{ display: 'flex', gap: 6, padding: '1px 0' }}><span style={{ color: '#6E6863', minWidth: 44 }}>{kn}</span><span style={{ color: '#A29C95', textDecoration: 'line-through' }}>{c.from != null ? String(c.from) : '(없음)'}</span><span>→</span><span style={{ color: '#2D5FE0', fontWeight: 700 }}>{String(c.to)}</span></div>); })}
        </div>
      )}
      {notFound && <div style={{ background: '#FEF2F2', border: '1px solid #FECACA', borderRadius: 8, padding: '8px 11px', fontSize: 15, color: '#E53935' }}>회의록의 대상({a.subplanName || a.planName}, ID {a.subplanId || a.planId})을 현재 대시보드에서 찾지 못했어요. 아래에서 직접 선택/입력해 새로 반영할 수 있어요.</div>}

      {a.level === 'kpi' ? (<>
        <div><Lbl c="메인 KPI" /><Sel value={mkId} onChange={setMkId} opts={mkList.map(m => ({ v: String(m.id), l: m.name }))} /></div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
          <div><Lbl c="적용 월 (YYYY-MM)" /><Inp value={kpiPeriod} onChange={setKpiPeriod} placeholder="2026-07" /></div>
          <div><Lbl c="목표값" /><Inp type="number" value={kpiTarget} onChange={setKpiTarget} placeholder="70000000" /></div>
        </div>
        <div style={{ display: 'flex', gap: 8 }}><Btn v="gold" onClick={applyKpi} style={{ flex: 1 }}>목표 반영</Btn><Btn v="secondary" onClick={onClose}>취소</Btn></div>
      </>) : a.level === 'memo' ? (<>
        <div style={{ fontSize: 17, color: '#3A3631', lineHeight: 1.6, padding: '4px 0' }}>{fld.memo || a.note}</div>
        <div style={{ fontSize: 15, color: '#A29C95' }}>메모성 항목이라 대시보드에 직접 반영할 대상은 없어요. 참고용으로 확인만 하세요.</div>
        <div style={{ display: 'flex', gap: 8 }}><Btn onClick={() => { onApplied(a.id); onClose(); }} style={{ flex: 1 }}>확인함</Btn><Btn v="secondary" onClick={onClose}>닫기</Btn></div>
      </>) : (<>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
          <div><Lbl c="출력 프로젝트" /><Sel value={outId} onChange={v => { setOutId(v); const ps = data.plans.filter(p => String(p.outputId) === String(v)); setPlanId(ps[0] ? String(ps[0].id) : ''); }} ph="선택..." opts={data.outputs.map(o => ({ v: String(o.id), l: (o.code ? o.code + ' ' : '') + o.name }))} /></div>
          <div><Lbl c="실행계획" /><Sel value={planId} onChange={setPlanId} ph="선택..." opts={plansInOut.map(p => ({ v: String(p.id), l: p.name }))} /></div>
        </div>
        {(!outId || !planId) && <div style={{ fontSize: 15, color: '#E08700' }}>※ 회의록 ID가 현재 대시보드와 달라 자동 선택이 안 됐어요. 위에서 프로젝트·실행계획을 골라주세요.</div>}
        <div><Lbl c={a.level === 'plan' ? '실행계획명' : '세부실행계획명'} /><Inp value={name} onChange={setName} placeholder="이름" /></div>
        {a.level === 'subplan' && <div><Lbl c="상태" /><Sel value={stage} onChange={setStage} opts={STAGES.map(s => ({ v: s, l: s }))} /></div>}
        <div><Lbl c="담당자 (다중 선택)" /><MemberMulti selected={owner} onToggle={m => setOwner(owner.includes(m) ? owner.filter(x => x !== m) : [...owner, m])} /></div>
        <SupportEditor support={support} setSupport={setSupport} />
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
          <div><Lbl c="시작일" /><Inp type="date" value={start} onChange={setStart} /></div>
          <div><Lbl c="마감일" /><Inp type="date" value={due} onChange={setDue} /></div>
        </div>
        <div style={{ display: 'flex', gap: 8 }}><Btn v="gold" onClick={applySubOrPlan} style={{ flex: 1 }}>{a.op === 'add' ? '등록하기' : '변경 저장'}</Btn><Btn v="secondary" onClick={onClose}>취소</Btn></div>
      </>)}
    </ModalShell>
  );
}

function TabMeeting({ data, setData }) {
  const [ghList, setGhList] = useState([]);
  const [status, setStatus] = useState('loading');
  const [sample, setSample] = useState(false);
  const [openId, setOpenId] = useState(null);
  const [openDoc, setOpenDoc] = useState(null);
  const [editMode, setEditMode] = useState(false);
  const [actModal, setActModal] = useState(null);
  const editRef = useRef(null);
  const [ownerF, setOwnerF] = useState('전체');
  const [editTitle, setEditTitle] = useState('');
  const [editHtml, setEditHtml] = useState('');
  const [editDate, setEditDate] = useState('');
  const [editAtt, setEditAtt] = useState('');
  const [allDocs, setAllDocs] = useState(null);
  const [inboxF, setInboxF] = useState('전체');
  const fbMeetings = data.meetings || [];

  useEffect(() => {
    let alive = true; setStatus('loading');
    ghFetch('data/meetings/index.json')
      .then(res => { if (!res.ok) throw new Error('no'); return res.json(); })
      .then(j => { if (!alive) return; setGhList(Array.isArray(j) ? j : []); setStatus('ok'); setSample(false); })
      .catch(() => { if (!alive) return; setGhList([]); setStatus('ok'); setSample(true); });
    return () => { alive = false; };
  }, []);

  // 통합 목록용: 모든 회의록 문서 로드 (Firebase 사본 우선, 나머지는 GitHub)
  useEffect(() => {
    if (status === 'loading') return;
    let alive = true;
    const fbIds = fbMeetings.map(m => m.id);
    const need = ghList.filter(m => fbIds.indexOf(m.id) < 0).map(m => m.id);
    Promise.all(need.map(id => ghFetch('data/meetings/' + id + '.json').then(r => r.ok ? r.json() : null).catch(() => null)))
      .then(docs => {
        if (!alive) return;
        const byId = {};
        if (sample && ghList.length === 0 && fbMeetings.length === 0) byId[MEETING_SAMPLE.id] = MEETING_SAMPLE;
        docs.forEach(dc => { if (dc && dc.id) byId[dc.id] = dc; });
        fbMeetings.forEach(f => { byId[f.id] = f; });
        setAllDocs(Object.values(byId).sort((a, b) => (a.date || '').localeCompare(b.date || '')));
      });
    return () => { alive = false; };
  }, [status, ghList, fbMeetings, sample]);

  // 목록 병합: Firebase 우선(수정됨), 나머지는 GitHub, 둘 다 없으면 샘플
  const merged = (() => {
    const byId = {};
    const gh = sample && fbMeetings.length === 0 && ghList.length === 0 ? [{ id: MEETING_SAMPLE.id, date: MEETING_SAMPLE.date, title: MEETING_SAMPLE.title, __sample: true }] : ghList;
    gh.forEach(m => { byId[m.id] = { ...m, source: 'github' }; });
    fbMeetings.forEach(m => { byId[m.id] = { id: m.id, date: m.date, title: m.title, source: 'firebase' }; });

  })();

  const openMeeting = row => {
    setEditMode(false);
    const fb = fbMeetings.find(m => m.id === row.id);
    if (fb) { setOpenDoc(fb); setOpenId(row.id); setEditMode(true); setEditTitle(fb.title || ''); setEditHtml(fb.summaryHtml || ''); setEditDate(fb.date || ''); setEditAtt((fb.attendees || []).join(', ')); return; }
    if (row.__sample) { setOpenDoc(MEETING_SAMPLE); setOpenId(row.id); return; }
    // GitHub에서 개별 회의록 로드
    setOpenDoc('loading'); setOpenId(row.id);
    ghFetch('data/meetings/' + row.id + '.json')
      .then(res => res.ok ? res.json() : null)
      .then(j => setOpenDoc(j || 'error'))
      .catch(() => setOpenDoc('error'));
  };

  const startEdit = () => {
    if (!openDoc || openDoc === 'loading' || openDoc === 'error') return;
    // GitHub/샘플 → Firebase 복사
    const copy = { ...openDoc, appliedActions: [] };
    setData(d => ({ ...d, meetings: [...(d.meetings || []).filter(m => m.id !== copy.id), copy] }));
    setOpenDoc(copy); setEditMode(true); setEditTitle(copy.title || ''); setEditHtml(copy.summaryHtml || ''); setEditDate(copy.date || ''); setEditAtt((copy.attendees || []).join(', '));
  };

  const saveEdit = () => {
    const html = editRef.current ? editRef.current.innerHTML : editHtml;
    setData(d => ({ ...d, meetings: (d.meetings || []).map(m => m.id === openDoc.id ? { ...m, title: editTitle, date: editDate, attendees: editAtt.split(',').map(s => s.trim()).filter(Boolean), summaryHtml: html } : m) }));
    setEditMode(false);
  };
  const cancelEdit = () => { setEditMode(false); const fb = fbMeetings.find(m => m.id === openDoc.id); if (fb) setOpenDoc(fb); };

  const markAppliedPairs = pairs => setData(d => {
    let meetings = d.meetings || [];
    pairs.forEach(pr => {
      const exists = meetings.find(m => m.id === pr.doc.id);
      const base = exists || { ...pr.doc, appliedActions: [] };
      const ap = base.appliedActions || [];
      if (ap.indexOf(pr.actId) >= 0) return;
      const updated = { ...base, appliedActions: [...ap, pr.actId] };
      meetings = [...meetings.filter(m => m.id !== pr.doc.id), updated];
    });
    return { ...d, meetings };
  });
  const appliedSet = (() => { const fb = fbMeetings.find(m => m.id === (openDoc && openDoc.id)); return (fb && fb.appliedActions) || []; })();
  const actOwner = act => { const o = (act.fields && act.fields.owner) || act.owner; if (o && o.length) return o; if (act.subplanId) { const s = data.subplans.find(x => x.id === act.subplanId); if (s && ownersOf(s).length) return ownersOf(s); } if (act.planId) { const p = data.plans.find(x => x.id === act.planId); if (p && ownersOf(p).length) return ownersOf(p); } return []; };

  // ===== 대시보드 입력 (통합): 모든 회의의 미반영 액션 병합, 같은 대상은 최신 회의 우선 =====
  const inbox = (() => {
    if (!allDocs) return null;
    const appliedOf = id => { const fb = fbMeetings.find(m => m.id === id); return (fb && fb.appliedActions) || []; };
    const keyOf = a => a.level === 'kpi' ? 'kpi:' + (a.mainKpiId || '') + ':' + (a.changes && a.changes.target ? (a.changes.target.period || '') : '')
