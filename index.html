const plansOfOut = (data, oid) => (data.plans || []).filter(p => isLinkedOut(p, oid));
const subsOfPlanAll = (data, pid) => (data.subplans || []).filter(s => isLinkedPlan(s, pid));
const sameOutParent = (data, a, b) => { const x = (data.plans || []).find(p => p.id === a), y = (data.plans || []).find(p => p.id === b); return !!(x && y && x.outputId === y.outputId); };
const samePlanParent = (data, a, b) => { const x = (data.subplans || []).find(s => s.id === a), y = (data.subplans || []).find(s => s.id === b); return !!(x && y && x.planId === y.planId); };
// 한 곳에서만 연결 해제. 대표를 해제하면 남은 연결 중 첫번째가 새 대표가 된다.
const unlinkPlanFrom = (d, planId, oid) => ({ ...d, plans: (d.plans || []).map(p => {
  if (p.id !== planId) return p;
  const ex = extraOuts(p).filter(x => x !== oid);
  if (p.outputId !== oid) return { ...p, extraOutputIds: ex };
  if (!ex.length) return p;
  return { ...p, outputId: ex[0], extraOutputIds: ex.slice(1) };

const unlinkSubFrom = (d, subId, pid) => ({ ...d, subplans: (d.subplans || []).map(s => {
  if (s.id !== subId) return s;
  const ex = extraPlans(s).filter(x => x !== pid);
  if (s.planId !== pid) return { ...s, extraPlanIds: ex };

// 실행계획 KPI 가 어느 프로젝트로 집계될지 (미지정/끊긴 값이면 대표 프로젝트)
const kpiOutId = (p, k) => { if (!p) return null; const v = (k && k.outputId != null) ? Number(k.outputId) : null; return (v != null && isLinkedOut(p, v)) ? v : p.outputId; };

const moveToTrash = (d, type, id) => {
  const trash = d.trash || [];
  const payload = { outputs: [], plans: [], subplans: [], checklists: [], budgets: [], kpiLogs: [], mainKpi: null };
  let outputs = d.outputs, plans = d.plans, subplans = d.subplans, checklists = d.checklists;
  let budgets = d.budgets || [], kpiLogs = d.kpiLogs || [], mainKpis = d.mainKpis || [];
  let label = '';
  if (type === 'output') {
    const o = outputs.find(x => x.id === id); if (!o) return d;
    // 다중 연결: 다른 프로젝트에도 연결된 실행계획은 삭제하지 않고 그쪽으로 대표를 넘긴다.
    const survP = {}; plans.forEach(p => { if (p.outputId === id) { const ex = extraOuts(p).filter(x => x !== id); if (ex.length) survP[p.id] = ex; } });
    const pIds = plans.filter(p => p.outputId === id && !survP[p.id]).map(p => p.id);
    const survS = {}; subplans.forEach(s => { if (pIds.includes(s.planId)) { const ex = extraPlans(s).filter(x => pIds.indexOf(x) < 0); if (ex.length) survS[s.id] = ex; } });
    const sIds = subplans.filter(s => pIds.includes(s.planId) && !survS[s.id]).map(s => s.id);
    payload.outputs = outputs.filter(x => x.id === id);
    payload.plans = plans.filter(p => pIds.includes(p.id));
    payload.subplans = subplans.filter(s => sIds.includes(s.id));
    payload.checklists = checklists.filter(c => sIds.includes(c.subplanId));
    payload.kpiLogs = kpiLogs.filter(l => pIds.includes(l.planId));
    payload.budgets = budgets.filter(b => b.outputId === id || pIds.includes(b.planId) || sIds.includes(b.subplanId));
    label = '프로젝트 · ' + outLabel(o);
    outputs = outputs.filter(x => x.id !== id);
    plans = plans.filter(p => !pIds.includes(p.id)).map(p => { const sv = survP[p.id]; if (sv) return { ...p, outputId: sv[0], extraOutputIds: sv.slice(1) }; return extraOuts(p).indexOf(id) >= 0 ? { ...p, extraOutputIds: extraOuts(p).filter(x => x !== id) } : p; });
    subplans = subplans.filter(s => !sIds.includes(s.id)).map(s => { const sv = survS[s.id]; if (sv) return { ...s, planId: sv[0], extraPlanIds: sv.slice(1) }; const ex = extraPlans(s).filter(x => pIds.indexOf(x) < 0); return ex.length !== extraPlans(s).length ? { ...s, extraPlanIds: ex } : s; });
    checklists = checklists.filter(c => !sIds.includes(c.subplanId));
    kpiLogs = kpiLogs.filter(l => !pIds.includes(l.planId));
    budgets = budgets.filter(b => !(b.outputId === id || pIds.includes(b.planId) || sIds.includes(b.subplanId)));
  } else if (type === 'plan') {
    const p = plans.find(x => x.id === id); if (!p) return d;
    // 다중 연결: 다른 실행계획에도 연결된 세부실행계획은 삭제하지 않고 그쪽으로 대표를 넘긴다.
    const survS = {}; subplans.forEach(s => { if (s.planId === id) { const ex = extraPlans(s).filter(x => x !== id); if (ex.length) survS[s.id] = ex; } });
    const sIds = subplans.filter(s => s.planId === id && !survS[s.id]).map(s => s.id);
    payload.plans = plans.filter(x => x.id === id);
    payload.subplans = subplans.filter(s => sIds.includes(s.id));
    payload.checklists = checklists.filter(c => sIds.includes(c.subplanId));
    payload.kpiLogs = kpiLogs.filter(l => l.planId === id);
    payload.budgets = budgets.filter(b => b.planId === id || sIds.includes(b.subplanId));
    label = '실행계획 · ' + p.name;
    plans = plans.filter(x => x.id !== id);
    subplans = subplans.filter(s => !sIds.includes(s.id)).map(s => { const sv = survS[s.id]; if (sv) return { ...s, planId: sv[0], extraPlanIds: sv.slice(1) }; return extraPlans(s).indexOf(id) >= 0 ? { ...s, extraPlanIds: extraPlans(s).filter(x => x !== id) } : s; });
    checklists = checklists.filter(c => !sIds.includes(c.subplanId));
    kpiLogs = kpiLogs.filter(l => l.planId !== id);
    budgets = budgets.filter(b => !(b.planId === id || sIds.includes(b.subplanId)));
  } else if (type === 'subplan') {
    const s = subplans.find(x => x.id === id); if (!s) return d;
    payload.subplans = subplans.filter(x => x.id === id);
    payload.checklists = checklists.filter(c => c.subplanId === id);
    payload.kpiLogs = kpiLogs.filter(l => l.subplanId === id);
    payload.budgets = budgets.filter(b => b.subplanId === id);
    label = '세부실행계획 · ' + s.name;
    subplans = subplans.filter(x => x.id !== id);
    checklists = checklists.filter(c => c.subplanId !== id);
    kpiLogs = kpiLogs.filter(l => l.subplanId !== id);
    budgets = budgets.filter(b => b.subplanId !== id);
  } else if (type === 'budget') {
    const b = budgets.find(x => x.id === id); if (!b) return d;
    payload.budgets = budgets.filter(x => x.id === id);
    const nm = budgetNames(d, b);
    label = '예산 · ' + (nm.detail || b.vendor) + ' ' + won(itemTotal(b));
    budgets = budgets.filter(x => x.id !== id);
  } else if (type === 'mainKpi') {
    const mk = mainKpis.find(x => x.id === id); if (!mk) return d;
    payload.mainKpi = mk;
    label = '메인 KPI · ' + mk.name;
    mainKpis = mainKpis.filter(x => x.id !== id);
  } else return d;
  const entry = { id: Date.now(), type, label, deletedAt: TODAY, payload };
  return { ...d, outputs, plans, subplans, checklists, budgets, kpiLogs, mainKpis, trash: [entry, ...trash] };
};

const reorderSiblings = (list, id, parentField, dir) => {
  const arr = [...list];
  const item = arr.find(x => x.id === id);
  if (!item) return list;
  const pv = item[parentField];
  const sib = arr.map((x, i) => (x[parentField] === pv ? i : -1)).filter(i => i >= 0);
  const pos = sib.indexOf(arr.indexOf(item));
  const np = pos + dir;
  if (np < 0 || np >= sib.length) return list;
  const i1 = sib[pos], i2 = sib[np];
  const t = arr[i1]; arr[i1] = arr[i2]; arr[i2] = t;
  return arr;
};

// 드래그로 형제 순서 바꾸기: fromId 를 toId 자리로 이동. 형제가 차지하던 전역 배열 슬롯은 그대로 유지.
// keyOf(x) 가 같은 항목끼리만 형제로 본다(부모 필드 하나 또는 부모+날짜 같은 복합 기준 모두 가능).
const moveSiblingToBy = (list, fromId, toId, keyOf) => {
  const arr = [...list];
  const fi = arr.findIndex(x => x.id === fromId), ti = arr.findIndex(x => x.id === toId);
  if (fi < 0 || ti < 0 || fromId === toId) return list;
  const pv = keyOf(arr[fi]);
  if (keyOf(arr[ti]) !== pv) return list;
  const slots = arr.map((x, i) => (keyOf(x) === pv ? i : -1)).filter(i => i >= 0);
  const seq = slots.map(i => arr[i]);
  const a = seq.findIndex(x => x.id === fromId), b = seq.findIndex(x => x.id === toId);
  if (a < 0 || b < 0) return list;
  const [m] = seq.splice(a, 1);
  seq.splice(b, 0, m);
  slots.forEach((slot, k) => { arr[slot] = seq[k]; });
  return arr;
};
const moveSiblingTo = (list, fromId, toId, parentField) => moveSiblingToBy(list, fromId, toId, x => x[parentField]);

// 체크리스트 표시 순서: 실행일 빠른 순, 실행일 미정은 맨 뒤. 같은 날짜면 저장된 순서(수동 순서) 그대로.
const sortChksByDate = list => (list || []).map((x, i) => [x, i]).sort((a, b) => {
  const ad = a[0].date || '', bd = b[0].date || '';
  if (ad !== bd) { if (!ad) return 1; if (!bd) return -1; return ad < bd ? -1 : 1; }
  return a[1] - b[1];
}).map(p => p[0]);
// 체크리스트 수동 순서 그룹: 같은 소속(세부계획) + 같은 실행일끼리만 순서를 바꿀 수 있다(드래그로 날짜가 바뀌는 사고 방지).
const chkOrderKey = x => String(x.subplanId == null ? 'm' : x.subplanId) + '|' + (x.date || '');
const sameChkGroup = (list, aId, bId) => { const x = (list || []).find(t => t.id === aId), y = (list || []).find(t => t.id === bId); return !!(x && y && chkOrderKey(x) === chkOrderKey(y)); };
const moveChkInGroup = (d, fromId, toId) => ({ ...d, checklists: moveSiblingToBy(d.checklists, fromId, toId, chkOrderKey) });
const WDNM = ['일', '월', '화', '수', '목', '금', '토'];
const dateWd = date => { try { const w = WDNM[new Date(date + 'T00:00:00').getDay()]; return w || ''; } catch (e) { return ''; } };

// 목록 안에서 행을 잡아 끌어 순서를 바꾸는 공용 훅. arm(id) 를 붙인 곳을 눌러야 그 행이 드래그된다(입력칸 텍스트 선택 보호).
// canDrop(from, to) 를 주면 그 조건을 만족하는 행에만 놓을 수 있다(조건 밖의 행은 강조도 안 되고 놓아도 무시).
function useDragOrder(onMove, canDrop) {
  const [dragId, setDragId] = useState(null);
  const [overId, setOverId] = useState(null);
  const [armId, setArmId] = useState(null);
  const reset = () => { setDragId(null); setOverId(null); setArmId(null); };
  const ok = (from, to) => from != null && from !== to && (!canDrop || canDrop(from, to) === true);
  const arm = id => ({ onMouseDown: () => setArmId(id), onMouseUp: () => setArmId(null), onTouchStart: () => setArmId(id) });
  const row = id => ({
    draggable: armId === id,
    onDragStart: e => { setDragId(id); try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(id)); } catch (err) {} },
    onDragOver: e => { if (dragId == null) return; if (!ok(dragId, id)) { e.stopPropagation(); if (overId != null) setOverId(null); return; } e.preventDefault(); if (overId !== id) setOverId(id); },
    onDragLeave: () => setOverId(o => (o === id ? null : o)),
    onDrop: e => { e.preventDefault(); e.stopPropagation(); const from = dragId; reset(); if (ok(from, id)) onMove(from, id); },
    onDragEnd: reset
  });
  const hl = id => (dragId === id ? { opacity: 0.4 } : (overId === id && ok(dragId, id)) ? { border: '1px solid ' + GO, boxShadow: 'inset 0 0 0 1px ' + GO } : null);
  return { arm, row, hl, dragId, overId };
}

// 드래그 중에 화면(또는 모달) 위/아래 끝에 가까워지면 자동으로 스크롤한다.
// 브라우저는 드래그 중 마우스 휠을 굴리면 드래그를 취소해 버리므로, 아래쪽 목록에서 위쪽 달력으로 끌어 올릴 때 반드시 필요하다.
function useDragAutoScroll() {
  useEffect(() => {
    const EDGE = 130, MAX = 26;
    let vy = 0, box = null, raf = 0, on = false;
    const scrollableUnder = node => {
      let n = node && node.nodeType === 3 ? node.parentElement : node;
      while (n && n.nodeType === 1 && n !== document.body && n !== document.documentElement) {
        let oy = '';
        try { oy = window.getComputedStyle(n).overflowY; } catch (e) { oy = ''; }
        if ((oy === 'auto' || oy === 'scroll') && n.scrollHeight > n.clientHeight + 4) return n;
        n = n.parentElement;
      }
      return null;
    };
    const step = () => {
      raf = 0;
      if (!on || !vy) return;
      if (box) { const b4 = box.scrollTop; box.scrollTop = b4 + vy; if (box.scrollTop === b4) window.scrollBy(0, vy); }
      else window.scrollBy(0, vy);
      raf = requestAnimationFrame(step);
    };
    const kick = () => { if (!raf && on && vy) raf = requestAnimationFrame(step); };
    const onOver = e => {
      on = true;
      const y = e.clientY;
      if (typeof y !== 'number') return;
      const el = scrollableUnder(e.target);
      let top = 0, bot = window.innerHeight || 0;
      if (el) { const r = el.getBoundingClientRect(); top = r.top; bot = r.bottom; }
      box = el;
      const dT = y - top, dB = bot - y;
      if (dT < EDGE) vy = -Math.ceil(MAX * Math.min(1, Math.max(0, EDGE - dT) / EDGE));
      else if (dB < EDGE) vy = Math.ceil(MAX * Math.min(1, Math.max(0, EDGE - dB) / EDGE));
      else vy = 0;
      kick();
    };
    const stop = () => { on = false; vy = 0; box = null; if (raf) { cancelAnimationFrame(raf); raf = 0; } };
    document.addEventListener('dragover', onOver, true);
    document.addEventListener('drop', stop, true);
    document.addEventListener('dragend', stop, true);
    window.addEventListener('blur', stop);
    return () => {
      document.removeEventListener('dragover', onOver, true);
      document.removeEventListener('drop', stop, true);
      document.removeEventListener('dragend', stop, true);
      window.removeEventListener('blur', stop);
      stop();
    };
  }, []);
}

const pad = n => String(n).padStart(2, '0');
const monthRange = (offset) => { const d = new Date(TODAY + 'T00:00:00'); let y = d.getFullYear(); let m = d.getMonth() + offset; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; const lastDay = new Date(y, m + 1, 0).getDate(); return { start: `${y}-${pad(m + 1)}-01`, end: `${y}-${pad(m + 1)}-${pad(lastDay)}`, key: `${y}-${pad(m + 1)}` }; };
const daysInMonth = key => { const [y, m] = key.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const dateDiff = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000) + 1;
const monthsInRange = (start, end) => {
  const res = []; let cur = start.slice(0, 7); const endKey = end.slice(0, 7); let guard = 0;
  while (cur <= endKey && guard < 36) {
    const [y, m] = cur.split('-').map(Number);
    const mStart = `${y}-${pad(m)}-01`;
    const mEnd = `${y}-${pad(m)}-${pad(new Date(y, m, 0).getDate())}`;
    const segStart = start > mStart ? start : mStart;
    const segEnd = end < mEnd ? end : mEnd;
    res.push({ key: cur, days: dateDiff(segStart, segEnd), totalDays: daysInMonth(cur) });
    let nm = m + 1, ny = y; if (nm > 12) { nm = 1; ny++; } cur = `${ny}-${pad(nm)}`; guard++;
  }
  return res;
};

const Card = ({ children, style = {}, onClick, draggable, onDragStart }) => (
  <div onClick={onClick} draggable={draggable} onDragStart={onDragStart} style={{ background: '#FFFFFF', borderRadius: 12, padding: 16, boxShadow: '0 1px 4px rgba(0,0,0,0.07)', border: '1px solid #E3E0DC', ...style }}>{children}</div>
);
const txtOn = hex => { const h = (hex || '').replace('#', ''); if (h.length !== 6) return 'white'; const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16); return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.65 ? '#1A1614' : 'white'; };
const Badge = ({ label, color }) => <span style={{ display: 'inline-block', padding: '2px 8px', borderRadius: 20, fontSize: 15, fontWeight: 600, color: txtOn(color), background: color, whiteSpace: 'nowrap' }}>{label}</span>;
const Bar = ({ v, m, h = 6 }) => { const p = Math.min(pct(v, m), 100); const bg = p >= 100 ? '#1FA463' : p >= 70 ? '#2D5FE0' : '#E08700'; return <div style={{ background: '#E3E0DC', borderRadius: 4, height: h, overflow: 'hidden' }}><div style={{ height: '100%', width: p + '%', background: bg, borderRadius: 4 }} /></div>; };
const Lbl = ({ c }) => <div style={{ fontSize: 16, color: '#6E6863', fontWeight: 500, marginBottom: 4 }}>{c}</div>;
const Sel = ({ value, onChange, opts, ph }) => (
  <select value={value} onChange={e => onChange(e.target.value)} style={{ width: '100%', padding: '8px 9px', borderRadius: 8, border: '1px solid #E3E0DC', fontSize: 17, background: 'white', boxSizing: 'border-box' }}>
    {ph ? <option value="">{ph}</option> : null}
    {opts.map(o => typeof o === 'object' ? <option key={o.v} value={o.v}>{o.l}</option> : <option key={o} value={o}>{o}</option>)}
  </select>
);
const Inp = ({ value, onChange, type = 'text', placeholder = '' }) => <input type={type} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} style={{ width: '100%', padding: '8px 9px', borderRadius: 8, border: '1px solid #E3E0DC', fontSize: 17, boxSizing: 'border-box' }} />;
const MoneyInput = ({ value, onChange, placeholder = '' }) => { const fmt = n => (n === '' || n === null || n === undefined || isNaN(Number(n))) ? '' : Number(n).toLocaleString(); return <input type="text" inputMode="numeric" value={fmt(value)} onChange={e => { const d = e.target.value.replace(/[^\d]/g, ''); onChange(d === '' ? '' : Number(d)); }} placeholder={placeholder} style={{ width: '100%', padding: '8px 9px', borderRadius: 8, border: '1px solid #E3E0DC', fontSize: 17, boxSizing: 'border-box' }} />; };
const inp = (val, set, type = 'text', ph = '') => <input type={type} value={val} onChange={e => set(e.target.value)} placeholder={ph} style={{ width: '100%', padding: '8px', borderRadius: 8, border: '1px solid #E3E0DC', fontSize: 17, boxSizing: 'border-box' }} />;
const Btn = ({ children, onClick, disabled, v = 'primary', style = {} }) => {
  let bg = G, color = 'white';
  if (disabled) bg = '#A29C95'; else if (v === 'gold') bg = GO; else if (v === 'secondary') { bg = '#E3E0DC'; color = '#3A3631'; } else if (v === 'ghost') { bg = 'transparent'; color = G; } else if (v === 'danger') bg = '#E53935';
  return <button onClick={onClick} disabled={disabled} style={{ padding: '9px 18px', borderRadius: 8, border: 'none', cursor: disabled ? 'not-allowed' : 'pointer', fontSize: 17, fontWeight: 600, background: bg, color, opacity: disabled ? 0.6 : 1, ...style }}>{children}</button>;
};
const EditBtn = ({ onClick }) => <button onClick={onClick} style={{ border: '1px solid #E3E0DC', background: 'white', borderRadius: 6, color: '#6E6863', cursor: 'pointer', fontSize: 14, padding: '2px 7px', fontWeight: 600 }}>수정</button>;
const SCards = ({ items }) => (
  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(130px,1fr))', gap: 10, marginBottom: 18 }}>
    {items.map(it => <Card key={it.label} onClick={it.onClick} style={{ textAlign: 'center', padding: 14, cursor: it.onClick ? 'pointer' : 'default', transition: 'transform .1s', border: it.onClick ? '1px solid #EDEBE7' : undefined }}><div style={{ fontSize: 22, fontWeight: 800, color: it.color }}>{it.value}</div><div style={{ fontSize: 15, color: '#6E6863', marginTop: 2 }}>{it.label}{it.onClick ? ' ›' : ''}</div></Card>)}
  </div>
);
const Chk = ({ on }) => <span style={{ width: 16, height: 16, borderRadius: 4, border: '2px solid ' + (on ? '#1FA463' : '#CBD5E1'), background: on ? '#1FA463' : 'white', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>{on ? <span style={{ color: 'white', fontSize: 14, fontWeight: 900 }}>✓</span> : null}</span>;
const FilterBar = ({ value, onChange }) => (
  <div style={{ display: 'flex', gap: 6, marginBottom: 14, flexWrap: 'wrap' }}>
    {['전체'].concat(MEMBERS).map(o => <button key={o} onClick={() => onChange(o)} style={{ padding: '6px 14px', borderRadius: 20, border: 'none', cursor: 'pointer', fontSize: 16, fontWeight: 600, background: value === o ? G : '#E3E0DC', color: value === o ? 'white' : '#3A3631' }}>{o === '전체' ? '전체' : AV[o] + ' ' + o}</button>)}
  </div>
);
const SyncBadge = ({ status, errMsg }) => {
  const cfg = { loading: { label: '⏳ 로딩 중...', bg: '#A29C95' }, saving: { label: '💾 저장 중...', bg: '#E08700' }, ok: { label: '✅ 실시간 연동', bg: '#1FA463' }, error: { label: '❌ ' + (errMsg || '오류'), bg: '#E53935' } };
  const c = cfg[status] || cfg.ok;
  return <span style={{ fontSize: 15, padding: '4px 10px', borderRadius: 20, background: c.bg, color: 'white', fontWeight: 600, whiteSpace: 'nowrap' }}>{c.label}</span>;
};

function FileModal({ subId, data, setData, onClose }) {
  const [file, setFile] = useState(null);
  const [desc, setDesc] = useState('');
  const [url, setUrl] = useState('');
  const [dragOver, setDragOver] = useState(false);
  const [uploading, setUploading] = useState(false);
  const [upErr, setUpErr] = useState('');
  const MAX = 5 * 1024 * 1024;
  const isLarge = file && file.size > MAX;
  const sub = data.subplans.find(s => s.id === subId);
  const plan = sub ? data.plans.find(p => p.id === sub.planId) : null;
  const output = plan ? data.outputs.find(o => o.id === plan.outputId) : null;
  const folderPath = `라이프밀/업무첨부/${output ? outLabel(output) : '기타'}/${plan ? plan.name : '기타'}`;
  const driveSearchUrl = `https://drive.google.com/drive/search?q=${encodeURIComponent(plan ? plan.name : '라이프밀')}`;
  const currentFiles = (data.subplans.find(s => s.id === subId) || {}).files || [];
  const delFile = id => setData(prev => ({ ...prev, subplans: prev.subplans.map(s => s.id === subId ? { ...s, files: (s.files || []).filter(f => f.id !== id) } : s) }));
  const save = () => {
    if (!file) { alert('파일을 선택하세요'); return; }
    const f = { id: Date.now(), name: file.name, size: file.size, driveUrl: url.trim(), desc: desc.trim(), uploadedAt: TODAY };
    setData(prev => ({ ...prev, subplans: prev.subplans.map(s => s.id === subId ? { ...s, files: [...(s.files || []), f] } : s) }));
    onClose();
  };
  const doUpload = async () => {
    if (!file) { alert('파일을 선택하세요'); return; }
    setUploading(true); setUpErr('');
    try {
      const sub2 = data.subplans.find(s => s.id === subId);
      const plan2 = sub2 ? data.plans.find(p => p.id === sub2.planId) : null;
      const out2 = plan2 ? data.outputs.find(o => o.id === plan2.outputId) : null;
      const folderId = await driveDeepFolder(['라이프밀', '업무첨부', out2 ? outLabel(out2) : '기타', plan2 ? plan2.name : '기타']);
      const r = await driveUploadFile(file, folderId);
      const f = { id: Date.now(), name: file.name, size: file.size, driveUrl: r.link, driveId: r.id, desc: desc.trim(), uploadedAt: TODAY };
      setData(prev => ({ ...prev, subplans: prev.subplans.map(s => s.id === subId ? { ...s, files: [...(s.files || []), f] } : s) }));
      onClose();
    } catch (e) { setUpErr(e.message || '업로드 실패'); } finally { setUploading(false); }
  };
  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'flex-start', justifyContent: 'center', zIndex: 200, padding: '24px 12px', overflowY: 'auto' }}>
      <div style={{ background: 'white', borderRadius: 16, width: '100%', maxWidth: 480, boxShadow: '0 10px 40px rgba(0,0,0,0.3)' }}>
        <div style={{ background: G, color: 'white', padding: '14px 20px', borderRadius: '16px 16px 0 0', display: 'flex', alignItems: 'center' }}>
          <span style={{ fontWeight: 800, fontSize: 19 }}>📎 파일 첨부</span>
          <button onClick={onClose} style={{ marginLeft: 'auto', background: 'none', border: 'none', color: 'white', fontSize: 26, cursor: 'pointer' }}>×</button>
        </div>
        <div style={{ padding: 20, display: 'flex', flexDirection: 'column', gap: 14, maxHeight: '80vh', overflowY: 'auto' }}>
          {currentFiles.length > 0 && (
            <div>
              <Lbl c="첨부된 파일" />
              {currentFiles.map(f => (
                <div key={f.id} style={{ background: '#F5F4F2', borderRadius: 8, padding: '8px 10px', marginBottom: 6 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <span style={{ fontSize: 20 }}>{f.name.match(/\.(png|jpg|jpeg|gif|webp)$/i) ? '🖼️' : '📄'}</span>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 16, fontWeight: 600 }}>{f.name}</div>
                      <div style={{ fontSize: 14, color: '#A29C95' }}>{fmtSize(f.size)} · {f.uploadedAt}</div>
                    </div>
                    {f.driveUrl && <a href={f.driveUrl} target="_blank" rel="noreferrer" style={{ fontSize: 15, color: '#2D5FE0', fontWeight: 600, textDecoration: 'none' }}>열기</a>}
                    <button onClick={() => delFile(f.id)} style={{ border: 'none', background: 'none', color: '#D1D5DB', cursor: 'pointer', fontSize: 20 }}>×</button>
                  </div>
                  {f.desc && <div style={{ fontSize: 15, color: '#6E6863', marginTop: 6, background: 'white', borderRadius: 6, padding: '5px 8px' }}>💬 {f.desc}</div>}
                </div>
              ))}
            </div>
          )}
          <div onDragOver={e => { e.preventDefault(); setDragOver(true); }} onDragLeave={() => setDragOver(false)}
            onDrop={e => { e.preventDefault(); setDragOver(false); setFile(e.dataTransfer.files[0]); }}
            onClick={() => document.getElementById('fu-input').click()}
            style={{ border: '2px dashed ' + (dragOver ? G : '#D1D5DB'), borderRadius: 12, padding: 24, textAlign: 'center', cursor: 'pointer', background: dragOver ? '#F5F4F2' : '#F5F4F2' }}>
            <div style={{ fontSize: 32, marginBottom: 6 }}>📁</div>
            <div style={{ fontSize: 17, color: '#6E6863' }}>드래그하거나 클릭해서 선택</div>
            <div style={{ fontSize: 15, color: '#A29C95', marginTop: 4 }}>선택하면 구글 드라이브로 바로 업로드돼요</div>
            <input id="fu-input" type="file" style={{ display: 'none' }} onChange={e => setFile(e.target.files[0])} />
          </div>
          {file && <div style={{ background: '#F5F4F2', borderRadius: 10, padding: 12, border: '1px solid #A7F3D0', display: 'flex', alignItems: 'center', gap: 8 }}>
            <span style={{ fontSize: 22 }}>{file.type.startsWith('image/') ? '🖼️' : '📄'}</span>
            <div style={{ flex: 1 }}><div style={{ fontSize: 17, fontWeight: 600 }}>{file.name}</div><div style={{ fontSize: 15, color: '#6E6863' }}>{fmtSize(file.size)}</div></div>
            {isLarge && <Badge label="대용량" color="#E08700" />}
          </div>}
          {file && (
            <div style={{ background: '#F5F4F2', borderRadius: 12, padding: 14, border: '1px solid #A7F3D0', display: 'flex', flexDirection: 'column', gap: 8 }}>
              <div style={{ fontSize: 17, fontWeight: 700, color: G }}>🚀 구글 드라이브에 바로 업로드</div>
              <div style={{ fontSize: 15, color: '#6E6863' }}>{folderPath} 폴더에 자동 저장되고, 링크만 대시보드에 기록됩니다. (처음 한 번 구글 로그인 필요)</div>
              {upErr && <div style={{ fontSize: 15, color: '#E53935', background: '#FEF2F2', borderRadius: 8, padding: '7px 10px' }}>⚠ {upErr}</div>}
              <button onClick={doUpload} disabled={uploading} style={{ padding: 11, background: uploading ? '#A29C95' : '#2D5FE0', color: 'white', border: 'none', borderRadius: 8, fontWeight: 700, fontSize: 17, cursor: uploading ? 'default' : 'pointer' }}>{uploading ? '업로드 중…' : '📤 드라이브에 업로드 후 첨부'}</button>
            </div>
          )}
          {file && (
            <details style={{ background: '#F5F4F2', borderRadius: 12, padding: '10px 14px', border: '1px solid #EDEBE7' }}>
              <summary style={{ fontSize: 16, color: '#6E6863', cursor: 'pointer' }}>직접 올린 링크로 기록하기 (수동)</summary>
              <div style={{ marginTop: 10, display: 'flex', flexDirection: 'column', gap: 8 }}>
                <a href={driveSearchUrl} target="_blank" rel="noreferrer" style={{ display: 'block', padding: 9, background: '#E3E0DC', color: '#3A3631', borderRadius: 8, textAlign: 'center', fontWeight: 600, textDecoration: 'none', fontSize: 16 }}>📂 드라이브 폴더 열기 →</a>
                <input value={url} onChange={e => setUrl(e.target.value)} placeholder="https://drive.google.com/..." style={{ width: '100%', padding: '8px 9px', borderRadius: 8, border: '1px solid #E3E0DC', fontSize: 17, boxSizing: 'border-box' }} />
              </div>
            </details>
          )}
          {file && (
            <div>
              <Lbl c="📝 파일 설명 (보고서 자동화에 활용)" />
              <textarea value={desc} onChange={e => setDesc(e.target.value)} placeholder="예: 6월 번들 상품 판매 추이 그래프 - 전월 대비 32% 증가"
                style={{ width: '100%', minHeight: 64, padding: '8px', borderRadius: 8, border: '1px solid #E3E0DC', fontSize: 17, boxSizing: 'border-box', resize: 'vertical', fontFamily: 'inherit' }} />
            </div>
          )}
          {file && url.trim() && <Btn onClick={save} style={{ width: '100%' }}>✅ 링크로 기록만 추가</Btn>}
          <Btn v="secondary" onClick={onClose} style={{ width: '100%' }}>닫기</Btn>
        </div>
      </div>
    </div>
  );
}

function DateBlock({ title, d, set, depOpts }) {
  const up = (k, val) => set({ ...d, [k]: val });
  const hideStart = title === '세부실행계획';
  return (
    <div style={{ background: '#F5F4F2', borderRadius: 10, padding: 12, marginTop: 8, border: '1px solid #EDEBE7' }}>
      <div style={{ fontSize: 16, fontWeight: 700, color: G, marginBottom: 8 }}>{title} 일정</div>
      <label style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 16, cursor: 'pointer', marginBottom: 8 }}><input type="checkbox" checked={d.useDep} onChange={e => up('useDep', e.target.checked)} /> 선행 업무 완료 후 시작</label>
      {d.useDep ? (
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 110px', gap: 8 }}>
          <div><Lbl c="선행 업무" /><Sel value={d.depId} onChange={v => up('depId', v)} opts={depOpts} ph="선택..." /></div>
          <div><Lbl c="완료 후 +일수" /><Inp type="number" value={d.depDays} onChange={v => up('depDays', v)} placeholder="7" /></div>
        </div>
      ) : hideStart ? (
        <div><Lbl c="마감일 (데드라인)" /><Inp type="date" value={d.due} onChange={v => up('due', v)} /></div>
      ) : (
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
          <div><Lbl c="시작일" /><Inp type="date" value={d.start} onChange={v => up('start', v)} /></div>
          <div><Lbl c="마감일" /><Inp type="date" value={d.due} onChange={v => up('due', v)} /></div>
        </div>
      )}
    </div>
  );
}

const MONTH_OPTS = (() => { const arr = []; const d = new Date(TODAY + 'T00:00:00'); for (let i = -2; i <= 9; i++) { const x = new Date(d.getFullYear(), d.getMonth() + i, 1); arr.push(`${x.getFullYear()}-${pad(x.getMonth() + 1)}`); } return arr; })();

const KpiInput = ({ value, onChange, existingTargets }) => {
  const set = (k, v) => {
    if (k === 'month') { const t = (existingTargets || {})[v]; onChange({ ...value, month: v, target: (t != null ? String(t) : (value.target || '')) }); }
    else onChange({ ...value, [k]: v });
  };
  return (
    <div style={{ background: '#F5F4F2', borderRadius: 10, padding: 12, border: '1px solid #A7F3D0', marginTop: 8 }}>
      <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap: 6, marginBottom: 8 }}>

        <div><Lbl c="단위" /><Inp value={value.unit} onChange={v => set('unit', v)} placeholder="원/명/%" /></div>

const genKpiId = () => 'k' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36);
const buildKpi = (st, existing) => {
  if (!st || !st.name) return null;
  const targets = { ...((existing && existing.targets) || {}) };

  return { id: (existing && existing.id) || genKpiId(), name: st.name, unit: st.unit || '', target: Number(st.target) || 0, targets };
};

  const ownSubs = kind === 'plan' ? data.subplans.filter(s => s.planId === item.id) : [];
  const childPlans = kind === 'output' ? plansOfOut(data, item.id) : [];
  const childSubs = kind === 'plan' ? subsOfPlanAll(data, item.id) : [];
  const linkN = kind === 'plan' ? planLinkN(item) : kind === 'subplan' ? subLinkN(item) : 1;
  const multiLinked = linkN > 1;
  const hereId = kind === 'plan' ? (target.from != null ? Number(target.from) : item.outputId) : kind === 'subplan' ? (target.from != null ? Number(target.from) : item.planId) : null;
  const hereLabel = kind === 'plan' ? (() => { const o = data.outputs.find(x => x.id === hereId); return o ? outLabel(o) : '현재 위치'; })() : kind === 'subplan' ? (() => { const p = data.plans.find(x => x.id === hereId); return p ? p.name : '현재 위치'; })() : '';
  const delHereOnly = () => { setData(d => kind === 'plan' ? unlinkPlanFrom(d, item.id, hereId) : unlinkSubFrom(d, item.id, hereId)); onClose(); };
  const subChks = kind === 'subplan' ? sortChksByDate(data.checklists.filter(c => c.subplanId === item.id)) : [];

  const mkKpi = () => kpiOn ? buildKpi(kpi, item.kpi) : null;
  const addPlanKpi = () => setPlanKpis(ks => [...ks, { id: genKpiId(), name: '', unit: '%', target: '', targets: {}, outputId: null }]);
  const updPlanKpi = (i, f2, v) => setPlanKpis(ks => ks.map((k, j) => j === i ? { ...k, [f2]: v } : k));
  const delPlanKpi = i => setPlanKpis(ks => ks.filter((_, j) => j !== i));

  const save = () => {
    if (!name.trim()) { alert('이름 입력'); return; }
    if (kind === 'output') {
      setData(d => ({ ...d, outputs: d.outputs.map(o => o.id === item.id ? { ...o, name: name.trim(), kpi: mkKpi() } : o) }));
      onClose(); return;
    }
    const dep = parseDep(ds);
    const f = { name: name.trim(), owner, support: support.slice(), start: dep ? '' : ds.start, due: dep ? addDays(TODAY, dep.days) : ds.due, dep, resolved: false };
    if (kind === 'subplan') {
      f.stage = stage;
      if (stage === '완료' && !item.completedAt) f.completedAt = TODAY;
      if (showOutputChg && newPlanId) f.planId = Number(newPlanId);
      if (showOutputChg) { const rep0 = newPlanId ? Number(newPlanId) : item.planId; f.extraPlanIds = xPlan.filter(x => x !== rep0); }
    }
    if (kind === 'plan') { f.kpis = planKpis.filter(k => (k.name || '').trim()).map(k => ({ id: k.id, name: k.name.trim(), unit: (k.unit || '').trim() || '%', target: Number(k.target) || 0, targets: k.targets || {}, outputId: k.outputId != null ? Number(k.outputId) : null })); f.kpi = null; f.hold = hold; f.desc = desc; if (showOutputChg) { const rep0 = newOutputId ? Number(newOutputId) : item.outputId; f.outputId = rep0; f.extraOutputIds = xOut.filter(x => x !== rep0); } }
    setData(d => resolveAll(kind === 'plan' ? { ...d, plans: d.plans.map(p => p.id === item.id ? { ...p, ...f } : p) } : { ...d, subplans: d.subplans.map(s => s.id === item.id ? { ...s, ...f } : s) }));
    onClose();
  };

  const del = () => { setData(d => moveToTrash(d, kind, item.id)); onClose(); };

  const addChildPlan = () => { if (!newChild.trim()) return; const nv = data.nid + 1; setData(d => ({ ...d, nid: d.nid + 1, plans: [...d.plans, { id: d.nid + 1, outputId: item.id, name: newChild.trim(), start: '', due: '', owner: ['현수'], support: [], kpis: [], dep: null, resolved: false, hold: false }] })); setNewChild(''); onSwitch && onSwitch({ kind: 'plan', id: nv }); };
  const addChildSub = () => { if (!newChild.trim()) return; const nv = data.nid + 1; setData(d => ({ ...d, nid: d.nid + 1, subplans: [...d.subplans, { id: d.nid + 1, planId: item.id, name: newChild.trim(), stage: '예정', start: '', due: '', owner: (ownersOf(item).length ? ownersOf(item) : ['현수']), support: [], dep: null, resolved: false, files: [], perfRecorded: false, kpis: [] }] })); setNewChild(''); onSwitch && onSwitch({ kind: 'subplan', id: nv }); };
  const movePlanChild = (id, dir) => setData(d => ({ ...d, plans: reorderSiblings(d.plans, id, 'outputId', dir) }));
  const toggleSubChk = id => setData(d => ({ ...d, checklists: d.checklists.map(c => c.id === id ? { ...c, done: !c.done } : c) }));
  const delSubChk = id => setData(d => ({ ...d, checklists: d.checklists.filter(c => c.id !== id) }));
  const setSubChkDate = (id, date) => setData(d => applyChklDate(d, id, date));
  const setSubChkOwner = (id, owner) => setData(d => ({ ...d, checklists: d.checklists.map(c => c.id === id ? { ...c, owner } : c) }));
  const setSubChkMemo = (id, memo) => setData(d => ({ ...d, checklists: d.checklists.map(c => c.id === id ? { ...c, memo } : c) }));
  const addSubChk = () => { if (!newSubChk.trim()) return; setData(d => ({ ...d, nid: d.nid + 1, checklists: [...d.checklists, { id: d.nid + 1, subplanId: item.id, text: newSubChk.trim(), done: false, date: '', owner: '', memo: '' }] })); setNewSubChk(''); };
  const setSubChkText = (id, text) => setData(d => ({ ...d, checklists: d.checklists.map(c => c.id === id ? { ...c, text } : c) }));
  const reorderSubChks = newOrder => setData(d => { const cur = d.checklists.filter(c => c.subplanId === item.id); const q = newOrder.map(x => cur.find(c => c.id === x.id)).filter(Boolean); if (q.length !== cur.length) return d; let k = 0; return { ...d, checklists: d.checklists.map(c => c.subplanId === item.id ? q[k++] : c) }; });
  const moveSubChild = (id, dir) => setData(d => ({ ...d, subplans: reorderSiblings(d.subplans, id, 'planId', dir) }));

  const titleMap = { output: '출력 프로젝트 수정', plan: '실행계획 수정', subplan: '세부실행계획 수정' };
  const kpiBlock = kind === 'output' ? (
    <div>
      <label style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 17, fontWeight: 700, color: G, cursor: 'pointer' }}><input type="checkbox" checked={kpiOn} onChange={e => setKpiOn(e.target.checked)} /> KPI (프로젝트 단위)</label>
      {kpiOn && <><KpiInput value={kpi} onChange={setKpi} existingTargets={(item.kpi && item.kpi.targets) || {}} /><div style={{ fontSize: 15, color: '#A29C95', marginTop: 6 }}>※ 프로젝트 KPI는 소속 실행계획 KPI들의 성과 합계로 집계됩니다.</div></>}
    </div>
  ) : (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}><span style={{ fontSize: 17, fontWeight: 700, color: G }}>🎯 KPI ({planKpis.length})</span><button onClick={addPlanKpi} style={{ marginLeft: 'auto', fontSize: 16, padding: '4px 11px', borderRadius: 7, border: 'none', background: GO, color: 'white', cursor: 'pointer', fontWeight: 700 }}>+ KPI 추가</button></div>
      {planKpis.length === 0 ? <div style={{ fontSize: 16, color: '#A29C95', marginTop: 8 }}>등록된 KPI가 없습니다. 여러 개 추가할 수 있어요.</div> :
        planKpis.map((k, i) => (
          <div key={k.id} style={{ background: '#F5F4F2', borderRadius: 10, padding: 12, border: '1px solid #A7F3D0', marginTop: 8 }}>
            <div style={{ display: 'flex', gap: 6, marginBottom: 6 }}>
              <div style={{ flex: 2 }}><Lbl c="KPI명" /><Inp value={k.name} onChange={v => updPlanKpi(i, 'name', v)} placeholder="예: 전환율 / 신규고객" /></div>
              <div style={{ flex: 1 }}><Lbl c="단위" /><Inp value={k.unit} onChange={v => updPlanKpi(i, 'unit', v)} placeholder="%/명/원" /></div>
              <button onClick={() => delPlanKpi(i)} style={{ alignSelf: 'flex-end', border: 'none', background: '#FEE2E2', color: '#E53935', borderRadius: 8, width: 36, height: 38, cursor: 'pointer', fontSize: 20 }}>×</button>
            </div>
            <div><Lbl c="기본 목표값" /><Inp type="number" value={k.target} onChange={v => updPlanKpi(i, 'target', v)} placeholder="목표값 (월별 목표는 KPI 탭에서)" /></div>
            {planLinkOuts.length > 1 && <div style={{ marginTop: 6 }}><Lbl c="집계 프로젝트" /><Sel value={String(k.outputId != null ? k.outputId : planRepOut)} onChange={v => updPlanKpi(i, 'outputId', Number(v))} opts={planLinkOuts.map(oid => { const oo = data.outputs.find(x => x.id === oid); return { v: String(oid), l: oo ? outLabel(oo) : ('#' + oid) }; })} /><div style={{ fontSize: 14, color: '#A29C95', marginTop: 3 }}>이 KPI 를 어느 프로젝트 KPI 로 합산할지 선택합니다.</div></div>}
          </div>
        ))}
      <div style={{ fontSize: 15, color: '#A29C95', marginTop: 6 }}>※ 달성값은 [업무 성과] 탭에서 KPI별로 기록하고, 월별 목표는 [KPI] 탭에서 설정합니다.</div>
    </div>
  );

  return (
    <ModalShell title={titleMap[kind]} onClose={onClose} onBack={canBack ? onBack : null}>
      <div><Lbl c="이름" /><Inp value={name} onChange={setName} /></div>
      {kind === 'plan' && <div><Lbl c="간략 설명" /><textarea value={desc} onChange={e => setDesc(e.target.value)} rows={3} placeholder="이 실행계획의 목표·맥락을 간단히 (예: 쇼핑검색광고를 운영할 수 있는 시스템 구축이 최종 목표. 이후 이 시스템으로 반복 운영)" style={{ width: '100%', boxSizing: 'border-box', fontSize: 17, padding: '9px 11px', border: '1px solid #E3E0DC', borderRadius: 9, outline: 'none', resize: 'vertical', fontFamily: 'inherit', lineHeight: 1.5 }} /></div>}

      {kind === 'plan' && (
        <div>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 6 }}>
            <Lbl c="연결된 프로젝트" />
            <button onClick={() => setShowOutputChg(!showOutputChg)} style={{ fontSize: 15, padding: '3px 10px', borderRadius: 6, border: '1px solid ' + G, background: showOutputChg ? G : 'white', color: showOutputChg ? 'white' : G, cursor: 'pointer', fontWeight: 600 }}>연결 변경</button>
          </div>
          {!showOutputChg ? (
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 16, color: '#3A3631', background: '#F5F4F2', padding: '8px 10px', borderRadius: 8 }}>
              <span style={{ flex: 1, minWidth: 0 }}>{(() => { const oo = data.outputs.find(x => x.id === item.outputId); return oo ? outLabel(oo) : '없음'; })()}</span>
              {planLinkN(item) > 1 && <button onClick={() => setLinkStat({ kind: 'plan', id: item.id })} title="다른 곳에도 연결됨 — 연결 현황 보기" style={{ border: '1px solid #C8A24A', background: '#FFF9E8', color: '#8A6A12', borderRadius: 7, padding: '3px 9px', fontSize: 14, fontWeight: 700, cursor: 'pointer', flexShrink: 0 }}>🔗 다른 곳에도 연결됨 {planLinkN(item)}</button>}
            </div>
          ) : (
            <div style={{ background: '#F5F4F2', borderRadius: 10, padding: 12, border: '1px solid #A7F3D0' }}>
              <div style={{ marginBottom: 8 }}><Lbl c="대표 프로젝트 (집계 기준)" /><Sel value={newOutputId} onChange={v => { setNewOutputId(v); setXOut(a => a.filter(x => x !== Number(v))); }} opts={data.outputs.map(o => ({ v: String(o.id), l: outLabel(o) }))} ph="선택..." /></div>
              <Lbl c="추가 연결 (여러 곳 선택 가능)" />
              <div style={{ display: 'flex', flexDirection: 'column', gap: 4, maxHeight: 190, overflowY: 'auto' }}>
                {data.outputs.filter(o => o.id !== Number(newOutputId)).map(o => (
                  <div key={o.id} onClick={() => toggleXOut(o.id)} style={{ display: 'flex', alignItems: 'center', gap: 8, background: 'white', border: '1px solid ' + (xOut.indexOf(o.id) >= 0 ? G : '#E3E0DC'), borderRadius: 8, padding: '6px 9px', cursor: 'pointer', fontSize: 16 }}>
                    <Chk on={xOut.indexOf(o.id) >= 0} /><span style={{ flex: 1, minWidth: 0 }}>{outLabel(o)}</span>
                  </div>
                ))}
              </div>
              <div style={{ fontSize: 15, color: '#A29C95', marginTop: 6, lineHeight: 1.5 }}>※ 진행률·예산·KPI 집계는 <b>대표 프로젝트</b> 한 곳에서만 이뤄지고, 추가 연결한 곳에는 목록에 함께 표시만 됩니다.</div>
            </div>
          )}
        </div>
      )}

      {kind === 'subplan' && (
        <div>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 6 }}>
            <Lbl c="연결된 출력/실행계획" />
            <button onClick={() => setShowOutputChg(!showOutputChg)} style={{ fontSize: 15, padding: '3px 10px', borderRadius: 6, border: '1px solid ' + G, background: showOutputChg ? G : 'white', color: showOutputChg ? 'white' : G, cursor: 'pointer', fontWeight: 600 }}>출력 연결 변경</button>
          </div>
          {!showOutputChg ? (
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 16, color: '#3A3631', background: '#F5F4F2', padding: '8px 10px', borderRadius: 8 }}>
              <span style={{ flex: 1, minWidth: 0 }}>{currentOutput ? outLabel(currentOutput) : '없음'} {currentPlan ? '▸ ' + currentPlan.name : ''}</span>
              {subLinkN(item) > 1 && <button onClick={() => setLinkStat({ kind: 'subplan', id: item.id })} title="다른 곳에도 연결됨 — 연결 현황 보기" style={{ border: '1px solid #C8A24A', background: '#FFF9E8', color: '#8A6A12', borderRadius: 7, padding: '3px 9px', fontSize: 14, fontWeight: 700, cursor: 'pointer', flexShrink: 0 }}>🔗 다른 곳에도 연결됨 {subLinkN(item)}</button>}
            </div>
          ) : (
            <div style={{ background: '#F5F4F2', borderRadius: 10, padding: 12, border: '1px solid #A7F3D0' }}>
              <div style={{ marginBottom: 8 }}><Lbl c="출력 프로젝트" /><Sel value={newOutputId} onChange={v => { setNewOutputId(v); setNewPlanId(''); }} opts={data.outputs.map(o => ({ v: String(o.id), l: outLabel(o) }))} ph="선택..." /></div>
              <div style={{ marginBottom: 8 }}><Lbl c="대표 실행계획 (집계 기준)" /><Sel value={newPlanId} onChange={v => { setNewPlanId(v); setXPlan(a => a.filter(x => x !== Number(v))); }} opts={chgPlans.map(p => ({ v: String(p.id), l: p.name }))} ph="선택..." /></div>
              <Lbl c="추가 연결 실행계획 (여러 곳 선택 가능)" />
              <div style={{ display: 'flex', flexDirection: 'column', gap: 4, maxHeight: 190, overflowY: 'auto' }}>
                {data.plans.filter(p => p.id !== Number(newPlanId)).map(p => { const po = data.outputs.find(o => o.id === p.outputId); return (
                  <div key={p.id} onClick={() => toggleXPlan(p.id)} style={{ display: 'flex', alignItems: 'center', gap: 8, background: 'white', border: '1px solid ' + (xPlan.indexOf(p.id) >= 0 ? G : '#E3E0DC'), borderRadius: 8, padding: '6px 9px', cursor: 'pointer', fontSize: 16 }}>
                    <Chk on={xPlan.indexOf(p.id) >= 0} /><span style={{ flex: 1, minWidth: 0 }}>{p.name}<span style={{ color: '#A29C95', fontSize: 14 }}> · {po ? outLabel(po) : '-'}</span></span>
                  </div>
                ); })}
              </div>
              <div style={{ fontSize: 15, color: '#A29C95', marginTop: 6, lineHeight: 1.5 }}>※ 진행률·예산·KPI 집계는 <b>대표 실행계획</b> 한 곳에서만 이뤄지고, 추가 연결한 곳에는 목록에 함께 표시만 됩니다.</div>
            </div>
          )}
        </div>
      )}

      {kind === 'subplan' && <DateBlock title="세부실행계획" d={ds} set={setDs} depOpts={depOpts} />}
      {kind === 'subplan' && <div><Lbl c="상태" /><div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>{STAGES.map(st => <button key={st} onClick={() => setStage(st)} style={{ padding: '7px 12px', borderRadius: 8, border: 'none', cursor: 'pointer', fontSize: 16, fontWeight: 600, background: stage === st ? stC(st) : '#E3E0DC', color: stage === st ? 'white' : '#3A3631' }}>{st}</button>)}</div></div>}
      {kind === 'subplan' && (
        <div style={{ background: '#F5F4F2', borderRadius: 10, padding: 12, border: '1px solid #EDEBE7' }}>
          <div style={{ display: 'flex', alignItems: 'center', marginBottom: 8 }}><div style={{ fontSize: 17, fontWeight: 700, color: G }}>☑ 체크리스트 ({subChks.length})</div>{subChks.length > 1 && <button onClick={() => setShowChkReorder(true)} title="드래그가 어려울 때: 목록에서 한 번에 순서 변경" style={{ marginLeft: 'auto', fontSize: 15, padding: '3px 10px', borderRadius: 6, border: '1px solid ' + G, background: 'white', color: G, cursor: 'pointer', fontWeight: 600 }}>⠿ 순서 변경</button>}</div>
          {subChks.length > 0 && <div style={{ fontSize: 15, color: '#A29C95', marginBottom: 8, lineHeight: 1.5 }}>실행일이 빠른 순으로 자동 정렬됩니다. 같은 날짜끼리는 왼쪽 ⠿ 를 잡고 끌어서 순서를 바꿀 수 있어요(항목명은 칸을 눌러 바로 수정).</div>}
          {subChks.length === 0 ? <div style={{ fontSize: 16, color: '#A29C95', marginBottom: 8 }}>등록된 체크리스트가 없습니다</div> :
            subChks.map(c => (
              <div key={c.id} style={{ marginBottom: 5 }}>
                <div {...chkDrag.row(c.id)} style={{ display: 'flex', alignItems: 'center', gap: 6, background: 'white', borderRadius: 8, padding: '7px 10px', border: '1px solid #E3E0DC', flexWrap: 'wrap', ...chkDrag.hl(c.id) }}>
                  <span {...chkDrag.arm(c.id)} title="여기를 잡고 끌어서 순서 변경" style={{ cursor: 'grab', color: '#C4BDB4', fontSize: 18, lineHeight: 1, padding: '0 1px', flexShrink: 0, userSelect: 'none' }}>⠿</span>
                  <span onClick={() => toggleSubChk(c.id)} style={{ cursor: 'pointer', display: 'flex' }}><Chk on={c.done} /></span>
                  <input value={c.text || ''} onChange={e => setSubChkText(c.id, e.target.value)} placeholder="체크리스트 명" title="클릭해서 이름 수정" style={{ flex: 1, minWidth: 90, fontSize: 16, fontWeight: 600, padding: '5px 7px', border: '1px solid #E3E0DC', borderRadius: 6, outline: 'none', background: 'white', boxSizing: 'border-box', fontFamily: 'inherit', color: c.done ? '#A29C95' : '#3A3631', textDecoration: c.done ? 'line-through' : 'none' }} />
                  <button onClick={() => setMemoOpen(o => o === c.id ? null : c.id)} title="메모" style={{ border: 'none', background: (c.memo || memoOpen === c.id) ? '#EEF4EC' : 'transparent', borderRadius: 6, cursor: 'pointer', fontSize: 17, padding: '2px 5px', lineHeight: 1, color: c.memo ? '#1FA463' : '#A29C95', flexShrink: 0 }}>📝</button>
                  <select value={c.owner || ''} onChange={e => setSubChkOwner(c.id, e.target.value)} title="담당자" style={{ fontSize: 14.5, padding: '3px 4px', border: '1px solid #E3E0DC', borderRadius: 6, color: c.owner ? '#3A3631' : '#A29C95', background: 'white', maxWidth: 88 }}><option value="">담당 없음</option>{MEMBERS.map(m => <option key={m} value={m}>{m}</option>)}</select>
                  <input type="date" value={c.date || ''} onChange={e => setSubChkDate(c.id, e.target.value)} title="실행일" style={{ fontSize: 15, padding: '3px 5px', border: '1px solid #E3E0DC', borderRadius: 6, color: c.date ? '#3A3631' : '#A29C95', flexShrink: 0, maxWidth: 130 }} />
                  <button onClick={() => delSubChk(c.id)} style={{ border: 'none', background: 'none', color: '#E53935', cursor: 'pointer', fontSize: 20, lineHeight: 1 }}>×</button>
                </div>
                {memoOpen === c.id && <textarea value={c.memo || ''} onChange={e => setSubChkMemo(c.id, e.target.value)} placeholder="메모 입력" autoFocus style={{ width: '100%', minHeight: 52, marginTop: 4, padding: '7px 9px', border: '1px solid #CDE3C6', borderRadius: 7, fontSize: 16, boxSizing: 'border-box', resize: 'vertical', fontFamily: 'inherit', lineHeight: 1.5, color: '#3A3631' }} />}
              </div>
            ))}
          <div style={{ display: 'flex', gap: 6, marginTop: 8 }}>
            <input value={newSubChk} onChange={e => setNewSubChk(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') addSubChk(); }} placeholder="새 체크리스트 항목" style={{ flex: 1, padding: '8px 9px', borderRadius: 8, border: '1px solid #E3E0DC', fontSize: 17 }} />
            <Btn v="gold" onClick={addSubChk} style={{ padding: '8px 14px' }}>+ 추가</Btn>
          </div>
        </div>
      )}
      {kind === 'subplan' && (
        <div style={{ background: '#F5F4F2', borderRadius: 10, padding: 12, border: '1px solid #EDEBE7' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>

      {kind === 'subplan' && <SupportEditor support={support} setSupport={setSupport} />}

      {kind === 'plan' && <div><Lbl c="담당자 (다중 선택)" /><MemberMulti selected={owner} onToggle={m => setOwner(owner.includes(m) ? owner.filter(x => x !== m) : [...owner, m])} /></div>}

            childPlans.map(p => { const subs = subsOfPlanAll(data, p.id); const done = subs.filter(s => s.stage === '완료').length; const own = p.outputId === item.id; const dragOk = own && ownPlans.length > 1; return (
              <div key={p.id} {...planDrag.row(p.id)} {...planDrag.arm(p.id)} style={{ display: 'flex', alignItems: 'center', gap: 8, background: own ? 'white' : '#FDFBF4', borderRadius: 8, padding: '8px 10px', marginBottom: 5, border: '1px solid ' + (own ? '#E3E0DC' : '#EBD9A8'), cursor: dragOk ? 'grab' : 'default', ...planDrag.hl(p.id) }}>
