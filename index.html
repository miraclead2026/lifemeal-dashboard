function TabDecisions({ decs, decErr, data, setData }) {
  const [fDom, setFDom] = useState('전체');
  const [fType, setFType] = useState('전체');
  const [notes, setNotes] = useState({});
  const [busy, setBusy] = useState('');
  const [err, setErr] = useState('');
  const [last, setLast] = useState(null);
  const [showExp, setShowExp] = useState(false);
  const [seeding, setSeeding] = useState(false);
  const [snoozeD, setSnoozeD] = useState({});   // 카드별로 고른 보류 기간(일). 비어 있으면 기본 7일
  const [openSnz, setOpenSnz] = useState(false); // 보류 중 목록 펼침
  const [otherOpen, setOtherOpen] = useState({}); // [기타 — 직접 입력]을 켠 카드. 켜져 있으면 메모가 필수다
  const [fixed, setFixed] = useState([]);       // 이번 세션에 문안을 맞춘 시드 카드 id
  const [stuck, setStuck] = useState([]);       // 문안이 바뀌기 전에 이미 답해버린 시드 카드 id
  const fixTried = useRef({});                  // 카드당 1회만 시도 — 실패 시에만 다시 연다
  const [confirmNow, setConfirmNow] = useState(''); // [지금 반영] 확인 단계에 들어간 카드
  const [confirmDsc, setConfirmDsc] = useState(''); // [폐기] 확인 단계에 들어간 카드
  const [dscNote, setDscNote] = useState({});   // 카드별 폐기 사유. 비어 있으면 폐기되지 않는다
  const [openDsc, setOpenDsc] = useState(false); // 「폐기됨」 목록 펼침
  const [openHelp, setOpenHelp] = useState(false); // [index_153] 배경 설명 접기 — 기본은 접힘
  const [openNote, setOpenNote] = useState(false); // [index_153] 화면 안내(문안 교정 등) 접기
  const [tick, setTick] = useState(0);          // 30초마다 다시 그려 '다음 반영 시각'이 굳지 않게 한다

  // 시계가 필요한 이유: 다음 반영 시각과 되돌리기 잔여 분은 시간이 지나면 저절로 바뀌는데,
  // 화면은 스냅샷이 올 때만 다시 그려진다. 답하고 가만히 보고 있으면 14:00 이 지나도
  // '다음 반영 14:00' 이 그대로 남아 거짓말이 된다.
  useEffect(() => {
    const t = setInterval(() => setTick(x => x + 1), 30000);
    return () => clearInterval(t);
  }, []);

  // [index_152] 자동 반영 상태. 화면 문구와 [지금 반영] 노출이 전부 여기서 갈린다.
  const applyMode = decApplyMode(decs && decs.meta);
  const applyOn = applyMode === DEC_APPLY_ON;
  const loading = !decs || decs.list === null;
  const list = (decs && decs.list) || [];
  const readErr = (decs && decs.err) || decErr || '';

  // 클릭 = 즉시 저장. 확인 모달 없음(한 번 클릭으로 끝나야 한다).
  // 대신 오클릭을 살릴 수 있게 '방금 저장' 줄을 띄운다 — 실행 전이면 되돌릴 수 있다.
  const save = (c, key) => {
    if (busy) return;
    const note = (notes[c._key] || '').trim();
    // [기타]만 즉시 저장의 예외다 — 메모가 곧 답이라 비어 있으면 저장할 것이 없다.
    // 버튼도 비활성이지만, 키보드·자동화로 들어오는 경로까지 여기서 한 번 더 막는다.
    if (key === DEC_OTHER && !note) { setErr('[기타]는 내용을 적어야 저장됩니다 — 아래 칸에 한 줄 적어주세요.'); return; }
    setBusy(c._key); setErr('');
    const patch = {
      answer: key,
      answerNote: note || null,
      answeredAt: new Date().toISOString(),
      status: 'answered',
      snoozedUntil: null,   // 답이 나왔으면 남아 있던 스누즈는 의미가 없다
    };
    db.ref(DEC_PATH + '/' + c._key).update(patch).then(() => {
      setBusy('');
      // 토스트에도 강등된 경로를 쓴다 — other 를 '곧 실행합니다'로 안내하면 그게 곧 오해다.
      setLast({ kind: 'answer', key: c._key, title: c.title, label: decOptLabel(c, key), route: (key === DEC_OTHER ? 'vault' : c.route) });
      setNotes(n => { const m = { ...n }; delete m[c._key]; return m; });
      setOtherOpen(s => { const m = { ...s }; delete m[c._key]; return m; });
    }).catch(e => { setBusy(''); setErr((e && e.message) || '저장 실패'); });
  };
  // 보류 = 답이 아니다. status 를 건드리지 않고 snoozedUntil 만 민다.
  // 그래서 그 날짜가 지나면 저절로 대기 목록으로 돌아온다 — 재등록해 줄 사람이 필요 없다.
  const snooze = (c) => {
    if (busy) return;
    const d = Number(snoozeD[c._key] || DEC_SNOOZE_D) || DEC_SNOOZE_D;
    setBusy(c._key); setErr('');
    const until = new Date(Date.now() + d * 86400000).toISOString();
    const note = (notes[c._key] || '').trim();
    const cnt = (Number(c.snoozeCount) || 0) + 1;
    // snoozeCount = 이 카드를 몇 번 미뤘는지. 허브 승인 6번째 필드.
    // 답이 나와도 초기화하지 않는다 — '네 번 미루고서야 답한 질문'이라는 사실 자체가 기록이다.
    const patch = { snoozedUntil: until, snoozeCount: cnt };
    // 빈 값으로 덮어 기존 메모를 지우지 않는다. 적었을 때만 '왜 미뤘는지'로 남긴다.
    if (note) patch.answerNote = note;
    db.ref(DEC_PATH + '/' + c._key).update(patch).then(() => {
      setBusy('');
      setLast({ kind: 'snooze', key: c._key, title: c.title, days: d, until: until, count: cnt });
      setNotes(n => { const m = { ...n }; delete m[c._key]; return m; });
    }).catch(e => { setBusy(''); setErr((e && e.message) || '보류 실패'); });
  };
  // back=true 는 '방금 누른 보류를 취소'다 — 오클릭이므로 횟수도 같이 되돌린다.
  // 보류 목록의 '지금 다시 보기'는 back 없이 부른다: 미룬 건 실제로 있었던 일이라 횟수를 남긴다.
  const unsnooze = (k, back) => {
    if (busy) return;
    setBusy(k); setErr('');
    const patch = { snoozedUntil: null };
    if (back) {
      const cur = list.filter(c => c._key === k)[0];
      const n = Number(cur && cur.snoozeCount) || 0;
      if (n > 0) patch.snoozeCount = n - 1;
    }
    db.ref(DEC_PATH + '/' + k).update(patch)
      .then(() => { setBusy(''); setLast(l => (l && l.key === k) ? null : l); })
      .catch(e => { setBusy(''); setErr((e && e.message) || '되돌리기 실패'); });
  };
  // ── [지금 반영] ────────────────────────────────────────────────────────────
  // 대시보드가 쓰는 7·8번째 필드(허브 승인). applyNow 는 true 만 쓰고, 요청 시각을
  // applyAskedAt 에 같이 남긴다. 둘 다 끄지 않는다 — 끄는 건 처리한 에이전트 몫이다.
  // 정기 반영은 답한 지 10분 지난 것만 처리해 되돌리기 창을 지킨다. 이 버튼은 그 창을 버린다.
  // 그래서 [기타]와 같은 방식으로 한 단계 확인을 둔다: 되돌릴 수 없는 일에는 확인이 있어야 한다.
  const applyNowReq = (c) => {
    if (busy) return;
    setBusy(c._key); setErr('');
    db.ref(DEC_PATH + '/' + c._key).update({ applyNow: true, applyAskedAt: new Date().toISOString() }).then(() => {
      setBusy('');
      setConfirmNow('');
      // 즉시 반영을 요청한 순간 이 카드의 '방금 저장' 되돌리기 줄은 거짓이 된다.
      // 에이전트가 5분 안에 가져가므로 되돌릴 수 있다고 안내하면 안 된다.
      setLast(l => (l && l.key === c._key) ? null : l);
    }).catch(e => { setBusy(''); setErr((e && e.message) || '반영 요청 실패'); });
  };

  // ── [폐기] ────────────────────────────────────────────────────────────────
  // 답하지 않고 카드를 내린다. 잘못 만들어진 질문에 억지로 답하게 두지 않기 위한 출구다.
  // answer 계열은 쓰지 않는다 — 폐기는 답이 아니고, 답으로 기록되면 볼트가 거짓말을 한다.
  // snoozedUntil 도 지우지 않는다: 종착 상태라 decEff 가 스누즈 분기를 타지 않고,
  // 쓰는 필드를 늘리면 서버 규칙 표면만 넓어진다.
  const discard = (c) => {
    if (busy) return;
    const note = (dscNote[c._key] || '').trim();
    if (!note) { setErr('폐기 사유를 적어야 합니다 — 되돌릴 수 없는 일이라 이유가 남아야 합니다.'); return; }
    setBusy(c._key); setErr('');
    db.ref(DEC_PATH + '/' + c._key).update({
      status: DEC_DISCARD,
      discardedAt: new Date().toISOString(),
      discardNote: note,
    }).then(() => {
      setBusy('');
      setConfirmDsc('');
      setDscNote(n => { const m = { ...n }; delete m[c._key]; return m; });
      // 되돌리기 줄을 띄우지 않는다. 폐기는 되돌릴 수 없으므로 띄우면 그게 곧 거짓말이다.
      setLast(l => (l && l.key === c._key) ? null : l);
    }).catch(e => {
      setBusy('');
      const m = (e && e.message) || '폐기 실패';
      setErr(/permission|denied|PERMISSION/i.test(m)
        ? '폐기가 서버에서 거부됐습니다 — discarded 규칙이 아직 적용되지 않았을 수 있습니다. (' + m + ')'
        : m);
    });
  };

  const undo = () => {
    if (!last || busy) return;
    const k = last.key;
    if (last.kind === 'snooze') { unsnooze(k, true); return; }
    setBusy(k); setErr('');
    db.ref(DEC_PATH + '/' + k).update({ answer: null, answerNote: null, answeredAt: null, status: 'pending', snoozedUntil: null })
      .then(() => { setBusy(''); setLast(null); })
      .catch(e => { setBusy(''); setErr((e && e.message) || '되돌리기 실패'); });
  };
  const seed = () => {
    if (seeding) return;
    setSeeding(true); setErr('');
    const patch = {};
    DEC_SEED.forEach(c => { patch[c.id] = c; });
    db.ref(DEC_PATH).update(patch).then(() => setSeeding(false))
      .catch(e => { setSeeding(false); setErr((e && e.message) || '등록 실패'); });
  };

  // ── 이미 등록된 시드 카드의 문안 교정 ──────────────────────────────────────
  // 시드 3건은 이미 /decisions 에 올라가 있고, 위 seed() 버튼은 화면이 완전히 빈 경우에만 뜬다.
  // 그래서 DEC_SEED 상수만 고치면 유니님이 실제로 누르는 라이브 카드는 그대로 남는다.
  // 대시보드가 만든 카드를 대시보드가 고치는 것이므로 경계 위반이 아니다 —
  // 단, 쓰는 필드는 SEED_FIX_KEYS(+seedRev) 뿐이고 답 계열 6개는 여기서 절대 건드리지 않는다.
  // 이미 답한 카드는 덮어쓰지 않는다. 나간 답을 없던 일로 만들 수 없으니 경고만 띄운다.
  const seedFix = () => {
    if (!decs || decs.list === null) return;
    DEC_SEED.forEach(s => {
      const live = decs.list.filter(c => c.id === s.id)[0];
      if (!live) return;                                  // 아직 등록 전이면 seed() 가 최신 문안으로 넣는다
      if ((Number(live.seedRev) || 0) >= SEED_REV) return; // 이미 맞춰졌다
      const answered = live.answer != null || (live.status && live.status !== 'pending');
      if (answered) { setStuck(a => a.indexOf(s.id) >= 0 ? a : a.concat([s.id])); return; }
      if (fixTried.current[s.id]) return;
      fixTried.current[s.id] = 1;
      const patch = { seedRev: SEED_REV };
      SEED_FIX_KEYS.forEach(k => { patch[k] = (s[k] === undefined ? null : s[k]); });
      db.ref(DEC_PATH + '/' + live._key).update(patch)
        .then(() => setFixed(a => a.indexOf(s.id) >= 0 ? a : a.concat([s.id])))
        .catch(e => { fixTried.current[s.id] = 0; setErr((e && e.message) || '카드 문안 교정 실패'); });
    });
  };
  useEffect(seedFix, [decs && decs.list]);

  // 오래 기다린 것부터 위로(선입선출). 단 만료 카드는 '지금 답해도 되지만 확인 필요'라
  // 살아 있는 질문보다 아래로 내린다 — 매번 만료 카드를 지나야 실제 질문에 닿는 걸 막는다.
  const queue = list.filter(c => { const e = decEff(c); return e === 'pending' || e === 'expired'; })
    .sort((a, b) => {
      const ax = decEff(a) === 'expired' ? 1 : 0, bx = decEff(b) === 'expired' ? 1 : 0;
      if (ax !== bx) return ax - bx;
      return String(a.createdAt || '').localeCompare(String(b.createdAt || ''));
    });
  const shown = queue.filter(c => (fDom === '전체' || c.domain === fDom) && (fType === '전체' || c.type === fType));
  // 대기 건수 = 화면에 실제로 쌓여 있는 카드 수(만료 포함). 만료 카드도 여전히 답할 수 있으므로
  // 배지에서 빼면 "대기 2건"인데 카드는 3장 보이는 어긋남이 생긴다. 7일 이상·만료는 그 안의 하위 집계다.
  const pendingN = queue.length;
  const staleN = queue.filter(c => decEff(c) === 'pending' && decAgeD(c.createdAt) >= DEC_STALE_D).length;
  const expiredN = queue.filter(c => decEff(c) === 'expired').length;
  // 보류 중 = 아직 pending 인데 snoozedUntil 이 미래인 카드. 대기 수에는 안 넣지만
  // 목록 자체는 접힌 채로 보여준다 — 어디로 갔는지 모르게 사라지면 그게 곧 유실이다.
  const snz = list.filter(c => decEff(c) === 'snoozed')
    .sort((a, b) => String(a.snoozedUntil || '').localeCompare(String(b.snoozedUntil || '')));
  const done = list.filter(c => (c.status === 'answered' || c.status === 'applied') && c.answeredAt && decAgeD(c.answeredAt) < DEC_RECENT_D)
    .sort((a, b) => String(b.answeredAt || '').localeCompare(String(a.answeredAt || '')));
  // 폐기됨 = 종착. 대기·보류·답변 완료 어느 목록에도 들어가지 않는다(decEff 가 status 를 그대로 낸다).
  // 그래도 화면에서 완전히 사라지게 두지 않는다 — 어디로 갔는지 모르게 없어지면 그게 유실이다.
  const dsc = list.filter(c => c.status === DEC_DISCARD)
    .sort((a, b) => String(b.discardedAt || '').localeCompare(String(a.discardedAt || '')));
  // [기타] 집계. 비율이 높으면 카드가 아니라 '선택지 설계'가 틀렸다는 신호다(허브).
  // 지금은 세어서 보여주기만 한다 — 어디에도 쓰지 않고 판단도 하지 않는다.
  const otherN = done.filter(c => c.answer === DEC_OTHER).length;
  const otherPct = done.length ? Math.round(otherN * 100 / done.length) : 0;
  const cntDom = d => queue.filter(c => (d === '전체' || c.domain === d) && (fType === '전체' || c.type === fType)).length;
  const cntType = t => queue.filter(c => (t === '전체' || c.type === t) && (fDom === '전체' || c.domain === fDom)).length;

  const chip = (on, label, n, onClick) => (
    <button key={label} onClick={onClick} style={{ padding: '6px 14px', borderRadius: 20, border: 'none', cursor: 'pointer', fontSize: 16, fontWeight: 600, background: on ? G : '#E3E0DC', color: on ? 'white' : '#3A3631' }}>
      {label}{n > 0 ? ' ' + n : ''}
    </button>
  );

  if (loading) return <div style={{ padding: 40, textAlign: 'center', color: '#6E6863', fontSize: 16 }}>판단 큐를 불러오는 중...</div>;

  return (
    <div style={{ padding: 20 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap', marginBottom: 6 }}>
        <div style={{ fontSize: 22, fontWeight: 800, color: G }}>🧭 판단 대기</div>
        <span data-dec-badge style={{ background: pendingN > 0 ? '#C62828' : '#A29C95', color: 'white', borderRadius: 20, padding: '3px 13px', fontSize: 16, fontWeight: 800 }}>대기 {pendingN}건</span>
        {staleN > 0 ? <Badge label={'7일 이상 ' + staleN + '건'} color="#E08700" /> : null}
        {expiredN > 0 ? <Badge label={'만료 표시 ' + expiredN + '건'} color="#989088" /> : null}
        {snz.length > 0 ? <span data-dec-snzbadge style={{ display: 'inline-block', padding: '3px 11px', borderRadius: 20, fontSize: 15, fontWeight: 700, color: '#3A3631', background: '#EDEBE7' }}>⏸ 보류 중 {snz.length}건</span> : null}
        {done.length > 0 ? <button onClick={() => setShowExp(true)} style={{ marginLeft: 'auto', padding: '7px 14px', borderRadius: 8, border: '1px solid #E3E0DC', background: 'white', color: '#3A3631', fontSize: 15, fontWeight: 700, cursor: 'pointer' }}>📋 옵시디언에 붙일 형식으로 내보내기</button> : null}
      </div>
      {/* [index_153] 맨 위에서 말할 것은 하나 — 「내가 답할 게 몇 개인가」.
          왜 이런 탭이 있는지는 궁금할 때만 보이면 된다. 기본은 접어 둔다. */}
      <div style={{ fontSize: 16, color: '#3A3631', marginBottom: 6, lineHeight: 1.7 }}>
        {pendingN > 0
          ? <React.Fragment><b>답해주실 게 {pendingN}건</b> 있습니다. 아래에서 버튼을 누르면 바로 저장됩니다.</React.Fragment>
          : <React.Fragment>지금 답하실 건 없습니다.</React.Fragment>}
      </div>
      <button data-dec-help-toggle onClick={() => setOpenHelp(!openHelp)}
        style={{ background: 'none', border: 'none', padding: 0, marginBottom: 12, color: '#8A8279', fontSize: 14, fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit' }}>
        {openHelp ? '▾' : '▸'} 이 탭은 뭔가요?
      </button>
      {openHelp ? (
        <div data-dec-help style={{ fontSize: 15, color: '#6E6863', marginBottom: 14, lineHeight: 1.7, background: '#F5F4F2', borderRadius: 9, padding: '11px 14px' }}>
          AI가 일하다가 <b>사람이 정해줘야 하는 것</b>을 만나면 여기에 카드로 올려둡니다.
          답하시면 그 내용이 <b>옵시디언에 기록</b>되고, 다음부터 AI가 그 기준으로 판단합니다.
          <br />답한 카드는 아래 「최근 {DEC_RECENT_D}일 답변 완료」에 남습니다.
        </div>
      ) : null}

      {/* [index_152] 자동 반영이 켜져 있는지를 화면 맨 위에서 한 번만 말한다.
          카드마다 반복하면 읽히지 않고, 안 적으면 화면이 거짓말한다. */}
      {!applyOn ? (
        <div data-dec-applybanner={applyMode} style={{ background: '#FFF6E5', borderLeft: '4px solid #E08700', borderRadius: '0 9px 9px 0', padding: '11px 14px', marginBottom: 14, fontSize: 15, color: '#6E4A00', lineHeight: 1.7 }}>
          {applyMode === DEC_APPLY_OFF
            ? <React.Fragment><b>🛑 광고 자동 반영이 지금 멈춰 있습니다.</b> 답하시면 <b>옵시디언에 기록만</b> 되고, 광고 계정은 바뀌지 않습니다.</React.Fragment>
            : <React.Fragment><b>🛑 광고 자동 반영이 켜져 있는지 확인이 안 됩니다.</b> 멈춘 것으로 보고 안내합니다 — 확실하지 않은 걸 켜진 것처럼 보여드리지 않으려고요.</React.Fragment>}
          <br /><b>답은 지금 하셔도 됩니다.</b> 다시 켜지면 그때 광고에 반영됩니다.
          <br /><span style={{ color: '#8A6A20' }}>다시 켜는 건 이 화면에서 할 수 없습니다 — 자동화PC 쪽에서 켭니다.</span>
        </div>
      ) : null}

      {readErr ? <div style={{ background: '#FDECEA', borderLeft: '4px solid #E53935', borderRadius: '0 8px 8px 0', padding: '10px 14px', fontSize: 15, color: '#8E2A22', marginBottom: 12 }}>판단 큐를 읽지 못했습니다 — {readErr}</div> : null}
      {err ? <div style={{ background: '#FDECEA', borderLeft: '4px solid #E53935', borderRadius: '0 8px 8px 0', padding: '10px 14px', fontSize: 15, color: '#8E2A22', marginBottom: 12 }}>{err}</div> : null}

      {/* [index_153] 아래 둘은 우리 사정이다 — 시드 문안을 우리가 고쳐서 생긴 일이고
          유니님이 하실 일이 없다. 지우지는 않고(무슨 일이 있었는지는 남아야 한다) 접어 둔다. */}
      {(stuck.length + fixed.length) > 0 ? (
        <button data-dec-note-toggle onClick={() => setOpenNote(!openNote)}
          style={{ background: 'none', border: 'none', padding: 0, marginBottom: 10, color: '#8A8279', fontSize: 14, fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit' }}>
          {openNote ? '▾' : '▸'} 화면 안내 {stuck.length + fixed.length}건 (읽지 않으셔도 됩니다)
        </button>
      ) : null}
      {openNote && stuck.length > 0 ? (
        <div data-dec-stuck style={{ background: '#FDECEA', borderLeft: '4px solid #E53935', borderRadius: '0 8px 8px 0', padding: '11px 14px', fontSize: 15, color: '#8E2A22', marginBottom: 12, lineHeight: 1.6 }}>
          ⚠️ <b>{stuck.map(id => (DEC_SEED.filter(s => s.id === id)[0] || {}).title || id).join(' · ')}</b> — 답한 뒤에 이 카드의 질문·선택지가 바뀌었습니다.
          저장된 답은 <b>바뀌기 전 문안 기준</b>이라 그대로 두었습니다. 옵시디언에 옮기기 전에 한 번만 확인해주세요.
        </div>
      ) : null}
      {openNote && fixed.length > 0 ? (
        <div data-dec-fixed style={{ background: '#EEF3FB', borderLeft: '4px solid #2D5FE0', borderRadius: '0 8px 8px 0', padding: '11px 14px', fontSize: 15, color: '#1F3F8F', marginBottom: 12, lineHeight: 1.6 }}>
          🔄 카드 {fixed.length}건의 질문·선택지를 최신 문안으로 맞췄습니다 — <b>{fixed.map(id => (DEC_SEED.filter(s => s.id === id)[0] || {}).title || id).join(' · ')}</b>.
          답한 내용은 건드리지 않았습니다.
        </div>
      ) : null}

      {last ? (
        <div data-dec-undo style={{ background: '#EAF5EE', borderLeft: '4px solid #1FA463', borderRadius: '0 8px 8px 0', padding: '11px 14px', marginBottom: 14, display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
          <span style={{ fontSize: 16, color: '#1A1614' }}>
            {last.kind === 'snooze'
              ? <React.Fragment>보류했습니다 — <b>{last.title}</b> · {last.days}일 뒤({decDate(last.until)}) 대기 목록으로 스스로 돌아옵니다{(Number(last.count) || 0) >= DEC_SNOOZE_WARN ? ' · 이 카드는 ' + last.count + '번째 보류입니다' : ''}</React.Fragment>
              : <React.Fragment>저장했습니다 — <b>{last.title}</b> · {last.label}{last.route === 'auto' ? ' (곧 광고에 반영됩니다)' : ' (옵시디언에 기록됩니다)'}</React.Fragment>}
          </span>
          <button onClick={undo} style={{ marginLeft: 'auto', padding: '6px 12px', borderRadius: 8, border: '1px solid #1FA463', background: 'white', color: '#14713F', fontSize: 15, fontWeight: 700, cursor: 'pointer' }}>되돌리기</button>
          <button onClick={() => setLast(null)} style={{ padding: '6px 10px', borderRadius: 8, border: 'none', background: 'transparent', color: '#6E6863', fontSize: 15, fontWeight: 700, cursor: 'pointer' }}>닫기</button>
        </div>
      ) : null}

      <div style={{ display: 'flex', gap: 6, marginBottom: 8, flexWrap: 'wrap' }}>
        {['전체'].concat(DEC_DOMAINS).map(d => chip(fDom === d, d, cntDom(d), () => setFDom(d)))}
      </div>
      <div style={{ display: 'flex', gap: 6, marginBottom: 16, flexWrap: 'wrap' }}>
        {['전체'].concat(DEC_TYPES).map(t => chip(fType === t, t, cntType(t), () => setFType(t)))}
      </div>

      {shown.length === 0 ? (
        <Card style={{ padding: 30, textAlign: 'center' }}>
          {queue.length === 0 && list.length === 0 ? (
            <div>
              <div style={{ fontSize: 34, marginBottom: 10 }}>🍃</div>
              <div style={{ fontSize: 19, fontWeight: 800, color: G, marginBottom: 6 }}>지금 물어볼 것이 없습니다.</div>
              <div style={{ fontSize: 16, color: '#6E6863', lineHeight: 1.7 }}>
                AI가 판단이 막히면 여기로 올라옵니다. 비어 있다는 건 지금은 물어볼 게 없다는 뜻입니다.
              </div>
              <div style={{ marginTop: 18, paddingTop: 16, borderTop: '1px solid #EDEBE7' }}>
                <div style={{ fontSize: 15, color: '#A29C95', marginBottom: 10 }}>첫 입주 대상 3건이 아직 등록되지 않았습니다.</div>
                <Btn v="secondary" onClick={seed} disabled={seeding}>{seeding ? '등록 중...' : '첫 3건 등록하기'}</Btn>
                <div style={{ fontSize: 14, color: '#A29C95', marginTop: 8 }}>야채분말 키워드 · ROAS 330% 근거 · 영양식 원료 개수</div>
              </div>
            </div>
          ) : (
            <div>
              <div style={{ fontSize: 30, marginBottom: 8 }}>🔎</div>
              <div style={{ fontSize: 18, fontWeight: 700, color: G, marginBottom: 4 }}>이 조건에 해당하는 대기 카드가 없습니다.</div>
              <div style={{ fontSize: 16, color: '#6E6863' }}>대기 중인 카드는 전체 {queue.length}건입니다. 위 필터를 전체로 바꿔보세요.</div>
            </div>
          )}
        </Card>
      ) : shown.map(c => {
        const e = decEff(c);
        const age = decAgeD(c.createdAt);
        const stale = e === 'pending' && age >= DEC_STALE_D;
        const expired = e === 'expired';
        const auto = decRoute(c) === 'auto';   // other 면 여기서 이미 vault 로 내려온다
        const snzN = Number(c.snoozeCount) || 0;
        const snzHot = snzN >= DEC_SNOOZE_WARN;
        const otherOn = !!otherOpen[c._key];          // [기타] 모드 — 메모가 필수가 된다
        const noteVal = (notes[c._key] || '').trim();
        const cs = { marginBottom: 14, padding: 18 };
        if (expired) { cs.border = '1.5px dashed #A29C95'; cs.background = '#FAFAF9'; }
        else if (stale) { cs.border = '1.5px solid #E08700'; cs.boxShadow = '0 2px 12px rgba(224,135,0,0.18)'; }
        return (
          <Card key={c._key} style={cs}>
            <div style={{ display: 'flex', gap: 6, alignItems: 'center', flexWrap: 'wrap', marginBottom: 10 }}>
              <Badge label={c.type || '판정'} color={DEC_TYPE_C[c.type] || '#6E6863'} />
              <Badge label={c.domain || '운영'} color="#E3E0DC" />
              <span data-dec-route={decRoute(c)} style={{ display: 'inline-block', padding: '3px 11px', borderRadius: 20, fontSize: 15, fontWeight: 800, color: (auto && applyOn) ? 'white' : '#3A3631', background: (auto && applyOn) ? '#C62828' : (auto ? '#F0E4C8' : '#E3E0DC'), whiteSpace: 'nowrap' }}>
                {!auto ? '📗 옵시디언에 기록 후 사람이 반영'
                  : applyOn ? '⚡ 답하면 바로 반영됩니다'
                  : '⏸ 자동 반영 대상 · 지금은 정지 중'}
              </span>
              {stale ? <Badge label={'⏳ ' + age + '일째 대기'} color="#E08700" /> : null}
              {expired ? <Badge label={'⌛ ' + age + '일 경과 · 만료 표시'} color="#989088" /> : null}
              {snzHot ? <span data-dec-snzcnt={c.id} style={{ display: 'inline-block', padding: '3px 11px', borderRadius: 20, fontSize: 15, fontWeight: 800, color: 'white', background: '#B26A00', whiteSpace: 'nowrap' }}>🔁 {snzN}번 미룸</span> : null}
              <span style={{ marginLeft: 'auto', fontSize: 14, color: '#A29C95' }}>{decDate(c.createdAt)} · {c.createdBy || '에이전트'}</span>
            </div>

            <div style={{ fontSize: 20, fontWeight: 800, color: '#1A1614', marginBottom: 6 }}>{c.title}</div>
            <div style={{ fontSize: 18, fontWeight: 700, color: G, marginBottom: 6, lineHeight: 1.5 }}>{c.question}</div>
            {c.context ? <div style={{ fontSize: 16, color: '#6E6863', lineHeight: 1.6 }}>{c.context}</div> : null}

            {c.vaultHint ? (
              <div data-dec-hint style={{ borderLeft: '4px solid ' + G, background: '#F5F3F0', borderRadius: '0 10px 10px 0', padding: '12px 14px', margin: '12px 0' }}>
                <div style={{ fontSize: 14, fontWeight: 800, color: '#6E6863', letterSpacing: 0.4, marginBottom: 4 }}>📗 옵시디언에 있는 것</div>
                <div style={{ fontSize: 18, fontWeight: 700, color: '#1A1614', lineHeight: 1.5 }}>{c.vaultHint}</div>
              </div>
            ) : null}

            {expired ? <div style={{ fontSize: 15, color: '#8A8279', marginBottom: 10 }}>{DEC_EXPIRE_D}일이 지난 카드입니다. 지금 답해도 저장되지만, 상황이 바뀌었을 수 있으니 한 번 확인해주세요.</div> : null}

            {/* ── 1층 · 준비된 선택지 ─ 누르면 즉시 저장된다 ────────────────────────── */}
            <div data-dec-layer1={c.id} style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginTop: 12 }}>
              {decVisibleOpts(c).map(o => (
                <button key={o.key} data-dec-opt={c.id + ':' + o.key} disabled={busy === c._key || otherOn} onClick={() => save(c, o.key)}
                  style={{ padding: '11px 22px', borderRadius: 9, border: 'none', cursor: (busy === c._key || otherOn) ? 'default' : 'pointer', fontSize: 17, fontWeight: 700, background: (busy === c._key || otherOn) ? '#C4BFB8' : G, color: 'white' }}>{o.label}</button>
              ))}
              {/* ── 2층 · 선택지 밖의 답 ─ 여기만 즉시 저장이 아니다. 메모가 곧 답이라 적어야 저장된다. */}
              <button data-dec-other={c.id} disabled={busy === c._key}
                onClick={() => setOtherOpen(s => { const m = { ...s }; if (m[c._key]) delete m[c._key]; else m[c._key] = 1; return m; })}
                style={{ padding: '11px 22px', borderRadius: 9, border: '2px solid ' + (otherOn ? '#2D5FE0' : '#C4BFB8'), cursor: busy === c._key ? 'wait' : 'pointer', fontSize: 17, fontWeight: 700, background: otherOn ? '#EEF3FB' : 'white', color: otherOn ? '#1F3F8F' : '#3A3631' }}>
                ✏ 기타 — 직접 입력
              </button>
            </div>

            {/* [index_152] 고르면 무슨 일이 생기는가. 라벨은 이름이지 결과가 아니다.
                버튼 안에 넣지 않고 아래 줄로 뺀 이유 — 버튼 높이가 문구 길이에 따라
                들쭉날쭉해지면 누르기 어려워진다. */}
            {decVisibleOpts(c).length > 0 ? (
              <div data-dec-effects={c.id} style={{ marginTop: 9, paddingLeft: 2, fontSize: 14, color: '#6E6863', lineHeight: 1.8 }}>
                {decVisibleOpts(c).map(o => (
                  <div key={'e' + o.key} data-dec-effect={c.id + ':' + o.key}>
                    <b style={{ color: '#3A3631' }}>{o.label}</b> → {decOptEffect(o)}
                  </div>
                ))}
                <div data-dec-effect-other={c.id}>
                  <b style={{ color: '#3A3631' }}>기타 — 직접 입력</b> → 옵시디언에 기록만 하고 광고에 자동 반영하지 않습니다
                </div>
              </div>
            ) : null}
            {otherOn ? (
              <div data-dec-othermsg={c.id} style={{ fontSize: 15, color: '#1F3F8F', fontWeight: 700, marginTop: 8, lineHeight: 1.6 }}>
                선택지에 없는 답이면 아래 칸에 직접 적어주세요 — <b>적어야 저장됩니다.</b> 이 답은 에이전트가 예상하지 못한 답이라 <b>광고에 자동 반영되지 않고</b>, 옵시디언에 기록된 뒤 사람이 반영합니다.
              </div>
            ) : null}
            {snzHot ? (
              <div data-dec-snzmsg={c.id} style={{ fontSize: 15, color: '#8A5200', fontWeight: 700, marginTop: 6, lineHeight: 1.6 }}>
                벌써 {snzN}번 미룬 카드입니다. 지금도 답하기 어렵다면, 아래 칸에 <b>무엇이 막고 있는지</b>만 한 줄 남겨주세요 — 그게 답보다 더 필요할 수 있습니다.
              </div>
            ) : null}

            {otherOn ? <div data-dec-notereq={c.id} style={{ fontSize: 15, fontWeight: 800, color: '#1F3F8F', marginTop: 12 }}>답 내용 <span style={{ color: '#C62828' }}>*필수</span></div> : null}
            <input value={notes[c._key] || ''} data-dec-note={c.id}
              onChange={ev => { const val = ev.target.value; setNotes(n => { const m = { ...n }; m[c._key] = val; return m; }); }}
              placeholder={otherOn ? '선택지에 없는 답을 그대로 적어주세요 — 이 내용이 곧 답입니다' : '한 줄 이유 (선택) — 먼저 적고 위 버튼을 누르면 답과 함께 저장됩니다'}
              style={{ width: '100%', marginTop: otherOn ? 5 : 12, padding: '9px 10px', borderRadius: 8, border: otherOn ? '2px solid #2D5FE0' : '1px solid #E3E0DC', background: otherOn ? '#FBFCFF' : 'white', fontSize: 16, boxSizing: 'border-box' }} />
            {/* 이 노드는 읽기가 공개(.read:true)다. 카드 본문 금지 규칙이 에이전트에게만 걸려 있어서
                사람이 직접 쓰는 이 칸이 유일하게 안 막힌 구멍이다 — 그래서 칸 바로 밑에 적는다. */}
            <div data-dec-warn style={{ fontSize: 14, color: '#8A8279', marginTop: 6 }}>
              🔒 원가·마진·손익분기 숫자, 협력사 단가, 고객 개인정보, <b>법적 리스크에 대한 내부 판단</b>, <b>키워드·캠페인 단위 성과 실측치</b>(클릭수·전환수·CTR 등)는 적지 마세요. 이 칸은 외부에서 읽을 수 있습니다 — 이런 내용은 옵시디언 <b>90_내부/</b> 에 직접 적어주세요.
            </div>

            {otherOn ? (
              <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap', marginTop: 10 }}>
                <button data-dec-othersave={c.id} disabled={busy === c._key || !noteVal} onClick={() => save(c, DEC_OTHER)}
                  style={{ padding: '11px 22px', borderRadius: 9, border: 'none', cursor: (busy === c._key || !noteVal) ? 'not-allowed' : 'pointer', fontSize: 17, fontWeight: 700, background: (busy === c._key || !noteVal) ? '#C4BFB8' : '#2D5FE0', color: 'white' }}>이 내용으로 저장</button>
                <button data-dec-othercancel={c.id} onClick={() => setOtherOpen(s => { const m = { ...s }; delete m[c._key]; return m; })}
                  style={{ padding: '11px 18px', borderRadius: 9, border: '1px solid #E3E0DC', cursor: 'pointer', fontSize: 16, fontWeight: 700, background: 'white', color: '#6E6863' }}>취소</button>
                {!noteVal ? <span data-dec-otherreq={c.id} style={{ fontSize: 15, color: '#8A5200', fontWeight: 700 }}>내용을 적어야 저장할 수 있습니다</span> : null}
              </div>
            ) : null}

            {/* ── 3층 · 보류 ─ 답이 아니다. 그래서 위 두 층과 선으로 끊어 놓는다(허브 지시). ────── */}
            <div data-dec-layer3={c.id} style={{ borderTop: '1px dashed #E3E0DC', marginTop: 16, paddingTop: 12, display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
              <span style={{ fontSize: 15, fontWeight: 700, color: '#8A8279' }}>지금은 답하기 어렵다면</span>
              <select value={String(snoozeD[c._key] || DEC_SNOOZE_D)} data-dec-snzsel={c.id}
                onChange={ev => { const v = ev.target.value; setSnoozeD(s => { const m = { ...s }; m[c._key] = Number(v); return m; }); }}
                style={{ padding: '10px 8px', borderRadius: 9, border: '1px solid #E3E0DC', background: 'white', fontSize: 16, color: '#3A3631', fontFamily: 'inherit', cursor: 'pointer' }}>
                {DEC_SNOOZE_OPTS.map(d => <option key={d} value={String(d)}>{d}일 뒤</option>)}
              </select>
              <button data-dec-snooze={c.id} disabled={busy === c._key} onClick={() => snooze(c)}
                style={{ padding: '10px 20px', borderRadius: 9, border: '1px solid #E3E0DC', cursor: busy === c._key ? 'wait' : 'pointer', fontSize: 16, fontWeight: 700, background: '#F5F4F2', color: '#6E6863' }}>보류</button>
              <span style={{ fontSize: 14, color: '#A29C95' }}>보류는 답이 아닙니다 — 고른 기간이 지나면 이 카드가 대기 목록으로 스스로 돌아옵니다.</span>
              {decCanDiscard(c) ? <button data-dec-discard={c.id} disabled={busy === c._key} onClick={() => { setConfirmDsc(confirmDsc === c._key ? '' : c._key); setErr(''); }}
                style={{ marginLeft: 'auto', padding: '10px 18px', borderRadius: 9, border: '1px solid #E7C3BE', cursor: busy === c._key ? 'wait' : 'pointer', fontSize: 16, fontWeight: 700, background: 'white', color: '#8E2018', fontFamily: 'inherit' }}>폐기</button> : null}
            </div>

            {/* ── [폐기] 확인 ─ 되돌릴 수 없는 일이라 한 단계를 둔다. [지금 반영]과 같은 방식. ──
                다른 점 하나: 여기는 사유가 필수다. 종착 상태인데 이유가 없으면 기록이 반쪽이 된다. */}
            {confirmDsc === c._key ? (
              <DecDiscardConfirm c={c} note={dscNote[c._key]} busy={busy === c._key}
                onNote={v => setDscNote(n => { const m = { ...n }; m[c._key] = v; return m; })}
                onYes={() => discard(c)} onNo={() => setConfirmDsc('')} />
            ) : null}

            {c.vaultTarget ? <div style={{ fontSize: 14, color: '#A29C95', marginTop: 10 }}>답은 옵시디언 <b>{c.vaultTarget}</b> 에 기록됩니다{c.answer === DEC_OTHER ? ' (기타는 검토 후)' : ''}</div> : null}
          </Card>
        );
      })}

      {snz.length > 0 ? (
        <div style={{ marginTop: 22 }} data-dec-snzbox>
          <button onClick={() => setOpenSnz(!openSnz)} style={{ width: '100%', textAlign: 'left', background: '#F5F4F2', border: '1px solid #EDEBE7', borderRadius: 10, padding: '11px 14px', fontSize: 16, fontWeight: 700, color: '#3A3631', cursor: 'pointer', fontFamily: 'inherit' }}>
            {openSnz ? '▾' : '▸'} ⏸ 보류 중 {snz.length}건 — 기간이 지나면 위 대기 목록으로 돌아옵니다
          </button>
          {openSnz ? snz.map(c => {
            const left = decSnoozeLeftD(c.snoozedUntil);
            return (
              <div key={'s' + c._key} data-dec-snz={c.id} style={{ background: 'white', borderLeft: '4px solid #C4BFB8', borderRadius: '0 10px 10px 0', boxShadow: '0 1px 4px rgba(0,0,0,0.06)', padding: '11px 14px', marginTop: 8 }}>
                <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
                  <Badge label={c.domain || '운영'} color="#E3E0DC" />
                  <Badge label={c.type || '판정'} color={DEC_TYPE_C[c.type] || '#6E6863'} />
                  <span style={{ fontSize: 17, fontWeight: 800, color: '#1A1614' }}>{c.title}</span>
                  <span style={{ fontSize: 15, color: '#6E6863' }}>{decDate(c.snoozedUntil)} 복귀 · {left <= 1 ? '오늘·내일 중' : left + '일 남음'}</span>
                  {(Number(c.snoozeCount) || 0) >= DEC_SNOOZE_WARN ? <span data-dec-snzcnt2={c.id} style={{ display: 'inline-block', padding: '2px 9px', borderRadius: 20, fontSize: 14, fontWeight: 800, color: 'white', background: '#B26A00' }}>🔁 {Number(c.snoozeCount)}번째</span> : null}
                  <button onClick={() => unsnooze(c._key)} disabled={busy === c._key} style={{ marginLeft: 'auto', padding: '6px 12px', borderRadius: 8, border: '1px solid #E3E0DC', background: 'white', color: '#3A3631', fontSize: 15, fontWeight: 700, cursor: busy === c._key ? 'wait' : 'pointer' }}>지금 다시 보기</button>
                </div>
                {c.answerNote ? <div style={{ fontSize: 15, color: '#6E6863', marginTop: 5 }}>&gt; {c.answerNote}</div> : null}
              </div>
            );
          }) : null}
        </div>
      ) : null}

      {dsc.length > 0 ? (
        <div style={{ marginTop: 22 }} data-dec-dscbox>
          <button onClick={() => setOpenDsc(!openDsc)} style={{ width: '100%', textAlign: 'left', background: '#F5F4F2', border: '1px solid #EDEBE7', borderRadius: 10, padding: '11px 14px', fontSize: 16, fontWeight: 700, color: '#3A3631', cursor: 'pointer', fontFamily: 'inherit' }}>
            {openDsc ? '▾' : '▸'} 🗑 폐기됨 {dsc.length}건 — 답하지 않고 내린 카드입니다. 데이터는 남아 있습니다
          </button>
          {openDsc ? dsc.map(c => (
            <div key={'x' + c._key} data-dec-dsc={c.id} style={{ background: '#FAFAF9', borderLeft: '4px solid #C4BFB8', borderRadius: '0 10px 10px 0', boxShadow: '0 1px 4px rgba(0,0,0,0.06)', padding: '11px 14px', marginTop: 8 }}>
              <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
                <Badge label={c.domain || '운영'} color="#E3E0DC" />
                <Badge label={c.type || '판정'} color={DEC_TYPE_C[c.type] || '#6E6863'} />
                <span style={{ fontSize: 17, fontWeight: 800, color: '#6E6863', textDecoration: 'line-through' }}>{c.title}</span>
                <span data-dec-dscat={c.id} style={{ fontSize: 15, color: '#A29C95' }}>{decDate(c.discardedAt) || '시각 미상'} 폐기</span>
              </div>
              <div data-dec-dscwhy={c.id} style={{ fontSize: 15, color: '#6E6863', marginTop: 5, lineHeight: 1.6 }}>
                &gt; {c.discardNote || '사유가 기록되지 않았습니다'}
              </div>
            </div>
          )) : null}
        </div>
      ) : null}

      <div style={{ marginTop: 28 }}>
        <div style={{ fontSize: 18, fontWeight: 800, color: G, marginBottom: 2 }}>최근 {DEC_RECENT_D}일 답변 완료</div>
        <div style={{ fontSize: 14, color: '#A29C95', marginBottom: 10 }}>읽기 전용입니다. 이 목록이 그대로 옵시디언 _수신함/판단 기록 으로 넘어갑니다.</div>
        {otherN > 0 ? (
          <div data-dec-othern={otherN} style={{ fontSize: 15, color: otherPct >= 50 ? '#8A5200' : '#6E6863', background: otherPct >= 50 ? '#FFF6E5' : '#F5F4F2', border: '1px solid ' + (otherPct >= 50 ? '#E7C98A' : '#EDEBE7'), borderRadius: 9, padding: '9px 12px', marginBottom: 10, lineHeight: 1.6 }}>
            ✏ <b>기타 {otherN}건</b> / {done.length}건 (<b>{otherPct}%</b>) — 준비된 선택지 밖의 답입니다.
            {otherPct >= 50 ? <span> 절반을 넘었습니다. 카드가 틀린 게 아니라 <b>선택지를 잘못 뽑고 있다는 신호</b>일 수 있으니 허브에 알려주세요.</span> : null}
          </div>
        ) : null}
        {done.length === 0 ? (
          <Card style={{ padding: 18, textAlign: 'center', color: '#A29C95', fontSize: 16 }}>최근 {DEC_RECENT_D}일 안에 답한 카드가 없습니다.</Card>
        ) : done.map(c => {
          // 반영 상태는 한 곳에서만 계산한다. 배지·버튼·설명이 서로 다른 말을 하면
          // 화면을 못 믿게 되고, 못 믿는 화면에서는 [지금 반영] 같은 버튼을 아무도 안 누른다.
          // [index_153] 실행할 게 있는 카드인가를 먼저 본다. 없으면 반영 상태 자체가
          //   성립하지 않으므로 'waiting' 으로 고정한다 — 실패도 요청도 없었던 카드다.
          const hasSpec = !!decApplySpec(c);
          const ast = hasSpec ? decApplyState(c) : 'waiting';
          const nx = decNextApply();
          // applySpec 이 없는 답이면 decRoute 가 vault 로 내려주므로 여기 문구도 자동으로 바뀐다.
          const waitLbl = decWaitLabel(c, hasSpec, applyOn);
          // 실패한 카드에도 버튼을 남긴다 — 사유를 읽고 고친 뒤 다시 누르는 게 자연스러운 순서다.
          // [index_152] 자동 반영이 켜져 있을 때만 [지금 반영]을 보여준다.
          //   정지 중에 눌리면 요청만 쌓이고 아무도 처리하지 않는다 — 실제로 그렇게 밀렸다.
          const canAsk = applyOn && (ast === 'waiting' || ast === 'failed');
          const asking = confirmNow === c._key;
          const bc = ast === 'applied' ? '#1FA463' : ast === 'failed' ? '#C62828' : (ast === 'asked' || ast === 'late') ? '#2D5FE0' : '#E3E0DC';
          return (
          <div key={'d' + c._key} data-dec-done={c.id} data-dec-applystate={ast} style={{ background: 'white', borderLeft: '4px solid ' + bc, borderRadius: '0 10px 10px 0', boxShadow: '0 1px 4px rgba(0,0,0,0.06)', padding: '12px 14px', marginBottom: 8 }}>
            <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
              <span style={{ fontSize: 14, color: '#A29C95' }}>{decDate(c.answeredAt)}</span>
              <Badge label={c.domain || '운영'} color="#E3E0DC" />
              <Badge label={c.type || '판정'} color={DEC_TYPE_C[c.type] || '#6E6863'} />
              <span style={{ fontSize: 17, fontWeight: 800, color: '#1A1614' }}>{c.title}</span>
              <span style={{ fontSize: 17, fontWeight: 800, color: G }}>— {decOptLabel(c, c.answer)}</span>
              {c.answer === DEC_OTHER ? <span data-dec-otherbadge={c.id} style={{ display: 'inline-block', padding: '2px 9px', borderRadius: 20, fontSize: 14, fontWeight: 800, color: 'white', background: '#2D5FE0' }}>✏ 기타</span> : null}
              {/* 여기도 decRoute — route:auto 카드라도 other 로 답했으면 '실행 대기'라고 쓰면 안 된다.
                  '실행 대기'만 있고 언제 실행되는지가 없으면 답한 사람은 화면이 멈춘 줄 안다.
                  그래서 대기 상태에는 반드시 다음 반영 시각을 같이 적는다(허브 지시). */}
              {ast === 'applied' ? <Badge label={'✅ 적용됨 ' + decDate(c.appliedAt)} color="#1FA463" />
                : ast === 'failed' ? <Badge label="⚠ 반영 실패" color="#C62828" />
                : ast === 'late' ? <Badge label={'⏳ 요청 후 ' + DEC_APPLY_LATE_MIN + '분 경과'} color="#B26A00" />
                : ast === 'asked' ? <Badge label={'⚡ 지금 반영 요청됨' + (c.applyAskedAt ? ' ' + decDate(c.applyAskedAt) : '')} color="#2D5FE0" />
                : <span data-dec-nextapply={nx.label} style={{ fontSize: 14, color: '#A29C95' }}>{waitLbl} · 다음 반영 <b style={{ color: '#6E6863', fontSize: 15 }}>{nx.label}</b>{nx.tomorrow ? ' (내일)' : ''}</span>}

                '자동 실행'이라고 적혀 있던 카드가 갑자기 볼트로 가는 것이라 이유를 적어준다.
                이유는 둘 중 하나뿐이다 — 선택지 밖의 답이었거나, 그 선택지에 실행 명세가 없거나. */}
            {(c.route === 'auto' && decRoute(c) === 'vault' && ast !== 'applied') ? (

                  : '이 선택지에는 아직 실행 방법이 정해져 있지 않아 광고에 자동 반영하지 않습니다 — 옵시디언에 기록만 갑니다.'}
              </div>
            ) : null}

            {/* ── 반영 실패 사유 ─ 에이전트가 쓰는 자리다. 대시보드는 읽기만 한다. ──────
                요청이 살아 있는 동안(applyNow:true)은 이전 시도의 사유이므로 흐리게 낮춘다.
                지운 게 아니라 낮춘 이유: 지우면 방금 뭐가 잘못됐는지가 사라진다. */}
            {/* [index_153] applySpec 이 없는 카드에는 실패 사유를 띄우지 않는다.
                실행 대상이 아니었으니 실패한 게 아니다. 상품 정합 카드에 광고 실패 문구가
                붙어서 유니님이 '이건 된 거야 안 된 거야'라고 물으셨다. */}
            {c.applyError && hasSpec ? (
              <div data-dec-applyerr={c.id} style={{ marginTop: 8, padding: '9px 12px', borderRadius: 9, background: (ast === 'asked' || ast === 'late') ? '#F5F4F2' : '#FDECEA', borderLeft: '3px solid ' + ((ast === 'asked' || ast === 'late') ? '#C4BFB8' : '#C62828'), lineHeight: 1.6 }}>
                <div style={{ fontSize: 14, fontWeight: 800, color: (ast === 'asked' || ast === 'late') ? '#8A8279' : '#8E2018' }}>
                  {(ast === 'asked' || ast === 'late') ? '이전 시도 실패 사유 (지금 다시 시도 중)' : '반영 실패 — 에이전트가 남긴 사유'}
                  {c.applyErrorAt ? <span style={{ fontWeight: 600, color: '#A29C95' }}> · {decDate(c.applyErrorAt)}</span> : null}
                </div>
                <div style={{ fontSize: 16, color: (ast === 'asked' || ast === 'late') ? '#8A8279' : '#3A3631', marginTop: 3 }}>{c.applyError}</div>
              </div>
            ) : null}

            {/* ── [지금 반영] ─ 대시보드가 쓰는 applyNow · applyAskedAt 두 개만 켠다 ────
                정기 반영은 답한 지 10분 지난 것만 처리해 되돌리기 창을 지킨다.
                이 버튼은 그 창을 버린다 — 그래서 [기타]와 같은 방식으로 한 단계 확인을 둔다. */}
            {canAsk ? (asking ? (
              <div data-dec-applyconfirm={c.id} style={{ marginTop: 10, padding: '11px 13px', borderRadius: 10, background: '#FFF6E5', borderLeft: '3px solid #E08700' }}>
                <div style={{ fontSize: 16, fontWeight: 800, color: '#8A5200', lineHeight: 1.6 }}>지금 반영하면 되돌릴 수 없습니다.</div>
                <div style={{ fontSize: 15, color: '#6E6863', marginTop: 4, lineHeight: 1.6 }}>
                  정기 반영({DEC_APPLY_SLOTS.join(' · ')})은 답한 지 <b>{DEC_UNDO_MIN}분</b>이 지난 것만 처리합니다 — 그 {DEC_UNDO_MIN}분이 답을 고칠 수 있는 시간입니다. 지금 반영은 그 시간을 건너뜁니다.
                </div>
                <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap', marginTop: 10 }}>
                  <button data-dec-applyyes={c.id} disabled={busy === c._key} onClick={() => applyNowReq(c)}
                    style={{ padding: '10px 20px', borderRadius: 9, border: 'none', cursor: busy === c._key ? 'wait' : 'pointer', fontSize: 16, fontWeight: 800, background: busy === c._key ? '#C4BFB8' : '#C62828', color: 'white' }}>지금 반영 — 되돌릴 수 없습니다</button>
                  <button data-dec-applyno={c.id} onClick={() => setConfirmNow('')}
                    style={{ padding: '10px 16px', borderRadius: 9, border: '1px solid #E3E0DC', cursor: 'pointer', fontSize: 15, fontWeight: 700, background: 'white', color: '#6E6863' }}>취소 — {nx.label}에 반영</button>
                </div>
              </div>
            ) : (
              <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap', marginTop: 9 }}>
                <button data-dec-applybtn={c.id} disabled={busy === c._key} onClick={() => setConfirmNow(c._key)}
                  style={{ padding: '8px 16px', borderRadius: 8, border: '1px solid #E3E0DC', cursor: busy === c._key ? 'wait' : 'pointer', fontSize: 15, fontWeight: 700, background: 'white', color: '#3A3631' }}>⚡ {ast === 'failed' ? '다시 지금 반영' : '지금 반영'}</button>
                {decUndoLeftMin(c) > 0 ? <span data-dec-undoleft={c.id} style={{ fontSize: 14, color: '#A29C95' }}>답을 고칠 수 있는 시간 {decUndoLeftMin(c)}분 남음</span> : null}
              </div>
            )) : null}

            {/* 요청이 살아 있는 동안. 5분이 넘으면 '지연'이라고 말한다 — 조용한 화면은 고장과 구분이 안 된다. */}
            {(ast === 'asked' || ast === 'late') ? (
              <div data-dec-asked={c.id} data-dec-askedmode={applyOn ? 'live' : 'halted'} style={{ fontSize: 15, color: (ast === 'late' || !applyOn) ? '#8A5200' : '#1F3F8F', fontWeight: 700, marginTop: 8, lineHeight: 1.6 }}>
                {!applyOn
                  ? '반영 요청이 남아 있지만 광고 자동 반영이 지금 멈춰 있습니다 — 밀린 게 아니라 멈춰 있는 것입니다. 다시 켜지면 그때 처리됩니다.'
                  : ast === 'late'
                  ? '요청한 지 ' + DEC_APPLY_LATE_MIN + '분이 지났는데 아직 반영되지 않았습니다. 에이전트가 밀렸을 수 있습니다 — 요청은 그대로 남아 있으니 다시 누를 필요는 없습니다.'
                  : '에이전트가 ' + DEC_APPLY_LATE_MIN + '분 안에 처리합니다. 되돌리기는 이미 지나갔습니다.'}
              </div>
            ) : null}

            {/* [index_150] 답변 완료 카드의 폐기. 카드 자체가 잘못 만들어졌을 때 쓴다.
                답은 지우지 않는다 — 배달부가 dec:<id> 와 dec:<id>#discarded 로 나눠 회수하므로
                답은 답대로, 폐기는 폐기대로 판단 기록에 남는다(허브 06-B).
                applied 카드에는 뜨지 않는다: 이미 실물이 바뀐 건은 폐기가 아니라 되돌리기다. */}
            {decCanDiscard(c) ? (
              confirmDsc === c._key ? (
                <DecDiscardConfirm c={c} note={dscNote[c._key]} busy={busy === c._key}
                  onNote={v => setDscNote(n => { const m = { ...n }; m[c._key] = v; return m; })}
                  onYes={() => discard(c)} onNo={() => setConfirmDsc('')} />
              ) : (
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 18, borderTop: '1px solid #EDEBE7', paddingTop: 12 }}>
                  <span style={{ fontSize: 14, color: '#A29C95' }}>
                    {c.applyError && hasSpec
                      ? '반영은 다시 시도할 수 있습니다. 폐기는 질문 자체가 잘못 만들어졌을 때만 쓰세요 —'
                      : '질문 자체가 잘못 만들어졌다면'}
                  </span>
                  <button data-dec-discard={c.id} disabled={busy === c._key} onClick={() => { setConfirmDsc(c._key); setErr(''); }}
                    style={{ padding: '7px 14px', borderRadius: 8, border: '1px solid #E7C3BE', cursor: busy === c._key ? 'wait' : 'pointer', fontSize: 15, fontWeight: 700, background: 'white', color: '#8E2018', fontFamily: 'inherit' }}>폐기</button>
                </div>
              )
            ) : null}
          </div>
          );
        })}
      </div>

      <div style={{ marginTop: 24 }}><AdsStrategyPanel data={data} setData={setData} prodNames={{}} /></div>
      {showExp ? <DecExportModal rows={done} onClose={() => setShowExp(false)} /> : null}
    </div>
  );
}

function App() {

  const [syncErr, setSyncErr] = useState('');
  const pendingRef = useRef(null);
  const lastSavedRef = useRef(null);
  const initDoneRef = useRef(false);
  const canSaveRef = useRef(false);
  const revRef = useRef(0);
  const serverSnapRef = useRef(null);
  const backupDayRef = useRef('');
  const decs = useDecisions();
  useDragAutoScroll();

  useEffect(() => {
    const ref = db.ref(DB_PATH);
    ref.on('value', snap => {
      const remote = snap.val();
      if (remote && typeof remote.rev === 'number') revRef.current = Math.max(revRef.current, remote.rev);
      if (!initDoneRef.current) {
        initDoneRef.current = true;
        if (remote && remote.nid) { const m = migrateData(remote); setData(m); serverSnapRef.current = m; lastSavedRef.current = sigOf(m); canSaveRef.current = true; }
        else if (remote == null) { setData(INIT); serverSnapRef.current = null; lastSavedRef.current = null; canSaveRef.current = true; }
        else { setData(INIT); serverSnapRef.current = null; lastSavedRef.current = null; }
        setReady(true); setSync('ok');
      } else {
        if (remote && remote.nid) { const m = migrateData(remote); serverSnapRef.current = m; const sg = sigOf(m); if (sg !== lastSavedRef.current) { setData(m); lastSavedRef.current = sg; } canSaveRef.current = true; }
      }
    }, err => { setSyncErr(err.message); setSync('error'); if (!initDoneRef.current) { initDoneRef.current = true; setData(INIT); setReady(true); } });
    return () => ref.off('value');
  }, []);

  useEffect(() => {
    if (!ready || !data || !canSaveRef.current) return;
    const str = sigOf(data);
    if (str === lastSavedRef.current) return;
    if (pendingRef.current) clearTimeout(pendingRef.current);
    setSync('saving');
    pendingRef.current = setTimeout(() => {
      const srv = serverSnapRef.current;
      if (srv) { const SK = ['budgets', 'payments', 'notices', 'plans', 'subplans']; for (let i = 0; i < SK.length; i++) { const k = SK[i]; const sv = Array.isArray(srv[k]) ? srv[k].length : 0; const cv = Array.isArray(data[k]) ? data[k].length : 0; if (sv >= 5 && cv === 0) { setSync('error'); setSyncErr('데이터 유실 위험 — 저장 중단(' + k + ')'); try { alert('⚠ 데이터 유실 위험이 감지되어 저장을 막았어요.\n' + k + '가 서버 ' + sv + '건인데 저장하려는 값은 0건입니다.\n새로고침 후 다시 시도해주세요.'); } catch (e) {} return; } } }
      if (backupDayRef.current !== TODAY) { backupDayRef.current = TODAY; try { db.ref(DB_PATH).once('value').then(sn => { const cur = sn.val(); if (cur && cur.nid) db.ref('/backups/auto/' + TODAY).set(cur).catch(() => {}); }).catch(() => {}); } catch (e) {} }
      const newRev = (revRef.current || 0) + 1;
      const payload = { ...data, rev: newRev };
      lastSavedRef.current = str;
      db.ref(DB_PATH).set(payload).then(() => { revRef.current = newRev; serverSnapRef.current = payload; setSync('ok'); }).catch(e => { setSync('error'); setSyncErr(e.message || '저장 실패'); lastSavedRef.current = null; });
    }, 800);

          <SyncBadge status={sync} errMsg={syncErr} />
          {MEMBERS.map(m => <div key={m} style={{ width: 30, height: 30, borderRadius: '50%', background: GO, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, border: '2px solid rgba(255,255,255,0.25)' }}>{AV[m]}</div>)}
          {heldCount > 0 && <div onClick={() => setTab(TABS.findIndex(t => t.label === '보류'))} style={{ background: '#989088', borderRadius: 20, padding: '4px 10px', fontSize: 11, fontWeight: 700, cursor: 'pointer' }}>⏸ {heldCount}</div>}{trashCount > 0 && <div onClick={() => setTab(TABS.findIndex(t => t.label === '휴지통'))} title="휴지통 열기" style={{ background: '#989088', borderRadius: 20, padding: '4px 10px', fontSize: 11, fontWeight: 700, cursor: 'pointer' }}>🗑 {trashCount}</div>}
          <button onClick={() => setModal(true)} style={{ padding: '8px 16px', borderRadius: 8, border: 'none', background: 'white', color: G, fontWeight: 700, fontSize: 13, cursor: 'pointer' }}>+ 업무 추가하기</button>
        </div>
      </div>
      {GROUPS ? (
      <React.Fragment>
        <div data-nav-groups style={{ background: 'white', boxShadow: '0 1px 4px rgba(0,0,0,0.07)', overflowX: 'auto' }}>
          <div style={{ display: 'flex', minWidth: 'max-content' }}>
            {GROUPS.map((g, gi) => <button key={gi} data-nav-group={g.label} onClick={() => goLabel(g.tabs[0])} style={{ padding: '12px 20px', border: 'none', cursor: 'pointer', fontSize: 14, fontWeight: activeGroup === gi ? 800 : 600, color: activeGroup === gi ? G : '#6E6863', background: 'transparent', borderBottom: activeGroup === gi ? '3px solid ' + G : '3px solid transparent', display: 'flex', alignItems: 'center', gap: 6, whiteSpace: 'nowrap' }}>{g.icon} {g.label}{g.label === 'AI 에이전트' && decPending > 0 ? <span style={{ background: '#C62828', color: 'white', borderRadius: 10, padding: '1px 6px', fontSize: 10, fontWeight: 700 }}>{decPending}</span> : null}</button>)}
          </div>
        </div>
        {activeGroup >= 0 && (GROUPS[activeGroup].tabs.length > 1 || ORPHAN_PARENT[curLabel] === GROUPS[activeGroup].label) ? (
        <div data-nav-sub style={{ background: '#FAFAF9', borderBottom: '1px solid #EDEBE7', overflowX: 'auto' }}>
          <div style={{ display: 'flex', minWidth: 'max-content', padding: '0 8px' }}>
            {GROUPS[activeGroup].tabs.map(lbl => { const i = TABS.findIndex(t => t.label === lbl); if (i < 0) return null; const t = TABS[i]; const on = i === tab; return <button key={lbl} data-nav-subtab={lbl} onClick={() => setTab(i)} style={{ padding: '9px 14px', border: 'none', cursor: 'pointer', fontSize: 13, fontWeight: on ? 700 : 500, color: on ? G : '#6E6863', background: 'transparent', borderBottom: on ? '2.5px solid ' + G : '2.5px solid transparent', display: 'flex', alignItems: 'center', gap: 5, whiteSpace: 'nowrap' }}>{t.icon} {lbl}{t.badge > 0 ? <span style={{ background: '#989088', color: 'white', borderRadius: 10, padding: '1px 6px', fontSize: 10, fontWeight: 700 }}>{t.badge}</span> : null}</button>; })}
            {ORPHAN_PARENT[curLabel] === GROUPS[activeGroup].label ? (() => { const t = TABS[tab]; return <button key="__orphan" data-nav-orphan={t.label} style={{ padding: '9px 14px', border: 'none', fontSize: 13, fontWeight: 700, color: G, background: 'transparent', borderBottom: '2.5px solid ' + G, display: 'flex', alignItems: 'center', gap: 5, whiteSpace: 'nowrap' }}>{t.icon} {t.label}{t.badge > 0 ? <span style={{ background: '#989088', color: 'white', borderRadius: 10, padding: '1px 6px', fontSize: 10, fontWeight: 700 }}>{t.badge}</span> : null}</button>; })() : null}
          </div>
        </div>
        ) : null}
      </React.Fragment>
      ) : (
      <div style={{ background: 'white', boxShadow: '0 1px 4px rgba(0,0,0,0.07)', overflowX: 'auto' }}>
        <div style={{ display: 'flex', minWidth: 'max-content' }}>
          {TABS.map((t, i) => <button key={i} onClick={() => setTab(i)} style={{ padding: '11px 18px', border: 'none', cursor: 'pointer', fontSize: 13, fontWeight: tab === i ? 700 : 500, color: tab === i ? G : '#6E6863', background: 'transparent', borderBottom: tab === i ? '2.5px solid ' + G : '2.5px solid transparent', display: 'flex', alignItems: 'center', gap: 5, whiteSpace: 'nowrap' }}>{t.icon} {t.label}{t.badge > 0 ? <span style={{ background: '#989088', color: 'white', borderRadius: 10, padding: '1px 6px', fontSize: 10, fontWeight: 700 }}>{t.badge}</span> : null}</button>)}
        </div>
      </div>
      )}
      <div style={{ maxWidth: 1400, margin: '0 auto' }}>
        <TabC data={data} setData={setData} decs={decs} decErr={decs.err} onEdit={t => setEditStack([t])} onRecord={id => setRecordId(id)} goTab={label => { const i = TABS.findIndex(t => t.label === label); if (i >= 0) setTab(i); }} />
      </div>
      {modal && <AddModal data={data} setData={setData} onClose={() => setModal(false)} />}
      {showUpdates && <UpdateCenterModal data={data} setData={setData} onClose={() => setShowUpdates(false)} />}
      {editStack.length > 0 && (() => { const cur = editStack[editStack.length - 1]; return <EditModal key={cur.kind + '-' + cur.id} target={cur} data={data} setData={setData} onClose={() => setEditStack([])} onSwitch={t => setEditStack(s => [...s, t])} canBack={editStack.length > 1} onBack={() => setEditStack(s => s.slice(0, -1))} />; })()}
      {recordId && <PerfModal subId={recordId} data={data} setData={setData} onClose={() => setRecordId(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
