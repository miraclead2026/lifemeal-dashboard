                <EditBtn onClick={() => onSwitch && onSwitch({ kind: 'plan', id: p.id, from: item.id })} />
              </div>
            ); })}
          <div style={{ display: 'flex', gap: 6, marginTop: 8 }}>
            <input value={newChild} onChange={e => setNewChild(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') addChildPlan(); }} placeholder="새 실행계획명" style={{ flex: 1, padding: '8px 9px', borderRadius: 8, border: '1px solid #E3E0DC', fontSize: 17 }} />
            <Btn v="gold" onClick={addChildPlan} style={{ padding: '8px 14px' }}>+ 추가</Btn>
          </div>
        </div>
      )}

      {kind === 'plan' && (
        <div style={{ background: '#F5F4F2', borderRadius: 10, padding: 12, border: '1px solid #EDEBE7' }}>
          <div style={{ display: 'flex', alignItems: 'center', marginBottom: 8 }}><div style={{ fontSize: 17, fontWeight: 700, color: G }}>📋 세부 실행계획 ({childSubs.length})</div>{ownSubs.length > 1 && <button onClick={() => setShowReorder(true)} title="드래그가 어려울 때: 목록에서 한 번에 순서 변경" style={{ marginLeft: 'auto', fontSize: 15, padding: '3px 10px', borderRadius: 6, border: '1px solid ' + G, background: 'white', color: G, cursor: 'pointer', fontWeight: 600 }}>⠿ 순서 변경</button>}</div>
          {ownSubs.length > 1 && <div style={{ fontSize: 15, color: '#A29C95', marginBottom: 8, lineHeight: 1.5 }}>⠿ 를 잡고 끌어서 순서를 바꿀 수 있어요. 🔗 표시는 다른 곳에도 연결된 항목입니다.</div>}
          {childSubs.length === 0 ? <div style={{ fontSize: 16, color: '#A29C95', marginBottom: 8 }}>등록된 세부 실행계획이 없습니다</div> :
            childSubs.map(s => { const own = s.planId === item.id; const dragOk = own && ownSubs.length > 1; return (
              <div key={s.id} {...subDrag.row(s.id)} {...subDrag.arm(s.id)} style={{ display: 'flex', alignItems: 'center', gap: 8, background: own ? 'white' : '#FDFBF4', borderRadius: 8, padding: '8px 10px', marginBottom: 5, border: '1px solid ' + (own ? '#E3E0DC' : '#EBD9A8'), cursor: dragOk ? 'grab' : 'default', ...subDrag.hl(s.id) }}>
                {dragOk && <span title="여기를 잡고 끌어서 순서 변경" style={{ color: '#C4BDB4', fontSize: 18, lineHeight: 1, flexShrink: 0, userSelect: 'none' }}>⠿</span>}
                <span style={{ fontSize: 14, padding: '1px 6px', borderRadius: 6, background: stC(s.stage), color: 'white' }}>{s.stage}</span>
                <div style={{ flex: 1, fontSize: 16, fontWeight: 600 }}>{s.name}{own ? '' : <span style={{ fontSize: 13, color: '#A29C95', fontWeight: 500 }}> · 다른 실행계획이 대표</span>}</div>
                <span style={{ fontSize: 14, color: G }}>{ownerAv(s)}</span>
                {subLinkN(s) > 1 && <button onClick={e => { e.stopPropagation(); setLinkStat({ kind: 'subplan', id: s.id }); }} title="다른 곳에도 연결됨 — 연결 현황 보기" style={{ border: '1px solid #C8A24A', background: '#FFF9E8', color: '#8A6A12', borderRadius: 7, padding: '3px 8px', fontSize: 14, fontWeight: 700, cursor: 'pointer', flexShrink: 0 }}>🔗 {subLinkN(s)}</button>}
                <EditBtn onClick={() => onSwitch && onSwitch({ kind: 'subplan', id: s.id, from: item.id })} />
              </div>
            ); })}
          <div style={{ display: 'flex', gap: 6, marginTop: 8 }}>
            <input value={newChild} onChange={e => setNewChild(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') addChildSub(); }} placeholder="새 세부 실행계획명" style={{ flex: 1, padding: '8px 9px', borderRadius: 8, border: '1px solid #E3E0DC', fontSize: 17 }} />
            <Btn v="gold" onClick={addChildSub} style={{ padding: '8px 14px' }}>+ 추가</Btn>
          </div>
        </div>
      )}



      {confirmDel && multiLinked && (
        <div style={{ background: '#FFF7ED', border: '1px solid #F4C77B', borderRadius: 10, padding: 12 }}>
          <div style={{ fontSize: 16, fontWeight: 800, color: '#8A5A12', marginBottom: 4 }}>⚠️ 이 {kind === 'plan' ? '실행계획' : '세부실행계획'}은 {linkN}곳에 연결되어 있습니다.</div>
          <div style={{ fontSize: 15, color: '#6E6863', lineHeight: 1.55, marginBottom: 9 }}>연동된 곳에서도 삭제할까요?<br />‘아니오’를 누르면 <b>{hereLabel}</b> 에서만 빠지고 나머지 연결은 그대로 남습니다.</div>
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
            <Btn v="danger" onClick={del}>예 – 전부 삭제</Btn>
            <Btn v="secondary" onClick={delHereOnly} style={{ color: '#8A5A12' }}>아니오 – 여기서만 빼기</Btn>
            <Btn v="secondary" onClick={() => setConfirmDel(false)}>취소</Btn>
          </div>
        </div>
      )}
      <div style={{ display: 'flex', gap: 8 }}><Btn onClick={save} style={{ flex: 1 }}>저장</Btn><Btn v="secondary" onClick={onClose}>취소</Btn>{confirmDel ? (multiLinked ? null : <Btn v="danger" onClick={del}>휴지통으로 이동</Btn>) : <Btn v="secondary" onClick={() => setConfirmDel(true)} style={{ color: '#E53935' }}>삭제</Btn>}</div>
      {linkStat && (() => { const it = linkStat.kind === 'plan' ? data.plans.find(x => x.id === linkStat.id) : data.subplans.find(x => x.id === linkStat.id); return it ? <LinkStatusModal kind={linkStat.kind} item={it} data={data} setData={setData} onClose={() => setLinkStat(null)} /> : null; })()}
      {showFile && <FileModal subId={item.id} data={data} setData={setData} onClose={() => setShowFile(false)} />}
      {showReorder && kind === 'output' && <ReorderModal title="실행계획 순서" items={ownPlans.map(p => ({ id: p.id, label: p.name }))} onClose={() => setShowReorder(false)} onSave={newOrder => setData(d => { const q = newOrder.map(x => d.plans.find(p => p.id === x.id)).filter(Boolean); let k = 0; return { ...d, plans: d.plans.map(p => p.outputId === item.id ? q[k++] : p) }; })} />}
      {showChkReorder && kind === 'subplan' && <ReorderModal title="체크리스트 순서 (같은 날짜 안에서만 반영)" items={subChks.map(c => ({ id: c.id, label: (c.date ? c.date + ' · ' : '미정 · ') + ((c.text || '').trim() || '(이름 없음)') }))} onClose={() => setShowChkReorder(false)} onSave={reorderSubChks} />}
      {showReorder && kind === 'plan' && <ReorderModal title="세부 실행계획 순서" items={ownSubs.map(s => ({ id: s.id, label: s.name }))} onClose={() => setShowReorder(false)} onSave={newOrder => setData(d => { const q = newOrder.map(x => d.subplans.find(s => s.id === x.id)).filter(Boolean); let k = 0; return { ...d, subplans: d.subplans.map(s => s.planId === item.id ? q[k++] : s) }; })} />}
    </ModalShell>
  );
}

function MemberModal({ data, setData, onClose }) {
  const list = data.members && data.members.length ? data.members : DEFAULT_MEMBERS;
  const [nm, setNm] = useState('');
  const [rl, setRl] = useState('');
  const [av, setAv] = useState('👤');
  const AVS = ['🌿', '📦', '👤', '🍀', '⭐', '🔥', '💡', '🎯', '🚀', '🌸', '☕', '🦊'];
  const workCount = m => data.plans.filter(p => ownersOf(p).includes(m)).length + data.subplans.filter(s => ownersOf(s).includes(m)).length + data.plans.filter(p => (p.support || []).some(s => s.m === m)).length + data.subplans.filter(s => (s.support || []).some(x => x.m === m)).length;
  const add = () => { const n = nm.trim(); if (!n) { alert('이름을 입력하세요'); return; } if (list.some(m => m.name === n)) { alert('이미 있는 팀원입니다'); return; } setData(d => ({ ...d, members: [...(d.members && d.members.length ? d.members : DEFAULT_MEMBERS), { name: n, role: rl.trim(), av }] })); setNm(''); setRl(''); setAv('👤'); };
  const upd = (name, key, val) => setData(d => ({ ...d, members: (d.members && d.members.length ? d.members : DEFAULT_MEMBERS).map(m => m.name === name ? { ...m, [key]: val } : m) }));
  const del = m => { const c = workCount(m.name); if (c > 0) { alert('"' + m.name + '"님은 담당/서포트 중인 업무가 ' + c + '건 있어 삭제할 수 없습니다.\n먼저 담당자를 변경한 뒤 삭제해주세요.'); return; } if (list.length <= 1) { alert('팀원이 최소 1명은 있어야 합니다'); return; } if (!confirm('"' + m.name + '"님을 팀원 목록에서 삭제할까요?')) return; setData(d => ({ ...d, members: (d.members && d.members.length ? d.members : DEFAULT_MEMBERS).filter(x => x.name !== m.name) })); };
  return (
    <ModalShell title="👥 팀원 관리" onClose={onClose}>
      <div style={{ fontSize: 16, color: '#6E6863', lineHeight: 1.5 }}>팀원을 추가하면 담당자 선택·필터·회의 액션 등 <b>모든 화면에 자동 반영</b>됩니다. <span style={{ color: '#A29C95' }}>· 아바타(📷)를 클릭하면 프로필 사진을 등록할 수 있어요.</span></div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginTop: 4 }}>
        {list.map(m => { const c = workCount(m.name); return (
          <div key={m.name} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '9px 11px', background: '#F8F7F5', border: '1px solid #E3E0DC', borderRadius: 9 }}>
            <label title="클릭해서 사진 등록/변경" style={{ position: 'relative', cursor: 'pointer', flexShrink: 0, lineHeight: 0 }}>
              {m.photo ? <img src={m.photo} alt="" style={{ width: 40, height: 40, borderRadius: '50%', objectFit: 'cover', display: 'block', border: '1px solid #E3E0DC' }} /> : <span style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', width: 40, height: 40, borderRadius: '50%', background: '#EFEDEA', fontSize: 24 }}>{m.av || '👤'}</span>}
              <span style={{ position: 'absolute', right: -1, bottom: -1, width: 16, height: 16, borderRadius: '50%', background: G, color: 'white', fontSize: 8, display: 'flex', alignItems: 'center', justifyContent: 'center', border: '1.5px solid white' }}>📷</span>
              <input type="file" accept="image/*" onChange={e => { const f = e.target.files && e.target.files[0]; if (f) resizeToThumb(f, url => { if (url) upd(m.name, 'photo', url); else alert('이미지를 불러오지 못했습니다. 다른 파일로 시도해주세요.'); }); e.target.value = ''; }} style={{ display: 'none' }} />
            </label>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 17, fontWeight: 700, color: '#1A1614' }}>{m.name}</div>
              <input value={m.role || ''} onChange={e => upd(m.name, 'role', e.target.value)} placeholder="역할 (예: 마케팅 팀장)" style={{ width: '100%', marginTop: 2, padding: '3px 6px', borderRadius: 5, border: '1px solid #E3E0DC', fontSize: 15, boxSizing: 'border-box' }} />
              {m.photo ? <button onClick={() => upd(m.name, 'photo', '')} style={{ marginTop: 3, fontSize: 13.5, color: '#A29C95', background: 'none', border: 'none', cursor: 'pointer', padding: 0, textDecoration: 'underline' }}>사진 제거</button> : null}
            </div>
            <div style={{ textAlign: 'right' }}>
              <div style={{ fontSize: 14.5, color: c > 0 ? '#6E6863' : '#A29C95' }}>업무 {c}건</div>
              <button onClick={() => del(m)} style={{ marginTop: 3, border: '1px solid ' + (c > 0 ? '#E3E0DC' : '#FCA5A5'), background: 'white', color: c > 0 ? '#C4BFB9' : '#E53935', borderRadius: 6, cursor: c > 0 ? 'not-allowed' : 'pointer', fontSize: 14, fontWeight: 700, padding: '3px 8px' }}>🗑 삭제</button>
            </div>
          </div>
        ); })}
      </div>
      <div style={{ borderTop: '1px solid #EDEBE7', paddingTop: 10, marginTop: 4 }}>
        <Lbl c="+ 새 팀원 추가" />
        <div style={{ display: 'flex', gap: 6 }}>
          <Inp value={nm} onChange={setNm} placeholder="이름" />
          <Inp value={rl} onChange={setRl} placeholder="역할 (선택)" />
        </div>
        <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap', marginTop: 7 }}>
          {AVS.map(a => <button key={a} onClick={() => setAv(a)} style={{ fontSize: 20, width: 32, height: 32, borderRadius: 8, cursor: 'pointer', border: '1px solid ' + (av === a ? G : '#E3E0DC'), background: av === a ? '#F0EEEB' : 'white' }}>{a}</button>)}
        </div>
        <Btn onClick={add} style={{ width: '100%', marginTop: 8 }}>{av} 팀원 추가</Btn>
      </div>
      <div style={{ fontSize: 14, color: '#A29C95', marginTop: 4, lineHeight: 1.5 }}>ℹ️ 담당·서포트 업무가 있는 팀원은 삭제할 수 없습니다(기록이 깨짐). 먼저 담당자를 변경하세요.</div>
      <div style={{ display: 'flex', gap: 8, marginTop: 10 }}><Btn v="secondary" onClick={onClose} style={{ flex: 1 }}>닫기</Btn></div>
    </ModalShell>
  );
}

function ProfileModal({ name, data, onClose }) {
  const mm = (data.members || []).find(x => x.name === name) || {};
  const photo = mm.photo || '';
  const av = mm.av || AV[name] || '👤';
  const role = mm.role || ROLES[name] || '';
  const plansOwned = data.plans.filter(p => ownersOf(p).includes(name));
  const subOwned = data.subplans.filter(s => ownersOf(s).includes(name));
  const supported = data.plans.filter(p => (p.support || []).some(s => s.m === name)).concat(data.subplans.filter(s => (s.support || []).some(x => x.m === name)));
  const subCnt = subOwned.length; const done = subOwned.filter(s => s.stage === '완료').length;
  const ownedCnt = plansOwned.length + subOwned.length;
  const stat = (label, value, color) => <div style={{ flex: 1, textAlign: 'center', background: '#F8F7F5', border: '1px solid #EDEBE7', borderRadius: 10, padding: '10px 4px' }}><div style={{ fontSize: 24, fontWeight: 800, color: color }}>{value}</div><div style={{ fontSize: 14.5, color: '#6E6863', marginTop: 1 }}>{label}</div></div>;
  return (
    <ModalShell title="팀원 프로필" onClose={onClose}>
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, padding: '2px 0 6px' }}>
        <div style={{ width: 96, height: 96, borderRadius: '50%', background: photo ? 'transparent' : G, overflow: 'hidden', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 50, border: '1px solid #E3E0DC', flexShrink: 0 }}>{photo ? <img src={photo} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover' }} /> : av}</div>
        <div style={{ fontSize: 24, fontWeight: 800, color: '#1A1614' }}>{name}</div>
        {role ? <div style={{ fontSize: 17, color: '#6E6863' }}>{role}</div> : null}
      </div>
      <div style={{ display: 'flex', gap: 8, marginTop: 4 }}>
        {stat('담당', ownedCnt, G)}
        {stat('서포트', supported.length, GO)}
        {stat('완료율', (subCnt ? pct(done, subCnt) : 0) + '%', '#2D5FE0')}
      </div>
      {subCnt ? <div style={{ marginTop: 8 }}><Bar v={done} m={subCnt} h={6} /><div style={{ fontSize: 14.5, color: '#A29C95', marginTop: 3, textAlign: 'right' }}>세부계획 {done}/{subCnt} 완료</div></div> : null}
      <div style={{ marginTop: 12 }}>
        <div style={{ fontSize: 16, fontWeight: 800, color: G, marginBottom: 6 }}>담당 업무 <span style={{ color: '#A29C95', fontWeight: 600 }}>{ownedCnt}건</span></div>
        {ownedCnt === 0 ? <div style={{ fontSize: 16, color: '#A29C95' }}>담당 중인 업무가 없습니다.</div> : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
            {plansOwned.map(p => { const subs = subsOfPlanAll(data, p.id); const pd = subs.filter(s => s.stage === '완료').length; return (
              <div key={'p' + p.id} style={{ display: 'flex', alignItems: 'center', gap: 6, background: '#F8F7F5', border: '1px solid #EDEBE7', borderRadius: 8, padding: '7px 10px' }}>
                <span style={{ fontSize: 13, fontWeight: 700, color: '#2D5FE0', background: '#EAF0FE', borderRadius: 5, padding: '1px 6px', flexShrink: 0 }}>실행계획</span>
                <span style={{ fontSize: 16.5, fontWeight: 600, color: '#1A1614', flex: 1, minWidth: 0 }}>{p.name}</span>
                {p.hold ? <Badge label="⏸ 보류" color="#989088" /> : <span style={{ fontSize: 14.5, color: '#6E6863', flexShrink: 0 }}>{pd}/{subs.length}</span>}
              </div>
            ); })}
            {subOwned.map(s => (
              <div key={'s' + s.id} style={{ display: 'flex', alignItems: 'center', gap: 6, background: '#F8F7F5', border: '1px solid #EDEBE7', borderRadius: 8, padding: '7px 10px' }}>
                <span style={{ fontSize: 13, fontWeight: 700, color: '#E08700', background: '#FBF1E0', borderRadius: 5, padding: '1px 6px', flexShrink: 0 }}>세부</span>
                <span style={{ fontSize: 16.5, fontWeight: 600, color: s.stage === '완료' ? '#A29C95' : '#1A1614', flex: 1, minWidth: 0, textDecoration: s.stage === '완료' ? 'line-through' : 'none' }}>{s.name}</span>
                <Badge label={s.stage} color={stC(s.stage)} />
              </div>
            ))}
          </div>
        )}
      </div>
      {supported.length ? <div style={{ marginTop: 12 }}>
        <div style={{ fontSize: 16, fontWeight: 800, color: GO, marginBottom: 6 }}>서포트 <span style={{ color: '#A29C95', fontWeight: 600 }}>{supported.length}건</span></div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
          {supported.map((x, i) => (
            <div key={'sup' + i} style={{ display: 'flex', alignItems: 'center', gap: 6, background: '#FAF6EE', border: '1px solid #F0E6D2', borderRadius: 8, padding: '7px 10px' }}>
              <span style={{ fontSize: 16.5, color: '#3A3631', flex: 1, minWidth: 0 }}>{x.name}</span>
              {x.stage ? <Badge label={x.stage} color={stC(x.stage)} /> : null}
            </div>
          ))}
        </div>
      </div> : null}
      <div style={{ display: 'flex', gap: 8, marginTop: 14 }}><Btn v="secondary" onClick={onClose} style={{ flex: 1 }}>닫기</Btn></div>
    </ModalShell>
  );
}

function ChecklistModal({ chkId, data, setData, onClose }) {
  const [memoOpen, setMemoOpen] = useState(null);
  const c = (data.checklists || []).find(x => x.id === chkId);
  if (!c) return null;
  const sub = data.subplans.find(s => s.id === c.subplanId);
  const plan = sub ? data.plans.find(p => p.id === sub.planId) : null;
  const out = plan ? data.outputs.find(o => o.id === plan.outputId) : null;
  const chks = sortChksByDate((data.checklists || []).filter(x => x.subplanId === c.subplanId));
  const chkDrag = useDragOrder((from, to) => setData(d => moveChkInGroup(d, from, to)), (from, to) => sameChkGroup(data.checklists, from, to));
  const toggleDone = id => setData(d => ({ ...d, checklists: d.checklists.map(x => x.id === id ? { ...x, done: !x.done } : x) }));
  const setText = (id, text) => setData(d => ({ ...d, checklists: d.checklists.map(x => x.id === id ? { ...x, text } : x) }));
  const setOwner = (id, owner) => setData(d => ({ ...d, checklists: d.checklists.map(x => x.id === id ? { ...x, owner } : x) }));
  const setDate = (id, date) => setData(d => applyChklDate(d, id, date));
  const setMemo = (id, memo) => setData(d => ({ ...d, checklists: d.checklists.map(x => x.id === id ? { ...x, memo } : x) }));
  const del = id => { if (!confirm('이 체크리스트를 삭제할까요?')) return; setData(d => ({ ...d, checklists: d.checklists.filter(x => x.id !== id) })); if (id === chkId) onClose && onClose(); };
  const addChk = () => setData(d => ({ ...d, nid: d.nid + 1, checklists: [...d.checklists, { id: d.nid + 1, subplanId: c.subplanId, text: '', done: false, date: c.date || '', owner: '', memo: '' }] }));
  return (
    <ModalShell title="체크리스트" onClose={onClose}>
      <div style={{ background: '#F5F4F2', borderRadius: 10, padding: 12, border: '1px solid #EDEBE7' }}>
        <div style={{ fontSize: 15, fontWeight: 700, color: G, marginBottom: 6 }}>소속 세부실행계획</div>
        {sub ? (
          <div>
            <div style={{ fontSize: 15, color: '#A29C95', marginBottom: 6 }}>{out ? outLabel(out) : ''}{plan ? ' ▸ ' + plan.name : ''}</div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
              <Badge label={sub.stage} color={stC(sub.stage)} />
              <span style={{ fontSize: 18, fontWeight: 700 }}>{sub.name}</span>
            </div>
            <div style={{ fontSize: 16, color: '#6E6863', marginTop: 6 }}>마감일: {sub.due || '미정'}</div>
          </div>
        ) : <div style={{ fontSize: 16.5, color: '#A29C95' }}>연결된 세부실행계획이 없습니다</div>}
      </div>
      <div style={{ marginTop: 14 }}>
        <div style={{ fontSize: 15, fontWeight: 700, color: G, marginBottom: 7 }}>체크리스트 <span style={{ color: '#A29C95', fontWeight: 400 }}>({chks.filter(x => x.done).length}/{chks.length})</span></div>
        {chks.length > 1 && <div style={{ fontSize: 15, color: '#A29C95', marginBottom: 8, lineHeight: 1.5 }}>실행일이 빠른 순으로 자동 정렬됩니다(미정은 맨 뒤). 같은 날짜끼리는 왼쪽 ⠿ 를 잡고 끌어서 순서를 바꿀 수 있어요.</div>}
        {chks.map((x, xi) => {
          const over = !!(x.date && sub && sub.due && x.date > sub.due);
          const isCur = x.id === chkId;
          const dk = x.date || '';
          const newGrp = xi === 0 || (chks[xi - 1].date || '') !== dk;
          const grpCnt = chks.filter(y => (y.date || '') === dk).length;
          return (
            <React.Fragment key={x.id}>
            {newGrp && (
              <div style={{ display: 'flex', alignItems: 'center', gap: 7, margin: xi === 0 ? '0 0 5px' : '12px 0 5px' }}>
                <span style={{ fontSize: 15.5, fontWeight: 800, color: dk ? G : '#A29C95', flexShrink: 0 }}>{dk ? dk + ' (' + dateWd(dk) + ')' : '📥 실행일 미정'}</span>
                <span style={{ fontSize: 14, color: '#A29C95', flexShrink: 0 }}>{grpCnt}건</span>
                <span style={{ flex: 1, height: 1, background: '#EDEBE7' }} />
              </div>
            )}
            <div {...chkDrag.row(x.id)} style={{ marginBottom: 6, border: '1px solid ' + (isCur ? G : '#E3E0DC'), borderRadius: 9, padding: 9, background: isCur ? '#FBFDFB' : 'white', ...chkDrag.hl(x.id) }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 7, flexWrap: 'wrap' }}>
                {grpCnt > 1 && <span {...chkDrag.arm(x.id)} title="여기를 잡고 끌어서 같은 날짜 안에서 순서 변경" style={{ cursor: 'grab', color: '#C4BDB4', fontSize: 18, lineHeight: 1, flexShrink: 0, userSelect: 'none' }}>⠿</span>}
                <span onClick={() => toggleDone(x.id)} style={{ cursor: 'pointer', display: 'flex', flexShrink: 0 }}><Chk on={x.done} /></span>
                <input value={x.text} onChange={e => setText(x.id, e.target.value)} placeholder="체크리스트 명" style={{ flex: 1, minWidth: 110, fontSize: 17, fontWeight: 600, padding: '6px 8px', border: '1px solid #E3E0DC', borderRadius: 7, outline: 'none', color: x.done ? '#A29C95' : '#1A1614', textDecoration: x.done ? 'line-through' : 'none', fontFamily: 'inherit' }} />
                <button onClick={() => setMemoOpen(o => o === x.id ? null : x.id)} title="메모" style={{ border: 'none', background: (x.memo || memoOpen === x.id) ? '#EEF4EC' : 'transparent', borderRadius: 6, cursor: 'pointer', fontSize: 17, padding: '3px 5px', lineHeight: 1, color: x.memo ? '#1FA463' : '#A29C95', flexShrink: 0 }}>📝</button>
                <button onClick={() => del(x.id)} style={{ border: 'none', background: 'none', color: '#E53935', cursor: 'pointer', fontSize: 19, lineHeight: 1, flexShrink: 0 }}>×</button>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap', marginTop: 6 }}>
                <select value={x.owner || ''} onChange={e => setOwner(x.id, e.target.value)} title="담당자" style={{ fontSize: 15, padding: '4px 6px', border: '1px solid #E3E0DC', borderRadius: 6, color: x.owner ? '#3A3631' : '#A29C95', background: 'white' }}><option value="">담당 없음</option>{MEMBERS.map(m => <option key={m} value={m}>{m}</option>)}</select>
                <input type="date" value={x.date || ''} onChange={e => setDate(x.id, e.target.value)} title="실행일" style={{ fontSize: 15, padding: '4px 6px', border: '1px solid ' + (over ? '#FCA5A5' : '#E3E0DC'), borderRadius: 6, color: x.date ? '#3A3631' : '#A29C95' }} />
                {over ? <span style={{ fontSize: 14, color: '#DC2626', fontWeight: 700 }}>⚠ 마감초과</span> : null}
              </div>
              {memoOpen === x.id && <textarea value={x.memo || ''} onChange={e => setMemo(x.id, e.target.value)} placeholder="메모 입력" style={{ width: '100%', minHeight: 52, marginTop: 6, padding: '7px 9px', border: '1px solid #CDE3C6', borderRadius: 7, fontSize: 16, boxSizing: 'border-box', resize: 'vertical', fontFamily: 'inherit', lineHeight: 1.5, color: '#3A3631' }} />}
            </div>
            </React.Fragment>
          );
        })}
        <button onClick={addChk} style={{ width: '100%', marginTop: 4, padding: '9px', borderRadius: 8, border: '1.5px dashed ' + G, cursor: 'pointer', fontSize: 16.5, fontWeight: 700, background: 'white', color: G }}>+ 체크리스트 추가</button>
      </div>
      <Btn v="secondary" onClick={onClose} style={{ width: '100%', marginTop: 14 }}>닫기</Btn>
    </ModalShell>
  );
}

function DayDetailModal({ date, data, setData, onEdit, onClose }) {
  const [newText, setNewText] = useState('');
  const [newOwner, setNewOwner] = useState('');
  const [newSub, setNewSub] = useState('');
  const [showOther, setShowOther] = useState(false);
  const subOf = id => (data.subplans || []).find(s => s.id === id);
  const planOf = id => (data.plans || []).find(p => p.id === id);
  const outOf = id => (data.outputs || []).find(o => o.id === id);
  const dayChks = sortChksByDate((data.checklists || []).filter(c => c.date === date));
  const manual = dayChks.filter(c => !c.subplanId);
  const linked = dayChks.filter(c => c.subplanId);
  const chkDrag = useDragOrder((from, to) => setData(d => moveChkInGroup(d, from, to)), (from, to) => sameChkGroup(data.checklists, from, to));
  const mainIds = [];
  const push = id => { if (id && mainIds.indexOf(id) < 0) mainIds.push(id); };
  linked.forEach(c => push(c.subplanId));
  (data.subplans || []).forEach(s => { if (s.start === date || s.due === date) push(s.id); });
  const others = (data.subplans || []).filter(s => mainIds.indexOf(s.id) < 0 && s.start && s.due && s.start < date && date < s.due);
  const doneCnt = dayChks.filter(c => c.done).length;
  const WDN = ['일', '월', '화', '수', '목', '금', '토'];
  const wd = WDN[new Date(date + 'T00:00:00').getDay()] || '';
  const toggleDone = id => setData(d => ({ ...d, checklists: d.checklists.map(x => x.id === id ? { ...x, done: !x.done } : x) }));
  const addChk = () => {
    const t = newText.trim(); if (!t) return;
    const sid = newSub ? Number(newSub) : null;
    setData(d => { const id = d.nid + 1; return applyChklDate({ ...d, nid: id, checklists: [...d.checklists, { id, subplanId: sid, standalone: !sid, text: t, done: false, date: '', owner: newOwner, memo: '' }] }, id, date); });
    setNewText(''); setNewOwner('');
  };
  const jump = t => { onClose && onClose(); onEdit && onEdit(t); };
  const miniBtn = { border: '1px solid #E3E0DC', background: 'white', borderRadius: 6, color: '#6E6863', cursor: 'pointer', fontSize: 14.5, padding: '2px 8px', fontWeight: 600, flexShrink: 0, fontFamily: 'inherit' };
  const selSt = { fontSize: 15.5, padding: '6px 8px', border: '1px solid #D8D3CC', borderRadius: 7, background: 'white', color: '#3A3631', fontFamily: 'inherit' };
  const tree = ids => {
    const g = [];
    ids.forEach(id => {
      const s = subOf(id); if (!s) return;
      const p = planOf(s.planId); const o = p ? outOf(p.outputId) : null;
      const oK = o ? o.id : 0; const pK = p ? p.id : 0;
      let go = g.find(x => x.key === oK); if (!go) { go = { key: oK, out: o, plans: [] }; g.push(go); }
      let gp = go.plans.find(x => x.key === pK); if (!gp) { gp = { key: pK, plan: p, subs: [] }; go.plans.push(gp); }
      gp.subs.push(s);
    });
    return g;
  };
  const subOpts = (data.subplans || []).map(s => { const p = planOf(s.planId); const o = p ? outOf(p.outputId) : null; return { id: s.id, label: (o ? o.code + ' ' : '') + (p ? p.name + ' ▸ ' : '') + s.name }; });
  const rank = id => mainIds.indexOf(id) >= 0 ? 0 : 1;
  subOpts.sort((a, b) => rank(a.id) - rank(b.id));
  const chkRow = c => {
    const s = subOf(c.subplanId); const over = !!(s && s.due && date > s.due);
    return (
      <div key={c.id} {...chkDrag.row(c.id)} style={{ display: 'flex', alignItems: 'center', gap: 7, marginTop: 5, padding: '6px 9px', borderRadius: 8, background: over ? '#FEF2F2' : (c.done ? '#F5F4F2' : '#FBFDFB'), border: '1px solid ' + (over ? '#FCA5A5' : (c.done ? '#E3E0DC' : '#CDE3C6')), ...chkDrag.hl(c.id) }}>
        <span {...chkDrag.arm(c.id)} title="여기를 잡고 끌어서 순서 변경" style={{ cursor: 'grab', color: '#C4BDB4', fontSize: 17, lineHeight: 1, flexShrink: 0, userSelect: 'none' }}>⠿</span>
        <span onClick={() => toggleDone(c.id)} title="완료 표시" style={{ cursor: 'pointer', display: 'flex', flexShrink: 0 }}><Chk on={c.done} /></span>
        <span onClick={() => toggleDone(c.id)} style={{ flex: 1, minWidth: 0, cursor: 'pointer', fontSize: 16.5, color: c.done ? '#A29C95' : '#3A3631', textDecoration: c.done ? 'line-through' : 'none', wordBreak: 'break-all' }}>{c.text}</span>
        {c.owner && <span style={{ fontSize: 15, color: '#6E6863', flexShrink: 0 }}>{AV[c.owner] || ''} {c.owner}</span>}
        {c.memo && <span style={{ fontSize: 15, flexShrink: 0 }} title={c.memo}>📝</span>}
        {over && <span style={{ fontSize: 14.5, color: '#DC2626', fontWeight: 700, flexShrink: 0 }} title={'마감일(' + s.due + ') 초과'}>⚠</span>}
      </div>
    );
  };
  const subRow = s => {
    const cs = linked.filter(c => c.subplanId === s.id);
    const isStart = s.start === date; const isDue = s.due === date;
    return (
      <div key={s.id} style={{ marginLeft: 6, marginTop: 7, paddingLeft: 10, borderLeft: '2px solid #EDEBE7' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
          <Badge label={s.stage} color={stC(s.stage)} />
          <span style={{ fontSize: 17, fontWeight: 700, color: s.stage === '완료' ? '#A29C95' : '#1A1614' }}>{s.name}</span>
          {isStart && <span style={{ fontSize: 14, fontWeight: 700, color: '#2D5FE0', background: '#EAF0FE', borderRadius: 5, padding: '1px 7px' }}>시작</span>}
          {isDue && <span style={{ fontSize: 14, fontWeight: 700, color: '#DC2626', background: '#FEF2F2', borderRadius: 5, padding: '1px 7px' }}>마감</span>}
          <button onClick={() => jump({ kind: 'subplan', id: s.id })} style={{ ...miniBtn, marginLeft: 'auto' }}>수정</button>
        </div>
        <div style={{ fontSize: 14.5, color: '#A29C95', marginTop: 3 }}>{(s.start || '미정') + ' ~ ' + (s.due || '미정')}{ownersOf(s).length ? ' · ' + ownerAv(s) + ' ' + ownerNm(s) : ''}{cs.length ? ' · ☑ ' + cs.filter(c => c.done).length + '/' + cs.length : ''}</div>
        {cs.map(c => chkRow(c))}
      </div>
    );
  };
  const renderTree = g => g.map(go => (
    <div key={go.key} style={{ marginTop: 10 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
        <span style={{ fontSize: 17, fontWeight: 800, color: G }}>📁 {go.out ? outLabel(go.out) : '연결된 출력 프로젝트 없음'}</span>
        {go.out && <button onClick={() => jump({ kind: 'output', id: go.out.id })} style={miniBtn}>수정</button>}
      </div>
      {go.plans.map(gp => (
        <div key={gp.key} style={{ marginLeft: 6, marginTop: 6 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
            <span style={{ fontSize: 16, fontWeight: 700, color: '#6E6863' }}>▸ {gp.plan ? gp.plan.name : '연결된 실행계획 없음'}</span>
            {gp.plan && <button onClick={() => jump({ kind: 'plan', id: gp.plan.id })} style={miniBtn}>수정</button>}
          </div>
          {gp.subs.map(s => subRow(s))}
        </div>
      ))}
    </div>
  ));
  return (
    <ModalShell title={date + ' (' + wd + ') 상세'} onClose={onClose}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap', background: '#F5F4F2', borderRadius: 10, padding: '10px 13px', border: '1px solid #EDEBE7' }}>
        <span style={{ fontSize: 16.5, fontWeight: 700, color: G }}>☑ 이 날 체크리스트 {doneCnt}/{dayChks.length}</span>
        <span style={{ fontSize: 15.5, color: '#6E6863' }}>· 세부 실행계획 {mainIds.length}건</span>
        {others.length > 0 && <span style={{ fontSize: 15.5, color: '#A29C95' }}>· 기간 중 {others.length}건</span>}
      </div>
      <div>
        {manual.length > 0 && (
          <div style={{ marginTop: 4 }}>
            <div style={{ fontSize: 17, fontWeight: 800, color: '#8B5CF6' }}>📌 수동 체크리스트</div>
            {manual.map(c => chkRow(c))}
          </div>
        )}
        {renderTree(tree(mainIds))}
        {mainIds.length === 0 && manual.length === 0 && <div style={{ fontSize: 16, color: '#A29C95', textAlign: 'center', padding: '14px 0' }}>이 날 예정된 작업이 없습니다. 아래에서 바로 추가할 수 있어요.</div>}
      </div>
      {others.length > 0 && (
        <div style={{ borderTop: '1px solid #EDEBE7', paddingTop: 12 }}>
          <button onClick={() => setShowOther(o => !o)} style={{ width: '100%', textAlign: 'left', background: 'none', border: 'none', cursor: 'pointer', fontSize: 16, fontWeight: 700, color: '#6E6863', padding: 0, fontFamily: 'inherit' }}>{showOther ? '▾' : '▸'} 이 날 기간에 걸쳐 있는 나머지 세부 실행계획 ({others.length})</button>
          {showOther && <div style={{ opacity: 0.85 }}>{renderTree(tree(others.map(s => s.id)))}</div>}
        </div>
      )}
      <div style={{ background: '#F6F2FD', border: '1px solid #E4DAF7', borderRadius: 10, padding: '10px 12px' }}>
        <div style={{ fontSize: 16, fontWeight: 700, color: '#8B5CF6', marginBottom: 7 }}>＋ 이 날짜({date})에 체크리스트 추가</div>
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', alignItems: 'center' }}>
          <input value={newText} onChange={e => setNewText(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') addChk(); }} placeholder="할 일 입력" style={{ flex: 1, minWidth: 160, fontSize: 16, padding: '7px 9px', border: '1px solid #D8D3CC', borderRadius: 7, outline: 'none', fontFamily: 'inherit', color: '#1A1614' }} />
          <select value={newOwner} onChange={e => setNewOwner(e.target.value)} title="담당자" style={selSt}><option value="">담당 없음</option>{MEMBERS.map(m => <option key={m} value={m}>{m}</option>)}</select>

function TeamCalendar({ data, setData, onEdit }) {

function UpdateModal({ data, setData, edit, onClose }) {
  const [date, setDate] = useState(edit ? (edit.date || TODAY) : TODAY);
  const [tag, setTag] = useState(edit ? (edit.tag || '안내') : '신규기능');
  const [title, setTitle] = useState(edit ? edit.title : '');
  const [content, setContent] = useState(edit ? edit.content : '');
  const [pinned, setPinned] = useState(edit ? !!edit.pinned : false);
  const save = () => {
    if (!title.trim() && !content.trim()) { alert('제목 또는 내용을 입력하세요.'); return; }
    setData(d => {
      let updates = [...(d.updates || [])];
      if (pinned) updates = updates.map(n => ({ ...n, pinned: false }));
      if (edit) updates = updates.map(n => n.id === edit.id ? { ...n, date: date, tag: tag, title: title.trim(), content: content.trim(), pinned: pinned } : n);
      else updates = [{ id: Date.now(), date: date, tag: tag, title: title.trim(), content: content.trim(), pinned: pinned }, ...updates];
      return { ...d, updates: updates };
    });
    onClose();
  };
  return (
    <ModalShell title={edit ? '업데이트 안내 수정' : '업데이트 안내 작성'} onClose={onClose}>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1.5fr', gap: 10 }}>
        <div><Lbl c="날짜" /><Inp type="date" value={date} onChange={setDate} /></div>
        <div><Lbl c="구분" /><div style={{ display: 'flex', gap: 5 }}>{Object.keys(UP_TAGS).map(tg => <button key={tg} onClick={() => setTag(tg)} style={{ flex: 1, padding: '8px 0', borderRadius: 8, border: 'none', cursor: 'pointer', fontSize: 15, fontWeight: 700, background: tag === tg ? UP_TAGS[tg] : '#E3E0DC', color: tag === tg ? 'white' : '#3A3631' }}>{tg}</button>)}</div></div>
      </div>
      <div><Lbl c="제목" /><Inp value={title} onChange={setTitle} placeholder="예: 매출 탭 기간지정 기능 추가" /></div>
      <div><Lbl c="내용" /><textarea value={content} onChange={e => setContent(e.target.value)} rows={5} placeholder="어떤 업데이트인지 이용자에게 설명하세요" style={{ width: '100%', boxSizing: 'border-box', fontSize: 17, padding: '9px 11px', border: '1px solid #E3E0DC', borderRadius: 9, outline: 'none', resize: 'vertical', fontFamily: 'inherit', lineHeight: 1.5 }} /></div>
      <label onClick={() => setPinned(!pinned)} style={{ display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer', background: pinned ? '#FBF6EC' : '#FAFAFA', border: '1.5px solid ' + (pinned ? GO : '#E3E0DC'), borderRadius: 10, padding: '10px 14px' }}><div style={{ width: 20, height: 20, borderRadius: 4, border: '2px solid ' + (pinned ? GO : '#D1D5DB'), background: pinned ? GO : 'white', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>{pinned ? <span style={{ color: 'white', fontSize: 16, fontWeight: 900 }}>✓</span> : null}</div><div><div style={{ fontSize: 17, fontWeight: 700 }}>📌 상단 고정</div><div style={{ fontSize: 15, color: '#A29C95' }}>고정하면 맨 위에 크게 표시됩니다 (하나만)</div></div></label>
      <div style={{ display: 'flex', gap: 8 }}><Btn onClick={save} style={{ flex: 1 }}>저장</Btn><Btn v="secondary" onClick={onClose}>취소</Btn></div>
    </ModalShell>
  );
}

  const mDates = [];
  for (let i = 0; i < RANGE_DAYS; i++) { const d = new Date(mStartD); d.setDate(mStartD.getDate() + i); mDates.push(ymd(d.getFullYear(), d.getMonth() + 1, d.getDate())); }
  const mLeadWd = (mStartD.getDay() + 6) % 7;
  const monthCells = [];
  for (let i = 0; i < mLeadWd; i++) monthCells.push(null);
  mDates.forEach(dt => monthCells.push(dt));
  while (monthCells.length % 7 !== 0) monthCells.push(null);
  const monthWeeks = []; for (let i = 0; i < monthCells.length; i += 7) monthWeeks.push(monthCells.slice(i, i + 7));
  const monthEnd = mDates[mDates.length - 1];
  const monthItemsOf = date => subs.filter(s => s.due === date);
  const navBtn = { border: '1px solid #E3E0DC', background: 'white', borderRadius: 6, cursor: 'pointer', padding: '4px 10px' };
  return (
    <div style={{ padding: 20 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 14, flexWrap: 'wrap' }}>
        <div style={{ fontSize: 21, fontWeight: 700, color: G }}>데일리 / 주간 업무</div>
        <div style={{ display: 'flex', gap: 6, marginLeft: 'auto', alignItems: 'center', flexWrap: 'wrap' }}>
          <button onClick={() => setMonthView(v => !v)} style={{ ...navBtn, background: monthView ? G : 'white', color: monthView ? 'white' : '#3A3631', fontWeight: 600 }}>{monthView ? '주간 보기' : '📅 월간 보기'}</button>
          {monthView ? (<>
            <span style={{ fontSize: 15, color: '#6E6863' }}>조회 시작일</span>
            <input type="date" value={monthStart} onChange={e => { if (e.target.value) setMonthStart(e.target.value); }} style={{ padding: '4px 8px', borderRadius: 6, border: '1px solid #E3E0DC', fontSize: 16 }} />
            <button onClick={() => setMonthStart(shiftMonthDate(monthStart, -1))} style={navBtn}>◀</button>
            <span style={{ fontSize: 16, color: '#6E6863', minWidth: 120, textAlign: 'center' }}>{monthStart.slice(5)} ~ {monthEnd.slice(5)} (30일)</span>
            <button onClick={() => setMonthStart(shiftMonthDate(monthStart, 1))} style={navBtn}>▶</button>
          </>) : (<>
            <button onClick={() => setOffset(offset - 1)} style={navBtn}>◀</button>
            <span style={{ fontSize: 16, color: '#6E6863', minWidth: 110, textAlign: 'center' }}>{weekDates[0].slice(5)} ~ {weekDates[6].slice(5)}{offset === 0 ? ' (이번 주)' : ''}</span>
            <button onClick={() => setOffset(offset + 1)} style={navBtn}>▶</button>
          </>)}
        </div>
      </div>
      <FilterBar value={filter} onChange={setFilter} />
      {monthView && (
        <div style={{ marginBottom: 16 }}>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,minmax(0,1fr))', gap: 6, marginBottom: 6 }}>
            {DAYS.map(day => <div key={day} style={{ textAlign: 'center', fontWeight: 700, fontSize: 16, color: G, padding: '4px 0' }}>{day}</div>)}
          </div>
          {monthWeeks.map((wk, wi) => (
            <div key={wi} style={{ display: 'grid', gridTemplateColumns: 'repeat(7,minmax(0,1fr))', gap: 6, marginBottom: 6 }}>
              {wk.map((date, di) => {
                if (!date) return <div key={di} style={{ minHeight: 92, background: '#FAFAFA', borderRadius: 8 }} />;
                const items = monthItemsOf(date);
                const isToday = date === TODAY, isSel = date === monthStart;
                return (
                  <div key={di} onClick={() => setMonthStart(date)}
                    onDragOver={e => { e.preventDefault(); setDragOver('m' + date); }}
                    onDragLeave={e => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOver(null); }}
                    onDrop={e => handleDrop(e, date)}
                    style={{ minHeight: 92, background: dragOver === 'm' + date ? '#E8F4EE' : 'white', border: '1px solid ' + (isSel ? G : isToday ? GO : '#EDEBE7'), borderRadius: 8, padding: 6, cursor: 'pointer', overflow: 'hidden' }}>
                    <div style={{ fontSize: 15, fontWeight: 700, color: isSel ? G : isToday ? GO : '#3A3631', marginBottom: 4 }}>{date.slice(8) === '01' ? Number(date.slice(5, 7)) + '월 1' : Number(date.slice(8))}{isSel ? ' ·시작' : isToday ? ' ·오늘' : ''}</div>
                    {items.slice(0, 4).map(s => <div key={s.id} style={{ fontSize: 13, padding: '2px 5px', borderRadius: 5, background: stC(s.stage), color: 'white', marginBottom: 3, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{s.name}</div>)}
                    {items.length > 4 && <div style={{ fontSize: 13, color: '#A29C95' }}>+{items.length - 4}건</div>}
                  </div>
                );
              })}
            </div>
          ))}
          <div style={{ fontSize: 15, color: '#A29C95', marginTop: 4 }}>날짜를 클릭하면 그 날부터 한 달(30일)로 조회 기간이 바뀝니다.</div>
        </div>
      )}
      <div style={{ overflowX: 'auto', marginBottom: 16, display: monthView ? 'none' : 'block' }}>
        <div style={{ minWidth: 1000 }}>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,minmax(0,1fr))', gap: 8, marginBottom: 8 }}>
            {DAYS.map((day, i) => (
              <div key={day} style={{ background: weekDates[i] === TODAY ? GO : G, color: 'white', borderRadius: 8, padding: '7px 0', textAlign: 'center', fontWeight: 700, fontSize: 16 }}>
                {day} <span style={{ opacity: 0.7, fontSize: 14 }}>{weekDates[i].slice(5)}</span>
              </div>
            ))}
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,minmax(0,1fr))', gap: 8 }}>
            {weekDates.map((date, i) => (
              <div key={'dc' + i} style={{ gridColumn: i + 1, gridRow: 1, minWidth: 0 }}
                onDragOver={e => { e.preventDefault(); setDragOver('c' + i); }}
                onDragLeave={e => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOver(null); }}
                onDrop={e => handleDrop(e, date)}>
                {(() => { const h = colReserve(i); return h > 0 ? <div style={{ height: h }} /> : null; })()}
                <div style={{ minHeight: 70, padding: 4, borderRadius: 8, background: dragOver === 'c' + i ? '#E8F4EE' : 'transparent', border: dragOver === 'c' + i ? '2px dashed ' + G : '2px solid transparent', transition: 'all 0.15s' }}>
                  {getDayItems(date).map(s => renderMini(s))}
                </div>
              </div>
            ))}
            {spanning.map((s, idx) => {
              const sc = s.start <= weekDates[0] ? 0 : weekDates.indexOf(s.start);
              const ec = s.due >= weekDates[6] ? 6 : weekDates.indexOf(s.due);
              if (sc < 0 || ec < 0 || sc > ec) return null;
              const dur = diffDays(s.start, s.due);
              const chks = data.checklists.filter(c => c.subplanId === s.id); const cd = chks.filter(c => c.done).length;
              return (
                <div key={s.id} ref={el => (spanRefs.current[s.id] = el)} draggable onDragStart={e => onDragStart(e, s, true)}
                  style={{ gridColumn: `${sc + 1} / ${ec + 2}`, gridRow: 1, alignSelf: 'start', marginTop: laneTop[laneOf[idx]], position: 'relative', zIndex: 2, background: 'white', border: '1.5px solid ' + stC(s.stage), borderLeft: '5px solid ' + stC(s.stage), borderRadius: 10, padding: '6px 12px', display: 'flex', flexDirection: 'column', gap: 4, boxShadow: '0 2px 8px rgba(0,0,0,0.1)', cursor: 'grab' }}>
                  <div style={{ display: 'flex', alignItems: 'flex-start', gap: 8 }}>
                    <Badge label={s.stage} color={stC(s.stage)} />
                    <div style={{ flex: 1, minWidth: 0, cursor: 'pointer' }} onClick={() => setColChk(cc => ({ ...cc, [s.id]: !cc[s.id] }))}>
                      <div style={{ fontSize: 17, fontWeight: 700, color: '#1A1614', whiteSpace: 'normal', wordBreak: 'break-word', lineHeight: 1.25 }}>{s.name}</div>
                      <div style={{ fontSize: 14, color: '#6E6863' }}>{ownerAv(s)} · {s.start.slice(5)}~{s.due.slice(5)} ({dur}일){chks.length > 0 ? ` · ☑ ${cd}/${chks.length}` : ''}</div>
                    </div>
                    <EditBtn onClick={() => onEdit({ kind: 'subplan', id: s.id })} />
                  </div>
                  {!colChk[s.id] && <div style={{ background: '#F5F4F2', borderRadius: 6, padding: 6 }}>{chks.map(c => <div key={c.id} onClick={() => toggleChk(c.id)} style={{ display: 'flex', alignItems: 'center', gap: 5, padding: '3px 0', cursor: 'pointer' }}><Chk on={c.done} /><span style={{ fontSize: 14, color: c.done ? '#A29C95' : '#3A3631', textDecoration: c.done ? 'line-through' : 'none' }}>{c.text}</span></div>)}<div style={{ display: 'flex', gap: 4, marginTop: chks.length ? 5 : 0 }}><input value={newChk[s.id] || ''} draggable={false} onMouseDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} onChange={e => setNewChk(n => ({ ...n, [s.id]: e.target.value }))} onKeyDown={e => { if (e.key === 'Enter') addChk(s.id); }} placeholder="+ 체크 추가" style={{ flex: 1, fontSize: 14, padding: '3px 6px', border: '1px solid #E3E0DC', borderRadius: 5, outline: 'none', minWidth: 0 }} /><button onClick={e => { e.stopPropagation(); addChk(s.id); }} style={{ fontSize: 14, padding: '3px 8px', border: 'none', background: G, color: 'white', borderRadius: 5, cursor: 'pointer', fontWeight: 600 }}>추가</button></div></div>}
                </div>
              );
            })}
          </div>
        </div>
      </div>
      <div onDragOver={e => { e.preventDefault(); setDragOver('un'); }} onDragLeave={() => setDragOver(null)} onDrop={handleUnassignedDrop}
        style={{ background: dragOver === 'un' ? '#E8F4EE' : '#F5F4F2', border: '1px dashed ' + (dragOver === 'un' ? G : '#D1D5DB'), borderRadius: 10, padding: 14, transition: 'all 0.15s' }}>
        <div style={{ fontSize: 17, fontWeight: 700, color: '#6E6863', marginBottom: 14 }}>미배정 ({unassigned.length}) <span style={{ fontWeight: 400, fontSize: 15 }}>· 날짜 칸으로 드래그해서 배정 / 달력→미배정 드래그로 해제</span></div>
        {unassigned.length === 0 ? <div style={{ fontSize: 16, color: '#A29C95' }}>모든 항목에 날짜가 배정되었습니다.</div> :
          Object.entries(grouped).map(([oKey, plans]) => (
            <div key={oKey} style={{ marginBottom: 16 }}>
              <div style={{ background: G, color: 'white', borderRadius: '8px 8px 0 0', padding: '8px 14px', fontSize: 16, fontWeight: 700 }}>📦 {oKey}</div>
              <div style={{ display: 'flex', border: '1px solid ' + G, borderTop: 'none', borderRadius: '0 0 8px 8px', overflowX: 'auto' }}>
                {Object.entries(plans).map(([pKey, tasks], pIdx, arr) => (
                  <div key={pKey} style={{ flex: '0 0 200px', borderRight: pIdx < arr.length - 1 ? '1px solid #E3E0DC' : 'none', background: 'white' }}>
                    <div style={{ background: '#E8F4EE', color: G, padding: '6px 10px', fontSize: 15, fontWeight: 700, borderBottom: '1px solid #D1FAE5' }}>▸ {pKey}</div>
                    <div style={{ padding: 8 }}>{tasks.map(s => renderMini(s, true))}</div>
                  </div>
                ))}
              </div>
            </div>
          ))}
      </div>
    </div>
  );
}

function PerfModal({ subId, data, setData, onClose }) {
  const sub = data.subplans.find(s => s.id === subId);
  const plan = sub ? data.plans.find(p => p.id === sub.planId) : null;
  const out = plan ? data.outputs.find(o => o.id === plan.outputId) : null;
  const planKpis = (plan && plan.kpis) || [];
  const hasKpi = planKpis.length > 0;
  const myLogs = (data.kpiLogs || []).filter(l => l.subplanId === subId);
  const first = myLogs[0];
  const [values, setValues] = useState(() => { const v = {}; myLogs.forEach(l => { v[l.kpiId || ('k' + l.planId)] = String(l.value); }); return v; });
  const [pStart, setPStart] = useState(first ? first.periodStart : addDay(TODAY, -30));
  const [pEnd, setPEnd] = useState(first ? first.periodEnd : TODAY);
  const [note, setNote] = useState(first ? first.note : '');
  const [showFile, setShowFile] = useState(false);
  const files = (data.subplans.find(s => s.id === subId) || {}).files || [];
  if (!sub) return null;
  const save = () => {
    setData(d => {
      let logs = (d.kpiLogs || []).filter(l => l.subplanId !== subId);
      planKpis.forEach(k => { const val = values[k.id]; if (val !== '' && val != null && !isNaN(Number(val))) logs = [...logs, { id: Date.now() + Math.floor(Math.random() * 1000), subplanId: subId, planId: plan.id, kpiId: k.id, value: Number(val), periodStart: pStart, periodEnd: pEnd, note, recordedAt: TODAY }]; });
      return { ...d, kpiLogs: logs, subplans: d.subplans.map(s => s.id === subId ? { ...s, perfRecorded: true } : s) };
    });
    onClose();
  };
  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'flex-start', justifyContent: 'center', zIndex: 100, padding: '24px 12px', overflowY: 'auto' }}>
      <div style={{ background: 'white', borderRadius: 16, width: '100%', maxWidth: 520, boxShadow: '0 10px 40px rgba(0,0,0,0.3)' }}>
        <div style={{ background: G, color: 'white', padding: '14px 20px', borderRadius: '16px 16px 0 0', display: 'flex', alignItems: 'center' }}>
          <span style={{ fontWeight: 800, fontSize: 19 }}>📊 성과 기록하기</span>
          <button onClick={onClose} style={{ marginLeft: 'auto', background: 'none', border: 'none', color: 'white', fontSize: 26, cursor: 'pointer' }}>×</button>
        </div>
        <div style={{ padding: 20, display: 'flex', flexDirection: 'column', gap: 16, maxHeight: '80vh', overflowY: 'auto' }}>
          <div style={{ background: '#F5F4F2', borderRadius: 10, padding: 12 }}>
            <div style={{ fontSize: 15, color: '#A29C95', marginBottom: 3 }}>{out ? outLabel(out) : ''} ▸ {plan ? plan.name : ''}</div>
            <div style={{ fontSize: 18, fontWeight: 700 }}>{sub.name}</div>
            <div style={{ fontSize: 15, color: '#6E6863', marginTop: 4 }}>{ownerAv(sub)} {ownerNm(sub)} · 완료일 {sub.completedAt || '미기록'}</div>
          </div>
          {hasKpi ? (
            <div style={{ background: '#F5F4F2', borderRadius: 10, padding: 14, border: '1px solid #A7F3D0' }}>
              <div style={{ fontSize: 17, fontWeight: 700, color: G, marginBottom: 10 }}>🎯 KPI 달성 기록 (KPI별 입력)</div>
              {planKpis.map(k => (
                <div key={k.id} style={{ background: 'white', borderRadius: 8, padding: '10px 12px', marginBottom: 8 }}>
                  <div style={{ fontSize: 16, color: '#3A3631', marginBottom: 6 }}><strong>{k.name}</strong> <span style={{ color: '#A29C95' }}>(기본목표 {(k.target || 0).toLocaleString()} {k.unit})</span></div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <input type="number" value={values[k.id] || ''} onChange={e => setValues(v => ({ ...v, [k.id]: e.target.value }))} placeholder="달성값 (비우면 미기록)" style={{ flex: 1, padding: '8px', borderRadius: 8, border: '1px solid #E3E0DC', fontSize: 17, boxSizing: 'border-box' }} />
                    <span style={{ fontSize: 16, color: '#6E6863', whiteSpace: 'nowrap' }}>{k.unit}</span>
                  </div>
                </div>
              ))}
              <div style={{ marginTop: 4 }}>
                <div style={{ fontSize: 15, color: '#6E6863', marginBottom: 4 }}>달성 기간 (KPI 공통)</div>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr auto 1fr', alignItems: 'center', gap: 8 }}>
                  {inp(pStart, setPStart, 'date')}<span style={{ color: '#A29C95' }}>~</span>{inp(pEnd, setPEnd, 'date')}
                </div>
                <div style={{ fontSize: 15, color: '#8B5CF6', marginTop: 6 }}>※ KPI 탭에서 이 기간이 집계 범위에 포함되면 자동 합산됩니다</div>
              </div>
            </div>
          ) : (
            <div style={{ background: '#FFF7ED', borderRadius: 10, padding: 12, border: '1px solid #FED7AA', fontSize: 16, color: '#92400E' }}>
              이 업무의 실행계획에는 등록된 KPI가 없습니다. KPI 없이 파일·설명만 기록할 수 있어요.
            </div>
          )}
          <div style={{ background: '#F5F4F2', borderRadius: 10, padding: 12, border: '1px solid #EDEBE7' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10 }}>
              <div style={{ fontSize: 17, fontWeight: 700, color: G }}>📎 보고서용 자료 {files.length > 0 ? `(${files.length})` : ''}</div>
              <Btn v="gold" onClick={() => setShowFile(true)} style={{ padding: '5px 12px', fontSize: 16 }}>+ 파일 추가</Btn>
            </div>
            {files.length === 0 ? <div style={{ fontSize: 16, color: '#A29C95' }}>첨부된 파일이 없습니다</div> :
              files.map(f => (
                <div key={f.id} style={{ background: 'white', borderRadius: 8, padding: '8px 10px', marginBottom: 6, border: '1px solid #E3E0DC' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <span>{f.name.match(/\.(png|jpg|jpeg|gif|webp)$/i) ? '🖼️' : '📄'}</span>
                    <div style={{ flex: 1 }}><div style={{ fontSize: 16, fontWeight: 600 }}>{f.name}</div><div style={{ fontSize: 14, color: '#A29C95' }}>{fmtSize(f.size)}</div></div>
                    {f.driveUrl && <a href={f.driveUrl} target="_blank" rel="noreferrer" style={{ fontSize: 15, color: '#2D5FE0', fontWeight: 600, textDecoration: 'none' }}>열기</a>}
                    <button onClick={() => { if (!confirm('이 첨부를 목록에서 삭제할까요? (드라이브 원본 파일은 유지됩니다)')) return; setData(d => ({ ...d, subplans: d.subplans.map(s => s.id === subId ? { ...s, files: (s.files || []).filter(x => x.id !== f.id) } : s) })); }} style={{ border: 'none', background: 'none', color: '#E53935', cursor: 'pointer', fontSize: 16, fontWeight: 700 }}>삭제</button>
                  </div>
                  {f.desc && <div style={{ fontSize: 15, color: '#6E6863', marginTop: 6, background: '#F5F4F2', borderRadius: 6, padding: '5px 8px' }}>💬 {f.desc}</div>}
                </div>
              ))
            }
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <Btn onClick={save} style={{ flex: 1 }}>성과 기록 저장</Btn>
            <Btn v="secondary" onClick={onClose}>취소</Btn>
          </div>
        </div>
      </div>
      {showFile && <FileModal subId={subId} data={data} setData={setData} onClose={() => setShowFile(false)} />}
    </div>
  );
}

function TabPerformance({ data, setData, onRecord }) {
  const [filter, setFilter] = useState('전체');
  const completed = data.subplans.filter(s => s.stage === '완료' && matchOwner(s, filter));
  const recorded = completed.filter(s => s.perfRecorded);
  const notRecorded = completed.filter(s => !s.perfRecorded);
  const planOf = id => data.plans.find(p => p.id === id);
  const outOf = pid => { const p = planOf(pid); return p ? data.outputs.find(o => o.id === p.outputId) : null; };
  const logsOf = subId => (data.kpiLogs || []).filter(l => l.subplanId === subId);
  const renderCard = (s, isRecorded) => {
    const plan = planOf(s.planId); const out = outOf(s.planId);
    const logs = logsOf(s.id); const files = s.files || [];
    return (
      <Card key={s.id} style={{ marginBottom: 10, borderLeft: '4px solid ' + (isRecorded ? '#1FA463' : '#E08700') }}>
        <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10 }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 15, color: '#A29C95', marginBottom: 3 }}>{out ? outLabel(out) : ''} ▸ {plan ? plan.name : ''}</div>
            <div style={{ fontSize: 18, fontWeight: 700 }}>{s.name}</div>
            <div style={{ fontSize: 15, color: '#6E6863', marginTop: 4 }}>{ownerAv(s)} {ownerNm(s)} · 완료 {s.completedAt || '미기록'}</div>
            {isRecorded && logs.length > 0 && plan && (
              <div style={{ marginTop: 10, background: '#F5F4F2', borderRadius: 8, padding: '8px 12px' }}>
                {logs.map(l => { const k = (plan.kpis || []).find(kk => kk.id === l.kpiId); return (
                  <div key={l.id} style={{ marginBottom: 4 }}>
                    <div style={{ fontSize: 16, fontWeight: 700, color: G }}>🎯 {k ? k.name : 'KPI'}: {l.value.toLocaleString()} {k ? k.unit : ''}</div>
                    <div style={{ fontSize: 15, color: '#6E6863', marginTop: 2 }}>달성기간 {l.periodStart} ~ {l.periodEnd}</div>
                  </div>
                ); })}
              </div>
            )}
            {isRecorded && files.length > 0 && (
              <div style={{ marginTop: 8 }}>
                {files.map(f => (
                  <div key={f.id} style={{ fontSize: 15, color: '#2D5FE0', marginBottom: 3 }}>
                    📎 {f.name}{f.desc ? <span style={{ color: '#A29C95' }}> — {f.desc}</span> : ''}
                  </div>
                ))}
              </div>
            )}
          </div>
          <button onClick={() => onRecord(s.id)} style={{ padding: '7px 14px', background: isRecorded ? 'white' : G, color: isRecorded ? G : 'white', border: '1px solid ' + G, borderRadius: 8, fontWeight: 600, cursor: 'pointer', fontSize: 16, whiteSpace: 'nowrap' }}>
            {isRecorded ? '기록 수정' : '📊 성과 기록'}
          </button>
        </div>
      </Card>
    );
  };
  return (
    <div style={{ padding: 20 }}>
      <div style={{ fontSize: 21, fontWeight: 700, color: G, marginBottom: 14 }}>업무 성과</div>
      <FilterBar value={filter} onChange={setFilter} />
      <div style={{ marginBottom: 24 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 }}>
          <span style={{ fontSize: 18, fontWeight: 700, color: '#92400E' }}>⏳ 성과 기록 전</span>

function NumInput({ value, onCommit, placeholder, style }) {
  const [v, setV] = useState(value == null || value === '' ? '' : String(value));
  const focused = useRef(false);
  useEffect(() => { if (!focused.current) setV(value == null || value === '' ? '' : String(value)); }, [value]);
  return <input type="number" value={v} onFocus={e => { focused.current = true; e.target.select(); }} onChange={e => setV(e.target.value)} onBlur={() => { focused.current = false; onCommit(v); }} onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); }} placeholder={placeholder} style={style} />;
}
function buildDailyPeriods(dates) {
  const ds = dates.slice().sort();
  const DOW2 = ['일', '월', '화', '수', '목', '금', '토'];
  const months = {}, weeks = {}, days = [];
  ds.forEach(d => {
    const m = d.slice(0, 7);
    if (!months[m]) months[m] = { key: m, s: m + '-01', e: m + '-31', label: m };
    const dt = new Date(d + 'T00:00:00');
    const mon = addDays(d, -((dt.getDay() + 6) % 7));
    if (!weeks[mon]) weeks[mon] = { key: mon, s: mon, e: addDays(mon, 6), label: mon.slice(5).replace('-', '/') + ' ~ ' + addDays(mon, 6).slice(5).replace('-', '/') + ' 주간' };
    days.push({ key: d, s: d, e: d, label: d + ' (' + DOW2[dt.getDay()] + ')' });
  });
  const desc = o => Object.values(o).sort((a, b) => b.key.localeCompare(a.key));
  return { month: desc(months), week: desc(weeks), day: days.reverse() };
}

                            <div style={{ display: 'flex', alignItems: 'baseline', gap: 4, marginTop: 6 }}><span style={{ fontSize: 17, fontWeight: 800, color: done ? '#1FA463' : G }}>{achieved.toLocaleString()}</span><span style={{ fontSize: 10, color: '#A29C95' }}>/ {Math.round(target).toLocaleString()} {k.unit}</span>{hasChild && <span style={{ fontSize: 9, fontWeight: 700, color: '#2D5FE0', background: '#EFF6FF', borderRadius: 4, padding: '1px 5px' }}>세부 {childs.length}</span>}</div>

                            {tgtMismatch && <div style={{ fontSize: 10, fontWeight: 700, color: '#E08700', background: '#FEF3C7', borderRadius: 6, padding: '4px 8px', marginTop: 6 }}>⚠ 목표 상이 — 세부 합계 {Math.round(cTgtSum).toLocaleString()}{k.unit} · 부모 목표를 {Math.round(cTgtSum).toLocaleString()}(으)로 수정 권장</div>}

                                  </div>

                                <div style={{ display: 'flex', gap: 6, alignItems: 'center', marginTop: 6 }}>

                              </div>
                            ); })()}
                            {!hasChild && lk && (

                                <span style={{ marginLeft: 'auto', color: '#A29C95', fontWeight: 400 }}>설정 ›</span>
                              </div>
                            )}
                            {!hasChild && lk && lk.type === 'sales' && ((lk.productIds || []).length > 0 || (lk.groupIds || []).length > 0) && (() => { const ins = productInsight(lk); return ins && (
                              <div style={{ background: '#FFFBEB', border: '1px solid #FDE68A', borderRadius: 8, padding: '8px 10px', marginBottom: 10 }}>

                            {hasChild && <div style={{ fontSize: 10, color: '#6E6863', background: '#F7FAFD', border: '1px solid #D9E7F5', borderRadius: 8, padding: '7px 10px', marginBottom: 8 }}>ℹ️ 달성값은 세부 KPI 합계로 자동 계산돼요. 아래 <b>월별 목표</b>는 {k.name} 자체 목표이며, 전체(기본) 목표는 오른쪽 위 <b>수정</b>에서 설정합니다. 세부 합계와 다르면 위에 ⚠ 표시가 떠요.</div>}

                      <td style={{ padding: '8px 10px', whiteSpace: 'nowrap' }}>{b.vendor}</td>

                const vendors = Object.entries(P.vendors).sort((a, b) => (b[1].appr - a[1].appr) || (b[1].paid - a[1].paid));
                const open = !!openProj[P.pid], isUnattr = P.payItems.length > 0, hasDetail = P.items.length > 0 || P.payItems.length > 0 || P.manualPays.length > 0;

                            </div>
                          ))}
                        </div>)}
                      </div>

                  </div>

                  {p.memo && <div style={{ fontSize: 11, color: '#6E6863', marginTop: 4, background: '#F5F4F2', borderRadius: 6, padding: '5px 8px' }}>💬 {p.memo}</div>}
                  <div style={{ display: 'flex', gap: 6, marginTop: 10, alignItems: 'center' }}>
                    {p.receiptUrl ? <a href={p.receiptUrl} target="_blank" rel="noreferrer" style={{ fontSize: 11, color: '#2D5FE0', fontWeight: 700, textDecoration: 'none' }}>🧾 영수증 열기</a> : <span style={{ fontSize: 11, color: '#A29C95' }}>영수증 없음</span>}

                  </div>
                </div>); })}</div>
            </Card>); })}
      </>)}

      {showAdd && <BudgetFormModal data={data} setData={setData} onClose={() => setShowAdd(false)} />}
      {showVendorMgr && <VendorManagerModal data={data} setData={setData} onClose={() => setShowVendorMgr(false)} />}
      {showCardMgr && <CardManagerModal data={data} setData={setData} onClose={() => setShowCardMgr(false)} />}
      {showCardUse && <CardUsageModal data={data} monthKey={monthKey} onClose={() => setShowCardUse(false)} />}

      {showPay && <PaymentModal data={data} setData={setData} onClose={() => setShowPay(false)} />}
      {editPay && <PaymentModal data={data} setData={setData} edit={editPay} onClose={() => setEditPay(null)} />}
    </div>
  );
}

function PaymentModal({ data, setData, edit, onClose }) {
  const e = edit || {};
  const budgetVendors = [...new Set((data.budgets || []).map(b => b.vendor).filter(Boolean))];
  const regVendors = data.vendors || [];
  const allVendors = [...new Set([...regVendors, ...budgetVendors])].sort();
  const [vendor, setVendor] = useState(e.vendor || allVendors[0] || '');
  const [newVendor, setNewVendor] = useState('');
  const [addingVendor, setAddingVendor] = useState(false);
  const [amount, setAmount] = useState(e.amount != null ? String(e.amount) : '');
  const [payMethod, setPayMethod] = useState(e.payMethod || '세금계산서');
  const [projectId, setProjectId] = useState(e.projectId != null && e.projectId !== '' ? String(e.projectId) : '');
  const [cardId, setCardId] = useState(e.cardId != null && e.cardId !== '' ? String(e.cardId) : '');
  const cards = data.cards || [];
  const [paidDate, setPaidDate] = useState(e.paidDate || TODAY);
  const [memo, setMemo] = useState(e.memo || '');
  const [receiptUrl, setReceiptUrl] = useState(e.receiptUrl || '');
  const [receiptName, setReceiptName] = useState(e.receiptName || '');
  const [receiptFile, setReceiptFile] = useState(null);
  const [uploading, setUploading] = useState(false);
  const [upErr, setUpErr] = useState('');
  const projectName = vendor || '미지정';
  const projOut = (data.outputs || []).find(o => String(o.id) === projectId) || null;
  const keepCov = (e.coveredBudgetIds || []).slice();
  const confirmAddVendor = () => { const v = newVendor.trim(); if (!v) return; if (allVendors.indexOf(v) < 0) setData(d => ({ ...d, vendors: [...(d.vendors || []), v] })); setVendor(v); setNewVendor(''); setAddingVendor(false); };

  const pickReceipt = async file => {
    if (!file) return;
    setUploading(true); setUpErr('');
    try {
      const folderId = await driveDeepFolder(['라이프밀', '영수증', projectName || '미지정']);
      const r = await driveUploadFile(file, folderId);
      setReceiptUrl(r.link); setReceiptName(file.name); setReceiptFile(null);
    } catch (err) { setUpErr(err.message || '업로드 실패'); } finally { setUploading(false); }
  };
  const save = () => {
    if (!projectId) { alert('프로젝트를 선택하세요'); return; }
    if (!vendor) { alert('업체를 선택하세요'); return; }
    if (!amount || Number(amount) <= 0) { alert('결제 금액을 입력하세요'); return; }
    if (payMethod === '카드결제' && cards.length > 0 && !cardId) { alert('결제 카드를 선택하세요'); return; }
    const fields = { vendor, amount: Number(amount), payMethod, paidDate, projectId: Number(projectId), cardId: payMethod === '카드결제' && cardId ? Number(cardId) : null, coveredBudgetIds: keepCov, receiptUrl, receiptName, project: projectName, memo: memo.trim() };
    if (edit) setData(d => ({ ...d, payments: (d.payments || []).map(p => p.id === edit.id ? { ...p, ...fields } : p) }));
    else setData(d => ({ ...d, payments: [{ id: Date.now(), createdAt: TODAY, ...fields }, ...(d.payments || [])] }));
    onClose();
  };
  return (
    <ModalShell title={edit ? '실결제 수정' : '실결제 추가'} onClose={onClose}>
      <div>
        <Lbl c="프로젝트 (필수)" />
        <Sel value={projectId} onChange={setProjectId} ph="프로젝트 선택..." opts={(data.outputs || []).map(o => ({ v: o.id, l: outLabel(o) }))} />
        <div style={{ fontSize: 11, color: '#A29C95', marginTop: 5, lineHeight: 1.5 }}>이 결제는 선택한 프로젝트의 <b>업체별 사용내역</b>에 그대로 쌓입니다. 같은 업체라도 다른 프로젝트에는 절대 넘어가지 않아요.</div>
      </div>
      <div>
        <Lbl c="결제 업체 (필수)" />
        {addingVendor ? (
          <div style={{ display: 'flex', gap: 6 }}>
            <input value={newVendor} onChange={ev => setNewVendor(ev.target.value)} onKeyDown={ev => { if (ev.key === 'Enter') confirmAddVendor(); }} placeholder="새 업체명 입력" autoFocus style={{ flex: 1, padding: '9px 11px', borderRadius: 9, border: '1px solid #E3E0DC', fontSize: 13, boxSizing: 'border-box' }} />
            <button onClick={confirmAddVendor} style={{ padding: '0 14px', borderRadius: 9, border: 'none', background: G, color: 'white', cursor: 'pointer', fontSize: 12, fontWeight: 700 }}>추가</button>
            <button onClick={() => { setAddingVendor(false); setNewVendor(''); }} style={{ padding: '0 12px', borderRadius: 9, border: '1px solid #E3E0DC', background: 'white', color: '#6E6863', cursor: 'pointer', fontSize: 12 }}>취소</button>
          </div>
        ) : (
          <div style={{ display: 'flex', gap: 6 }}>
            <div style={{ flex: 1 }}><Sel value={vendor} onChange={setVendor} ph="업체 선택..." opts={allVendors.map(v => ({ v, l: v }))} /></div>
            <button onClick={() => setAddingVendor(true)} style={{ padding: '0 14px', borderRadius: 9, border: '1px dashed ' + G, background: 'white', color: G, cursor: 'pointer', fontSize: 12, fontWeight: 700, whiteSpace: 'nowrap' }}>+ 새 업체</button>
          </div>
        )}
        {allVendors.length === 0 && !addingVendor && <div style={{ fontSize: 11, color: '#A29C95', marginTop: 5 }}>등록된 업체가 없습니다. [+ 새 업체]로 추가하세요.</div>}
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}><div><Lbl c="실결제 금액 (원)" /><MoneyInput value={amount} onChange={setAmount} placeholder="실제 결제 금액" /></div><div><Lbl c="결제일" /><Inp type="date" value={paidDate} onChange={setPaidDate} /></div></div>
      <div><Lbl c="결제방법" />{seg(payMethod, setPayMethod, PAY_OPTS)}</div>
      {payMethod === '카드결제' && (
        <div>
          <Lbl c="결제 카드" />
          {cards.length === 0 ? <div style={{ fontSize: 11.5, color: '#B45309', background: '#FFFBEB', border: '1px solid #FDE68A', borderRadius: 9, padding: '9px 11px' }}>등록된 카드가 없습니다. 예산 탭 상단 [💳 카드 관리]에서 먼저 카드를 추가하세요.</div>
            : <Sel value={cardId} onChange={setCardId} ph="카드 선택..." opts={cards.map(c => ({ v: c.id, l: c.name + (c.issuer ? ' · ' + c.issuer : '') + (c.limit ? ' · 한도 ' + won(Number(c.limit)) : '') }))} />}
        </div>
      )}
      <div>
        <Lbl c="영수증" />
        {receiptUrl ? (
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, background: '#F5F4F2', border: '1px solid #A7F3D0', borderRadius: 9, padding: '8px 10px' }}>
            <span style={{ fontSize: 16 }}>🧾</span>
            <div style={{ flex: 1, fontSize: 12, fontWeight: 600, wordBreak: 'break-all' }}>{receiptName || '영수증'}</div>
            <a href={receiptUrl} target="_blank" rel="noreferrer" style={{ fontSize: 11, color: '#2D5FE0', fontWeight: 600, textDecoration: 'none' }}>열기</a>
            <button onClick={() => { setReceiptUrl(''); setReceiptName(''); }} style={{ border: 'none', background: 'none', color: '#E53935', cursor: 'pointer', fontSize: 12, fontWeight: 700 }}>제거</button>

            <div style={{ fontSize: 24, marginBottom: 4 }}>🧾</div>
            <div style={{ fontSize: 13, color: '#6E6863', fontWeight: 600 }}>{receiptFile ? receiptFile.name : '클릭해서 영수증 파일 선택'}</div>
            <div style={{ fontSize: 11, color: '#A29C95', marginTop: 3 }}>{receiptFile ? fmtSize(receiptFile.size) : '이미지 · PDF 등'}</div>
            <input id="rcpt-input" type="file" disabled={uploading} onChange={ev => { const f = ev.target.files && ev.target.files[0]; if (f) setReceiptFile(f); ev.target.value = ''; }} style={{ display: 'none' }} />
          </div>
          {receiptFile && (
            <div style={{ background: '#F5F4F2', borderRadius: 10, padding: 12, border: '1px solid #A7F3D0', marginTop: 8, display: 'flex', flexDirection: 'column', gap: 8 }}>
              <div style={{ fontSize: 11, color: '#6E6863' }}>드라이브 라이프밀/영수증/{projectName || '미지정'} 폴더에 저장됩니다 (처음 한 번 구글 로그인 필요)</div>
              {upErr ? <div style={{ fontSize: 11, color: '#E53935', background: '#FEF2F2', borderRadius: 8, padding: '7px 10px' }}>⚠ {upErr}</div> : null}
              <div style={{ display: 'flex', gap: 6 }}>
                <button onClick={() => pickReceipt(receiptFile)} disabled={uploading} style={{ flex: 1, padding: 11, background: uploading ? '#A29C95' : '#2D5FE0', color: 'white', border: 'none', borderRadius: 8, fontWeight: 700, fontSize: 13, cursor: uploading ? 'default' : 'pointer' }}>{uploading ? '업로드 중…' : '📤 드라이브에 업로드'}</button>
                {!uploading && <button onClick={() => { setReceiptFile(null); setUpErr(''); }} style={{ padding: '11px 14px', background: 'white', color: '#6E6863', border: '1px solid #E3E0DC', borderRadius: 8, fontWeight: 600, fontSize: 12, cursor: 'pointer' }}>취소</button>}
              </div>

          )}
        </>)}
        <div style={{ fontSize: 11, color: '#A29C95', marginTop: 6 }}>※ 처음 한 번 구글 로그인이 필요해요.</div>
      </div>
      <div><Lbl c="비고 (선택)" /><Inp value={memo} onChange={setMemo} placeholder="메모" /></div>
      <div style={{ display: 'flex', gap: 8 }}><Btn onClick={save} style={{ flex: 1 }}>{edit ? '저장' : '추가'}</Btn><Btn v="secondary" onClick={onClose}>취소</Btn></div>
    </ModalShell>
  );
}

function DraftModal({ data, setData, onClose }) {
  const [start, setStart] = useState(addDays(TODAY, -14));
  const [end, setEnd] = useState(TODAY);
  const [checked, setChecked] = useState({});
  const [memos, setMemos] = useState({});
  const [markDone, setMarkDone] = useState(true);
  const [saving, setSaving] = useState(false);
  const [saveErr, setSaveErr] = useState('');
  const [savedLink, setSavedLink] = useState('');
  const items = (data.budgets || []).filter(b => b.status === '기안전' && b.date >= start && b.date <= end);
  const selected = items.filter(b => checked[b.id]);
  const total = selected.reduce((a, b) => a + itemTotal(b), 0);
  const make = () => {
    if (!selected.length) { alert('기안서에 포함할 항목을 선택하세요'); return; }
    const invalid = selected.find(b => b.payMethod === '세금계산서' && !(b.account || '').trim());
    if (invalid) { alert('입금계좌가 등록되지않아 기안서 작성이 불가능합니다'); return; }
    const heads = ['프로젝트명', '실행계획명', '세부항목', '업체', '금액', '결제방법', '입금계좌', '비고'];
    const rows = selected.map(b => { const n = budgetNames(data, b); return [n.project, n.plan, n.detail, b.vendor, won(itemTotal(b)), b.payMethod, b.account || '-', (memos[b.id] || '').trim() || '-']; });
    const w = window.open('', '_blank');
    if (!w) { alert('팝업이 차단되었습니다. 팝업 허용 후 다시 시도하세요.'); return; }
    const css = '@page{size:A4 landscape;margin:14mm}body{font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;color:#1A1614;padding:0}h1{font-size:18px;margin:0 0 4px}.sub{color:#6E6863;font-size:12px;margin-bottom:14px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{border:1px solid #999;padding:6px 8px;text-align:left;vertical-align:top}th{background:#1A1614;color:#fff}tfoot td{font-weight:700;background:#FFFFFF}@media print{.noprint{display:none}}';
    const body = '<h1>예산 기안서</h1><div class="sub">기간 ' + start + ' ~ ' + end + ' · 총 ' + selected.length + '건 · 합계 ' + won(total) + '</div><table><thead><tr>' + heads.map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') + '</tbody><tfoot><tr><td colspan="4">합계</td><td>' + won(total) + '</td><td colspan="3"></td></tr></tfoot></table><button class="noprint" onclick="window.print()" style="margin-top:18px;padding:9px 18px;border:none;border-radius:8px;background:#1A1614;color:#fff;font-weight:600;cursor:pointer">인쇄 / PDF로 저장</button>';
    w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>예산 기안서</title><style>' + css + '</style></head><body>' + body + '</body></html>');
    w.document.close();
    if (markDone) setData(d => ({ ...d, budgets: d.budgets.map(b => checked[b.id] ? { ...b, status: '기안완료', memo: (memos[b.id] || '').trim() } : b) }));
    onClose();
  };
  const buildDocHtml = () => {
    const heads = ['프로젝트명', '실행계획명', '세부항목', '업체', '금액', '결제방법', '입금계좌', '비고'];
    const th = heads.map(h => '<td style="background:#1A1614;color:#ffffff;font-weight:bold;padding:6px;">' + h + '</td>').join('');
    const trs = selected.map(b => { const n = budgetNames(data, b); const r = [n.project, n.plan, n.detail, b.vendor, won(itemTotal(b)), b.payMethod, b.account || '-', (memos[b.id] || '').trim() || '-']; return '<tr>' + r.map(c => '<td style="padding:6px;">' + String(c) + '</td>').join('') + '</tr>'; }).join('');
    return '<html><head><meta charset="utf-8"></head><body><h2>예산 기안서</h2><p>기간 ' + start + ' ~ ' + end + ' &middot; 총 ' + selected.length + '건 &middot; 합계 ' + won(total) + '</p><table border="1" cellspacing="0" cellpadding="6" style="border-collapse:collapse;font-size:11px;width:100%;"><tr>' + th + '</tr>' + trs + '<tr><td colspan="4" style="font-weight:bold;padding:6px;">합계</td><td style="font-weight:bold;padding:6px;">' + won(total) + '</td><td colspan="3"></td></tr></table></body></html>';
  };
  const saveToDrive = async () => {
    if (!selected.length) { alert('기안서에 포함할 항목을 선택하세요'); return; }
    const invalid = selected.find(b => b.payMethod === '세금계산서' && !(b.account || '').trim());
    if (invalid) { alert('입금계좌가 등록되지않아 기안서 작성이 불가능합니다'); return; }
    setSaving(true); setSaveErr(''); setSavedLink('');
    try {
      const folderId = await driveBaseFolder('기안서');
      const r = await driveSaveDraftPdf(buildDocHtml(), '예산기안서_' + start + '_' + end, folderId);
      setSavedLink(r.pdfLink);
      if (markDone) setData(d => ({ ...d, budgets: d.budgets.map(b => checked[b.id] ? { ...b, status: '기안완료', memo: (memos[b.id] || '').trim() } : b) }));
    } catch (e) { setSaveErr(e.message || '저장 실패'); } finally { setSaving(false); }
  };
  return (
    <ModalShell title="기안서 만들기" onClose={onClose}>
      <div><Lbl c="기안서를 만들 기간을 선택하세요" /><div style={{ display: 'grid', gridTemplateColumns: '1fr auto 1fr', alignItems: 'center', gap: 8 }}><Inp type="date" value={start} onChange={setStart} /><span style={{ color: '#A29C95' }}>~</span><Inp type="date" value={end} onChange={setEnd} /></div></div>
      <div>
        <div style={{ fontSize: 12, fontWeight: 700, color: G, marginBottom: 8 }}>기안전 예산 ({items.length}건)</div>
        {!items.length ? <div style={{ fontSize: 12, color: '#A29C95', padding: '12px 0' }}>선택한 기간에 기안전 상태의 예산이 없습니다.</div> : null}
        {items.map(b => { const n = budgetNames(data, b); const on = !!checked[b.id]; const noAcc = b.payMethod === '세금계산서' && !(b.account || '').trim(); return (
          <div key={b.id} style={{ border: '1px solid #EDEBE7', borderRadius: 10, padding: 10, marginBottom: 8, background: on ? '#F6FBF7' : 'white' }}>
            <div onClick={() => setChecked({ ...checked, [b.id]: !on })} style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer' }}>
              <Chk on={on} />
              <div style={{ flex: 1 }}><div style={{ fontSize: 12, fontWeight: 600 }}>{n.detail} <span style={{ color: '#A29C95', fontWeight: 400 }}>· {b.vendor}</span></div><div style={{ fontSize: 11, color: '#6E6863' }}>{n.project} · {won(itemTotal(b))} · {b.payMethod}{noAcc ? ' · ⚠ 입금계좌 없음' : ''}</div></div>
              <span style={{ fontSize: 11, color: '#A29C95' }}>{b.date.slice(5)}</span>
            </div>
            {on ? (<div style={{ marginTop: 8 }}><input value={memos[b.id] || ''} onChange={e => setMemos({ ...memos, [b.id]: e.target.value })} placeholder="비고 입력 (선택)" style={{ width: '100%', padding: '7px 9px', borderRadius: 8, border: '1px solid #E3E0DC', fontSize: 12, boxSizing: 'border-box' }} />{noAcc ? <div style={{ fontSize: 11, color: '#E53935', marginTop: 4 }}>※ 세금계산서인데 입금계좌가 없습니다 — 예산 수정에서 먼저 등록하세요.</div> : null}</div>) : null}
          </div>); })}
      </div>
      {selected.length ? <div style={{ fontSize: 12, color: '#3A3631', fontWeight: 600 }}>선택 {selected.length}건 · 합계 {won(total)}</div> : null}
      <label style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12, color: '#3A3631', cursor: 'pointer' }}><input type="checkbox" checked={markDone} onChange={e => setMarkDone(e.target.checked)} /> 기안서 생성 후 선택 항목을 '기안완료'로 변경</label>
      {savedLink ? <div style={{ background: '#F5F4F2', border: '1px solid #A7F3D0', borderRadius: 10, padding: '10px 12px', fontSize: 12, color: G }}>✅ 라이프밀/기안서 폴더에 저장됐어요. <a href={savedLink} target="_blank" rel="noreferrer" style={{ color: '#2D5FE0', fontWeight: 700, textDecoration: 'none' }}>PDF 열기 →</a></div> : null}
      {saveErr ? <div style={{ background: '#FEF2F2', borderRadius: 10, padding: '10px 12px', fontSize: 12, color: '#E53935' }}>⚠ {saveErr}</div> : null}
      <div style={{ fontSize: 11, color: '#A29C95' }}>※ 처음 한 번 구글 로그인이 필요해요. 드라이브 라이프밀/기안서 폴더에 PDF로 저장됩니다.</div>
      <div style={{ display: 'flex', gap: 8 }}><Btn v="gold" onClick={saveToDrive} disabled={saving} style={{ flex: 1 }}>{saving ? '저장 중…' : '📤 드라이브에 저장 (PDF)'}</Btn><Btn v="secondary" onClick={make}>🖨 인쇄</Btn><Btn v="secondary" onClick={onClose}>닫기</Btn></div>
    </ModalShell>
  );
}
