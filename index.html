  const [paidDate, setPaidDate] = useState(e.paidDate || TODAY);
  const [paidAmount, setPaidAmount] = useState(e.paidAmount != null && e.paidAmount !== '' ? String(e.paidAmount) : '');
  const confirmAddVendor = () => { const v = newVendor.trim(); if (!v) return; if (allVendors.indexOf(v) < 0) setData(d => ({ ...d, vendors: [...(d.vendors || []), v] })); setVendor(v); setNewVendor(''); setAddingVendor(false); };
  const plans = data.plans.filter(p => isLinkedOut(p, Number(outId)));
  const seg = (val, set, opts) => <div style={{ display: 'flex', gap: 6 }}>{opts.map(o => <button key={o} onClick={() => set(o)} style={{ flex: 1, padding: '8px 0', borderRadius: 8, border: 'none', cursor: 'pointer', fontSize: 12, fontWeight: 600, background: val === o ? G : '#E3E0DC', color: val === o ? 'white' : '#3A3631' }}>{o}</button>)}</div>;
  const submit = () => {
    if (!outId || !vendor.trim() || !amount || Number(amount) <= 0) { alert('필수 항목을 입력하세요'); return; }
    if (pay === '카드결제' && cards.length > 0 && !cardId) { alert('결제 카드를 선택하세요'); return; }
    const fields = { outputId: Number(outId), planId: planId ? Number(planId) : null, kind, vendor: vendor.trim(), amount: Number(amount), vat, payMethod: pay, cardId: pay === '카드결제' && cardId ? Number(cardId) : null, account: account.trim(), status, date, paidDate: status === '결제완료' ? paidDate : (e.paidDate || ''), paidAmount: status === '결제완료' && paidAmount !== '' ? Number(paidAmount) : null };
    if (edit) setData(d => ({ ...d, budgets: d.budgets.map(b => b.id === edit.id ? { ...b, ...fields } : b) }));
    else setData(d => ({ ...d, nid: d.nid + 1, budgets: [...(d.budgets || []), { id: d.nid + 1, subplanId: null, checklistId: null, memo: '', ...fields }] }));
    onClose();
  };
  return (
    <ModalShell title={edit ? '예산 수정' : '예산 추가'} onClose={onClose}>
      <div><Lbl c="출력 프로젝트" /><Sel value={outId} onChange={v => { setOutId(v); setPlanId(''); }} ph="선택..." opts={data.outputs.map(o => ({ v: o.id, l: o.code + ' · ' + o.name }))} /></div>
      <div><Lbl c="실행계획 (선택)" /><Sel value={planId} onChange={setPlanId} ph="선택..." opts={plans.map(p => ({ v: p.id, l: p.name }))} /></div>
      <div><Lbl c="구분" />{seg(kind, setKind, ['일반', '정기'])}</div>
      <div>
        <Lbl c="결제 업체" />
        {addingVendor ? (
          <div style={{ display: 'flex', gap: 6 }}>
            <input value={newVendor} onChange={ev => setNewVendor(ev.target.value)} onKeyDown={ev => { if (ev.key === 'Enter') confirmAddVendor(); }} placeholder="새 업체명 입력" autoFocus style={{ flex: 1, padding: '9px 11px', borderRadius: 9, border: '1px solid #E3E0DC', fontSize: 13, boxSizing: 'border-box' }} />
            <button onClick={confirmAddVendor} style={{ padding: '0 14px', borderRadius: 9, border: 'none', background: G, color: 'white', cursor: 'pointer', fontSize: 12, fontWeight: 700 }}>추가</button>
            <button onClick={() => { setAddingVendor(false); setNewVendor(''); }} style={{ padding: '0 12px', borderRadius: 9, border: '1px solid #E3E0DC', background: 'white', color: '#6E6863', cursor: 'pointer', fontSize: 12 }}>취소</button>
          </div>
        ) : (
          <div style={{ display: 'flex', gap: 6 }}>
            <div style={{ flex: 1 }}><Sel value={vendor} onChange={setVendor} ph="업체 선택..." opts={allVendors.map(v => ({ v, l: v }))} /></div>
            <button onClick={() => setAddingVendor(true)} style={{ padding: '0 14px', borderRadius: 9, border: '1px dashed ' + G, background: 'white', color: G, cursor: 'pointer', fontSize: 12, fontWeight: 700, whiteSpace: 'nowrap' }}>+ 새 업체</button>
          </div>
        )}
        {allVendors.length === 0 && !addingVendor && <div style={{ fontSize: 11, color: '#A29C95', marginTop: 5 }}>등록된 업체가 없습니다. [+ 새 업체]로 추가하세요.</div>}
      </div>
      <div><Lbl c="예상 금액 (원)" /><MoneyInput value={amount} onChange={setAmount} placeholder="공급가" /></div>
      <div><Lbl c="VAT" />{seg(vat, setVat, VAT_OPTS)}</div>
      <div><Lbl c="결제방법" />{seg(pay, setPay, PAY_OPTS)}</div>
      {pay === '세금계산서' && <div><Lbl c="입금 계좌 (선택)" /><Inp value={account} onChange={setAccount} placeholder="은행 / 계좌번호 / 예금주" /></div>}
      {pay === '카드결제' && (
        <div>
          <Lbl c="결제 카드" />
          {cards.length === 0 ? <div style={{ fontSize: 11.5, color: '#B45309', background: '#FFFBEB', border: '1px solid #FDE68A', borderRadius: 9, padding: '9px 11px' }}>등록된 카드가 없습니다. 예산 탭 상단 [💳 카드 관리]에서 먼저 카드를 추가하세요.</div>
            : <Sel value={cardId} onChange={setCardId} ph="카드 선택..." opts={cards.map(c => ({ v: c.id, l: c.name + (c.issuer ? ' · ' + c.issuer : '') + (c.limit ? ' · 한도 ' + won(Number(c.limit)) : '') }))} />}
        </div>
      )}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}><div><Lbl c="상태" /><Sel value={status} onChange={setStatus} opts={BSTATUS} /></div><div><Lbl c="기안/등록 일자" /><Inp type="date" value={date} onChange={setDate} /></div></div>
      {status === '결제완료' && <div style={{ background: '#ECFDF5', borderRadius: 10, padding: 12, border: '1px solid #A7F3D0' }}><div style={{ fontSize: 12, fontWeight: 700, color: '#1FA463', marginBottom: 8 }}>✓ 결제 완료 정보</div><div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}><div><Lbl c="결제 완료일" /><Inp type="date" value={paidDate} onChange={setPaidDate} /></div><div><Lbl c="실결제 금액 (선택)" /><MoneyInput value={paidAmount} onChange={setPaidAmount} placeholder="비우면 예상금액 사용" /></div></div><div style={{ fontSize: 11, color: '#6E6863', marginTop: 6 }}>※ 결제완료일 기준으로 월 집계 및 날짜별 표시가 반영됩니다.</div></div>}
      <div style={{ display: 'flex', gap: 8 }}><Btn onClick={submit} style={{ flex: 1 }}>{edit ? '저장' : '추가'}</Btn><Btn v="secondary" onClick={onClose}>취소</Btn></div>
    </ModalShell>
  );
}

function CardManagerModal({ data, setData, onClose }) {
  const cards = data.cards || [];
  const budgets = data.budgets || [];
  const payments = data.payments || [];
  const [name, setName] = useState('');
  const [issuer, setIssuer] = useState('');
  const [limit, setLimit] = useState('');
  const [editId, setEditId] = useState(null);
  const usedCnt = id => payments.filter(p => String(p.cardId) === String(id)).length + budgets.filter(b => String(b.cardId) === String(id)).length;
  const usedSum = id => payments.filter(p => String(p.cardId) === String(id)).reduce((a, p) => a + (Number(p.amount) || 0), 0);
  const reset = () => { setName(''); setIssuer(''); setLimit(''); setEditId(null); };
  const submit = () => {
    const nm = name.trim(); if (!nm) { alert('카드명을 입력하세요'); return; }
    const lim = limit === '' ? null : Number(limit);
    if (editId) { setData(d => ({ ...d, cards: (d.cards || []).map(c => c.id === editId ? { ...c, name: nm, issuer: issuer.trim(), limit: lim } : c) })); reset(); return; }
    if (cards.some(c => c.name === nm)) { alert('이미 있는 카드명입니다'); return; }
    setData(d => ({ ...d, cards: [...(d.cards || []), { id: Date.now(), name: nm, issuer: issuer.trim(), limit: lim }] }));
    reset();
  };
  const startEdit = c => { setEditId(c.id); setName(c.name || ''); setIssuer(c.issuer || ''); setLimit(c.limit != null ? String(c.limit) : ''); };
  const removeCard = c => { if (usedCnt(c.id) > 0) { alert('이 카드로 등록된 기안·실결제가 있어 삭제할 수 없습니다.\n먼저 해당 기록의 카드를 바꿔주세요.'); return; } if (!confirm('"' + c.name + '" 카드를 삭제할까요?')) return; setData(d => ({ ...d, cards: (d.cards || []).filter(x => x.id !== c.id) })); if (editId === c.id) reset(); };
  return (
    <ModalShell title="💳 카드 관리" onClose={onClose}>
      <div style={{ fontSize: 12, color: '#6E6863', lineHeight: 1.5 }}>기안 작성·실결제에서 <b>카드결제</b>를 고르면 여기 등록한 카드를 선택할 수 있어요. 월 한도를 넣으면 [📊 카드별 사용내역]에서 <b>사용가능금액</b>이 계산됩니다.</div>
      <div style={{ background: '#FAFAF9', border: '1px solid #EDEBE7', borderRadius: 10, padding: 11, display: 'flex', flexDirection: 'column', gap: 8 }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: G }}>{editId ? '✏️ 카드 수정' : '+ 새 카드 등록'}</div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
          <div><Lbl c="카드명 (필수)" /><Inp value={name} onChange={setName} placeholder="예) 법인카드 1234" /></div>
          <div><Lbl c="카드사 (선택)" /><Inp value={issuer} onChange={setIssuer} placeholder="예) 신한 / 하나" /></div>
        </div>
        <div><Lbl c="월 한도 (선택)" /><MoneyInput value={limit} onChange={setLimit} placeholder="비우면 한도 없음" /></div>
        <div style={{ display: 'flex', gap: 8 }}><Btn onClick={submit} style={{ flex: 1 }}>{editId ? '저장' : '+ 추가'}</Btn>{editId ? <Btn v="secondary" onClick={reset}>취소</Btn> : null}</div>
      </div>
      {cards.length === 0 ? <div style={{ fontSize: 12, color: '#A29C95', padding: '16px 0', textAlign: 'center' }}>등록된 카드가 없습니다</div> : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 6, maxHeight: 320, overflowY: 'auto' }}>
          {cards.map(c => { const cnt = usedCnt(c.id), sum = usedSum(c.id); return (
            <div key={c.id} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '9px 11px', background: '#F8F7F5', border: '1px solid #E3E0DC', borderRadius: 9 }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
                  <span style={{ fontSize: 13, fontWeight: 700, color: '#1A1614' }}>💳 {c.name}</span>
                  {c.issuer ? <span style={{ fontSize: 10, color: '#6E6863', background: '#EDEBE7', borderRadius: 5, padding: '1px 6px' }}>{c.issuer}</span> : null}
                  {cnt === 0 ? <span style={{ fontSize: 9, fontWeight: 700, color: '#8A8580', background: '#F5F4F2', border: '1px solid #E3E0DC', borderRadius: 5, padding: '1px 6px' }}>사용 안 함</span> : null}
                </div>
                <div style={{ fontSize: 10.5, color: '#A29C95', marginTop: 2 }}>{c.limit ? '월 한도 ' + won(Number(c.limit)) : '한도 미설정'}{cnt > 0 ? ' · 사용 ' + cnt + '건 · 누적 ' + won(sum) : ''}</div>
              </div>
              <button onClick={() => startEdit(c)} style={{ border: '1px solid #E3E0DC', background: 'white', color: '#6E6863', borderRadius: 6, cursor: 'pointer', fontSize: 10.5, fontWeight: 700, padding: '4px 9px' }}>수정</button>
              <button onClick={() => removeCard(c)} style={{ border: '1px solid ' + (cnt > 0 ? '#E3E0DC' : '#FCA5A5'), background: 'white', color: cnt > 0 ? '#C4BFB9' : '#E53935', borderRadius: 6, cursor: 'pointer', fontSize: 10.5, fontWeight: 700, padding: '4px 9px' }}>🗑</button>
            </div>
          ); })}
        </div>
      )}
      <div style={{ display: 'flex', gap: 8 }}><Btn v="secondary" onClick={onClose} style={{ flex: 1 }}>닫기</Btn></div>
    </ModalShell>
  );
}

function CardUsageModal({ data, monthKey, onClose }) {
  const cards = data.cards || [];
  const payments = data.payments || [];
  const [allTime, setAllTime] = useState(false);
  const [open, setOpen] = useState({});
  const inRange = p => allTime ? true : ((p.paidDate || '').slice(0, 7) === monthKey);
  const cardPays = payments.filter(p => inRange(p) && (p.payMethod === '카드결제' || p.cardId));
  const rows = cards.map(c => {
    const list = cardPays.filter(p => String(p.cardId) === String(c.id)).sort((a, b) => (b.paidDate || '') < (a.paidDate || '') ? -1 : 1);
    const used = list.reduce((a, p) => a + (Number(p.amount) || 0), 0);
    const lim = c.limit != null && c.limit !== '' ? Number(c.limit) : null;
    return { c: c, list: list, used: used, lim: lim, left: lim != null ? lim - used : null, pct: lim ? Math.min(100, Math.round(used / lim * 100)) : (used > 0 ? 100 : 0) };
  }).sort((a, b) => b.used - a.used);
  const noCard = cardPays.filter(p => !p.cardId).sort((a, b) => (b.paidDate || '') < (a.paidDate || '') ? -1 : 1);
  const noCardSum = noCard.reduce((a, p) => a + (Number(p.amount) || 0), 0);
  const totalUsed = rows.reduce((a, r) => a + r.used, 0) + noCardSum;
  const totalLimit = rows.reduce((a, r) => a + (r.lim || 0), 0);
  const payRow = p => { const po = (data.outputs || []).find(o => String(o.id) === String(p.projectId)); return (
    <div key={p.id} style={{ display: 'flex', alignItems: 'center', gap: 7, flexWrap: 'wrap', fontSize: 11.5, background: '#FAFAF9', border: '1px solid #F0EEEB', borderRadius: 8, padding: '6px 9px' }}>
      <span style={{ color: '#A29C95', minWidth: 38 }}>{(p.paidDate || '').slice(5) || '-'}</span>
      <span style={{ fontSize: 9, fontWeight: 700, color: '#6E6863', background: '#F0EEEB', borderRadius: 4, padding: '1px 5px' }}>{p.vendor || '(업체 미지정)'}</span>
      {po ? <span style={{ fontSize: 9, fontWeight: 700, color: '#2D5FE0', background: '#EFF6FF', borderRadius: 4, padding: '1px 5px' }}>{po.code}</span> : <span style={{ fontSize: 9, fontWeight: 700, color: '#B45309', background: '#FFFBEB', borderRadius: 4, padding: '1px 5px' }}>프로젝트 미지정</span>}
      <span style={{ flex: 1, minWidth: 60, color: '#3A3631' }}>{p.memo || ''}</span>
      <span style={{ fontWeight: 800, color: '#1A1614' }}>{won(Number(p.amount) || 0)}</span>
    </div>
  ); };
  return (
    <ModalShell title="📊 카드별 사용내역" onClose={onClose}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
        <span style={{ fontSize: 12.5, fontWeight: 700, color: G }}>{allTime ? '전체 기간' : monthKey}</span>
        <button onClick={() => setAllTime(!allTime)} style={{ padding: '5px 12px', borderRadius: 7, border: '1px solid #E3E0DC', background: 'white', color: '#6E6863', fontSize: 11.5, fontWeight: 700, cursor: 'pointer' }}>{allTime ? '📅 이 달만 보기' : '🗂 전체 기간 보기'}</button>
        <span style={{ marginLeft: 'auto', fontSize: 11.5, color: '#6E6863' }}>총 사용 <b style={{ color: '#1FA463' }}>{won(totalUsed)}</b>{totalLimit > 0 ? <span style={{ color: '#A29C95' }}> / 한도합 {won(totalLimit)}</span> : null}</span>
      </div>
      {cards.length === 0 ? <div style={{ fontSize: 12, color: '#A29C95', padding: '18px 0', textAlign: 'center' }}>등록된 카드가 없습니다. [💳 카드 관리]에서 먼저 카드를 추가하세요.</div> : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 9, maxHeight: 420, overflowY: 'auto' }}>
          {rows.map(r => { const over = r.left != null && r.left < 0, barC = over ? '#E53935' : (r.pct >= 90 ? '#E08700' : '#1FA463'), isOpen = !!open[r.c.id]; return (
            <div key={r.c.id} style={{ border: '1px solid ' + (over ? '#FCA5A5' : '#EDEBE7'), background: over ? '#FEF2F2' : 'white', borderRadius: 10, padding: '11px 13px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap', marginBottom: 7 }}>
                <span style={{ fontSize: 13.5, fontWeight: 800, color: '#1A1614' }}>💳 {r.c.name}</span>
                {r.c.issuer ? <span style={{ fontSize: 10, color: '#6E6863', background: '#F0EEEB', borderRadius: 5, padding: '1px 6px' }}>{r.c.issuer}</span> : null}
                {over ? <span style={{ fontSize: 9.5, fontWeight: 800, color: '#E53935', background: '#FEF2F2', border: '1px solid #FCA5A5', borderRadius: 5, padding: '1px 6px' }}>한도 초과</span> : null}
                <span style={{ marginLeft: 'auto', fontSize: 11, color: '#6E6863' }}>{r.lim != null ? <>한도 <b style={{ color: '#2D5FE0' }}>{won(r.lim)}</b></> : <span style={{ color: '#A29C95' }}>한도 미설정</span>}</span>
              </div>
              <div style={{ height: 7, background: '#F0EEEB', borderRadius: 4, overflow: 'hidden' }}><div style={{ width: r.pct + '%', height: '100%', background: barC, borderRadius: 4 }} /></div>
              <div style={{ display: 'flex', gap: 12, marginTop: 6, flexWrap: 'wrap', fontSize: 11.5 }}>
                <span style={{ color: '#6E6863' }}>사용한금액 <b style={{ color: '#1FA463' }}>{won(r.used)}</b></span>
                <span style={{ color: '#6E6863' }}>사용가능금액 <b style={{ color: over ? '#E53935' : '#E08700' }}>{r.left != null ? won(r.left) : '-'}</b></span>
                <span style={{ marginLeft: 'auto', color: '#A29C95', fontWeight: 700 }}>{r.lim != null ? r.pct + '%' : r.list.length + '건'}</span>
              </div>
              {r.list.length > 0 && (
                <div style={{ marginTop: 8 }}>
                  <button onClick={() => setOpen(o => ({ ...o, [r.c.id]: !o[r.c.id] }))} style={{ fontSize: 11, fontWeight: 700, padding: '5px 10px', borderRadius: 7, border: '1px solid #E3E0DC', background: isOpen ? '#F5F4F2' : 'white', color: '#6E6863', cursor: 'pointer' }}>{isOpen ? '▾' : '▸'} 결제 내역 ({r.list.length}건)</button>
                  {isOpen && <div style={{ marginTop: 7, display: 'flex', flexDirection: 'column', gap: 5 }}>{r.list.map(payRow)}</div>}
                </div>
              )}
            </div>
          ); })}
          {noCard.length > 0 && (
            <div style={{ border: '1px solid #FDE68A', background: '#FFFBEB', borderRadius: 10, padding: '11px 13px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap', marginBottom: 6 }}>
                <span style={{ fontSize: 13, fontWeight: 800, color: '#B45309' }}>⚠ 카드 미지정 결제</span>
                <span style={{ marginLeft: 'auto', fontSize: 12, fontWeight: 800, color: '#B45309' }}>{won(noCardSum)}</span>
              </div>
              <div style={{ fontSize: 11, color: '#8A8580', marginBottom: 7 }}>결제방법이 카드결제인데 카드가 선택되지 않은 {noCard.length}건입니다. 실결제 [수정]에서 카드를 지정하면 위 집계에 반영됩니다.</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>{noCard.map(payRow)}</div>
            </div>
          )}
        </div>
      )}
      <div style={{ fontSize: 10.5, color: '#A29C95', lineHeight: 1.5 }}>사용한금액 = {allTime ? '전체 기간' : monthKey} 실결제 중 해당 카드로 지정된 금액 합 · 사용가능금액 = 월 한도 − 사용한금액 (한도 미설정이면 표시되지 않습니다)</div>
      <div style={{ display: 'flex', gap: 8 }}><Btn v="secondary" onClick={onClose} style={{ flex: 1 }}>닫기</Btn></div>
    </ModalShell>
  );
}

              <td style={tdR}>{num(R.v)}</td><td style={tdR}>{pctS(R.v ? R.o / R.v * 100 : 0)}</td><td style={tdR}>{num(R.o)}</td>
            </tr>
          ].concat(open ? R.kids.map((k, ki) => <tr key={R.l1 + '~' + ki}>
              <td style={{ ...td, paddingLeft: 22, color: '#6E6863' }}>{k.l2}{k.l3 && k.l3 !== '-' ? ' ▸ ' + k.l3 : ''}<span onClick={() => setTip({ name: R.l1 + ' ▸ ' + k.l2 + (k.l3 && k.l3 !== '-' ? ' ▸ ' + k.l3 : ''), text: tipOf(R.l1, k.l2, k.l3) })} style={{ cursor: 'pointer', color: '#2D5FE0', marginLeft: 5, fontSize: 10.5 }}>❓</span></td>
              <td style={tdR}>{num(k.v)}</td><td style={tdR}>{pctS(k.v ? k.o / k.v * 100 : 0)}</td><td style={tdR}>{num(k.o)}</td>
            </tr>) : []); })}</tbody>
        </table>
      </div>

      <Sub n="5" t="유입 성격 요약" d={'선택 기간(' + (curLabel || '전체') + ') · 6가지 성격 · ' + priCmp + ' 대비 증감'} />
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(150px,1fr))', gap: 8, marginBottom: 16 }}>
        {GROUPS.map(gr => { const c = cur.byGroup[gr[0]] || { v: 0, o: 0 }; const pv = (pri.byGroup[gr[0]] || { v: 0 }).v; const conv = c.v ? c.o / c.v * 100 : 0; const d = (hasPri && !cmpSuppressed) ? gd(c.v, pv) : null; return <div key={gr[0]} style={{ border: '1px solid #EDEBE7', borderLeft: '4px solid ' + gr[1], borderRadius: 9, padding: '9px 11px' }}><div style={{ fontSize: 12, fontWeight: 800, color: gr[1] }}>{gr[0]}</div><div style={{ fontSize: 9, color: '#A29C95', margin: '1px 0 5px', lineHeight: 1.35, minHeight: 22 }}>{gr[2]}</div><div style={{ display: 'flex', alignItems: 'baseline', gap: 5 }}><div style={{ fontSize: 15, fontWeight: 800, color: G }}>{num(c.v)}</div><div style={{ fontSize: 9, color: '#6E6863' }}>방문</div>{d == null ? null : <div style={{ fontSize: 10, fontWeight: 700, marginLeft: 'auto', color: d >= 0 ? '#1FA463' : '#DC2626' }}>{d >= 0 ? '▲' : '▼'}{Math.abs(d)}%</div>}</div><div style={{ fontSize: 10.5, color: '#6E6863' }}>전환 {pctS(conv)} · 결제 {num(c.o)}</div></div>; })}
      </div>

      {vcTot ? <React.Fragment>
        <Sub n="6" t="고객 요약 (기간합계·보조)" d={'순인원 기준 · ' + periodLabel + ' · 고객수는 전체만 신뢰(경로별 합산 금지)'} />
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(110px,1fr))', gap: 8 }}>
          {[['순방문', num(vcTot.visitors) + '명'], ['순구매', num(vcTot.buyers) + '명'], ['1인당 방문', (vcTot.visitors ? Math.round(periodVisits / vcTot.visitors * 10) / 10 : 0) + '회'], ['재구매(주문/구매자)', (vcTot.buyers ? Math.round(periodOrders / vcTot.buyers * 100) / 100 : 0) + '회'], ['객단가', won(vcTot.aov)]].map((c, i) => <div key={i} style={{ background: '#F5F8FE', border: '1px solid #DBE7FA', borderRadius: 9, padding: '9px 10px' }}><div style={{ fontSize: 10, color: '#6E6863', marginBottom: 2 }}>{c[0]}</div><div style={{ fontSize: 15, fontWeight: 800, color: '#2D5FE0' }}>{c[1]}</div></div>)}
        </div>
      </React.Fragment> : null}
    </Card>
  );
}

function aggSalesRange(days, start, end) {
  if (!start || !end || start > end) return null;
  const inR = (days || []).filter(d => d.key && d.key >= start && d.key <= end).sort((a, b) => a.key < b.key ? -1 : 1);
  if (!inR.length) return null;
  const ad = (s, n) => { const t = new Date(s + 'T00:00:00'); t.setDate(t.getDate() + n); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); };
  const span = Math.round((new Date(end) - new Date(start)) / 86400000) + 1;
  const prior = (days || []).filter(d => d.key && d.key >= ad(start, -span) && d.key <= ad(start, -1));
  const sv = (arr, k) => arr.reduce((s, d) => s + (((d.summary && d.summary[k]) || {}).value || 0), 0);
  const refSum = arr => arr.reduce((s, d) => { const b = d.summary && d.summary.refund && d.summary.refund.breakdown; return s + ((b && b.total && b.total.amount) || 0); }, 0);
  const tot = arr => ({ rev: sv(arr, 'revenue'), ord: sv(arr, 'orders'), vis: sv(arr, 'visitors'), ref: refSum(arr) });
  const cur = tot(inR), pr = prior.length ? tot(prior) : null;
  const r1 = x => Math.round(x * 10) / 10;
  const mk = (v, pv) => ({ value: v, deltaValue: pv == null ? null : v - pv, deltaPct: (pv == null || pv === 0) ? null : r1((v - pv) / pv * 100) });
  const aov = cur.ord ? Math.round(cur.rev / cur.ord) : 0, paov = (pr && pr.ord) ? Math.round(pr.rev / pr.ord) : null;
  const conv = cur.vis ? Math.round(cur.ord / cur.vis * 10000) / 100 : 0, pconv = (pr && pr.vis) ? Math.round(pr.ord / pr.vis * 10000) / 100 : null;
  const rb = key => inR.reduce((a, d) => { const x = ((d.summary && d.summary.refund && d.summary.refund.breakdown) || {})[key]; return { amount: a.amount + ((x && x.amount) || 0), count: a.count + ((x && x.count) || 0) }; }, { amount: 0, count: 0 });
  const cancel = rb('cancel'), ret = rb('return'), exch = rb('exchange');
  const refTot = { amount: cancel.amount + ret.amount + exch.amount, count: cancel.count + ret.count + exch.count };
  const refDelta = pr == null ? null : refTot.amount - pr.ref, refPct = (pr == null || pr.ref === 0) ? null : r1((refTot.amount - pr.ref) / pr.ref * 100);
  const summary = {
    revenue: mk(cur.rev, pr && pr.rev), orders: mk(cur.ord, pr && pr.ord),
    aov: { value: aov, deltaValue: paov == null ? null : aov - paov, deltaPct: (paov == null || paov === 0) ? null : r1((aov - paov) / paov * 100) },
    visitors: mk(cur.vis, pr && pr.vis),
    conversion: { value: conv, deltaValue: pconv == null ? null : Math.round((conv - pconv) * 100) / 100, deltaPct: (pconv == null || pconv === 0) ? null : r1((conv - pconv) / pconv * 100) },
    refund: { value: null, deltaValue: refDelta, deltaPct: refPct, breakdown: { basis: '처리일(취소완료일)', cancel: cancel, return: ret, exchange: exch, total: refTot, deltaValue: refDelta, deltaPct: refPct } }
  };
  const daily = inR.map(d => ({ date: d.key, revenue: ((d.summary && d.summary.revenue) || {}).value || 0 }));
  const chMap = {};
  inR.forEach(d => (d.channels || []).forEach(c => { const k = c.name || '(미지정)'; const m = chMap[k] || (chMap[k] = { name: k, revenue: 0, visitors: 0 }); m.revenue += c.revenue || 0; m.visitors += c.visitors || 0; }));
  const chSum = Object.values(chMap).reduce((s, c) => s + c.revenue, 0);
  const channels = Object.values(chMap).map(c => ({ name: c.name, revenue: c.revenue, visitors: c.visitors, sharePct: chSum ? Math.round(c.revenue / chSum * 1000) / 10 : 0 })).sort((a, b) => b.revenue - a.revenue);
  const prMap = {};
  inR.forEach(d => (d.products || []).forEach(p => { const k = p.productId || p.name; const m = prMap[k] || (prMap[k] = { name: p.name, productId: p.productId, revenue: 0, qty: 0 }); m.revenue += p.revenue || 0; m.qty += p.qty || 0; }));
  const products = Object.values(prMap).sort((a, b) => b.revenue - a.revenue).map((p, i) => ({ rank: i + 1, name: p.name, productId: p.productId, revenue: p.revenue, qty: p.qty }));
  const subDays = inR.filter(d => d.subscription && ((d.subscription.orders || 0) > 0 || (d.subscription.activeSubscribers || 0) > 0));
  let subscription = null;
  if (subDays.length) {
    const ss = f => subDays.reduce((a, d) => a + ((d.subscription && d.subscription[f]) || 0), 0);
    const lastAct = [...subDays].reverse().find(d => d.subscription.activeSubscribers != null);
    const spMap = {};
    subDays.forEach(d => (d.subscription.products || []).forEach(p => { const k = p.productId || p.name; const m = spMap[k] || (spMap[k] = { productId: p.productId, name: p.name, orders: 0, revenue: 0 }); m.orders += p.orders || 0; m.revenue += p.revenue || 0; }));
    subscription = { orders: ss('orders'), newOrders: ss('newOrders'), renewOrders: ss('renewOrders'), canceled: ss('canceled'), revenue: ss('revenue'), activeSubscribers: lastAct ? lastAct.subscription.activeSubscribers : 0, products: Object.values(spMap) };
  }
  const nDays = inR.filter(d => d.subscribers && d.subscribers.notify);
  let subscribers = null;
  if (nDays.length) {
    const lastN = nDays[nDays.length - 1].subscribers.notify;
    const addN = nDays.reduce((a, d) => a + ((d.subscribers.notify && d.subscribers.notify.added) || 0), 0);
    const iDays = inR.filter(d => d.subscribers && d.subscribers.interest);
    const lastI = iDays.length ? iDays[iDays.length - 1].subscribers.interest : null;
    const addI = iDays.reduce((a, d) => a + ((d.subscribers.interest && d.subscribers.interest.added) || 0), 0);
    subscribers = { notify: { total: (lastN && lastN.total) || 0, added: addN }, interest: lastI ? { total: lastI.total || 0, added: addI } : null };
  }
  return { key: start + '~' + end, label: start + ' ~ ' + end, periodStart: start, periodEnd: end, summary: summary, daily: daily, channels: channels, products: products, subscription: subscription, subscribers: subscribers };
}

                <div style={{ flex: 1, minWidth: 0 }}>

                </div>
                <button onClick={() => unlinkProduct(it.pid)} style={{ flexShrink: 0, padding: '4px 9px', borderRadius: 6, border: '1px solid #FECACA', background: '#FEF2F2', color: '#E53935', cursor: 'pointer', fontSize: 10.5, fontWeight: 700, whiteSpace: 'nowrap' }}>연동 해제</button>
              </div>

          </Card>

            : <div style={{ fontSize: 12, color: '#6E6863', lineHeight: 1.6 }}>메인 KPI 이름에 <b>"매출"</b>을 넣으면 네이버 매출이 자동 연동됩니다. 집계기간에 해당하는 일별 매출이 KPI 달성값에 자동 합산돼요. (이번 달 누적: {won2(monthRev)})</div>}
        </Card>
      </>)}
    </div>
  );
}

function MeetingActionModal({ action, data, setData, onApplied, onClose }) {
  const a = action;
  const STAGES = ['예정', '진행중', '검토중', '완료', '보류'];
  const existingSub = a.subplanId ? data.subplans.find(s => s.id === a.subplanId) : null;
  const existingPlan = a.planId ? data.plans.find(p => p.id === a.planId) : null;
  const initPlanId = existingSub ? existingSub.planId : (existingPlan ? existingPlan.id : (a.planId || ''));
  const initPlan = data.plans.find(p => p.id === initPlanId);

  const chg = a.changes || {}; const fld = a.fields || {};

  const [stage, setStage] = useState(getChg('stage') != null ? getChg('stage') : (base.stage || fld.stage || '예정'));
  const [owner, setOwner] = useState(getChg('owner') || fld.owner || (existingSub ? ownersOf(existingSub) : (existingPlan ? ownersOf(existingPlan) : [])) || []);
  const [support, setSupport] = useState((existingSub && existingSub.support) || (existingPlan && existingPlan.support) || []);
  const [start, setStart] = useState(getChg('start') != null ? getChg('start') : (base.start || fld.start || (existingPlan ? existingPlan.start : '') || ''));

      onApplied(a.id); onClose(); return;
    }
    // subplan
    if (!planId) { alert('실행계획을 선택하세요'); return; }
    if (existingSub) {
      setData(d => resolveAll({ ...d, subplans: d.subplans.map(s => s.id === existingSub.id ? { ...s, name: name.trim() || s.name, stage, owner, support, start, due, planId: Number(planId), completedAt: stage === '완료' && !s.completedAt ? TODAY : s.completedAt } : s) }));
    } else {

    }
    onApplied(a.id); onClose();
  };

  const applyKpi = () => {
    if (!mkId) { alert('메인 KPI를 선택하세요'); return; }
    const val = Number(kpiTarget) || 0;
    setData(d => ({ ...d, mainKpis: (d.mainKpis || []).map(mk => String(mk.id) === String(mkId) ? { ...mk, targets: { ...(mk.targets || {}), [kpiPeriod]: val } } : mk) }));
    onApplied(a.id); onClose();

        <b>회의 근거:</b> {a.note || '-'}{a.needsConfirm ? <span style={{ marginLeft: 6, fontSize: 14, fontWeight: 700, color: '#E08700', background: '#FEF3C7', borderRadius: 5, padding: '1px 6px' }}>확인 필요</span> : null}
      </div>
      {a.op === 'edit' && a.level !== 'kpi' && a.changes && Object.keys(a.changes).length > 0 && (
        <div style={{ background: '#EFF6FF', border: '1px solid #BFDBFE', borderRadius: 8, padding: '8px 11px', fontSize: 16 }}>
          <div style={{ fontWeight: 700, color: '#2D5FE0', marginBottom: 4 }}>변경 내용 (원래 → 변경)</div>
          {Object.keys(a.changes).map(k => { const kn = { stage: '상태', name: '이름', due: '마감일', start: '시작일', owner: '담당자' }[k] || k; const c = a.changes[k]; return (<div key={k} style={{ display: 'flex', gap: 6, padding: '1px 0' }}><span style={{ color: '#6E6863', minWidth: 44 }}>{kn}</span><span style={{ color: '#A29C95', textDecoration: 'line-through' }}>{c.from != null ? String(c.from) : '(없음)'}</span><span>→</span><span style={{ color: '#2D5FE0', fontWeight: 700 }}>{String(c.to)}</span></div>); })}
        </div>
      )}
      {notFound && <div style={{ background: '#FEF2F2', border: '1px solid #FECACA', borderRadius: 8, padding: '8px 11px', fontSize: 15, color: '#E53935' }}>회의록의 대상({a.subplanName || a.planName}, ID {a.subplanId || a.planId})을 현재 대시보드에서 찾지 못했어요. 아래에서 직접 선택/입력해 새로 반영할 수 있어요.</div>}

      {a.level === 'kpi' ? (<>
        <div><Lbl c="메인 KPI" /><Sel value={mkId} onChange={setMkId} opts={mkList.map(m => ({ v: String(m.id), l: m.name }))} /></div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
          <div><Lbl c="적용 월 (YYYY-MM)" /><Inp value={kpiPeriod} onChange={setKpiPeriod} placeholder="2026-07" /></div>
          <div><Lbl c="목표값" /><Inp type="number" value={kpiTarget} onChange={setKpiTarget} placeholder="70000000" /></div>
        </div>
        <div style={{ display: 'flex', gap: 8 }}><Btn v="gold" onClick={applyKpi} style={{ flex: 1 }}>목표 반영</Btn><Btn v="secondary" onClick={onClose}>취소</Btn></div>
      </>) : a.level === 'memo' ? (<>
        <div style={{ fontSize: 17, color: '#3A3631', lineHeight: 1.6, padding: '4px 0' }}>{fld.memo || a.note}</div>
        <div style={{ fontSize: 15, color: '#A29C95' }}>메모성 항목이라 대시보드에 직접 반영할 대상은 없어요. 참고용으로 확인만 하세요.</div>
        <div style={{ display: 'flex', gap: 8 }}><Btn onClick={() => { onApplied(a.id); onClose(); }} style={{ flex: 1 }}>확인함</Btn><Btn v="secondary" onClick={onClose}>닫기</Btn></div>
      </>) : (<>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
          <div><Lbl c="출력 프로젝트" /><Sel value={outId} onChange={v => { setOutId(v); const ps = data.plans.filter(p => String(p.outputId) === String(v)); setPlanId(ps[0] ? String(ps[0].id) : ''); }} ph="선택..." opts={data.outputs.map(o => ({ v: String(o.id), l: (o.code ? o.code + ' ' : '') + o.name }))} /></div>
          <div><Lbl c="실행계획" /><Sel value={planId} onChange={setPlanId} ph="선택..." opts={plansInOut.map(p => ({ v: String(p.id), l: p.name }))} /></div>
        </div>

function TabMeeting({ data, setData }) {
  const [ghList, setGhList] = useState([]);
  const [status, setStatus] = useState('loading');
  const [sample, setSample] = useState(false);
  const [openId, setOpenId] = useState(null);
  const [openDoc, setOpenDoc] = useState(null);
  const [editMode, setEditMode] = useState(false);
  const [actModal, setActModal] = useState(null);
  const editRef = useRef(null);
  const [ownerF, setOwnerF] = useState('전체');
  const [editTitle, setEditTitle] = useState('');
  const [editHtml, setEditHtml] = useState('');
  const [editDate, setEditDate] = useState('');
  const [editAtt, setEditAtt] = useState('');
  const [allDocs, setAllDocs] = useState(null);
  const [inboxF, setInboxF] = useState('전체');
  const BASE = 'https://raw.githubusercontent.com/miraclead2026/lifemeal-dashboard/main/data/';
  const fbMeetings = data.meetings || [];

  useEffect(() => {
    let alive = true; setStatus('loading');
    fetch(BASE + 'meetings/index.json?t=' + Date.now())
      .then(res => { if (!res.ok) throw new Error('no'); return res.json(); })
      .then(j => { if (!alive) return; setGhList(Array.isArray(j) ? j : []); setStatus('ok'); setSample(false); })
      .catch(() => { if (!alive) return; setGhList([]); setStatus('ok'); setSample(true); });
    return () => { alive = false; };
  }, []);

  // 통합 목록용: 모든 회의록 문서 로드 (Firebase 사본 우선, 나머지는 GitHub)
  useEffect(() => {
    if (status === 'loading') return;
    let alive = true;
    const fbIds = fbMeetings.map(m => m.id);
    const need = ghList.filter(m => fbIds.indexOf(m.id) < 0).map(m => m.id);
    Promise.all(need.map(id => fetch(BASE + 'meetings/' + id + '.json?t=' + Date.now()).then(r => r.ok ? r.json() : null).catch(() => null)))
      .then(docs => {
        if (!alive) return;
        const byId = {};
        if (sample && ghList.length === 0 && fbMeetings.length === 0) byId[MEETING_SAMPLE.id] = MEETING_SAMPLE;
        docs.forEach(dc => { if (dc && dc.id) byId[dc.id] = dc; });
        fbMeetings.forEach(f => { byId[f.id] = f; });
        setAllDocs(Object.values(byId).sort((a, b) => (a.date || '').localeCompare(b.date || '')));
      });
    return () => { alive = false; };
  }, [status, ghList, fbMeetings, sample]);

  // 목록 병합: Firebase 우선(수정됨), 나머지는 GitHub, 둘 다 없으면 샘플
  const merged = (() => {
    const byId = {};
    const gh = sample && fbMeetings.length === 0 && ghList.length === 0 ? [{ id: MEETING_SAMPLE.id, date: MEETING_SAMPLE.date, title: MEETING_SAMPLE.title, __sample: true }] : ghList;
    gh.forEach(m => { byId[m.id] = { ...m, source: 'github' }; });
    fbMeetings.forEach(m => { byId[m.id] = { id: m.id, date: m.date, title: m.title, source: 'firebase' }; });
    return Object.values(byId).sort((x, y) => (y.date || '').localeCompare(x.date || ''));
  })();

  const openMeeting = row => {
    setEditMode(false);
    const fb = fbMeetings.find(m => m.id === row.id);
    if (fb) { setOpenDoc(fb); setOpenId(row.id); setEditMode(true); setEditTitle(fb.title || ''); setEditHtml(fb.summaryHtml || ''); setEditDate(fb.date || ''); setEditAtt((fb.attendees || []).join(', ')); return; }
    if (row.__sample) { setOpenDoc(MEETING_SAMPLE); setOpenId(row.id); return; }
    // GitHub에서 개별 회의록 로드
    setOpenDoc('loading'); setOpenId(row.id);
    fetch(BASE + 'meetings/' + row.id + '.json?t=' + Date.now())
      .then(res => res.ok ? res.json() : null)
      .then(j => setOpenDoc(j || 'error'))
      .catch(() => setOpenDoc('error'));
  };

  const startEdit = () => {
    if (!openDoc || openDoc === 'loading' || openDoc === 'error') return;
    // GitHub/샘플 → Firebase 복사
    const copy = { ...openDoc, appliedActions: [] };
    setData(d => ({ ...d, meetings: [...(d.meetings || []).filter(m => m.id !== copy.id), copy] }));
    setOpenDoc(copy); setEditMode(true); setEditTitle(copy.title || ''); setEditHtml(copy.summaryHtml || ''); setEditDate(copy.date || ''); setEditAtt((copy.attendees || []).join(', '));
  };

  const saveEdit = () => {
    const html = editRef.current ? editRef.current.innerHTML : editHtml;
    setData(d => ({ ...d, meetings: (d.meetings || []).map(m => m.id === openDoc.id ? { ...m, title: editTitle, date: editDate, attendees: editAtt.split(',').map(s => s.trim()).filter(Boolean), summaryHtml: html } : m) }));
    setEditMode(false);
  };
  const cancelEdit = () => { setEditMode(false); const fb = fbMeetings.find(m => m.id === openDoc.id); if (fb) setOpenDoc(fb); };

  const markAppliedPairs = pairs => setData(d => {
    let meetings = d.meetings || [];
    pairs.forEach(pr => {
      const exists = meetings.find(m => m.id === pr.doc.id);
      const base = exists || { ...pr.doc, appliedActions: [] };
      const ap = base.appliedActions || [];
      if (ap.indexOf(pr.actId) >= 0) return;
      const updated = { ...base, appliedActions: [...ap, pr.actId] };
      meetings = [...meetings.filter(m => m.id !== pr.doc.id), updated];
    });
    return { ...d, meetings };
  });
  const appliedSet = (() => { const fb = fbMeetings.find(m => m.id === (openDoc && openDoc.id)); return (fb && fb.appliedActions) || []; })();
  const actOwner = act => { const o = (act.fields && act.fields.owner) || act.owner; if (o && o.length) return o; if (act.subplanId) { const s = data.subplans.find(x => x.id === act.subplanId); if (s && ownersOf(s).length) return ownersOf(s); } if (act.planId) { const p = data.plans.find(x => x.id === act.planId); if (p && ownersOf(p).length) return ownersOf(p); } return []; };

  // ===== 대시보드 입력 (통합): 모든 회의의 미반영 액션 병합, 같은 대상은 최신 회의 우선 =====
  const inbox = (() => {
    if (!allDocs) return null;
    const appliedOf = id => { const fb = fbMeetings.find(m => m.id === id); return (fb && fb.appliedActions) || []; };
    const keyOf = a => a.level === 'kpi' ? 'kpi:' + (a.mainKpiId || '') + ':' + (a.changes && a.changes.target ? (a.changes.target.period || '') : '')
      : a.level === 'memo' ? 'memo:' + (a.planId || '') + ':' + ((a.fields && a.fields.name) || '')
      : a.op === 'edit' ? (a.level === 'plan' ? 'plan:' + (a.planId || '') : 'sub:' + (a.subplanId || ''))
      : 'add:' + (a.planId || '') + ':' + ((a.fields && a.fields.name) || '').trim();
    const groups = {};
    allDocs.forEach(dc => { const ap = appliedOf(dc.id); (dc.actions || []).forEach(a => { const k = keyOf(a); (groups[k] = groups[k] || []).push({ a, doc: dc, date: dc.date || '', applied: ap.indexOf(a.id) >= 0 }); }); });
    const cards = []; const traces = [];
    Object.keys(groups).forEach(k => {
      const arr = groups[k];
      const pend = arr.filter(x => !x.applied);
      if (!pend.length) return;
      const srcC = {}, srcF = {};
      arr.forEach(x => { Object.keys(x.a.changes || {}).forEach(f => { srcC[f] = x; }); Object.keys(x.a.fields || {}).forEach(f => { srcF[f] = x; }); });
      const contrib = pend.filter(x => Object.keys(x.a.changes || {}).some(f => srcC[f] === x) || Object.keys(x.a.fields || {}).some(f => srcF[f] === x) || (Object.keys(x.a.changes || {}).length === 0 && Object.keys(x.a.fields || {}).length === 0 && x === pend[pend.length - 1]));
      pend.filter(x => contrib.indexOf(x) < 0).forEach(x => {
        let by = '';
        Object.keys(x.a.changes || {}).forEach(f => { if (srcC[f] !== x && srcC[f].date > by) by = srcC[f].date; });
        Object.keys(x.a.fields || {}).forEach(f => { if (srcF[f] !== x && srcF[f].date > by) by = srcF[f].date; });
        traces.push({ x, by });
      });
      if (!contrib.length) return;
      const latest = contrib[contrib.length - 1];
      const mc = {}, mf = {}, cSrc = {}, fSrc = {};
      Object.keys(srcC).forEach(f => { if (!srcC[f].applied) { mc[f] = srcC[f].a.changes[f]; cSrc[f] = srcC[f].date; } });
      Object.keys(srcF).forEach(f => { mf[f] = srcF[f].a.fields[f]; fSrc[f] = srcF[f].date; });
      const action = { ...latest.a, id: '__mix__' + k, changes: Object.keys(mc).length ? mc : latest.a.changes, fields: Object.keys(mf).length ? mf : latest.a.fields, needsConfirm: contrib.some(x => !!x.a.needsConfirm), note: contrib.map(x => (contrib.length > 1 ? (x.date || '').slice(5).replace('-', '/') + ' · ' : '') + (x.a.note || '')).filter(Boolean).join('  /  ') };
      cards.push({ key: k, action, contrib, pend, cSrc, multi: contrib.length > 1, latestDate: latest.date || '' });
    });
    cards.sort((x, y) => (x.action.needsConfirm === y.action.needsConfirm) ? y.latestDate.localeCompare(x.latestDate) : (x.action.needsConfirm ? 1 : -1));
    traces.sort((x, y) => (y.x.date || '').localeCompare(x.x.date || ''));
    return { cards, traces };
  })();

  const opColor = { add: '#1FA463', edit: '#2D5FE0' };

        {inbox && (inbox.cards.length > 0 || inbox.traces.length > 0) && (

                  <div key={i} style={{ fontSize: 15, color: '#A29C95', padding: '3px 0' }}>🔄 <span style={{ textDecoration: 'line-through' }}>{(t.x.date || '').slice(5).replace('-', '/')} · {nm}{brief ? ' (' + brief + ')' : ''}</span> — <b>{(t.by || '').slice(5).replace('-', '/')}</b> 회의 결정으로 대체됨</div>
                ); })}

        {actModal && <MeetingActionModal action={actModal.action} data={data} setData={setData} onApplied={() => markAppliedPairs(actModal.pairs)} onClose={() => setActModal(null)} />}

  // ===== 상세 화면 =====
  const doc = openDoc;
  return (

              </div>

function TabTrash({ data, setData }) {
  const trash = data.trash || [];
  const [confirmId, setConfirmId] = useState(null);
  const [confirmEmpty, setConfirmEmpty] = useState(false);
  const typeIcon = { output: '📁', plan: '📋', subplan: '📝', budget: '💰', mainKpi: '⭐' };
  const summary = p => {
    p = p || {};
    const parts = [];
    if ((p.outputs || []).length) parts.push(`프로젝트 ${p.outputs.length}`);
    if ((p.plans || []).length) parts.push(`실행계획 ${p.plans.length}`);
    if ((p.subplans || []).length) parts.push(`세부 ${p.subplans.length}`);
    if ((p.checklists || []).length) parts.push(`체크 ${p.checklists.length}`);
    if ((p.kpiLogs || []).length) parts.push(`성과기록 ${p.kpiLogs.length}`);
    if ((p.budgets || []).length) parts.push(`예산 ${p.budgets.length}건`);
    if (p.mainKpi) parts.push('메인KPI');
    return parts.join(' · ') || '항목 없음';
  };
  return (
    <div style={{ padding: 20 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 4 }}>
        <div style={{ fontSize: 21, fontWeight: 700, color: '#64748B' }}>🗑 휴지통</div>
        {trash.length > 0 && <span style={{ background: '#989088', color: 'white', borderRadius: 20, padding: '2px 10px', fontSize: 16, fontWeight: 700 }}>{trash.length}</span>}

function TabSchedule({ data, setData }) {

  const sendCodes = sd => { const its = sd.items || []; if (its.length) { const all = []; its.forEach(it => (it.codes || []).forEach(c => all.push(c))); return all; } return sd.codes || []; };
  const STATUS = ['예약', '발송대기', '발송완료'];
  const isCancelled = st => st === '발송취소';
  const isPending = st => { const s = st || '예약'; return s !== '발송완료' && s !== '발송취소'; };
  const stMeta = s => s === '발송완료' ? { bg: '#ECFDF5', bd: '#A7F3D0', tx: '#047857' } : s === '발송대기' ? { bg: '#FFFBEB', bd: '#FDE68A', tx: '#B45309' } : s === '발송취소' ? { bg: '#F5F4F2', bd: '#D5D2CE', tx: '#8A8580' } : { bg: '#EFF6FF', bd: '#BFDBFE', tx: '#2563EB' };

  const PROD_NO = { '라이프밀 데일리': 1, '황성주 박사의 영양식': 2, '황성주 박사의 1일 1생식': 3, '프로틴 골드 HIGH5': 4, '황성주 박사의 발효건강식': 5, '황성주 박사의 닥터 샐러드': 6 };
  const prodNo = nm => { if (PROD_NO[nm]) return PROD_NO[nm]; const k = Object.keys(PROD_NO).find(x => nm && (nm.indexOf(x) >= 0 || x.indexOf(nm) >= 0)); return k ? PROD_NO[k] : null; };
  const couponCode = (seg, nm, date) => { const no = prodNo(nm); const pr = seg && seg.priority != null ? seg.priority : null; if (no == null || pr == null || !date) return null; const d = String(date).replace(/-/g, '').slice(2); return 'P' + pr + '-' + no + '-' + d; };
  const benefitKey = nm => { const no = prodNo(nm); return no != null ? 'no:' + no : 'nm:' + (nm || ''); };
  const benefitOf = (seg, nm) => (((seg && seg.benefitNames) || {})[benefitKey(nm)] || {}).name || '';
  const mmdd = ds => { if (!ds) return ''; const p = String(ds).split('-'); return p.length >= 3 ? p[1] + '/' + p[2] : String(ds); };
  const thisMon = (() => { const d = new Date(TODAY + 'T00:00:00'); const g = d.getDay(); d.setDate(d.getDate() + (g === 0 ? -6 : 1 - g)); return d.toISOString().slice(0, 10); })();
  const flagged = entries.flatMap(([segId, seg]) => (seg.sends || []).filter(sd => sendCodes(sd).some(c => !isSafeCode(c))).map(sd => ({ segName: seg.segmentName || segId, date: sd.date })));
  const cycleStatus = (segId, sendIdx) => setData(d => { const sc = { ...(d.messageSchedules || {}) }; const seg = sc[segId]; if (!seg) return d; const sends = (seg.sends || []).map((s, i) => { if (i !== sendIdx) return s; const ni = (STATUS.indexOf(s.status || '예약') + 1) % STATUS.length; return { ...s, status: STATUS[ni] }; }); sc[segId] = { ...seg, sends }; return { ...d, messageSchedules: sc }; });
  const setSendStatus = (segId, sendIdx, st) => setData(d => { const sc = { ...(d.messageSchedules || {}) }; const seg = sc[segId]; if (!seg) return d; const sends = (seg.sends || []).map((s, i) => i === sendIdx ? { ...s, status: st } : s); sc[segId] = { ...seg, sends }; return { ...d, messageSchedules: sc }; });
  const copyText = (text, key) => { const done = () => { setCopied(key); setTimeout(() => setCopied(c => c === key ? null : c), 1500); }; try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done).catch(() => done()); } else { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(ta); done(); } } catch (e) { done(); } };
  const copyCodes = (codes, key) => { const seen = {}; const safe = (codes || []).filter(isSafeCode).filter(c => { if (seen[c]) return false; seen[c] = 1; return true; }); copyText(safe.length ? 'python lookup.py ' + safe.join(' ') : '', key); };
  const rules = entries.map(([segId, seg]) => { const sends = seg.sends || []; const pend = sends.filter(s => isPending(s.status)); const today = sends.filter(s => s.date === TODAY && isPending(s.status)); const thisWk = sends.filter(s => s.date === thisMon && s.date !== TODAY && isPending(s.status)); const over = sends.filter(s => s.date && s.date < thisMon && isPending(s.status)); const total = sends.reduce((a, s) => a + (isCancelled(s.status) ? 0 : Number(s.count != null ? s.count : sendCodes(s).length)), 0); return { segId, seg, sends, pendCnt: pend.length, todayCnt: today.length, thisWkCnt: thisWk.length, overCnt: over.length, total, active: pend.length > 0 }; }).sort((a, b) => (b.overCnt > 0) - (a.overCnt > 0) || (b.todayCnt > 0) - (a.todayCnt > 0) || (b.thisWkCnt > 0) - (a.thisWkCnt > 0) || b.active - a.active || (Number(b.seg.priority) || 0) - (Number(a.seg.priority) || 0) || b.pendCnt - a.pendCnt);
  const curId = selRule && scheds[selRule] ? selRule : (rules.length ? rules[0].segId : null);
  const cur = curId ? scheds[curId] : null;
  const prods = (() => { if (!cur) return []; const m = {}; (cur.sends || []).forEach((sd, si) => { const its = sd.items || []; const push = (nm, servings, codes, cnt, catchup) => { const cxl = isCancelled(sd.status); if (!m[nm]) m[nm] = { name: nm, servings: servings, count: 0, byDate: {}, over: 0, today: 0, thisWk: 0, cxlDates: 0 }; const t = m[nm]; if (!cxl) t.count += cnt; if (servings != null) t.servings = servings; const dk = sd.date || '-'; if (!t.byDate[dk]) { t.byDate[dk] = { sd, si, codes: [], count: 0, catchup: false, merged: 0 }; if (cxl) t.cxlDates++; if (sd.date && sd.date < thisMon && isPending(sd.status)) t.over++; else if (sd.date === thisMon && sd.date !== TODAY && isPending(sd.status)) t.thisWk++; if (sd.date === TODAY && isPending(sd.status)) t.today++; } const e = t.byDate[dk]; (codes || []).forEach(c => { if (e.codes.indexOf(c) < 0) e.codes.push(c); }); e.count += cnt; e.catchup = e.catchup || !!catchup; e.merged++; }; if (its.length) { its.forEach(it => { const codes = it.codes || []; push(pname(it), it.servings, codes, Number(it.count != null ? it.count : codes.length), it.catchup); }); } else { const codes = sendCodes(sd); push('(상품 미지정)', null, codes, Number(sd.count != null ? sd.count : codes.length), false); } }); return Object.values(m).map(p => ({ ...p, dates: Object.values(p.byDate).sort((a, b) => (a.sd.date || '') < (b.sd.date || '') ? -1 : 1) })).sort((a, b) => b.count - a.count); })();
  const curProd = (() => { if (!prods.length) return null; const f = prods.find(p => p.name === selProd); return f || prods[0]; })();
  const msgFor = p => { const m = (cur && cur.message) || {}; const rep = s => String(s == null ? '' : s).replace(/\{productName\}/g, p ? p.name : '').replace(/\{displayName\}/g, p ? p.name : ''); return { title: rep(m.title), body: rep(m.body), button: rep(m.button), coupon: rep(m.coupon) }; };

                      {full ? <button onClick={() => copyText(full, mkey)} style={{ fontSize: 10, fontWeight: 700, color: copied === mkey ? '#047857' : 'white', background: copied === mkey ? '#ECFDF5' : G, border: copied === mkey ? '1px solid #A7F3D0' : 'none', borderRadius: 6, padding: '3px 10px', cursor: 'pointer' }}>{copied === mkey ? '✓ 복사됨' : '📋 메시지 복사'}</button> : null}
                    </div>
                  </div>
                  {m.title ? <div style={{ fontSize: 13, fontWeight: 700, color: '#1A1614' }}>{m.title}</div> : null}
                  {m.body ? <div style={{ fontSize: 12, color: '#3A3631', lineHeight: 1.6, marginTop: 4, whiteSpace: 'pre-wrap' }}>{m.body}</div> : null}
                  {(m.button || m.coupon) ? <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 8 }}>{m.button ? <span style={{ fontSize: 10, fontWeight: 700, color: '#2563EB', background: '#EFF6FF', border: '1px solid #BFDBFE', borderRadius: 5, padding: '2px 8px' }}>🔘 {m.button}</span> : null}{m.coupon ? <span style={{ fontSize: 10, fontWeight: 700, color: '#B45309', background: '#FFFBEB', border: '1px solid #FDE68A', borderRadius: 5, padding: '2px 8px' }}>🎟 {m.coupon}</span> : null}</div> : null}
                </div>
              ) : (
                <div style={{ background: '#FBFAF8', border: '1px dashed #E3E0DC', borderRadius: 9, padding: '10px 12px', marginBottom: 10, display: 'flex', alignItems: 'center', gap: 8 }}>
                  <span style={{ fontSize: 11.5, color: '#A29C95' }}>등록된 메시지 문구가 없습니다</span>
                  <button onClick={() => setEdit({ title: '', body: '', button: '', coupon: '' })} style={{ marginLeft: 'auto', fontSize: 10, fontWeight: 700, color: '#4F46E5', background: 'white', border: '1px solid #C7D2FE', borderRadius: 6, padding: '3px 10px', cursor: 'pointer' }}>✏️ 문구 작성</button>
                </div>
              )}
              {isRepurchase && cancelledCnt > 0 ? <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8, flexWrap: 'wrap' }}><button onClick={() => setShowCancelled(v => !v)} style={{ fontSize: 10.5, fontWeight: 700, color: showCancelled ? '#8A8580' : '#6E6863', background: showCancelled ? '#F5F4F2' : 'white', border: '1px solid ' + (showCancelled ? '#D5D2CE' : '#E3E0DC'), borderRadius: 7, padding: '4px 11px', cursor: 'pointer' }}>{showCancelled ? '취소된 발송 숨기기' : '취소된 발송 ' + cancelledCnt + '건 보기'}</button><span style={{ fontSize: 10, color: '#A29C95' }}>취소된 건은 인원·쿠폰 집계에서 제외됩니다</span></div> : null}
              <div style={{ display: 'flex', flexDirection: 'column', gap: 7 }}>
                {curProd.dates.filter(dt => showCancelled || !isCancelled(dt.sd.status)).map((dt, k) => { const sd = dt.sd; const cxl = isCancelled(sd.status); const unsafe = dt.codes.filter(c => !isSafeCode(c)); const safeCount = dt.codes.length - unsafe.length; const sm = stMeta(sd.status || '예약'); const ckey = curId + ':' + curProd.name + ':' + k; const isToday = sd.date === TODAY; const isThisWeek = sd.date === thisMon && sd.date !== TODAY; const overdue = !!sd.date && sd.date < thisMon && isPending(sd.status);
                  return (
                    <div key={k} style={{ border: '1px solid ' + (cxl ? '#D5D2CE' : (overdue ? '#FDBA74' : ((isToday || isThisWeek) && isPending(sd.status) ? '#6EE7B7' : '#E3E0DC'))), borderLeft: '3px solid ' + (cxl ? '#B8B2AA' : (overdue ? '#EA580C' : ((isToday || isThisWeek) && isPending(sd.status) ? '#1FA463' : '#E3E0DC'))), borderRadius: 9, padding: '9px 11px', background: cxl ? '#FAFAF9' : (overdue ? '#FFFBF5' : 'white'), opacity: cxl ? 0.62 : 1 }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
                        <span style={{ fontSize: 12.5, fontWeight: 700, color: cxl ? '#8A8580' : '#1A1614' }}>📅 {sd.date || '-'}</span>
                        {cxl ? <span style={{ fontSize: 9.5, fontWeight: 800, color: '#8A8580', background: '#F0EEEB', border: '1px solid #D5D2CE', borderRadius: 5, padding: '1px 6px' }}>발송취소</span> : null}
                        {overdue ? <span style={{ fontSize: 9.5, fontWeight: 800, color: '#C2410C', background: '#FFF7ED', border: '1px solid #FDBA74', borderRadius: 5, padding: '1px 6px' }}>⚠ 경과 · 미발송</span> : null}
                        {isToday && isPending(sd.status) ? <span style={{ fontSize: 9.5, fontWeight: 800, color: '#047857', background: '#ECFDF5', border: '1px solid #A7F3D0', borderRadius: 5, padding: '1px 6px' }}>🔔 오늘</span> : null}
                        {isThisWeek && isPending(sd.status) ? <span style={{ fontSize: 9.5, fontWeight: 800, color: '#047857', background: '#ECFDF5', border: '1px solid #A7F3D0', borderRadius: 5, padding: '1px 6px' }}>🔔 이번주</span> : null}
                        {dt.catchup ? <span style={{ fontSize: 9, fontWeight: 700, color: '#B45309', background: '#FFFBEB', border: '1px solid #FDE68A', borderRadius: 4, padding: '0 5px' }}>캐치업</span> : null}
                        <span style={{ fontSize: 11, color: '#6E6863' }}>{dt.count.toLocaleString()}명</span>
                        <div style={{ marginLeft: 'auto', display: 'flex', gap: 5, alignItems: 'center' }}>
                          {cxl ? (isRepurchase ? <button onClick={() => setSendStatus(curId, dt.si, '예약')} style={{ fontSize: 10, fontWeight: 700, color: '#2563EB', background: 'white', border: '1px solid #BFDBFE', borderRadius: 6, padding: '3px 10px', cursor: 'pointer' }}>↩ 취소 되돌리기</button> : <span style={{ fontSize: 10, fontWeight: 800, color: '#8A8580' }}>발송취소</span>) : (<React.Fragment>
                            <button onClick={() => cycleStatus(curId, dt.si)} style={{ fontSize: 10, fontWeight: 800, color: sm.tx, background: sm.bg, border: '1px solid ' + sm.bd, borderRadius: 6, padding: '3px 10px', cursor: 'pointer' }}>{sd.status || '예약'} ⇄</button>
                            {isRepurchase ? <button onClick={() => { if (confirm('발송을 취소하시겠습니까?')) setSendStatus(curId, dt.si, '발송취소'); }} style={{ fontSize: 10, fontWeight: 700, color: '#DC2626', background: 'white', border: '1px solid #FCA5A5', borderRadius: 6, padding: '3px 10px', cursor: 'pointer' }}>발송 취소</button> : null}
                          </React.Fragment>)}
                        </div>
                      </div>
                      {unsafe.length > 0 ? <div style={{ fontSize: 10.5, color: '#DC2626', background: '#FEF2F2', border: '1px solid #FCA5A5', borderRadius: 7, padding: '5px 8px', marginTop: 6 }}>⚠ 코드 형식이 아닌 값 {unsafe.length}건 감지 — 실제 ID일 수 있어 숨겼습니다. 유니 확인 필요.</div> : null}
                      {!cxl ? <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 7, flexWrap: 'wrap' }}>
                        {(() => { const cpkey = 'ben:' + ckey; const benLabel = savedBenefit ? savedBenefit + ' (' + mmdd(sd.date) + ')' : ''; return savedBenefit ? (
                          <button onClick={() => copyText(benLabel, cpkey)} title={benLabel} style={{ fontSize: 11, fontWeight: 800, color: copied === cpkey ? '#047857' : '#B45309', background: copied === cpkey ? '#ECFDF5' : '#FFFBEB', border: '1px solid ' + (copied === cpkey ? '#A7F3D0' : '#FDE68A'), borderRadius: 6, padding: '4px 11px', cursor: 'pointer', maxWidth: 280, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{copied === cpkey ? '✓ 복사됨' : '🎟 ' + benLabel}</button>
                        ) : <span style={{ fontSize: 10, fontWeight: 700, color: '#B45309', background: '#FFFBEB', border: '1px solid #FDE68A', borderRadius: 6, padding: '3px 9px' }}>🎟 이 상품의 혜택명을 먼저 등록하세요 ↑</span>; })()}
                        <button onClick={() => copyCodes(dt.codes, ckey)} disabled={safeCount === 0} style={{ fontSize: 11, fontWeight: 700, color: copied === ckey ? '#047857' : 'white', background: copied === ckey ? '#ECFDF5' : (safeCount === 0 ? '#C4BFB9' : G), border: copied === ckey ? '1px solid #A7F3D0' : 'none', borderRadius: 6, padding: '4px 12px', cursor: safeCount === 0 ? 'default' : 'pointer' }}>{copied === ckey ? '✓ 복사됨 · 터미널에 붙여넣기' : '📋 조회 명령 복사'}</button>
                        <span style={{ fontSize: 10.5, color: '#A29C95' }}>{safeCount.toLocaleString()}개 코드</span>
                        {(() => { const cc = couponCode(cur, curProd.name, sd.date); return cc ? <span style={{ fontSize: 9, color: '#C4BFB9', fontFamily: 'monospace' }} title="내부 구분용 · 복사 대상 아님">내부 {cc}</span> : null; })()}
                        {dt.codes.length > 0 ? (
                          <details style={{ marginLeft: 'auto' }}>
                            <summary style={{ fontSize: 10.5, color: '#2563EB', cursor: 'pointer', fontWeight: 600 }}>코드 보기</summary>
                            <div style={{ marginTop: 5, maxHeight: 140, overflowY: 'auto', background: '#F8F7F5', border: '1px solid #E3E0DC', borderRadius: 7, padding: '7px 9px', fontSize: 10.5, color: '#3A3631', fontFamily: 'monospace', lineHeight: 1.7, wordBreak: 'break-all' }}>{dt.codes.map((c, x) => isSafeCode(c) ? <span key={x} style={{ marginRight: 8 }}>{c}</span> : <span key={x} style={{ marginRight: 8, color: '#DC2626', fontWeight: 700 }}>🔒숨김</span>)}</div>
                          </details>
                        ) : null}
                      </div> : null}
                    </div>
                  );
                })}
              </div>
              <div style={{ fontSize: 10.5, color: '#6E6863', background: '#F5F4F2', border: '1px solid #E3E0DC', borderRadius: 7, padding: '6px 9px', marginTop: 8, lineHeight: 1.5 }}>💻 <b>조회 명령 복사</b> → 터미널(run_lookup.bat)에 붙여넣으면 <b>lookup.py가 코드를 네이버ID로 복원</b>해 클립보드에 담아줍니다. → 톡톡에서 Ctrl+V로 예약 발송.</div>
              {cur.updatedAt ? <div style={{ fontSize: 9.5, color: '#A29C95', textAlign: 'right', marginTop: 6 }}>갱신 {cur.updatedAt}</div> : null}
            </Card>
          ); })() : null}
        </div>
      )}
    </div>
  );
}

const TAB_SLUG = { team: '팀 현황', weekly: '데일리/주간', progress: '프로젝트 진행 상황', kanban: '칸반', performance: '업무 성과', kpi: 'KPI', sales: '매출', kakao: '카카오', ads: '광고', trends: '키워드 트렌드', schedule: '발송 스케줄', meeting: '회의', hold: '보류', budget: '예산', trash: '휴지통' };

const sigOf = d => JSON.stringify({ ...(d || {}), rev: 0 });

function App() {
  const [tab, setTab] = useState(0);
  const [data, setData] = useState(null);
  const [ready, setReady] = useState(false);
  const [modal, setModal] = useState(false);
  const [showUpdates, setShowUpdates] = useState(false);
  const [editStack, setEditStack] = useState([]);
  const [recordId, setRecordId] = useState(null);
  const [sync, setSync] = useState('loading');
  const [syncErr, setSyncErr] = useState('');
  const pendingRef = useRef(null);
  const lastSavedRef = useRef(null);
  const initDoneRef = useRef(false);
  const canSaveRef = useRef(false);
  const revRef = useRef(0);
  const serverSnapRef = useRef(null);
  const backupDayRef = useRef('');
  useDragAutoScroll();

  useEffect(() => {
    const ref = db.ref(DB_PATH);
    ref.on('value', snap => {
      const remote = snap.val();
      if (remote && typeof remote.rev === 'number') revRef.current = Math.max(revRef.current, remote.rev);
      if (!initDoneRef.current) {
        initDoneRef.current = true;
        if (remote && remote.nid) { const m = migrateData(remote); setData(m); serverSnapRef.current = m; lastSavedRef.current = sigOf(m); canSaveRef.current = true; }
        else if (remote == null) { setData(INIT); serverSnapRef.current = null; lastSavedRef.current = null; canSaveRef.current = true; }
        else { setData(INIT); serverSnapRef.current = null; lastSavedRef.current = null; }
        setReady(true); setSync('ok');
      } else {
        if (remote && remote.nid) { const m = migrateData(remote); serverSnapRef.current = m; const sg = sigOf(m); if (sg !== lastSavedRef.current) { setData(m); lastSavedRef.current = sg; } canSaveRef.current = true; }
      }
    }, err => { setSyncErr(err.message); setSync('error'); if (!initDoneRef.current) { initDoneRef.current = true; setData(INIT); setReady(true); } });
    return () => ref.off('value');
  }, []);

  useEffect(() => {
    if (!ready || !data || !canSaveRef.current) return;
    const str = sigOf(data);
    if (str === lastSavedRef.current) return;
    if (pendingRef.current) clearTimeout(pendingRef.current);
    setSync('saving');
    pendingRef.current = setTimeout(() => {
      const srv = serverSnapRef.current;
      if (srv) { const SK = ['budgets', 'payments', 'notices', 'plans', 'subplans']; for (let i = 0; i < SK.length; i++) { const k = SK[i]; const sv = Array.isArray(srv[k]) ? srv[k].length : 0; const cv = Array.isArray(data[k]) ? data[k].length : 0; if (sv >= 5 && cv === 0) { setSync('error'); setSyncErr('데이터 유실 위험 — 저장 중단(' + k + ')'); try { alert('⚠ 데이터 유실 위험이 감지되어 저장을 막았어요.\n' + k + '가 서버 ' + sv + '건인데 저장하려는 값은 0건입니다.\n새로고침 후 다시 시도해주세요.'); } catch (e) {} return; } } }
      if (backupDayRef.current !== TODAY) { backupDayRef.current = TODAY; try { db.ref(DB_PATH).once('value').then(sn => { const cur = sn.val(); if (cur && cur.nid) db.ref('/backups/auto/' + TODAY).set(cur).catch(() => {}); }).catch(() => {}); } catch (e) {} }
      const newRev = (revRef.current || 0) + 1;
      const payload = { ...data, rev: newRev };
      lastSavedRef.current = str;
      db.ref(DB_PATH).set(payload).then(() => { revRef.current = newRev; serverSnapRef.current = payload; setSync('ok'); }).catch(e => { setSync('error'); setSyncErr(e.message || '저장 실패'); lastSavedRef.current = null; });
    }, 800);
  }, [data, ready]);

  const heldCount = data ? data.plans.filter(p => p.hold).length + data.subplans.filter(s => s.stage === '보류').length : 0;
  const trashCount = data ? (data.trash || []).length : 0;
  const TABS = [
    { icon: '👥', label: '팀 현황', C: TabTeam },
    { icon: '📅', label: '데일리/주간', C: TabWeekly },
    { icon: '📈', label: '프로젝트 진행 상황', C: TabProgress },
    { icon: '🗂️', label: '칸반', C: TabKanban },
    { icon: '🏆', label: '업무 성과', C: TabPerformance },
    { icon: '📊', label: 'KPI', C: TabKpi },
    { icon: '💵', label: '매출', C: TabSales },
    { icon: '🔎', label: '네이버 채널 추적', C: TabChannel },
    { icon: '💬', label: '카카오', C: TabKakao },
    { icon: '📣', label: '광고', C: TabAds },
    { icon: '🔥', label: '키워드 트렌드', C: TabTrends },
    { icon: '📨', label: '발송 스케줄', C: TabSchedule },
    { icon: '🗓', label: '회의', C: TabMeeting },
    { icon: '⏸', label: '보류', C: TabHold, badge: heldCount },
    { icon: '💰', label: '예산', C: TabBudget },
    { icon: '🗑', label: '휴지통', C: TabTrash, badge: trashCount },
  ];

  useEffect(() => {
    const applyHash = () => { const raw = decodeURIComponent((window.location.hash || '').replace(/^#/, '')).trim(); if (!raw) return; const label = TAB_SLUG[raw.toLowerCase()] || raw; const i = TABS.findIndex(t => t.label === label); if (i >= 0) setTab(i); };
    applyHash();
    window.addEventListener('hashchange', applyHash);
    return () => window.removeEventListener('hashchange', applyHash);
  }, []);

  if (!ready || !data) return (
    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: BG }}>
      <div style={{ textAlign: 'center', color: '#6E6863' }}><div style={{ fontSize: 44, marginBottom: 12 }}>🌿</div><div style={{ fontSize: 15, fontWeight: 600, marginBottom: 6 }}>Firebase에서 불러오는 중...</div><div style={{ fontSize: 12, color: '#A29C95' }}>LIFEMEAL 팀 대시보드</div></div>
    </div>
  );

  const TabC = TABS[tab].C;
  return (
    <div style={{ minHeight: '100vh', background: BG }}>
      <div style={{ background: G, color: 'white', padding: '12px 20px', display: 'flex', alignItems: 'center', gap: 12, boxShadow: '0 2px 8px rgba(0,0,0,0.2)', flexWrap: 'wrap' }}>
        <span style={{ fontSize: 22 }}>🌿</span>
        <div><div style={{ fontSize: 16, fontWeight: 800 }}>통합 팀 대시보드</div><div style={{ fontSize: 11, opacity: 0.7 }}>LIFEMEAL · Firebase 실시간 연동</div></div>
        <button onClick={() => setShowUpdates(true)} style={{ padding: '6px 12px', borderRadius: 8, border: '1px solid rgba(255,255,255,0.28)', background: 'rgba(255,255,255,0.12)', color: 'white', fontWeight: 700, fontSize: 12, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 5 }}>🆕 업데이트 확인하기{(data.updates || []).length > 0 ? <span style={{ background: '#E53935', color: 'white', borderRadius: 10, padding: '0 6px', fontSize: 10, fontWeight: 800 }}>{(data.updates || []).length}</span> : null}</button>
        <div style={{ marginLeft: 'auto', display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
          <SyncBadge status={sync} errMsg={syncErr} />
          {MEMBERS.map(m => <div key={m} style={{ width: 30, height: 30, borderRadius: '50%', background: GO, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, border: '2px solid rgba(255,255,255,0.25)' }}>{AV[m]}</div>)}
          {heldCount > 0 && <div onClick={() => setTab(TABS.findIndex(t => t.label === '보류'))} style={{ background: '#989088', borderRadius: 20, padding: '4px 10px', fontSize: 11, fontWeight: 700, cursor: 'pointer' }}>⏸ {heldCount}</div>}
          <button onClick={() => setModal(true)} style={{ padding: '8px 16px', borderRadius: 8, border: 'none', background: 'white', color: G, fontWeight: 700, fontSize: 13, cursor: 'pointer' }}>+ 업무 추가하기</button>
        </div>
      </div>
      <div style={{ background: 'white', boxShadow: '0 1px 4px rgba(0,0,0,0.07)', overflowX: 'auto' }}>
        <div style={{ display: 'flex', minWidth: 'max-content' }}>
          {TABS.map((t, i) => <button key={i} onClick={() => setTab(i)} style={{ padding: '11px 18px', border: 'none', cursor: 'pointer', fontSize: 13, fontWeight: tab === i ? 700 : 500, color: tab === i ? G : '#6E6863', background: 'transparent', borderBottom: tab === i ? '2.5px solid ' + G : '2.5px solid transparent', display: 'flex', alignItems: 'center', gap: 5, whiteSpace: 'nowrap' }}>{t.icon} {t.label}{t.badge > 0 ? <span style={{ background: '#989088', color: 'white', borderRadius: 10, padding: '1px 6px', fontSize: 10, fontWeight: 700 }}>{t.badge}</span> : null}</button>)}
        </div>
      </div>
      <div style={{ maxWidth: 1400, margin: '0 auto' }}>
        <TabC data={data} setData={setData} onEdit={t => setEditStack([t])} onRecord={id => setRecordId(id)} goTab={label => { const i = TABS.findIndex(t => t.label === label); if (i >= 0) setTab(i); }} />
      </div>
      {modal && <AddModal data={data} setData={setData} onClose={() => setModal(false)} />}
      {showUpdates && <UpdateCenterModal data={data} setData={setData} onClose={() => setShowUpdates(false)} />}
      {editStack.length > 0 && (() => { const cur = editStack[editStack.length - 1]; return <EditModal key={cur.kind + '-' + cur.id} target={cur} data={data} setData={setData} onClose={() => setEditStack([])} onSwitch={t => setEditStack(s => [...s, t])} canBack={editStack.length > 1} onBack={() => setEditStack(s => s.slice(0, -1))} />; })()}
      {recordId && <PerfModal subId={recordId} data={data} setData={setData} onClose={() => setRecordId(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
