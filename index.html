function driveReady() { return !!(window.google && window.google.accounts && window.google.accounts.oauth2); }
function driveSignIn(forcePrompt) {
  return new Promise((resolve, reject) => {
    if (!driveReady()) { reject(new Error('구글 로그인 모듈 로딩 중입니다. 잠시 후 다시 시도하세요.')); return; }
    if (!_driveTokenClient) _driveTokenClient = google.accounts.oauth2.initTokenClient({ client_id: DRIVE_CLIENT_ID, scope: DRIVE_SCOPE, callback: () => {} });
    _driveTokenClient.callback = (resp) => { if (resp && resp.error) { reject(new Error(resp.error_description || resp.error)); return; } _driveToken = resp.access_token; resolve(_driveToken); };
    _driveTokenClient.error_callback = (err) => reject(new Error((err && err.message) || '구글 로그인이 취소되었습니다.'));
    _driveTokenClient.requestAccessToken({ prompt: forcePrompt ? 'consent' : '' });
  });
}
async function driveEnsureToken() { if (_driveToken) return _driveToken; return await driveSignIn(false); }
async function driveFetch(url, opts, retry) {
  const token = await driveEnsureToken();
  opts = opts || {};
  const headers = Object.assign({}, opts.headers || {}, { Authorization: 'Bearer ' + token });
  const res = await fetch(url, Object.assign({}, opts, { headers }));
  if (res.status === 401 && retry !== false) { _driveToken = null; await driveSignIn(false); return driveFetch(url, opts, false); }
  return res;
}
async function driveFindOrCreateFolder(name, parentId) {
  const key = (parentId || 'root') + '/' + name;
  if (_driveFolderCache[key]) return _driveFolderCache[key];
  let q = "mimeType='application/vnd.google-apps.folder' and trashed=false and name='" + name.replace(/'/g, "\\'") + "'";
  q += parentId ? (" and '" + parentId + "' in parents") : " and 'root' in parents";
  const sres = await driveFetch('https://www.googleapis.com/drive/v3/files?spaces=drive&fields=files(id,name)&q=' + encodeURIComponent(q));
  const sdata = await sres.json();
  if (sdata.files && sdata.files.length) { _driveFolderCache[key] = sdata.files[0].id; return sdata.files[0].id; }
  const meta = { name: name, mimeType: 'application/vnd.google-apps.folder' };
  if (parentId) meta.parents = [parentId];
  const cres = await driveFetch('https://www.googleapis.com/drive/v3/files?fields=id', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(meta) });
  const cdata = await cres.json();
  if (!cdata.id) throw new Error('폴더 생성 실패');
  _driveFolderCache[key] = cdata.id;
  return cdata.id;
}

async function driveUploadFile(fileObj, parentId) {
  const token = await driveEnsureToken();
  const meta = { name: fileObj.name, parents: [parentId] };
  const initRes = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id,webViewLink', { method: 'POST', headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json; charset=UTF-8', 'X-Upload-Content-Type': fileObj.type || 'application/octet-stream' }, body: JSON.stringify(meta) });
  if (!initRes.ok) { if (initRes.status === 401) { _driveToken = null; await driveSignIn(false); return driveUploadFile(fileObj, parentId); } throw new Error('업로드 시작 실패 (' + initRes.status + ')'); }
  const uploadUrl = initRes.headers.get('Location');
  const putRes = await fetch(uploadUrl, { method: 'PUT', headers: { 'Content-Type': fileObj.type || 'application/octet-stream' }, body: fileObj });

  if (!pdata.id) throw new Error('업로드 실패');

}
async function driveSaveDraftPdf(html, baseName, parentId) {
  const token = await driveEnsureToken();
  const boundary = 'lmbnd' + Date.now();
  const meta = { name: baseName, mimeType: 'application/vnd.google-apps.document', parents: [parentId] };
  const body = '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(meta) + '\r\n--' + boundary + '\r\nContent-Type: text/html; charset=UTF-8\r\n\r\n' + html + '\r\n--' + boundary + '--';
  const docRes = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'multipart/related; boundary=' + boundary }, body });
  const docData = await docRes.json();
  if (!docData.id) { if (docRes.status === 401) { _driveToken = null; await driveSignIn(false); return driveSaveDraftPdf(html, baseName, parentId); } throw new Error('문서 생성 실패'); }
  const docId = docData.id;
  const pdfRes = await driveFetch('https://www.googleapis.com/drive/v3/files/' + docId + '/export?mimeType=application/pdf');
  const pdfBlob = await pdfRes.blob();
  const pdfMeta = { name: baseName + '.pdf', parents: [parentId] };
  const initRes = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id,webViewLink', { method: 'POST', headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json; charset=UTF-8', 'X-Upload-Content-Type': 'application/pdf' }, body: JSON.stringify(pdfMeta) });
  const uploadUrl = initRes.headers.get('Location');
  const putRes = await fetch(uploadUrl, { method: 'PUT', headers: { 'Content-Type': 'application/pdf' }, body: pdfBlob });
  const pput = await putRes.json();
  if (!pput.id) throw new Error('PDF 저장 실패');
  try { await driveFetch('https://www.googleapis.com/drive/v3/files/' + docId, { method: 'DELETE' }); } catch (e) {}
  return { pdfId: pput.id, pdfLink: pput.webViewLink || ('https://drive.google.com/file/d/' + pput.id + '/view') };
}

const moveToTrash = (d, type, id) => {

    const sIds = subplans.filter(s => pIds.includes(s.planId)).map(s => s.id);

const reorderSiblings = (list, id, parentField, dir) => {
  const arr = [...list];
  const item = arr.find(x => x.id === id);
  if (!item) return list;
  const pv = item[parentField];
  const sib = arr.map((x, i) => (x[parentField] === pv ? i : -1)).filter(i => i >= 0);
  const pos = sib.indexOf(arr.indexOf(item));
  const np = pos + dir;
  if (np < 0 || np >= sib.length) return list;
  const i1 = sib[pos], i2 = sib[np];
  const t = arr[i1]; arr[i1] = arr[i2]; arr[i2] = t;
  return arr;
};

const daysInMonth = key => { const [y, m] = key.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const dateDiff = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000) + 1;
const monthsInRange = (start, end) => {
  const res = []; let cur = start.slice(0, 7); const endKey = end.slice(0, 7); let guard = 0;
  while (cur <= endKey && guard < 36) {
    const [y, m] = cur.split('-').map(Number);
    const mStart = `${y}-${pad(m)}-01`;
    const mEnd = `${y}-${pad(m)}-${pad(new Date(y, m, 0).getDate())}`;
    const segStart = start > mStart ? start : mStart;
    const segEnd = end < mEnd ? end : mEnd;
    res.push({ key: cur, days: dateDiff(segStart, segEnd), totalDays: daysInMonth(cur) });
    let nm = m + 1, ny = y; if (nm > 12) { nm = 1; ny++; } cur = `${ny}-${pad(nm)}`; guard++;
  }
  return res;
};

const Card = ({ children, style = {}, onClick, draggable, onDragStart }) => (
  <div onClick={onClick} draggable={draggable} onDragStart={onDragStart} style={{ background: '#FFFFFF', borderRadius: 12, padding: 16, boxShadow: '0 1px 4px rgba(0,0,0,0.07)', border: '1px solid #E3E0DC', ...style }}>{children}</div>
);
const txtOn = hex => { const h = (hex || '').replace('#', ''); if (h.length !== 6) return 'white'; const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16); return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.65 ? '#1A1614' : 'white'; };
const Badge = ({ label, color }) => <span style={{ display: 'inline-block', padding: '2px 8px', borderRadius: 20, fontSize: 11, fontWeight: 600, color: txtOn(color), background: color, whiteSpace: 'nowrap' }}>{label}</span>;
const Bar = ({ v, m, h = 6 }) => { const p = Math.min(pct(v, m), 100); const bg = p >= 100 ? '#1FA463' : p >= 70 ? '#2D5FE0' : '#E08700'; return <div style={{ background: '#E3E0DC', borderRadius: 4, height: h, overflow: 'hidden' }}><div style={{ height: '100%', width: p + '%', background: bg, borderRadius: 4 }} /></div>; };
const Lbl = ({ c }) => <div style={{ fontSize: 12, color: '#6E6863', fontWeight: 500, marginBottom: 4 }}>{c}</div>;
const Sel = ({ value, onChange, opts, ph }) => (
  <select value={value} onChange={e => onChange(e.target.value)} style={{ width: '100%', padding: '8px 9px', borderRadius: 8, border: '1px solid #E3E0DC', fontSize: 13, background: 'white', boxSizing: 'border-box' }}>
    {ph ? <option value="">{ph}</option> : null}
    {opts.map(o => typeof o === 'object' ? <option key={o.v} value={o.v}>{o.l}</option> : <option key={o} value={o}>{o}</option>)}
  </select>
);
const Inp = ({ value, onChange, type = 'text', placeholder = '' }) => <input type={type} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} style={{ width: '100%', padding: '8px 9px', borderRadius: 8, border: '1px solid #E3E0DC', fontSize: 13, boxSizing: 'border-box' }} />;
const inp = (val, set, type = 'text', ph = '') => <input type={type} value={val} onChange={e => set(e.target.value)} placeholder={ph} style={{ width: '100%', padding: '8px', borderRadius: 8, border: '1px solid #E3E0DC', fontSize: 13, boxSizing: 'border-box' }} />;
const Btn = ({ children, onClick, disabled, v = 'primary', style = {} }) => {
  let bg = G, color = 'white';
  if (disabled) bg = '#A29C95'; else if (v === 'gold') bg = GO; else if (v === 'secondary') { bg = '#E3E0DC'; color = '#3A3631'; } else if (v === 'ghost') { bg = 'transparent'; color = G; } else if (v === 'danger') bg = '#E53935';
  return <button onClick={onClick} disabled={disabled} style={{ padding: '9px 18px', borderRadius: 8, border: 'none', cursor: disabled ? 'not-allowed' : 'pointer', fontSize: 13, fontWeight: 600, background: bg, color, opacity: disabled ? 0.6 : 1, ...style }}>{children}</button>;
};
const EditBtn = ({ onClick }) => <button onClick={onClick} style={{ border: '1px solid #E3E0DC', background: 'white', borderRadius: 6, color: '#6E6863', cursor: 'pointer', fontSize: 10, padding: '2px 7px', fontWeight: 600 }}>수정</button>;
const SCards = ({ items }) => (
  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(130px,1fr))', gap: 10, marginBottom: 18 }}>
    {items.map(it => <Card key={it.label} onClick={it.onClick} style={{ textAlign: 'center', padding: 14, cursor: it.onClick ? 'pointer' : 'default', transition: 'transform .1s', border: it.onClick ? '1px solid #EDEBE7' : undefined }}><div style={{ fontSize: 18, fontWeight: 800, color: it.color }}>{it.value}</div><div style={{ fontSize: 11, color: '#6E6863', marginTop: 2 }}>{it.label}{it.onClick ? ' ›' : ''}</div></Card>)}
  </div>
);
const Chk = ({ on }) => <span style={{ width: 16, height: 16, borderRadius: 4, border: '2px solid ' + (on ? '#1FA463' : '#CBD5E1'), background: on ? '#1FA463' : 'white', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>{on ? <span style={{ color: 'white', fontSize: 10, fontWeight: 900 }}>✓</span> : null}</span>;
const FilterBar = ({ value, onChange }) => (
  <div style={{ display: 'flex', gap: 6, marginBottom: 14, flexWrap: 'wrap' }}>
    {['전체'].concat(MEMBERS).map(o => <button key={o} onClick={() => onChange(o)} style={{ padding: '6px 14px', borderRadius: 20, border: 'none', cursor: 'pointer', fontSize: 12, fontWeight: 600, background: value === o ? G : '#E3E0DC', color: value === o ? 'white' : '#3A3631' }}>{o === '전체' ? '전체' : AV[o] + ' ' + o}</button>)}
  </div>
);
const SyncBadge = ({ status, errMsg }) => {
  const cfg = { loading: { label: '⏳ 로딩 중...', bg: '#A29C95' }, saving: { label: '💾 저장 중...', bg: '#E08700' }, ok: { label: '✅ 실시간 연동', bg: '#1FA463' }, error: { label: '❌ ' + (errMsg || '오류'), bg: '#E53935' } };
  const c = cfg[status] || cfg.ok;
  return <span style={{ fontSize: 11, padding: '4px 10px', borderRadius: 20, background: c.bg, color: 'white', fontWeight: 600, whiteSpace: 'nowrap' }}>{c.label}</span>;
};

function FileModal({ subId, data, setData, onClose }) {
  const [file, setFile] = useState(null);
  const [desc, setDesc] = useState('');
  const [url, setUrl] = useState('');
  const [dragOver, setDragOver] = useState(false);
  const [uploading, setUploading] = useState(false);
  const [upErr, setUpErr] = useState('');
  const MAX = 5 * 1024 * 1024;
  const isLarge = file && file.size > MAX;
  const sub = data.subplans.find(s => s.id === subId);
  const plan = sub ? data.plans.find(p => p.id === sub.planId) : null;
  const output = plan ? data.outputs.find(o => o.id === plan.outputId) : null;
  const folderPath = `라이프밀/업무첨부/${output ? outLabel(output) : '기타'}/${plan ? plan.name : '기타'}`;
  const driveSearchUrl = `https://drive.google.com/drive/search?q=${encodeURIComponent(plan ? plan.name : '라이프밀')}`;
  const currentFiles = (data.subplans.find(s => s.id === subId) || {}).files || [];
  const delFile = id => setData(prev => ({ ...prev, subplans: prev.subplans.map(s => s.id === subId ? { ...s, files: (s.files || []).filter(f => f.id !== id) } : s) }));
  const save = () => {
    if (!file) { alert('파일을 선택하세요'); return; }
    const f = { id: Date.now(), name: file.name, size: file.size, driveUrl: url.trim(), desc: desc.trim(), uploadedAt: TODAY };
    setData(prev => ({ ...prev, subplans: prev.subplans.map(s => s.id === subId ? { ...s, files: [...(s.files || []), f] } : s) }));
    onClose();
  };
  const doUpload = async () => {
    if (!file) { alert('파일을 선택하세요'); return; }
    setUploading(true); setUpErr('');
    try {
      const sub2 = data.subplans.find(s => s.id === subId);
      const plan2 = sub2 ? data.plans.find(p => p.id === sub2.planId) : null;
      const out2 = plan2 ? data.outputs.find(o => o.id === plan2.outputId) : null;
      const folderId = await driveDeepFolder(['라이프밀', '업무첨부', out2 ? outLabel(out2) : '기타', plan2 ? plan2.name : '기타']);
      const r = await driveUploadFile(file, folderId);
      const f = { id: Date.now(), name: file.name, size: file.size, driveUrl: r.link, driveId: r.id, desc: desc.trim(), uploadedAt: TODAY };
      setData(prev => ({ ...prev, subplans: prev.subplans.map(s => s.id === subId ? { ...s, files: [...(s.files || []), f] } : s) }));
      onClose();
    } catch (e) { setUpErr(e.message || '업로드 실패'); } finally { setUploading(false); }
  };
  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'flex-start', justifyContent: 'center', zIndex: 200, padding: '24px 12px', overflowY: 'auto' }}>
      <div style={{ background: 'white', borderRadius: 16, width: '100%', maxWidth: 480, boxShadow: '0 10px 40px rgba(0,0,0,0.3)' }}>
        <div style={{ background: G, color: 'white', padding: '14px 20px', borderRadius: '16px 16px 0 0', display: 'flex', alignItems: 'center' }}>
          <span style={{ fontWeight: 800, fontSize: 15 }}>📎 파일 첨부</span>
          <button onClick={onClose} style={{ marginLeft: 'auto', background: 'none', border: 'none', color: 'white', fontSize: 22, cursor: 'pointer' }}>×</button>
        </div>
        <div style={{ padding: 20, display: 'flex', flexDirection: 'column', gap: 14, maxHeight: '80vh', overflowY: 'auto' }}>
          {currentFiles.length > 0 && (
            <div>
              <Lbl c="첨부된 파일" />
              {currentFiles.map(f => (
                <div key={f.id} style={{ background: '#F5F4F2', borderRadius: 8, padding: '8px 10px', marginBottom: 6 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <span style={{ fontSize: 16 }}>{f.name.match(/\.(png|jpg|jpeg|gif|webp)$/i) ? '🖼️' : '📄'}</span>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 12, fontWeight: 600 }}>{f.name}</div>
                      <div style={{ fontSize: 10, color: '#A29C95' }}>{fmtSize(f.size)} · {f.uploadedAt}</div>
                    </div>
                    {f.driveUrl && <a href={f.driveUrl} target="_blank" rel="noreferrer" style={{ fontSize: 11, color: '#2D5FE0', fontWeight: 600, textDecoration: 'none' }}>열기</a>}
                    <button onClick={() => delFile(f.id)} style={{ border: 'none', background: 'none', color: '#D1D5DB', cursor: 'pointer', fontSize: 16 }}>×</button>
                  </div>
                  {f.desc && <div style={{ fontSize: 11, color: '#6E6863', marginTop: 6, background: 'white', borderRadius: 6, padding: '5px 8px' }}>💬 {f.desc}</div>}
                </div>
              ))}
            </div>
          )}
          <div onDragOver={e => { e.preventDefault(); setDragOver(true); }} onDragLeave={() => setDragOver(false)}
            onDrop={e => { e.preventDefault(); setDragOver(false); setFile(e.dataTransfer.files[0]); }}
            onClick={() => document.getElementById('fu-input').click()}
            style={{ border: '2px dashed ' + (dragOver ? G : '#D1D5DB'), borderRadius: 12, padding: 24, textAlign: 'center', cursor: 'pointer', background: dragOver ? '#F5F4F2' : '#F5F4F2' }}>
            <div style={{ fontSize: 28, marginBottom: 6 }}>📁</div>
            <div style={{ fontSize: 13, color: '#6E6863' }}>드래그하거나 클릭해서 선택</div>
            <div style={{ fontSize: 11, color: '#A29C95', marginTop: 4 }}>선택하면 구글 드라이브로 바로 업로드돼요</div>
            <input id="fu-input" type="file" style={{ display: 'none' }} onChange={e => setFile(e.target.files[0])} />
          </div>
          {file && <div style={{ background: '#F5F4F2', borderRadius: 10, padding: 12, border: '1px solid #A7F3D0', display: 'flex', alignItems: 'center', gap: 8 }}>
            <span style={{ fontSize: 18 }}>{file.type.startsWith('image/') ? '🖼️' : '📄'}</span>
            <div style={{ flex: 1 }}><div style={{ fontSize: 13, fontWeight: 600 }}>{file.name}</div><div style={{ fontSize: 11, color: '#6E6863' }}>{fmtSize(file.size)}</div></div>
            {isLarge && <Badge label="대용량" color="#E08700" />}
          </div>}
          {file && (
            <div style={{ background: '#F5F4F2', borderRadius: 12, padding: 14, border: '1px solid #A7F3D0', display: 'flex', flexDirection: 'column', gap: 8 }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: G }}>🚀 구글 드라이브에 바로 업로드</div>
              <div style={{ fontSize: 11, color: '#6E6863' }}>{folderPath} 폴더에 자동 저장되고, 링크만 대시보드에 기록됩니다. (처음 한 번 구글 로그인 필요)</div>
              {upErr && <div style={{ fontSize: 11, color: '#E53935', background: '#FEF2F2', borderRadius: 8, padding: '7px 10px' }}>⚠ {upErr}</div>}
              <button onClick={doUpload} disabled={uploading} style={{ padding: 11, background: uploading ? '#A29C95' : '#2D5FE0', color: 'white', border: 'none', borderRadius: 8, fontWeight: 700, fontSize: 13, cursor: uploading ? 'default' : 'pointer' }}>{uploading ? '업로드 중…' : '📤 드라이브에 업로드 후 첨부'}</button>
            </div>
          )}
          {file && (
            <details style={{ background: '#F5F4F2', borderRadius: 12, padding: '10px 14px', border: '1px solid #EDEBE7' }}>
              <summary style={{ fontSize: 12, color: '#6E6863', cursor: 'pointer' }}>직접 올린 링크로 기록하기 (수동)</summary>
              <div style={{ marginTop: 10, display: 'flex', flexDirection: 'column', gap: 8 }}>
                <a href={driveSearchUrl} target="_blank" rel="noreferrer" style={{ display: 'block', padding: 9, background: '#E3E0DC', color: '#3A3631', borderRadius: 8, textAlign: 'center', fontWeight: 600, textDecoration: 'none', fontSize: 12 }}>📂 드라이브 폴더 열기 →</a>
                <input value={url} onChange={e => setUrl(e.target.value)} placeholder="https://drive.google.com/..." style={{ width: '100%', padding: '8px 9px', borderRadius: 8, border: '1px solid #E3E0DC', fontSize: 13, boxSizing: 'border-box' }} />
              </div>
            </details>
          )}
          {file && (
            <div>
              <Lbl c="📝 파일 설명 (보고서 자동화에 활용)" />
              <textarea value={desc} onChange={e => setDesc(e.target.value)} placeholder="예: 6월 번들 상품 판매 추이 그래프 - 전월 대비 32% 증가"
                style={{ width: '100%', minHeight: 64, padding: '8px', borderRadius: 8, border: '1px solid #E3E0DC', fontSize: 13, boxSizing: 'border-box', resize: 'vertical', fontFamily: 'inherit' }} />
            </div>
          )}
          {file && url.trim() && <Btn onClick={save} style={{ width: '100%' }}>✅ 링크로 기록만 추가</Btn>}
          <Btn v="secondary" onClick={onClose} style={{ width: '100%' }}>닫기</Btn>
        </div>
      </div>
    </div>
  );
}

function DateBlock({ title, d, set, depOpts }) {
  const up = (k, val) => set({ ...d, [k]: val });
  return (
    <div style={{ background: '#F5F4F2', borderRadius: 10, padding: 12, marginTop: 8, border: '1px solid #EDEBE7' }}>
      <div style={{ fontSize: 12, fontWeight: 700, color: G, marginBottom: 8 }}>{title} 일정</div>
      <label style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12, cursor: 'pointer', marginBottom: 8 }}><input type="checkbox" checked={d.useDep} onChange={e => up('useDep', e.target.checked)} /> 선행 업무 완료 후 시작</label>
      {d.useDep ? (
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 110px', gap: 8 }}>
          <div><Lbl c="선행 업무" /><Sel value={d.depId} onChange={v => up('depId', v)} opts={depOpts} ph="선택..." /></div>
          <div><Lbl c="완료 후 +일수" /><Inp type="number" value={d.depDays} onChange={v => up('depDays', v)} placeholder="7" /></div>
        </div>

const genKpiId = () => 'k' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36);

  const addChildSub = () => { if (!newChild.trim()) return; const nv = data.nid + 1; setData(d => ({ ...d, nid: d.nid + 1, subplans: [...d.subplans, { id: d.nid + 1, planId: item.id, name: newChild.trim(), stage: '예정', start: '', due: '', owner: (ownersOf(item).length ? ownersOf(item) : ['현수']), support: [], dep: null, resolved: false, files: [], perfRecorded: false }] })); setNewChild(''); onSwitch && onSwitch({ kind: 'subplan', id: nv }); };
  const movePlanChild = (id, dir) => setData(d => ({ ...d, plans: reorderSiblings(d.plans, id, 'outputId', dir) }));
  const toggleSubChk = id => setData(d => ({ ...d, checklists: d.checklists.map(c => c.id === id ? { ...c, done: !c.done } : c) }));
  const delSubChk = id => setData(d => ({ ...d, checklists: d.checklists.filter(c => c.id !== id) }));
  const addSubChk = () => { if (!newSubChk.trim()) return; setData(d => ({ ...d, nid: d.nid + 1, checklists: [...d.checklists, { id: d.nid + 1, subplanId: item.id, text: newSubChk.trim(), done: false }] })); setNewSubChk(''); };
  const moveSubChild = (id, dir) => setData(d => ({ ...d, subplans: reorderSiblings(d.subplans, id, 'planId', dir) }));

  const titleMap = { output: '출력 프로젝트 수정', plan: '실행계획 수정', subplan: '세부실행계획 수정' };
  const kpiBlock = kind === 'output' ? (
    <div>
      <label style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 13, fontWeight: 700, color: G, cursor: 'pointer' }}><input type="checkbox" checked={kpiOn} onChange={e => setKpiOn(e.target.checked)} /> KPI (프로젝트 단위)</label>
      {kpiOn && <><KpiInput value={kpi} onChange={setKpi} existingTargets={(item.kpi && item.kpi.targets) || {}} /><div style={{ fontSize: 11, color: '#A29C95', marginTop: 6 }}>※ 프로젝트 KPI는 소속 실행계획 KPI들의 성과 합계로 집계됩니다.</div></>}
    </div>
  ) : (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}><span style={{ fontSize: 13, fontWeight: 700, color: G }}>🎯 KPI ({planKpis.length})</span><button onClick={addPlanKpi} style={{ marginLeft: 'auto', fontSize: 12, padding: '4px 11px', borderRadius: 7, border: 'none', background: GO, color: 'white', cursor: 'pointer', fontWeight: 700 }}>+ KPI 추가</button></div>
      {planKpis.length === 0 ? <div style={{ fontSize: 12, color: '#A29C95', marginTop: 8 }}>등록된 KPI가 없습니다. 여러 개 추가할 수 있어요.</div> :
        planKpis.map((k, i) => (
          <div key={k.id} style={{ background: '#F5F4F2', borderRadius: 10, padding: 12, border: '1px solid #A7F3D0', marginTop: 8 }}>
            <div style={{ display: 'flex', gap: 6, marginBottom: 6 }}>
              <div style={{ flex: 2 }}><Lbl c="KPI명" /><Inp value={k.name} onChange={v => updPlanKpi(i, 'name', v)} placeholder="예: 전환율 / 신규고객" /></div>
              <div style={{ flex: 1 }}><Lbl c="단위" /><Inp value={k.unit} onChange={v => updPlanKpi(i, 'unit', v)} placeholder="%/명/원" /></div>
              <button onClick={() => delPlanKpi(i)} style={{ alignSelf: 'flex-end', border: 'none', background: '#FEE2E2', color: '#E53935', borderRadius: 8, width: 36, height: 38, cursor: 'pointer', fontSize: 16 }}>×</button>
            </div>
            <div><Lbl c="기본 목표값" /><Inp type="number" value={k.target} onChange={v => updPlanKpi(i, 'target', v)} placeholder="목표값 (월별 목표는 KPI 탭에서)" /></div>
          </div>
        ))}
      <div style={{ fontSize: 11, color: '#A29C95', marginTop: 6 }}>※ 달성값은 [업무 성과] 탭에서 KPI별로 기록하고, 월별 목표는 [KPI] 탭에서 설정합니다.</div>
    </div>
  );

  return (
    <ModalShell title={titleMap[kind]} onClose={onClose} onBack={canBack ? onBack : null}>
      <div><Lbl c="이름" /><Inp value={name} onChange={setName} /></div>
      {kind === 'plan' && <div><Lbl c="간략 설명" /><textarea value={desc} onChange={e => setDesc(e.target.value)} rows={3} placeholder="이 실행계획의 목표·맥락을 간단히 (예: 쇼핑검색광고를 운영할 수 있는 시스템 구축이 최종 목표. 이후 이 시스템으로 반복 운영)" style={{ width: '100%', boxSizing: 'border-box', fontSize: 13, padding: '9px 11px', border: '1px solid #E3E0DC', borderRadius: 9, outline: 'none', resize: 'vertical', fontFamily: 'inherit', lineHeight: 1.5 }} /></div>}

      {kind === 'subplan' && (
        <div>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 6 }}>
            <Lbl c="연결된 출력/실행계획" />
            <button onClick={() => setShowOutputChg(!showOutputChg)} style={{ fontSize: 11, padding: '3px 10px', borderRadius: 6, border: '1px solid ' + G, background: showOutputChg ? G : 'white', color: showOutputChg ? 'white' : G, cursor: 'pointer', fontWeight: 600 }}>출력 연결 변경</button>
          </div>
          {!showOutputChg ? (
            <div style={{ fontSize: 12, color: '#3A3631', background: '#F5F4F2', padding: '8px 10px', borderRadius: 8 }}>
              {currentOutput ? outLabel(currentOutput) : '없음'} {currentPlan ? '▸ ' + currentPlan.name : ''}
            </div>
          ) : (
            <div style={{ background: '#F5F4F2', borderRadius: 10, padding: 12, border: '1px solid #A7F3D0' }}>
              <div style={{ marginBottom: 8 }}><Lbl c="출력 프로젝트" /><Sel value={newOutputId} onChange={v => { setNewOutputId(v); setNewPlanId(''); }} opts={data.outputs.map(o => ({ v: String(o.id), l: outLabel(o) }))} ph="선택..." /></div>
              <div><Lbl c="실행계획" /><Sel value={newPlanId} onChange={setNewPlanId} opts={chgPlans.map(p => ({ v: String(p.id), l: p.name }))} ph="선택..." /></div>
            </div>
          )}
        </div>
      )}

      {kind === 'subplan' && <DateBlock title="세부실행계획" d={ds} set={setDs} depOpts={depOpts} />}
      {kind === 'subplan' && <div><Lbl c="상태" /><div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>{STAGES.map(st => <button key={st} onClick={() => setStage(st)} style={{ padding: '7px 12px', borderRadius: 8, border: 'none', cursor: 'pointer', fontSize: 12, fontWeight: 600, background: stage === st ? stC(st) : '#E3E0DC', color: stage === st ? 'white' : '#3A3631' }}>{st}</button>)}</div></div>}
      {kind === 'subplan' && (
        <div style={{ background: '#F5F4F2', borderRadius: 10, padding: 12, border: '1px solid #EDEBE7' }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: G, marginBottom: 8 }}>☑ 체크리스트 ({subChks.length})</div>
          {subChks.length === 0 ? <div style={{ fontSize: 12, color: '#A29C95', marginBottom: 8 }}>등록된 체크리스트가 없습니다</div> :
            subChks.map(c => (
              <div key={c.id} style={{ display: 'flex', alignItems: 'center', gap: 8, background: 'white', borderRadius: 8, padding: '7px 10px', marginBottom: 5, border: '1px solid #E3E0DC' }}>
                <span onClick={() => toggleSubChk(c.id)} style={{ cursor: 'pointer', display: 'flex' }}><Chk on={c.done} /></span>
                <div style={{ flex: 1, fontSize: 12, color: c.done ? '#A29C95' : '#3A3631', textDecoration: c.done ? 'line-through' : 'none' }}>{c.text}</div>
                <button onClick={() => delSubChk(c.id)} style={{ border: 'none', background: 'none', color: '#E53935', cursor: 'pointer', fontSize: 16, lineHeight: 1 }}>×</button>
              </div>
            ))}
          <div style={{ display: 'flex', gap: 6, marginTop: 8 }}>
            <input value={newSubChk} onChange={e => setNewSubChk(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') addSubChk(); }} placeholder="새 체크리스트 항목" style={{ flex: 1, padding: '8px 9px', borderRadius: 8, border: '1px solid #E3E0DC', fontSize: 13 }} />
            <Btn v="gold" onClick={addSubChk} style={{ padding: '8px 14px' }}>+ 추가</Btn>
          </div>
        </div>
      )}
      {kind === 'subplan' && (
        <div style={{ background: '#F5F4F2', borderRadius: 10, padding: 12, border: '1px solid #EDEBE7' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: G }}>📎 첨부 파일 {currentFiles.length > 0 ? `(${currentFiles.length})` : ''}</div>
            <Btn v="gold" onClick={() => setShowFile(true)} style={{ padding: '5px 12px', fontSize: 12 }}>+ 파일 추가</Btn>
          </div>
          {currentFiles.length === 0 ? (
            <div style={{ fontSize: 12, color: '#A29C95', textAlign: 'center', padding: '10px 0' }}>첨부된 파일이 없습니다</div>
          ) : currentFiles.map(f => (
            <div key={f.id} style={{ display: 'flex', alignItems: 'center', gap: 8, background: 'white', borderRadius: 8, padding: '7px 10px', marginBottom: 5, border: '1px solid #E3E0DC' }}>
              <span>{f.name.match(/\.(png|jpg|jpeg|gif|webp)$/i) ? '🖼️' : '📄'}</span>
              <div style={{ flex: 1 }}><div style={{ fontSize: 12, fontWeight: 600 }}>{f.name}</div><div style={{ fontSize: 10, color: '#A29C95' }}>{fmtSize(f.size)} · {f.uploadedAt}</div></div>
              {f.driveUrl && <a href={f.driveUrl} target="_blank" rel="noreferrer" style={{ fontSize: 11, color: '#2D5FE0', fontWeight: 600, textDecoration: 'none' }}>열기</a>}
              <button onClick={() => { if (!confirm('이 첨부를 목록에서 삭제할까요? (드라이브 원본 파일은 유지됩니다)')) return; setData(d => ({ ...d, subplans: d.subplans.map(s => s.id === item.id ? { ...s, files: (s.files || []).filter(x => x.id !== f.id) } : s) })); }} style={{ border: 'none', background: 'none', color: '#E53935', cursor: 'pointer', fontSize: 12, fontWeight: 700 }}>삭제</button>
            </div>
          ))}
        </div>
      )}
      {kind === 'subplan' && <div><Lbl c="담당자 (다중 선택)" /><MemberMulti selected={owner} onToggle={m => setOwner(owner.includes(m) ? owner.filter(x => x !== m) : [...owner, m])} /></div>}
      {kind === 'subplan' && <SupportEditor support={support} setSupport={setSupport} />}

      {kind === 'plan' && <div><Lbl c="보류" /><label onClick={() => setHold(!hold)} style={{ display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer', background: hold ? '#F1F5F9' : '#FAFAFA', border: '1.5px solid ' + (hold ? '#989088' : '#E3E0DC'), borderRadius: 10, padding: '10px 14px' }}><div style={{ width: 20, height: 20, borderRadius: 4, border: '2px solid ' + (hold ? '#989088' : '#D1D5DB'), background: hold ? '#989088' : 'white', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>{hold ? <span style={{ color: 'white', fontSize: 12, fontWeight: 900 }}>✓</span> : null}</div><div><div style={{ fontSize: 13, fontWeight: 700 }}>⏸ 보류로 표시</div><div style={{ fontSize: 11, color: '#A29C95' }}>보류 탭에서 별도 관리</div></div></label></div>}

      {kind === 'plan' && <div><Lbl c="담당자 (다중 선택)" /><MemberMulti selected={owner} onToggle={m => setOwner(owner.includes(m) ? owner.filter(x => x !== m) : [...owner, m])} /></div>}
      {kind === 'plan' && <SupportEditor support={support} setSupport={setSupport} />}
      {kind === 'plan' && <DateBlock title="실행계획" d={ds} set={setDs} depOpts={depOpts} />}

      {(kind === 'plan' || kind === 'output') && kpiBlock}

      {kind === 'output' && (
        <div style={{ background: '#F5F4F2', borderRadius: 10, padding: 12, border: '1px solid #EDEBE7' }}>
          <div style={{ display: 'flex', alignItems: 'center', marginBottom: 8 }}><div style={{ fontSize: 13, fontWeight: 700, color: G }}>📋 실행계획 ({childPlans.length})</div>{childPlans.length > 1 && <button onClick={() => setShowReorder(true)} style={{ marginLeft: 'auto', fontSize: 11, padding: '3px 10px', borderRadius: 6, border: '1px solid ' + G, background: 'white', color: G, cursor: 'pointer', fontWeight: 600 }}>⠿ 순서 변경</button>}</div>
          {childPlans.length === 0 ? <div style={{ fontSize: 12, color: '#A29C95', marginBottom: 8 }}>등록된 실행계획이 없습니다</div> :
            childPlans.map((p, pi) => { const subs = data.subplans.filter(s => s.planId === p.id); const done = subs.filter(s => s.stage === '완료').length; return (
              <div key={p.id} style={{ display: 'flex', alignItems: 'center', gap: 8, background: 'white', borderRadius: 8, padding: '8px 10px', marginBottom: 5, border: '1px solid #E3E0DC' }}>
                <div style={{ flex: 1 }}><div style={{ fontSize: 12, fontWeight: 600 }}>{p.name}{(p.kpis && p.kpis.length) ? ' 🎯' : ''}{p.hold ? ' ⏸' : ''}</div><div style={{ fontSize: 10, color: '#A29C95' }}>{ownerAv(p)} {ownerNm(p)} · 세부 {done}/{subs.length}</div></div>
                <EditBtn onClick={() => onSwitch && onSwitch({ kind: 'plan', id: p.id })} />
              </div>
            ); })}
          <div style={{ display: 'flex', gap: 6, marginTop: 8 }}>
            <input value={newChild} onChange={e => setNewChild(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') addChildPlan(); }} placeholder="새 실행계획명" style={{ flex: 1, padding: '8px 9px', borderRadius: 8, border: '1px solid #E3E0DC', fontSize: 13 }} />
            <Btn v="gold" onClick={addChildPlan} style={{ padding: '8px 14px' }}>+ 추가</Btn>
          </div>
        </div>
      )}

      {kind === 'plan' && (
        <div style={{ background: '#F5F4F2', borderRadius: 10, padding: 12, border: '1px solid #EDEBE7' }}>
          <div style={{ display: 'flex', alignItems: 'center', marginBottom: 8 }}><div style={{ fontSize: 13, fontWeight: 700, color: G }}>📋 세부 실행계획 ({childSubs.length})</div>{childSubs.length > 1 && <button onClick={() => setShowReorder(true)} style={{ marginLeft: 'auto', fontSize: 11, padding: '3px 10px', borderRadius: 6, border: '1px solid ' + G, background: 'white', color: G, cursor: 'pointer', fontWeight: 600 }}>⠿ 순서 변경</button>}</div>
          {childSubs.length === 0 ? <div style={{ fontSize: 12, color: '#A29C95', marginBottom: 8 }}>등록된 세부 실행계획이 없습니다</div> :
            childSubs.map((s, si) => (
              <div key={s.id} style={{ display: 'flex', alignItems: 'center', gap: 8, background: 'white', borderRadius: 8, padding: '8px 10px', marginBottom: 5, border: '1px solid #E3E0DC' }}>
                <span style={{ fontSize: 10, padding: '1px 6px', borderRadius: 6, background: stC(s.stage), color: 'white' }}>{s.stage}</span>
                <div style={{ flex: 1, fontSize: 12, fontWeight: 600 }}>{s.name}</div>
                <span style={{ fontSize: 10, color: G }}>{ownerAv(s)}</span>
                <EditBtn onClick={() => onSwitch && onSwitch({ kind: 'subplan', id: s.id })} />
              </div>
            ))}
          <div style={{ display: 'flex', gap: 6, marginTop: 8 }}>
            <input value={newChild} onChange={e => setNewChild(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') addChildSub(); }} placeholder="새 세부 실행계획명" style={{ flex: 1, padding: '8px 9px', borderRadius: 8, border: '1px solid #E3E0DC', fontSize: 13 }} />
            <Btn v="gold" onClick={addChildSub} style={{ padding: '8px 14px' }}>+ 추가</Btn>
          </div>
        </div>
      )}



      <div style={{ display: 'flex', gap: 8 }}><Btn onClick={save} style={{ flex: 1 }}>저장</Btn><Btn v="secondary" onClick={onClose}>취소</Btn>{confirmDel ? <Btn v="danger" onClick={del}>휴지통으로 이동</Btn> : <Btn v="secondary" onClick={() => setConfirmDel(true)} style={{ color: '#E53935' }}>삭제</Btn>}</div>
      {showFile && <FileModal subId={item.id} data={data} setData={setData} onClose={() => setShowFile(false)} />}
      {showReorder && kind === 'output' && <ReorderModal title="실행계획 순서" items={childPlans.map(p => ({ id: p.id, label: p.name }))} onClose={() => setShowReorder(false)} onSave={newOrder => setData(d => { const q = newOrder.map(x => d.plans.find(p => p.id === x.id)).filter(Boolean); let k = 0; return { ...d, plans: d.plans.map(p => p.outputId === item.id ? q[k++] : p) }; })} />}
      {showReorder && kind === 'plan' && <ReorderModal title="세부 실행계획 순서" items={childSubs.map(s => ({ id: s.id, label: s.name }))} onClose={() => setShowReorder(false)} onSave={newOrder => setData(d => { const q = newOrder.map(x => d.subplans.find(s => s.id === x.id)).filter(Boolean); let k = 0; return { ...d, subplans: d.subplans.map(s => s.planId === item.id ? q[k++] : s) }; })} />}
    </ModalShell>
  );
}

function TabTeam({ data, setData, goTab }) {
  const all = data.plans.map(p => ({ ...p })).concat(data.subplans.map(s => ({ ...s })));
  const heldTotal = data.plans.filter(p => p.hold).length + data.subplans.filter(s => s.stage === '보류').length;
  return (
    <div style={{ padding: 20 }}>
      <div style={{ fontSize: 17, fontWeight: 700, color: G, marginBottom: 4 }}>팀 현황</div>
      <div style={{ fontSize: 12, color: '#6E6863', marginBottom: 16 }}>{TODAY} 기준</div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(240px,1fr))', gap: 12 }}>
        {MEMBERS.map(m => {
          const owned = all.filter(x => ownersOf(x).includes(m)); const supp = all.filter(x => x.support && x.support.some(s => s.m === m));
          const subCnt = data.subplans.filter(s => ownersOf(s).includes(m)).length; const done = data.subplans.filter(s => ownersOf(s).includes(m) && s.stage === '완료').length;
          return (<Card key={m}><div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 12 }}><div style={{ width: 44, height: 44, borderRadius: '50%', background: G, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 22 }}>{AV[m]}</div><div><div style={{ fontWeight: 700, fontSize: 15 }}>{m}</div><div style={{ fontSize: 11, color: '#6E6863' }}>{ROLES[m]}</div></div><div style={{ marginLeft: 'auto', textAlign: 'right' }}><div style={{ fontSize: 11, color: '#6E6863' }}>완료율</div><div style={{ fontSize: 16, fontWeight: 700, color: G }}>{subCnt ? pct(done, subCnt) : 0}%</div></div></div><Bar v={done} m={subCnt || 1} h={5} /><div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginTop: 12 }}><div style={{ textAlign: 'center', background: '#F5F4F2', borderRadius: 8, padding: '8px 4px' }}><div style={{ fontSize: 18, fontWeight: 700, color: G }}>{owned.length}</div><div style={{ fontSize: 10, color: '#6E6863' }}>담당</div></div><div style={{ textAlign: 'center', background: '#FAF6EE', borderRadius: 8, padding: '8px 4px' }}><div style={{ fontSize: 18, fontWeight: 700, color: GO }}>{supp.length}</div><div style={{ fontSize: 10, color: '#6E6863' }}>서포트</div></div></div></Card>);
        })}
      </div>
      <div style={{ marginTop: 18 }}><SCards items={[{ label: '출력 프로젝트', value: data.outputs.length + '개', color: G, onClick: () => goTab && goTab('프로젝트 진행 상황') }, { label: '실행계획', value: data.plans.length + '개', color: '#2D5FE0', onClick: () => goTab && goTab('칸반') }, { label: '세부 실행계획', value: data.subplans.length + '개', color: '#E08700', onClick: () => goTab && goTab('데일리/주간') }, { label: '등록 KPI', value: (data.plans.reduce((a, p) => a + (p.kpis ? p.kpis.length : 0), 0) + data.outputs.filter(o => o.kpi).length) + '개', color: GO, onClick: () => goTab && goTab('KPI') }, { label: '보류 항목', value: heldTotal + '건', color: '#989088', onClick: () => goTab && goTab('보류') }]} /></div>
      <NoticeBoard data={data} setData={setData} />
    </div>
  );
}

function NoticeModal({ data, setData, edit, onClose }) {
  const [title, setTitle] = useState(edit ? edit.title : '');
  const [content, setContent] = useState(edit ? edit.content : '');
  const [author, setAuthor] = useState(edit ? edit.author : MEMBERS[0]);
  const [pinned, setPinned] = useState(edit ? !!edit.pinned : false);
  const save = () => {
    if (!title.trim() && !content.trim()) { alert('제목 또는 내용을 입력하세요.'); return; }
    setData(d => {
      let notices = [...(d.notices || [])];
      if (pinned) notices = notices.map(n => ({ ...n, pinned: false }));
      if (edit) notices = notices.map(n => n.id === edit.id ? { ...n, title: title.trim(), content: content.trim(), author, pinned } : n);
      else notices = [{ id: Date.now(), title: title.trim(), content: content.trim(), author, pinned, createdAt: TODAY }, ...notices];
      return { ...d, notices };
    });
    onClose();
  };
  return (

  const spanning = subs.filter(s => s.start && s.due && s.start !== s.due && s.start <= weekDates[6] && s.due >= weekDates[0]);
  const SPAN_GAP = 8;
  const spanMeta = spanning.map(s => {
    const sc = s.start <= weekDates[0] ? 0 : weekDates.indexOf(s.start);
    const ec = s.due >= weekDates[6] ? 6 : weekDates.indexOf(s.due);
    return { sc, ec };
  });
  // 겹치지 않는 막대는 같은 줄(lane)에 배치
  const laneOf = {};
  const lanes = [];
  spanMeta.map((m, i) => i).sort((a, b) => spanMeta[a].sc - spanMeta[b].sc || a - b).forEach(i => {
    const m = spanMeta[i];
    let k = lanes.findIndex(l => l.endCol < m.sc);
    if (k === -1) { lanes.push({ endCol: m.ec }); k = lanes.length - 1; } else { lanes[k].endCol = m.ec; }
    laneOf[i] = k;
  });
  // 막대 실제 높이를 측정 → 줄별 최대 높이 (요일별로 자기 칸을 지나는 막대만큼만 자리 확보)
  const spanRefs = useRef({});
  const [laneH, setLaneH] = useState({});
  React.useLayoutEffect(() => {
    const h = {};
    spanning.forEach((s, idx) => { const el = spanRefs.current[s.id]; if (el) { const k = laneOf[idx]; h[k] = Math.max(h[k] || 0, el.offsetHeight); } });
    setLaneH(prev => (JSON.stringify(prev) === JSON.stringify(h) ? prev : h));
  });
  const laneTop = [];
  lanes.forEach((_, k) => { laneTop[k] = k === 0 ? 0 : laneTop[k - 1] + (laneH[k - 1] || 46) + SPAN_GAP; });
  const colReserve = i => { let h = 0; spanMeta.forEach((m, idx) => { if (m.sc >= 0 && m.ec >= 0 && m.sc <= i && i <= m.ec) h = Math.max(h, laneTop[laneOf[idx]] + (laneH[laneOf[idx]] || 46) + SPAN_GAP); }); return h; };
  const getDayItems = date => subs.filter(s => { if (s.start && s.due && s.start !== s.due) return false; return s.due === date; });
  const unassigned = subs.filter(s => !s.due);
  const grouped = {};
  unassigned.forEach(s => {
    const p = data.plans.find(x => x.id === s.planId);
    const o = p ? data.outputs.find(x => x.id === p.outputId) : null;
    const oKey = o ? outLabel(o) : '기타';
    const pKey = p ? p.name : '기타';
    if (!grouped[oKey]) grouped[oKey] = {};
    if (!grouped[oKey][pKey]) grouped[oKey][pKey] = [];
    grouped[oKey][pKey].push(s);
  });
  const renderMini = (s, hideParent = false) => {
    const chks = data.checklists.filter(c => c.subplanId === s.id); const cd = chks.filter(c => c.done).length;
    const isSpan = !!(s.start && s.due && s.start !== s.due); const files = s.files || [];
    return (
      <Card key={s.id} draggable onDragStart={e => onDragStart(e, s, isSpan)} style={{ marginBottom: 6, padding: 8, cursor: 'grab' }}>
        {!hideParent && <div style={{ fontSize: 9, color: '#A29C95', marginBottom: 3 }}>{planName(s.planId)}</div>}
        <div style={{ display: 'flex', gap: 4, alignItems: 'flex-start' }}>
          <div style={{ fontSize: 11, fontWeight: 600, flex: 1, lineHeight: 1.3, cursor: 'pointer' }} onClick={() => setColChk(cc => ({ ...cc, [s.id]: !cc[s.id] }))}>{s.name}</div>
          <EditBtn onClick={() => onEdit({ kind: 'subplan', id: s.id })} />
        </div>
        <div style={{ display: 'flex', gap: 5, marginTop: 4, flexWrap: 'wrap', alignItems: 'center' }}>
          <span style={{ fontSize: 9, padding: '1px 5px', borderRadius: 6, background: stC(s.stage), color: 'white' }}>{s.stage}</span>
          <span style={{ fontSize: 9, color: G }}>{ownerAv(s)}</span>
          {chks.length > 0 && <span style={{ fontSize: 9, color: '#6E6863' }}>☑ {cd}/{chks.length}</span>}
          {files.length > 0 && <span style={{ fontSize: 9, color: '#2D5FE0' }}>📎{files.length}</span>}
        </div>
        {!colChk[s.id] && <div style={{ background: '#F5F4F2', borderRadius: 6, padding: 6, marginTop: 6 }}>{chks.map(c => <div key={c.id} onClick={() => toggleChk(c.id)} style={{ display: 'flex', alignItems: 'center', gap: 5, padding: '3px 0', cursor: 'pointer' }}><Chk on={c.done} /><span style={{ fontSize: 10, color: c.done ? '#A29C95' : '#3A3631', textDecoration: c.done ? 'line-through' : 'none' }}>{c.text}</span></div>)}<div style={{ display: 'flex', gap: 4, marginTop: chks.length ? 5 : 0 }}><input value={newChk[s.id] || ''} draggable={false} onMouseDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} onChange={e => setNewChk(n => ({ ...n, [s.id]: e.target.value }))} onKeyDown={e => { if (e.key === 'Enter') addChk(s.id); }} placeholder="+ 체크 추가" style={{ flex: 1, fontSize: 10, padding: '3px 6px', border: '1px solid #E3E0DC', borderRadius: 5, outline: 'none', minWidth: 0 }} /><button onClick={e => { e.stopPropagation(); addChk(s.id); }} style={{ fontSize: 10, padding: '3px 8px', border: 'none', background: G, color: 'white', borderRadius: 5, cursor: 'pointer', fontWeight: 600 }}>추가</button></div></div>}
      </Card>
    );
  };
  const ymd = (y, m, d) => y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  const shiftMonthDate = (ds, n) => { const d = new Date(ds + 'T00:00:00'); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last)); return ymd(d.getFullYear(), d.getMonth() + 1, d.getDate()); };
  const mStartD = new Date(monthStart + 'T00:00:00');
  const RANGE_DAYS = 30;
  const mDates = [];
  for (let i = 0; i < RANGE_DAYS; i++) { const d = new Date(mStartD); d.setDate(mStartD.getDate() + i); mDates.push(ymd(d.getFullYear(), d.getMonth() + 1, d.getDate())); }
  const mLeadWd = (mStartD.getDay() + 6) % 7;
  const monthCells = [];
  for (let i = 0; i < mLeadWd; i++) monthCells.push(null);
  mDates.forEach(dt => monthCells.push(dt));
  while (monthCells.length % 7 !== 0) monthCells.push(null);
  const monthWeeks = []; for (let i = 0; i < monthCells.length; i += 7) monthWeeks.push(monthCells.slice(i, i + 7));
  const monthEnd = mDates[mDates.length - 1];
  const monthItemsOf = date => subs.filter(s => { if (!s.due) return false; if (s.start && s.due && s.start !== s.due) return s.start <= date && date <= s.due; return s.due === date; });
  const navBtn = { border: '1px solid #E3E0DC', background: 'white', borderRadius: 6, cursor: 'pointer', padding: '4px 10px' };
  return (
    <div style={{ padding: 20 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 14, flexWrap: 'wrap' }}>
        <div style={{ fontSize: 17, fontWeight: 700, color: G }}>데일리 / 주간 업무</div>
        <div style={{ display: 'flex', gap: 6, marginLeft: 'auto', alignItems: 'center', flexWrap: 'wrap' }}>
          <button onClick={() => setMonthView(v => !v)} style={{ ...navBtn, background: monthView ? G : 'white', color: monthView ? 'white' : '#3A3631', fontWeight: 600 }}>{monthView ? '주간 보기' : '📅 월간 보기'}</button>
          {monthView ? (<>
            <span style={{ fontSize: 11, color: '#6E6863' }}>조회 시작일</span>
            <input type="date" value={monthStart} onChange={e => { if (e.target.value) setMonthStart(e.target.value); }} style={{ padding: '4px 8px', borderRadius: 6, border: '1px solid #E3E0DC', fontSize: 12 }} />
            <button onClick={() => setMonthStart(shiftMonthDate(monthStart, -1))} style={navBtn}>◀</button>
            <span style={{ fontSize: 12, color: '#6E6863', minWidth: 120, textAlign: 'center' }}>{monthStart.slice(5)} ~ {monthEnd.slice(5)} (30일)</span>
            <button onClick={() => setMonthStart(shiftMonthDate(monthStart, 1))} style={navBtn}>▶</button>
          </>) : (<>
            <button onClick={() => setOffset(offset - 1)} style={navBtn}>◀</button>
            <span style={{ fontSize: 12, color: '#6E6863', minWidth: 110, textAlign: 'center' }}>{weekDates[0].slice(5)} ~ {weekDates[6].slice(5)}{offset === 0 ? ' (이번 주)' : ''}</span>
            <button onClick={() => setOffset(offset + 1)} style={navBtn}>▶</button>
          </>)}
        </div>
      </div>
      <FilterBar value={filter} onChange={setFilter} />
      {monthView && (
        <div style={{ marginBottom: 16 }}>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: 6, marginBottom: 6 }}>
            {DAYS.map(day => <div key={day} style={{ textAlign: 'center', fontWeight: 700, fontSize: 12, color: G, padding: '4px 0' }}>{day}</div>)}
          </div>
          {monthWeeks.map((wk, wi) => (
            <div key={wi} style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: 6, marginBottom: 6 }}>
              {wk.map((date, di) => {
                if (!date) return <div key={di} style={{ minHeight: 92, background: '#FAFAFA', borderRadius: 8 }} />;
                const items = monthItemsOf(date);
                const isToday = date === TODAY, isSel = date === monthStart;
                return (
                  <div key={di} onClick={() => setMonthStart(date)}
                    onDragOver={e => { e.preventDefault(); setDragOver('m' + date); }}
                    onDragLeave={e => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOver(null); }}
                    onDrop={e => handleDrop(e, date)}
                    style={{ minHeight: 92, background: dragOver === 'm' + date ? '#E8F4EE' : 'white', border: '1px solid ' + (isSel ? G : isToday ? GO : '#EDEBE7'), borderRadius: 8, padding: 6, cursor: 'pointer', overflow: 'hidden' }}>
                    <div style={{ fontSize: 11, fontWeight: 700, color: isSel ? G : isToday ? GO : '#3A3631', marginBottom: 4 }}>{date.slice(8) === '01' ? Number(date.slice(5, 7)) + '월 1' : Number(date.slice(8))}{isSel ? ' ·시작' : isToday ? ' ·오늘' : ''}</div>
                    {items.slice(0, 4).map(s => <div key={s.id} style={{ fontSize: 9, padding: '2px 5px', borderRadius: 5, background: stC(s.stage), color: 'white', marginBottom: 3, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{s.name}</div>)}
                    {items.length > 4 && <div style={{ fontSize: 9, color: '#A29C95' }}>+{items.length - 4}건</div>}
                  </div>
                );
              })}
            </div>
          ))}
          <div style={{ fontSize: 11, color: '#A29C95', marginTop: 4 }}>날짜를 클릭하면 그 날부터 한 달(30일)로 조회 기간이 바뀝니다.</div>
        </div>
      )}
      <div style={{ overflowX: 'auto', marginBottom: 16, display: monthView ? 'none' : 'block' }}>
        <div style={{ minWidth: 1000 }}>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: 8, marginBottom: 8 }}>
            {DAYS.map((day, i) => (
              <div key={day} style={{ background: weekDates[i] === TODAY ? GO : G, color: 'white', borderRadius: 8, padding: '7px 0', textAlign: 'center', fontWeight: 700, fontSize: 12 }}>
                {day} <span style={{ opacity: 0.7, fontSize: 10 }}>{weekDates[i].slice(5)}</span>
              </div>
            ))}
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: 8 }}>
            {weekDates.map((date, i) => (
              <div key={'dc' + i} style={{ gridColumn: i + 1, gridRow: 1 }}
                onDragOver={e => { e.preventDefault(); setDragOver('c' + i); }}
                onDragLeave={e => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOver(null); }}
                onDrop={e => handleDrop(e, date)}>
                {(() => { const h = colReserve(i); return h > 0 ? <div style={{ height: h }} /> : null; })()}
                <div style={{ minHeight: 70, padding: 4, borderRadius: 8, background: dragOver === 'c' + i ? '#E8F4EE' : 'transparent', border: dragOver === 'c' + i ? '2px dashed ' + G : '2px solid transparent', transition: 'all 0.15s' }}>
                  {getDayItems(date).map(s => renderMini(s))}
                </div>
              </div>
            ))}
            {spanning.map((s, idx) => {
              const sc = s.start <= weekDates[0] ? 0 : weekDates.indexOf(s.start);
              const ec = s.due >= weekDates[6] ? 6 : weekDates.indexOf(s.due);
              if (sc < 0 || ec < 0 || sc > ec) return null;
              const dur = diffDays(s.start, s.due);
              const chks = data.checklists.filter(c => c.subplanId === s.id); const cd = chks.filter(c => c.done).length;
              return (
                <div key={s.id} ref={el => (spanRefs.current[s.id] = el)} draggable onDragStart={e => onDragStart(e, s, true)}
                  style={{ gridColumn: `${sc + 1} / ${ec + 2}`, gridRow: 1, alignSelf: 'start', marginTop: laneTop[laneOf[idx]], position: 'relative', zIndex: 2, background: 'white', border: '1.5px solid ' + stC(s.stage), borderLeft: '5px solid ' + stC(s.stage), borderRadius: 10, padding: '6px 12px', display: 'flex', flexDirection: 'column', gap: 4, boxShadow: '0 2px 8px rgba(0,0,0,0.1)', cursor: 'grab' }}>
                  <div style={{ display: 'flex', alignItems: 'flex-start', gap: 8 }}>
                    <Badge label={s.stage} color={stC(s.stage)} />
                    <div style={{ flex: 1, minWidth: 0, cursor: 'pointer' }} onClick={() => setColChk(cc => ({ ...cc, [s.id]: !cc[s.id] }))}>
                      <div style={{ fontSize: 13, fontWeight: 700, color: '#1A1614', whiteSpace: 'normal', wordBreak: 'break-word', lineHeight: 1.25 }}>{s.name}</div>
                      <div style={{ fontSize: 10, color: '#6E6863' }}>{ownerAv(s)} · {s.start.slice(5)}~{s.due.slice(5)} ({dur}일){chks.length > 0 ? ` · ☑ ${cd}/${chks.length}` : ''}</div>
                    </div>
                    <EditBtn onClick={() => onEdit({ kind: 'subplan', id: s.id })} />
                  </div>
                  {!colChk[s.id] && <div style={{ background: '#F5F4F2', borderRadius: 6, padding: 6 }}>{chks.map(c => <div key={c.id} onClick={() => toggleChk(c.id)} style={{ display: 'flex', alignItems: 'center', gap: 5, padding: '3px 0', cursor: 'pointer' }}><Chk on={c.done} /><span style={{ fontSize: 10, color: c.done ? '#A29C95' : '#3A3631', textDecoration: c.done ? 'line-through' : 'none' }}>{c.text}</span></div>)}<div style={{ display: 'flex', gap: 4, marginTop: chks.length ? 5 : 0 }}><input value={newChk[s.id] || ''} draggable={false} onMouseDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} onChange={e => setNewChk(n => ({ ...n, [s.id]: e.target.value }))} onKeyDown={e => { if (e.key === 'Enter') addChk(s.id); }} placeholder="+ 체크 추가" style={{ flex: 1, fontSize: 10, padding: '3px 6px', border: '1px solid #E3E0DC', borderRadius: 5, outline: 'none', minWidth: 0 }} /><button onClick={e => { e.stopPropagation(); addChk(s.id); }} style={{ fontSize: 10, padding: '3px 8px', border: 'none', background: G, color: 'white', borderRadius: 5, cursor: 'pointer', fontWeight: 600 }}>추가</button></div></div>}
                </div>
              );
            })}
          </div>
        </div>
      </div>
      <div onDragOver={e => { e.preventDefault(); setDragOver('un'); }} onDragLeave={() => setDragOver(null)} onDrop={handleUnassignedDrop}
        style={{ background: dragOver === 'un' ? '#E8F4EE' : '#F5F4F2', border: '1px dashed ' + (dragOver === 'un' ? G : '#D1D5DB'), borderRadius: 10, padding: 14, transition: 'all 0.15s' }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: '#6E6863', marginBottom: 14 }}>미배정 ({unassigned.length}) <span style={{ fontWeight: 400, fontSize: 11 }}>· 날짜 칸으로 드래그해서 배정 / 달력→미배정 드래그로 해제</span></div>
        {unassigned.length === 0 ? <div style={{ fontSize: 12, color: '#A29C95' }}>모든 항목에 날짜가 배정되었습니다.</div> :
          Object.entries(grouped).map(([oKey, plans]) => (
            <div key={oKey} style={{ marginBottom: 16 }}>
              <div style={{ background: G, color: 'white', borderRadius: '8px 8px 0 0', padding: '8px 14px', fontSize: 12, fontWeight: 700 }}>📦 {oKey}</div>
              <div style={{ display: 'flex', border: '1px solid ' + G, borderTop: 'none', borderRadius: '0 0 8px 8px', overflowX: 'auto' }}>
                {Object.entries(plans).map(([pKey, tasks], pIdx, arr) => (
                  <div key={pKey} style={{ flex: '0 0 200px', borderRight: pIdx < arr.length - 1 ? '1px solid #E3E0DC' : 'none', background: 'white' }}>
                    <div style={{ background: '#E8F4EE', color: G, padding: '6px 10px', fontSize: 11, fontWeight: 700, borderBottom: '1px solid #D1FAE5' }}>▸ {pKey}</div>
                    <div style={{ padding: 8 }}>{tasks.map(s => renderMini(s, true))}</div>
                  </div>
                ))}
              </div>
            </div>
          ))}
      </div>
    </div>
  );
}

            <div style={{ fontSize: 11, color: '#A29C95', marginBottom: 3 }}>{out ? outLabel(out) : ''} ▸ {plan ? plan.name : ''}</div>
            <div style={{ fontSize: 14, fontWeight: 700 }}>{sub.name}</div>

              <div style={{ fontSize: 13, fontWeight: 700, color: G, marginBottom: 10 }}>🎯 KPI 달성 기록 (KPI별 입력)</div>
              {planKpis.map(k => (
                <div key={k.id} style={{ background: 'white', borderRadius: 8, padding: '10px 12px', marginBottom: 8 }}>

                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>

                    <button onClick={() => { if (!confirm('이 첨부를 목록에서 삭제할까요? (드라이브 원본 파일은 유지됩니다)')) return; setData(d => ({ ...d, subplans: d.subplans.map(s => s.id === subId ? { ...s, files: (s.files || []).filter(x => x.id !== f.id) } : s) })); }} style={{ border: 'none', background: 'none', color: '#E53935', cursor: 'pointer', fontSize: 12, fontWeight: 700 }}>삭제</button>
                  </div>

      {showFile && <FileModal subId={subId} data={data} setData={setData} onClose={() => setShowFile(false)} />}

}

function TabPerformance({ data, setData, onRecord }) {

  const renderCard = (s, isRecorded) => {

            <div style={{ fontSize: 14, fontWeight: 700 }}>{s.name}</div>
            <div style={{ fontSize: 11, color: '#6E6863', marginTop: 4 }}>{ownerAv(s)} {ownerNm(s)} · 완료 {s.completedAt || '미기록'}</div>
            {isRecorded && logs.length > 0 && plan && (
              <div style={{ marginTop: 10, background: '#F5F4F2', borderRadius: 8, padding: '8px 12px' }}>
                {logs.map(l => { const k = (plan.kpis || []).find(kk => kk.id === l.kpiId); return (
                  <div key={l.id} style={{ marginBottom: 4 }}>
                    <div style={{ fontSize: 12, fontWeight: 700, color: G }}>🎯 {k ? k.name : 'KPI'}: {l.value.toLocaleString()} {k ? k.unit : ''}</div>
                    <div style={{ fontSize: 11, color: '#6E6863', marginTop: 2 }}>달성기간 {l.periodStart} ~ {l.periodEnd}</div>
                  </div>
                ); })}
              </div>
            )}
            {isRecorded && files.length > 0 && (
              <div style={{ marginTop: 8 }}>
                {files.map(f => (
                  <div key={f.id} style={{ fontSize: 11, color: '#2D5FE0', marginBottom: 3 }}>

                  </div>
                ))}
              </div>
            )}
          </div>
          <button onClick={() => onRecord(s.id)} style={{ padding: '7px 14px', background: isRecorded ? 'white' : G, color: isRecorded ? G : 'white', border: '1px solid ' + G, borderRadius: 8, fontWeight: 600, cursor: 'pointer', fontSize: 12, whiteSpace: 'nowrap' }}>

    <div style={{ padding: 20 }}>
      <div style={{ fontSize: 17, fontWeight: 700, color: G, marginBottom: 14 }}>업무 성과</div>
      <FilterBar value={filter} onChange={setFilter} />
      <div style={{ marginBottom: 24 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 }}>
          <span style={{ fontSize: 14, fontWeight: 700, color: '#92400E' }}>⏳ 성과 기록 전</span>
          <Badge label={notRecorded.length + '건'} color="#E08700" />
        </div>
        {notRecorded.length === 0 ? <Card style={{ textAlign: 'center', padding: 30, color: '#A29C95', fontSize: 13 }}>기록할 완료 업무가 없습니다</Card> : notRecorded.map(s => renderCard(s, false))}

        {recorded.length === 0 ? <Card style={{ textAlign: 'center', padding: 30, color: '#A29C95', fontSize: 13 }}>아직 기록된 성과가 없습니다</Card> : recorded.map(s => renderCard(s, true))}
      </div>
    </div>
  );
}

function NumInput({ value, onCommit, placeholder, style }) {
  const [v, setV] = useState(value == null || value === '' ? '' : String(value));
  const focused = useRef(false);
  useEffect(() => { if (!focused.current) setV(value == null || value === '' ? '' : String(value)); }, [value]);
  return <input type="number" value={v} onFocus={e => { focused.current = true; e.target.select(); }} onChange={e => setV(e.target.value)} onBlur={() => { focused.current = false; onCommit(v); }} onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); }} placeholder={placeholder} style={style} />;
}
function shiftMonth(base, n) { const p = base.split('-'); const d = new Date(Number(p[0]), Number(p[1]) - 1 + n, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function TargetEditor({ targets, onSet, unit }) {
  const [mo, setMo] = useState(TODAY.slice(0, 7));
  const nav = { border: '1px solid #E3E0DC', background: 'white', borderRadius: 6, cursor: 'pointer', padding: '4px 9px', fontSize: 12 };
  const tg = targets || {};
  const setKeys = Object.keys(tg).filter(k => tg[k]).sort();
  return (
    <div style={{ marginBottom: 12 }}>
      <div style={{ fontSize: 11, fontWeight: 600, color: '#6E6863', marginBottom: 6 }}>🎯 월별 목표 설정</div>
      <div style={{ background: '#F5F4F2', borderRadius: 8, padding: '10px 12px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
          <button onClick={() => setMo(shiftMonth(mo, -1))} style={nav}>◀</button>
          <span style={{ fontSize: 13, fontWeight: 700, color: G, minWidth: 78, textAlign: 'center' }}>{mo}</span>
          <button onClick={() => setMo(shiftMonth(mo, 1))} style={nav}>▶</button>
          <span style={{ fontSize: 11, color: '#6E6863' }}>목표 ({unit})</span>
        </div>
        <NumInput value={tg[mo]} onCommit={v => onSet(mo, v)} placeholder="이 달 목표 입력" style={{ width: 200, padding: '8px', borderRadius: 8, border: '1px solid #E3E0DC', fontSize: 13, boxSizing: 'border-box' }} />
        {setKeys.length > 0 && (
          <div style={{ marginTop: 8, display: 'flex', flexWrap: 'wrap', gap: 6 }}>
            {setKeys.map(k => (
              <button key={k} onClick={() => setMo(k)} style={{ fontSize: 11, padding: '3px 8px', borderRadius: 6, border: 'none', cursor: 'pointer', background: k === mo ? G : '#E3E0DC', color: k === mo ? '#fff' : '#3A3631', fontWeight: 600 }}>{k} · {Number(tg[k]).toLocaleString()}</button>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function MainKpiModal({ data, setData, onClose, edit }) {
  const [name, setName] = useState(edit ? edit.name : '');
  const [unit, setUnit] = useState(edit ? edit.unit : '원');
  const save = () => {
    if (!name.trim()) { alert('KPI 이름을 입력하세요'); return; }
    const u = unit.trim() || '개';
    if (edit) setData(d => ({ ...d, mainKpis: d.mainKpis.map(mk => mk.id === edit.id ? { ...mk, name: name.trim(), unit: u } : mk) }));
    else setData(d => ({ ...d, mainKpis: [...(d.mainKpis || []), { id: 'm' + Date.now(), name: name.trim(), unit: u, linkedKpiIds: [], targets: {}, manuals: [] }] }));
    onClose();
  };
  return (
    <ModalShell title={edit ? '메인 KPI 수정' : '메인 KPI 추가'} onClose={onClose}>
      <div><Lbl c="KPI 이름" /><Inp value={name} onChange={setName} placeholder="예: 총매출 / 신규고객 / 전환율" /></div>
      <div><Lbl c="단위" /><Inp value={unit} onChange={setUnit} placeholder="원 / 명 / % / 건" /></div>
      <div style={{ display: 'flex', gap: 8 }}><Btn v="gold" onClick={save} style={{ flex: 1 }}>{edit ? '수정' : '추가'}</Btn><Btn v="secondary" onClick={onClose}>취소</Btn></div>
    </ModalShell>
  );
}

function TabKpi({ data, setData }) {
  const [pStart, setPStart] = useState(monthRange(0).start);
  const [pEnd, setPEnd] = useState(monthRange(0).end);
  const [expanded, setExpanded] = useState(null);
  const [editLink, setEditLink] = useState(null);
  const [mkEdit, setMkEdit] = useState(undefined);
  const mainKpis = data.mainKpis || [];
  const logs = data.kpiLogs || [];
  const rangeMonths = monthsInRange(pStart, pEnd);
  const isSingleMonth = rangeMonths.length === 1;
  const sumForPlan = planId => logs.filter(l => l.planId === planId && l.periodStart <= pEnd && l.periodEnd >= pStart).reduce((a, l) => a + l.value, 0);
  const sumForKpi = kid => logs.filter(l => l.kpiId === kid && l.periodStart <= pEnd && l.periodEnd >= pStart).reduce((a, l) => a + l.value, 0);
  const logsForKpi = kid => logs.filter(l => l.kpiId === kid && l.periodStart <= pEnd && l.periodEnd >= pStart);
  const logsForPlan = planId => logs.filter(l => l.planId === planId && l.periodStart <= pEnd && l.periodEnd >= pStart);
  const plansOfOutput = oid => data.plans.filter(p => p.outputId === oid);
  const sumForOutput = oid => plansOfOutput(oid).reduce((a, p) => a + sumForPlan(p.id), 0);
  const outOf = pid => { const p = data.plans.find(x => x.id === pid); return p ? data.outputs.find(o => o.id === p.outputId) : null; };
  const effTarget = kpi => { const t = (kpi && kpi.targets) || {}; const keys = Object.keys(t); if (keys.length) { return rangeMonths.reduce((acc, mo) => { const v = t[mo.key] || 0; return isSingleMonth ? v : acc + (mo.totalDays ? v / mo.totalDays * mo.days : 0); }, 0); } return Number(kpi && kpi.target) || 0; };

  const presetDays = days => { setPStart(addDay(TODAY, -days)); setPEnd(TODAY); };
  const presetMonth = offset => { const r = monthRange(offset); setPStart(r.start); setPEnd(r.end); };
  const isActivePreset = (s, e) => pStart === s && pEnd === e;

  const setMainMonth = (mkId, key, val) => setData(d => ({ ...d, mainKpis: d.mainKpis.map(mk => mk.id === mkId ? { ...mk, targets: { ...(mk.targets || {}), [key]: Number(val) || 0 } } : mk) }));
  const setOutMonth = (oid, key, val) => setData(d => ({ ...d, outputs: d.outputs.map(o => o.id === oid && o.kpi ? { ...o, kpi: { ...o.kpi, targets: { ...(o.kpi.targets || {}), [key]: Number(val) || 0 } } } : o) }));
  const setPlanKpiMonth = (pid, kid, key, val) => setData(d => ({ ...d, plans: d.plans.map(p => p.id === pid ? { ...p, kpis: (p.kpis || []).map(k => k.id === kid ? { ...k, targets: { ...(k.targets || {}), [key]: Number(val) || 0 } } : k) } : p) }));
  const toggleLink = (mkId, kid) => setData(d => ({ ...d, mainKpis: d.mainKpis.map(mk => { if (mk.id !== mkId) return mk; const cur = mk.linkedKpiIds || []; return { ...mk, linkedKpiIds: cur.includes(kid) ? cur.filter(x => x !== kid) : [...cur, kid] }; }) }));
  const addManual = mkId => setData(d => ({ ...d, mainKpis: d.mainKpis.map(mk => mk.id === mkId ? { ...mk, manuals: [...(mk.manuals || []), { id: Date.now(), value: 0, note: '' }] } : mk) }));
  const updManual = (mkId, mId, field, val) => setData(d => ({ ...d, mainKpis: d.mainKpis.map(mk => mk.id === mkId ? { ...mk, manuals: (mk.manuals || []).map(m => m.id === mId ? { ...m, [field]: field === 'value' ? (Number(val) || 0) : val } : m) } : mk) }));
  const delManual = (mkId, mId) => setData(d => ({ ...d, mainKpis: d.mainKpis.map(mk => mk.id === mkId ? { ...mk, manuals: (mk.manuals || []).filter(m => m.id !== mId) } : mk) }));

  const allPlanKpis = []; data.plans.forEach(p => (p.kpis || []).forEach(k => allPlanKpis.push({ plan: p, kpi: k })));
  const findKpi = kid => { for (const p of data.plans) { const k = (p.kpis || []).find(x => x.id === kid); if (k) return { plan: p, kpi: k }; } return null; };
  const kpiOutputs = data.outputs.filter(o => o.kpi || data.plans.some(p => p.outputId === o.id && (p.kpis && p.kpis.length))).sort((a, b) => { const ci = n => { const i = data.categories.findIndex(c => c.name === n); return i < 0 ? 999 : i; }; return ci(a.type) - ci(b.type); });


  const KpiHeader = ({ title, achieved, target, unit, openKey, accent, sub }) => {
    const pr = pct(achieved, target); const done = target > 0 && pr >= 100; const open = expanded === openKey;
    return (
      <div onClick={() => setExpanded(open ? null : openKey)} style={{ cursor: 'pointer' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap', marginBottom: 10 }}>
          <div style={{ flex: '1 1 200px' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}><span style={{ fontSize: 15, fontWeight: 800 }}>{title}</span><span style={{ fontSize: 11, color: '#A29C95' }}>{open ? '▲' : '▼'}</span></div>
            {sub && <div style={{ fontSize: 11, color: '#6E6863', marginTop: 2 }}>{sub}</div>}
          </div>
          <div style={{ textAlign: 'right' }}>
            <div style={{ fontSize: 20, fontWeight: 800, color: done ? '#1FA463' : accent }}>{achieved.toLocaleString()}</div>
            <div style={{ fontSize: 11, color: '#A29C95' }}>/ {Math.round(target).toLocaleString()} {unit}</div>
          </div>
          {done && <Badge label="✓ 달성" color="#1FA463" />}
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{ flex: 1 }}><Bar v={achieved} m={target || 1} /></div>
          <span style={{ fontSize: 13, fontWeight: 700, color: done ? '#1FA463' : pr < 70 ? '#E53935' : '#E08700', minWidth: 45, textAlign: 'right' }}>{target > 0 ? pr : 0}%</span>
        </div>
      </div>
    );
  };

  return (
    <div style={{ padding: 20 }}>
      <div style={{ fontSize: 17, fontWeight: 700, color: G, marginBottom: 14 }}>KPI 관리</div>

      <Card style={{ marginBottom: 16 }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: G, marginBottom: 10 }}>📅 집계 기간</div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr auto 1fr', alignItems: 'center', gap: 8, marginBottom: 10 }}>
          {inp(pStart, setPStart, 'date')}<span style={{ color: '#A29C95' }}>~</span>{inp(pEnd, setPEnd, 'date')}
        </div>
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
          {[['이번 달', () => presetMonth(0), monthRange(0)], ['지난 달', () => presetMonth(-1), monthRange(-1)]].map(([l, fn, r]) => (
            <button key={l} onClick={fn} style={{ padding: '5px 12px', borderRadius: 20, border: '1px solid ' + (isActivePreset(r.start, r.end) ? G : '#E3E0DC'), background: isActivePreset(r.start, r.end) ? G : 'white', color: isActivePreset(r.start, r.end) ? 'white' : '#3A3631', cursor: 'pointer', fontSize: 12, fontWeight: 600 }}>{l}</button>
          ))}
          {[['최근 7일', 7], ['최근 30일', 30], ['최근 90일', 90]].map(([l, dd]) => {
            const act = isActivePreset(addDay(TODAY, -dd), TODAY);
            return <button key={l} onClick={() => presetDays(dd)} style={{ padding: '5px 12px', borderRadius: 20, border: '1px solid ' + (act ? G : '#E3E0DC'), background: act ? G : 'white', color: act ? 'white' : '#3A3631', cursor: 'pointer', fontSize: 12, fontWeight: 600 }}>{l}</button>;
          })}
        </div>
      </Card>

      <div style={{ marginBottom: 24 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10 }}>
          <span style={{ fontSize: 14, fontWeight: 800, color: GO }}>⭐ 메인 KPI</span>
          <span style={{ fontSize: 11, color: '#A29C95' }}>전사 전체 목표</span>
          <button onClick={() => setMkEdit(null)} style={{ marginLeft: 'auto', fontSize: 12, padding: '5px 12px', borderRadius: 7, border: 'none', background: GO, color: 'white', cursor: 'pointer', fontWeight: 700 }}>+ 메인 KPI 추가</button>
        </div>
        {mkEdit !== undefined && <MainKpiModal data={data} setData={setData} edit={mkEdit} onClose={() => setMkEdit(undefined)} />}
        {mainKpis.map(mk => {
          const linkedIds = mk.linkedKpiIds || [];
          const linked = linkedIds.map(kid => findKpi(kid)).filter(Boolean);
          const linkedSum = linkedIds.reduce((a, kid) => a + sumForKpi(kid), 0);
          const manuals = mk.manuals || [];
          const manualSum = manuals.reduce((a, m) => a + (m.value || 0), 0);
          const achieved = linkedSum + manualSum;
          const target = effTarget(mk);
          const linking = editLink === mk.id;
          return (
            <Card key={mk.id} style={{ marginBottom: 10, borderLeft: '4px solid ' + GO }}>
              <KpiHeader title={mk.name} achieved={achieved} target={target} unit={mk.unit} openKey={'main-' + mk.id} accent={GO} sub={`연결 ${linked.length}개${manuals.length > 0 ? ` · 수동 ${manuals.length}건` : ''}`} />
              {expanded === 'main-' + mk.id && (
                <div style={{ marginTop: 12, borderTop: '1px solid #F5F4F2', paddingTop: 12 }}>
                  <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 6, marginBottom: 10 }}><button onClick={() => setMkEdit(mk)} style={{ padding: '4px 10px', borderRadius: 6, border: '1px solid ' + G, background: 'white', color: G, cursor: 'pointer', fontSize: 11, fontWeight: 600 }}>✏️ 수정</button><button onClick={() => setData(d => moveToTrash(d, 'mainKpi', mk.id))} style={{ padding: '4px 10px', borderRadius: 6, border: '1px solid #E53935', background: 'white', color: '#E53935', cursor: 'pointer', fontSize: 11, fontWeight: 600 }}>🗑 삭제 (휴지통)</button></div>
                  <TargetEditor targets={mk.targets} onSet={(k, v) => setMainMonth(mk.id, k, v)} unit={mk.unit} />
                  <div style={{ display: 'flex', gap: 8, marginBottom: 14, flexWrap: 'wrap' }}>
                    <div style={{ flex: 1, minWidth: 130, background: '#F5F4F2', borderRadius: 8, padding: '8px 12px' }}><div style={{ fontSize: 10, color: '#6E6863' }}>연결 KPI 합산</div><div style={{ fontSize: 15, fontWeight: 700, color: G }}>{linkedSum.toLocaleString()}</div></div>
                    <div style={{ flex: 1, minWidth: 130, background: '#FAF6EE', borderRadius: 8, padding: '8px 12px' }}><div style={{ fontSize: 10, color: '#6E6863' }}>수동 입력 합계</div><div style={{ fontSize: 15, fontWeight: 700, color: GO }}>{manualSum.toLocaleString()}</div></div>
                  </div>
                  <div style={{ marginBottom: 14 }}>
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 6 }}>
                      <div style={{ fontSize: 11, fontWeight: 600, color: '#6E6863' }}>✏️ 수동 입력 ({mk.unit})</div>
                      <button onClick={() => addManual(mk.id)} style={{ fontSize: 11, padding: '3px 10px', borderRadius: 6, border: 'none', background: GO, color: 'white', cursor: 'pointer', fontWeight: 600 }}>+ 추가</button>
                    </div>
                    {manuals.length === 0 ? <div style={{ fontSize: 12, color: '#A29C95' }}>직접 입력한 값이 없습니다</div> :
                      manuals.map(m => (
                        <div key={m.id} style={{ display: 'flex', gap: 6, marginBottom: 6, alignItems: 'flex-start' }}>
                          <NumInput value={m.value} onCommit={v => updManual(mk.id, m.id, 'value', v)} placeholder="값" style={{ width: 100, padding: '8px', borderRadius: 8, border: '1px solid #E3E0DC', fontSize: 13, boxSizing: 'border-box', flexShrink: 0 }} />
                          <input value={m.note || ''} onChange={e => updManual(mk.id, m.id, 'note', e.target.value)} placeholder="설명 (예: 오프라인 팝업 매출)" style={{ flex: 1, padding: '8px', borderRadius: 8, border: '1px solid #E3E0DC', fontSize: 13, boxSizing: 'border-box' }} />
                          <button onClick={() => delManual(mk.id, m.id)} style={{ border: 'none', background: '#F5F4F2', borderRadius: 8, color: '#A29C95', cursor: 'pointer', width: 34, height: 35, fontSize: 16, flexShrink: 0 }}>×</button>
                        </div>
                      ))}
                  </div>
                  <div>

                      <button onClick={() => setEditLink(linking ? null : mk.id)} style={{ fontSize: 11, padding: '3px 10px', borderRadius: 6, border: '1px solid ' + G, background: linking ? G : 'white', color: linking ? 'white' : G, cursor: 'pointer', fontWeight: 600 }}>{linking ? '완료' : 'KPI 연결 편집'}</button>
                    </div>
                    {linking ? (
                      <div style={{ background: '#F5F4F2', borderRadius: 8, padding: 10 }}>
                        {allPlanKpis.length === 0 ? <div style={{ fontSize: 12, color: '#A29C95' }}>연결 가능한 KPI가 없습니다</div> :
                          allPlanKpis.map(({ plan: p, kpi: k }) => { const on = linkedIds.includes(k.id); const out = outOf(p.id); return (
                            <label key={k.id} onClick={() => toggleLink(mk.id, k.id)} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '6px 4px', cursor: 'pointer' }}>
