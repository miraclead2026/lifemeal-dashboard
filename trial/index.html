<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>라이프밀 체험단 관리</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
  :root{
    --green:#2e7d32; --green-bg:#f0faf2; --orange:#e65100; --red:#c62828;
    --line:#e3e6ec; --ink:#222; --mute:#767b85; --bg:#f2f4f8; --card:#fff;
  }
  *{box-sizing:border-box}
  body{font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);
       color:var(--ink);line-height:1.55;font-size:14px;margin:0}
  header{background:var(--green);color:#fff;padding:14px 20px;display:flex;
         align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;font-weight:800}
  header .sp{flex:1}
  select,input,textarea,button{font-family:inherit;font-size:13px}
  select,input,textarea{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
  header select{border:none;padding:6px 10px;border-radius:6px}
  button{padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;
         cursor:pointer}
  button:hover{background:#f7f8fa}
  button.primary{background:var(--green);color:#fff;border-color:var(--green)}
  button.primary:hover{filter:brightness(1.08)}
  button.danger{color:var(--red);border-color:#f3d4d4}
  button:disabled{opacity:.45;cursor:not-allowed}
  nav{display:flex;gap:2px;background:#fff;border-bottom:1px solid var(--line);
      padding:0 12px;overflow-x:auto}
  nav button{border:none;border-radius:0;border-bottom:2px solid transparent;
             padding:11px 15px;background:none;color:var(--mute);font-weight:700;white-space:nowrap}
  nav button.on{color:var(--green);border-bottom-color:var(--green)}
  main{padding:18px;max-width:1240px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
        padding:16px;margin-bottom:16px}
  .card h2{font-size:14px;margin:0 0 12px;font-weight:800}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{border-bottom:1px solid var(--line);padding:8px 7px;text-align:left;vertical-align:top}
  th{background:#fafbfc;font-weight:700;font-size:12px;color:#555;white-space:nowrap}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .score{font-weight:800;font-size:15px}
  .sub{font-size:11.5px;color:var(--mute);line-height:1.45}
  .tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;
       background:#eef1f5;color:#555;margin:1px 2px 1px 0;white-space:nowrap}
  .tag.ok{background:var(--green-bg);color:var(--green)}
  .tag.warn{background:#fff4e5;color:var(--orange)}
  .tag.bad{background:#fdecec;color:var(--red)}
  .empty{color:var(--mute);padding:26px;text-align:center}
  .banner{padding:9px 12px;border-radius:8px;margin-bottom:12px;font-size:12.5px}
  .banner.warn{background:#fff4e5;color:#8a4b00;border:1px solid #ffd9a8}
  .banner.err{background:#fdecec;color:#8a1c1c;border:1px solid #f3c2c2}
  .mvp{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px}
  .mvp .m{border:1px solid var(--line);border-radius:9px;padding:11px}
  .mvp .m.gold{border-color:#f0c14b;background:#fffdf3}
  .mvp .m.silver{border-color:#cfd4da;background:#fbfcfd}
  .mvp .m.bronze{border-color:#dcb18b;background:#fdf8f3}
  .mvp .nm{font-weight:800}
  dialog{border:none;border-radius:12px;padding:0;max-width:520px;width:94%}
  dialog::backdrop{background:rgba(0,0,0,.4)}
  .dlg-b{padding:18px}
  .dlg-f{padding:12px 18px;background:#fafbfc;border-top:1px solid var(--line);
         display:flex;gap:8px;justify-content:flex-end}
  .fld{margin-bottom:10px}
  .fld label{display:block;font-size:12px;font-weight:700;margin-bottom:3px;color:#444}
  .fld input,.fld select,.fld textarea{width:100%}
  #status{font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.2)}
  .muted-row{opacity:.5}
</style>
</head>
<body>

<header>
  <h1>🌿 라이프밀 체험단 관리</h1>
  <select id="cohortSel"></select>
  <span class="sp"></span>
  <span id="status">연결 중…</span>
</header>

<nav>
  <button data-tab="participants" class="on">참가자</button>
  <button data-tab="posts">게시물 접수</button>
  <button data-tab="scoring">채점 현황</button>
  <button data-tab="report">보고서</button>
  <button data-tab="settings">기수 설정</button>
</nav>

<main id="view"><div class="empty">불러오는 중…</div></main>

<dialog id="dlg"><form method="dialog">
  <div class="dlg-b"><h2 id="dlgTitle" style="margin:0 0 14px;font-size:15px"></h2>
    <div id="dlgBody"></div></div>
  <div class="dlg-f">
    <button value="cancel">취소</button>
    <button value="ok" class="primary" id="dlgOk">저장</button>
  </div>
</form></dialog>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   라이프밀 체험단 관리 페이지

   설계 원칙 두 가지 — 이걸 어기면 과거 사고가 재발한다.

   1) 총점은 저장하지 않는다. 항상 computeTotal() 로 파생 계산한다.
      3기 데이터는 total_score 를 저장했다가 스토리 건수/점수 혼동, 크로스채널
      보너스 누락 같은 불일치가 생겼다. 계산식은 scripts/verify_formula.py 의
      compute_total() 과 **완전히 동일해야 한다**(21/21 회귀 테스트로 고정).

   2) 채점 필드(scores·autoCheck·flags·scoringStatus)는 이 페이지가 쓰지 않는다.
      서버 보안규칙이 role=='scorer' 만 허용하므로 시도해도 401 이다.
      담당자가 AI 채점을 실수로 덮어쓰는 걸 구조적으로 막는 장치다.

   쓰기는 항상 **필드 단위**로 한다. 통짜 set() 은 다른 담당자의 동시 수정을
   덮어쓴다(대시보드 /dashboard 가 겪은 2026-07-23 데이터 소실의 원인).
   ═══════════════════════════════════════════════════════════════════════════ */

firebase.initializeApp({
  apiKey: "AIzaSyDwMAa-vs5zRZd2Y5SHfYh67TXfRcECTBA",
  databaseURL: "https://lifemeal-f0d71-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "lifemeal-f0d71"
});
const db = firebase.database();

const $ = s => document.querySelector(s);
const el = (t, a = {}, ...kids) => {
  const n = document.createElement(t);
  for (const [k, v] of Object.entries(a)) {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c.nodeType ? c : String(c));
  return n;
};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let COHORT = null, DATA = {}, TAB = 'participants', READY = false;

const setStatus = (t, bad) => {
  const s = $('#status'); s.textContent = t;
  s.style.background = bad ? 'rgba(255,120,120,.35)' : 'rgba(255,255,255,.2)';
};

/* ── 채점 규칙 기본값 ─────────────────────────────────────────────────────
   /trials/{기수}/rules 가 있으면 그걸 쓰고, 없으면 이 값으로 떨어진다.
   verify_formula.py 의 DEFAULT_RULES 와 같은 값이어야 한다. */
const FALLBACK_RULES = {
  basePerPost: 20,
  perExtraPost: { instagram: 10, blog: 20 },
  perStory: 2, perCrossPost: 2,
  minMedia: 10, minChars: 1000,
  penaltyMedia: -10, penaltyChars: -10, penaltyPerMissingTag: -5
};
const rules = () => Object.assign({}, FALLBACK_RULES, DATA.rules || {});

const obj = o => o && typeof o === 'object' ? o : {};
const list = o => Object.entries(obj(o)).map(([id, v]) => ({ id, ...v }));
const avg = xs => xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 0;

/* 게시물 1건의 감점(음수). 추가글은 감점 미적용(2026-06-29 정책).
   미디어·글자수·해시태그 감점은 블로그 전용이다. */
function postDeduction(post, channel, R) {
  if (post.type === '추가' || channel !== 'blog') return 0;
  const f = obj(post.flags);
  let t = 0;
  if (f.image_insufficient) t += R.penaltyMedia;
  if (f.char_insufficient) t += R.penaltyChars;
  t += R.penaltyPerMissingTag * (f.missing_tags || []).length;
  return t;
}

/* ★ 총점 정본. scripts/verify_formula.py 의 compute_total() 과 동일해야 한다. */
function computeTotal(pid) {
  const R = rules();
  const p = obj(DATA.participants)[pid];
  if (!p) return { total: 0, parts: {} };
  const channel = p.channel === 'instagram' ? 'instagram' : 'blog';

  const posts = list(DATA.posts).filter(x => x.pid === pid);
  const nMand = posts.filter(x => (x.type || '의무') === '의무').length;
  const nExtra = posts.filter(x => x.type === '추가').length;
  const base = nMand * R.basePerPost + nExtra * R.perExtraPost[channel];

  const content = avg(posts.map(x => obj(obj(x.scores).content).total)
    .filter(v => typeof v === 'number'));
  const auth = avg(posts.map(x => obj(obj(x.scores).authenticity).total)
    .filter(v => typeof v === 'number'));
  const ded = posts.reduce((a, x) => a + postDeduction(x, channel, R), 0);

  const stories = list(DATA.stories).filter(s => s.pid === pid)
    .reduce((a, s) => a + (s.count || 0), 0);
  const cross = list(DATA.crossPosts).filter(c => c.pid === pid)
    .reduce((a, c) => a + (c.count || 0), 0);

  const total = base + content + auth + ded
    + stories * R.perStory + cross * R.perCrossPost;
  return {
    total, parts: { base, content, auth, ded, stories, cross, nPosts: posts.length, nExtra },
    posts, channel
  };
}

const fmt = n => Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/0$/, '');

/* 채점이 아직 안 끝난 게시물이 있으면 총점은 잠정이다. */
const isProvisional = pid => list(DATA.posts)
  .filter(x => x.pid === pid)
  .some(x => x.scoringStatus !== 'final');

/* ── 쓰기 헬퍼 ────────────────────────────────────────────────────────────
   게시물은 서버 규칙상 통짜 수정이 막혀 있다($postId 의 .write 는 생성·삭제만).
   그래서 필드마다 개별 set() 을 날린다 — 동시 편집 충돌도 이 방식이 안전하다. */
async function setFields(basePath, patch) {
  const ops = Object.entries(patch)
    .map(([k, v]) => db.ref(`${basePath}/${k}`).set(v ?? null));
  await Promise.all(ops);
}
async function writeLog(kind, text) {
  const id = 'L' + Date.now().toString(36);
  await db.ref(`/trials/${COHORT}/log/${id}`).set({
    ts: new Date().toISOString(), actor: 'page', kind, text
  });
}
function guard(p) {
  return p.catch(e => {
    const denied = /permission|denied|401/i.test(e.message || '');
    setStatus(denied ? '권한 거부됨' : '저장 실패', true);
    alert(denied
      ? '이 항목은 이 페이지에서 수정할 수 없습니다.\n\n채점 결과(내용·진정성·자동체크)는 채점 워커만 기록할 수 있도록 서버에서 막고 있습니다.'
      : '저장에 실패했습니다: ' + e.message);
    throw e;
  });
}

/* ── 입력 대화상자 ────────────────────────────────────────────────────────*/
function askForm(title, fields, onOk) {
  const body = $('#dlgBody'); body.innerHTML = '';
  const inputs = {};
  for (const f of fields) {
    const wrap = el('div', { class: 'fld' }, el('label', {}, f.label));
    let inp;
    if (f.type === 'select') {
      inp = el('select', {});
      for (const o of f.options) {
        const opt = el('option', { value: o.value ?? o }, o.label ?? o);
        if ((o.value ?? o) === f.value) opt.selected = true;
        inp.append(opt);
      }
    } else if (f.type === 'textarea') {
      inp = el('textarea', { rows: f.rows || 4 }); inp.value = f.value ?? '';
    } else {
      inp = el('input', { type: f.type || 'text', placeholder: f.placeholder || '' });
      inp.value = f.value ?? '';
    }
    inputs[f.key] = inp; wrap.append(inp); body.append(wrap);
  }
  $('#dlgTitle').textContent = title;
  const dlg = $('#dlg');
  dlg.onclose = () => {
    if (dlg.returnValue !== 'ok') return;
    const out = {};
    for (const [k, i] of Object.entries(inputs)) out[k] = i.value.trim();
    onOk(out);
  };
  dlg.showModal();
}

/* ══════════════════════ 탭: 참가자 ══════════════════════════════════════ */
function viewParticipants() {
  const ps = list(DATA.participants);
  const wrap = el('div');

  wrap.append(el('div', { class: 'card' },
    el('div', { class: 'row' },
      el('h2', { style: 'margin:0;flex:1' }, `참가자 ${ps.length}명`),
      el('button', {
        class: 'primary', onclick: () => askForm('참가자 추가', [
          { key: 'name', label: '이름' },
          { key: 'handle', label: '핸들 / 블로그 ID', placeholder: 'sul.dong2 또는 freshday9656' },
          {
            key: 'channel', label: '채널', type: 'select',
            options: [{ value: 'instagram', label: '인스타그램' }, { value: 'blog', label: '블로그' }]
          }
        ], async v => {
          if (!v.name || !v.handle) return alert('이름과 핸들은 필수입니다.');
          const pid = v.handle.replace(/[.$#\[\]\/]/g, '_');
          if (obj(DATA.participants)[pid]) return alert('이미 등록된 핸들입니다.');
          await guard(db.ref(`/trials/${COHORT}/participants/${pid}`).set({
            name: v.name, handle: v.handle, channel: v.channel, status: '활동중',
            delivery: '발송전',
            profileUrl: v.channel === 'instagram'
              ? `https://www.instagram.com/${v.handle}/`
              : `https://blog.naver.com/${v.handle}`
          }));
          await writeLog('decision', `참가자 추가: ${v.name} (${v.handle}, ${v.channel})`);
        })
      }, '+ 참가자 추가'))));

  for (const ch of ['instagram', 'blog']) {
    const rows = ps.filter(p => p.channel === ch)
      .map(p => ({ p, t: computeTotal(p.id) }))
      .sort((a, b) => b.t.total - a.t.total);
    if (!rows.length) continue;

    const tb = el('tbody');
    rows.forEach(({ p, t }, i) => {
      const prov = isProvisional(p.id);
      tb.append(el('tr', { class: p.status === '중도이탈' ? 'muted-row' : '' },
        el('td', { class: 'num' }, i + 1),
        el('td', {},
          el('div', { style: 'font-weight:700' }, p.name),
          el('a', {
            class: 'sub', href: p.profileUrl || '#', target: '_blank',
            style: 'color:#5b7fb5;text-decoration:none'
          }, p.handle)),
        el('td', {}, el('span', { class: 'tag' }, `게시물 ${t.parts.nPosts}`),
          t.parts.stories ? el('span', { class: 'tag' }, `스토리 ${t.parts.stories}`) : null,
          t.parts.cross ? el('span', { class: 'tag' }, `크로스 ${t.parts.cross}`) : null),
        el('td', {},
          el('select', {
            onchange: e => guard(db.ref(
              `/trials/${COHORT}/participants/${p.id}/delivery`).set(e.target.value))
          }, ...['발송전', '발송완료', '수령확인'].map(v =>
            el('option', { value: v, ...(p.delivery === v ? { selected: '' } : {}) }, v)))),
        el('td', {},
          el('select', {
            onchange: e => guard(db.ref(
              `/trials/${COHORT}/participants/${p.id}/status`).set(e.target.value))
          }, ...['활동중', '중도이탈'].map(v =>
            el('option', { value: v, ...(p.status === v ? { selected: '' } : {}) }, v)))),
        el('td', { class: 'num' },
          el('div', { class: 'score' }, fmt(t.total)),
          prov ? el('div', { class: 'sub', style: 'color:#e65100' }, '잠정') : null),
        el('td', {},
          el('button', {
            onclick: () => askForm(`${p.name} 메모`, [
              { key: 'memo', label: '메모', type: 'textarea', value: p.memo || '' }
            ], v => guard(db.ref(`/trials/${COHORT}/participants/${p.id}/memo`)
              .set(v.memo || null)))
          }, p.memo ? '메모✓' : '메모'),
          el('button', {
            class: 'danger', onclick: async () => {
              if (!confirm(`${p.name} 님을 삭제할까요?\n게시물·스토리 기록은 남습니다.`)) return;
              await guard(db.ref(`/trials/${COHORT}/participants/${p.id}`).remove());
              await writeLog('decision', `참가자 삭제: ${p.name}`);
            }
          }, '삭제'))));
    });

    wrap.append(el('div', { class: 'card' },
      el('h2', {}, ch === 'instagram' ? '📸 인스타그램' : '📝 블로그'),
      el('table', {},
        el('thead', {}, el('tr', {},
          ...['#', '이름 / 계정', '활동', '배송', '상태', '현재 점수', ''].map(h =>
            el('th', {}, h)))), tb)));
  }
  return wrap;
}

/* ══════════════════════ 탭: 게시물 접수 ═════════════════════════════════ */
function addPostDialog(preset = {}) {
  const ps = list(DATA.participants);
  if (!ps.length) return alert('참가자를 먼저 등록하세요.');
  askForm('게시물 접수', [
    {
      key: 'pid', label: '참가자', type: 'select', value: preset.pid,
      options: ps.map(p => ({ value: p.id, label: `${p.name} (${p.handle})` }))
    },
    { key: 'week', label: '주차', type: 'number', value: preset.week ?? 1 },
    {
      key: 'type', label: '구분', type: 'select', value: preset.type || '의무',
      options: ['의무', '추가']
    },
    { key: 'url', label: 'URL', value: preset.url || '', placeholder: 'https://…' },
    {
      key: 'date', label: '게시일', type: 'date',
      value: preset.date || new Date().toISOString().slice(0, 10)
    }
  ], async v => {
    if (!v.url) return alert('URL 은 필수입니다.');
    await savePost(v);
  });
}

async function savePost(v) {
  const seq = list(DATA.posts).filter(x =>
    x.pid === v.pid && String(x.week) === String(v.week) && x.type === v.type).length + 1;
  const id = `${v.pid}_w${v.week}_${v.type === '추가' ? 'x' : 'm'}${seq}`;
  await guard(db.ref(`/trials/${COHORT}/posts/${id}`).set({
    pid: v.pid, week: Number(v.week), type: v.type, url: v.url, date: v.date,
    submittedBy: 'page', submittedAt: new Date().toISOString()
  }));
  // scoringStatus 는 워커 전용 필드라 여기서 못 쓴다. 필드가 없으면 워커가
  // '미채점'으로 간주해 큐에 넣는다.
  const p = obj(DATA.participants)[v.pid];
  await writeLog('decision', `게시물 접수: ${p ? p.name : v.pid} ${v.week}주 ${v.type} — ${v.url}`);
}

/* 카카오톡 export 붙여넣기 → URL 추출. 발신자 표기가 [이름/채널] 형태라
   이름으로 참가자를 역매칭한다. */
function parseKakao(text) {
  const out = [];
  const lines = text.split(/\r?\n/);
  let curDate = '';
  const ps = list(DATA.participants);
  for (const line of lines) {
    const d = line.match(/-{3,}\s*(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/);
    if (d) {
      curDate = `${d[1]}-${String(d[2]).padStart(2, '0')}-${String(d[3]).padStart(2, '0')}`;
      continue;
    }
    const urls = line.match(/https?:\/\/[^\s]+/g);
    if (!urls) continue;
    const who = line.match(/^\[([^\]/]+)(?:\/[^\]]*)?\]/);
    const name = who ? who[1].trim() : '';
    const hit = ps.find(p => p.name === name);
    for (const u of urls) {
      const kind = /instagram\.com\/(p|reel)\//.test(u) ? 'instagram'
        : /blog\.naver\.com|m\.blog\.naver\.com/.test(u) ? 'blog'
          : /instagram\.com\/stories\//.test(u) ? 'story' : null;
      if (!kind) continue;
      out.push({ url: u.replace(/[),.]+$/, ''), date: curDate, name, pid: hit ? hit.id : '', kind });
    }
  }
  const known = new Set(list(DATA.posts).map(p => p.url));
  return out.filter(o => !known.has(o.url));
}

function viewScoring() {
  const posts = list(DATA.posts);
  const pending = posts.filter(p => !p.scoringStatus || p.scoringStatus === 'pending');
  const prov = posts.filter(p => p.scoringStatus === 'provisional');
  const blocked = posts.filter(p => p.scoringStatus === 'blocked');
  const done = posts.filter(p => p.scoringStatus === 'final');
  const wrap = el('div');

  wrap.append(el('div', { class: 'card' },
    el('h2', {}, '채점 진행'),
    el('div', { class: 'row' },
      ...[['미채점', pending.length, 'warn'], ['잠정', prov.length, 'warn'],
      ['보류', blocked.length, 'bad'], ['완료', done.length, 'ok']]
        .map(([l, n, c]) => el('div', {
          style: 'flex:1;min-width:110px;border:1px solid var(--line);border-radius:8px;padding:10px'
        },
          el('div', { class: 'sub' }, l),
          el('div', { class: 'score', style: 'font-size:21px' }, String(n))))),
    el('div', { class: 'sub', style: 'margin-top:10px' },
      '내용·진정성 채점은 사진과 본문을 직접 확인해야 하므로 이 페이지에서 입력할 수 없습니다. ' +
      '접수된 게시물은 채점 워커가 가져가 채점하고, 결과가 여기에 자동으로 반영됩니다.')));

  if (pending.length) {
    const tb = el('tbody');
    for (const p of pending) {
      const who = obj(DATA.participants)[p.pid];
      tb.append(el('tr', {},
        el('td', {}, who ? who.name : p.pid),
        el('td', {}, `${p.week}주 ${p.type || '의무'}`),
        el('td', {}, el('a', { href: p.url, target: '_blank', style: 'color:#5b7fb5;font-size:12px' },
          (p.url || '').slice(0, 62))),
        el('td', { class: 'sub' }, p.submittedAt ? p.submittedAt.slice(0, 10) : '')));
    }
    wrap.append(el('div', { class: 'card' },
      el('h2', {}, `채점 대기 ${pending.length}건`),
      el('table', {}, el('thead', {}, el('tr', {},
        ...['참가자', '주차', 'URL', '접수일'].map(h => el('th', {}, h)))), tb)));
  }

  if (blocked.length) {
    wrap.append(el('div', { class: 'card' },
      el('div', { class: 'banner err' }, '아래 게시물은 채점을 진행할 수 없습니다. 원인을 해소한 뒤 다시 접수하세요.'),
      el('table', {}, el('tbody', {}, ...blocked.map(p => {
        const who = obj(DATA.participants)[p.pid];
        return el('tr', {},
          el('td', {}, who ? who.name : p.pid),
          el('td', {}, `${p.week}주`),
          el('td', { class: 'sub' }, p.scoreError || '원인 미기록'));
      })))));
  }

  // 채점 세부 (내부용 — 하위 항목까지 보여준다)
  const dtb = el('tbody');
  for (const p of posts.filter(x => obj(x.scores).content)) {
    const who = obj(DATA.participants)[p.pid];
    const c = obj(p.scores).content, a = obj(p.scores).authenticity || {};
    dtb.append(el('tr', {},
      el('td', {}, who ? who.name : p.pid),
      el('td', {}, `${p.week}주 ${p.type || '의무'}`),
      el('td', { class: 'num' }, el('b', {}, `${c.total ?? '—'}`), '/30',
        el('div', { class: 'sub' },
          `스토리 ${c.story_richness ?? '—'} · 특징 ${c.product_features ?? '—'} · 완성도 ${c.info_completeness ?? '—'}`)),
      el('td', { class: 'num' }, el('b', {}, `${a.total ?? '—'}`), '/30',
        el('div', { class: 'sub' },
          `경험 ${a.personal_experience ?? '—'} · 문체 ${a.natural_tone ?? '—'} · 독창 ${a.originality ?? '—'}`)),
      el('td', { class: 'sub', style: 'max-width:330px' },
        [c.reason, a.reason].filter(Boolean).join(' / '))));
  }
  if (dtb.children.length) {
    wrap.append(el('div', { class: 'card' },
      el('h2', {}, '채점 세부 (내부용)'),
      el('table', {}, el('thead', {}, el('tr', {},
        ...['참가자', '주차', '내용', '진정성', '채점 근거'].map(h => el('th', {}, h)))), dtb)));
  }
  return wrap;

/* ══════════════════════ 탭: 보고서 ══════════════════════════════════════ */
function viewReport() {
  const wrap = el('div');
  const info = obj(DATA.info);
  const R = rules();

  const ranked = ch => list(DATA.participants).filter(p => p.channel === ch)
    .map(p => ({ p, t: computeTotal(p.id) }))
    .sort((a, b) => b.t.total - a.t.total);

  wrap.append(el('div', { class: 'card' },
    el('h2', {}, info.name || COHORT),
    el('div', { class: 'sub' },
      `${info.startDate || '—'} ~ ${info.endDate || '—'}` +
      (info.deadline ? ` · 채점 마감 ${info.deadline}` : '') +
      ` · 상태 ${info.status || '진행중'}`),
    list(DATA.posts).some(p => p.scoringStatus !== 'final')
      ? el('div', { class: 'banner warn', style: 'margin-top:10px' },
        '채점이 끝나지 않은 게시물이 있어 아래 순위는 잠정입니다.') : null));

  for (const ch of ['instagram', 'blog']) {
    const rows = ranked(ch);
    if (!rows.length) continue;
    const top = rows.slice(0, info.mvpCount || 3);

    wrap.append(el('div', { class: 'card' },
      el('h2', {}, ch === 'instagram' ? '📸 인스타그램 MVP' : '📝 블로그 MVP'),
      el('div', { class: 'mvp' }, ...top.map(({ p, t }, i) =>
        el('div', { class: 'm ' + ['gold', 'silver', 'bronze'][i] },
          el('div', { class: 'row' },
            el('span', { style: 'font-size:20px' }, ['🥇', '🥈', '🥉'][i]),
            el('div', { style: 'flex:1' },
              el('div', { class: 'nm' }, p.name),
              el('div', { class: 'sub' }, p.handle)),
            el('div', { class: 'score', style: 'font-size:19px' }, fmt(t.total))),
          el('div', { class: 'sub', style: 'margin-top:6px' },
            `기본 ${t.parts.base} · 내용 ${fmt(t.parts.content)} · 진정성 ${fmt(t.parts.auth)}` +
            (t.parts.ded ? ` · 감점 ${t.parts.ded}` : '') +
            (t.parts.stories ? ` · 스토리 ${t.parts.stories}건` : '') +
            (t.parts.cross ? ` · 크로스 ${t.parts.cross}건` : ''))))),
      el('table', { style: 'margin-top:12px' },
        el('thead', {}, el('tr', {}, ...['#', '이름', '게시물', '내용', '진정성', '감점', '가산', '총점']
          .map(h => el('th', {}, h)))),
        el('tbody', {}, ...rows.map(({ p, t }, i) => el('tr', {},
          el('td', { class: 'num' }, i + 1),
          el('td', {}, p.name, el('div', { class: 'sub' }, p.handle)),
          el('td', { class: 'num' }, `${t.parts.nPosts}건`,
            t.parts.nExtra ? el('div', { class: 'sub' }, `추가 ${t.parts.nExtra}`) : null),
          el('td', { class: 'num' }, fmt(t.parts.content)),
          el('td', { class: 'num' }, fmt(t.parts.auth)),
          el('td', { class: 'num', style: t.parts.ded ? 'color:#c62828' : '' },
            t.parts.ded ? String(t.parts.ded) : '—'),
          el('td', { class: 'num' },
            (t.parts.stories * R.perStory + t.parts.cross * R.perCrossPost) || '—'),
          el('td', { class: 'num' }, el('span', { class: 'score' }, fmt(t.total)))))))));
  }

  // 미달 항목
  const short = [];
  for (const p of list(DATA.posts)) {
    const f = obj(p.flags);
    const who = obj(DATA.participants)[p.pid];
    if (!who || who.channel !== 'blog' || p.type === '추가') continue;
    const items = [];
    if (f.image_insufficient) items.push('미디어 부족');
    if (f.char_insufficient) items.push('글자수 부족');
    (f.missing_tags || []).forEach(t => items.push(`#${t} 누락`));
    if (items.length) short.push({ name: who.name, week: p.week, items });
  }
  if (short.length) {
    wrap.append(el('div', { class: 'card' },
      el('h2', {}, '미달 항목'),
      el('table', {}, el('tbody', {}, ...short.map(s => el('tr', {},
        el('td', {}, s.name), el('td', {}, `${s.week}주`),
        el('td', {}, ...s.items.map(i => el('span', { class: 'tag bad' }, i)))))))));
  }

  // 운영 로그
  const logs = list(DATA.log).sort((a, b) => (b.ts || '').localeCompare(a.ts || ''));
  if (logs.length) {
    wrap.append(el('div', { class: 'card' },
      el('h2', {}, `운영 기록 ${logs.length}건`),
      el('div', { style: 'max-height:340px;overflow:auto' },
        el('table', {}, el('tbody', {}, ...logs.map(l => el('tr', {},
          el('td', { class: 'sub', style: 'white-space:nowrap' }, (l.ts || '').slice(0, 10)),
          el('td', {}, el('span', {
            class: 'tag ' + (l.kind === 'policy' ? 'warn' : l.kind === 'correction' ? 'bad' : '')
          }, l.kind || '')),
          el('td', { class: 'sub' }, l.text || ''))))))));
  }
  return wrap;
}

  infoBox.append(el('div', { class: 'fld', style: 'flex:1;min-width:150px' },
    el('label', {}, '상태'), stSel));
  wrap.append(el('div', { class: 'card' }, el('h2', {}, '기수 정보'), infoBox));

  const ruleFields = [
    ['basePerPost', '게시물 기본점'], ['perStory', '스토리 1건'],
    ['perCrossPost', '크로스채널 1건'], ['minMedia', '미디어 하한'],
    ['minChars', '글자수 하한'], ['penaltyMedia', '미디어 미달 감점'],
    ['penaltyChars', '글자수 미달 감점'], ['penaltyPerMissingTag', '태그 누락 감점(개당)'],
  ];
  const ruleBox = el('div', { class: 'row' });
  for (const [k, label] of ruleFields) {
    const inp = el('input', { type: 'number', value: R[k] });
    inp.addEventListener('change', async () => {
      const old = R[k], val = Number(inp.value);
      await guard(db.ref(`/trials/${COHORT}/rules/${k}`).set(val));
      await writeLog('policy', `채점 규칙 변경: ${label} ${old} → ${val}`);
    });
    ruleBox.append(el('div', { class: 'fld', style: 'flex:1;min-width:150px' },
      el('label', {}, label), inp));
  }
  for (const ch of ['instagram', 'blog']) {
    const inp = el('input', { type: 'number', value: obj(R.perExtraPost)[ch] });
    inp.addEventListener('change', async () => {
      const old = obj(R.perExtraPost)[ch], val = Number(inp.value);
      await guard(db.ref(`/trials/${COHORT}/rules/perExtraPost/${ch}`).set(val));
      await writeLog('policy', `채점 규칙 변경: 추가글 기본점(${ch}) ${old} → ${val}`);
    });
    ruleBox.append(el('div', { class: 'fld', style: 'flex:1;min-width:150px' },
      el('label', {}, `추가글 기본점 (${ch === 'instagram' ? '인스타' : '블로그'})`), inp));
  }
  wrap.append(el('div', { class: 'card' },
    el('h2', {}, '채점 규칙'),
    el('div', { class: 'banner warn' },
      '규칙을 바꾸면 모든 참가자의 총점이 즉시 다시 계산됩니다. 변경 내역은 운영 기록에 자동으로 남습니다. ' +
      '미디어·글자수·해시태그 감점은 블로그 의무 게시글에만 적용됩니다.'),
    ruleBox));

  wrap.append(el('div', { class: 'card' },
    el('h2', {}, '새 기수 만들기'),
    el('div', { class: 'row' },
      el('button', {
        class: 'primary', onclick: () => askForm('새 기수', [
          { key: 'id', label: '기수 ID (영문)', placeholder: 'routiner-4' },
          { key: 'name', label: '기수 이름', placeholder: '라이프밀 루티너 4기' },
          { key: 'startDate', label: '시작일', type: 'date' },
          { key: 'endDate', label: '종료일', type: 'date' }
        ], async v => {
          if (!/^[A-Za-z0-9._-]+$/.test(v.id)) return alert('기수 ID 는 영문·숫자·-_ 만 가능합니다.');
          if (obj(await (await db.ref('/trials').once('value')).val())[v.id])
            return alert('이미 있는 기수 ID 입니다.');
          await guard(db.ref(`/trials/${v.id}/info`).set({
            name: v.name || v.id, startDate: v.startDate, endDate: v.endDate,
            weeks: 2, mvpCount: 3, status: '준비'
          }));
          await guard(db.ref(`/trials/${v.id}/rules`).set(FALLBACK_RULES));
          location.hash = v.id; location.reload();
        })
      }, '+ 새 기수')),
    el('div', { class: 'sub', style: 'margin-top:8px' },
      '새 기수는 위 기본 채점 규칙으로 시작합니다. 만든 뒤 규칙을 조정하세요.')));
  return wrap;
}

/* ══════════════════════ 렌더 / 구독 ════════════════════════════════════ */
const VIEWS = {
  participants: viewParticipants, posts: viewPosts,
  scoring: viewScoring, report: viewReport, settings: viewSettings
};

function render() {
  const v = $('#view'); v.innerHTML = '';
  if (!READY) { v.append(el('div', { class: 'empty' }, '불러오는 중…')); return; }
  if (!COHORT) { v.append(el('div', { class: 'empty' }, '기수가 없습니다. 기수 설정에서 만들어 주세요.')); return; }
  try { v.append(VIEWS[TAB]()); }
  catch (e) {
    v.append(el('div', { class: 'banner err' }, '화면을 그리는 중 오류: ' + e.message));
    console.error(e);
  }
}

document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); TAB = b.dataset.tab; render();
}));

let dataRef = null;
function subscribe(cohort) {
  if (dataRef) dataRef.off();
  COHORT = cohort; location.hash = cohort; READY = false; render();
  dataRef = db.ref(`/trials/${cohort}`);
  dataRef.on('value', snap => {
    DATA = snap.val() || {};
    READY = true;
    setStatus('연결됨');
    render();
  }, err => {
    setStatus('읽기 실패', true);
    $('#view').innerHTML = '';
    $('#view').append(el('div', { class: 'banner err' },
      '데이터를 읽지 못했습니다: ' + err.message));
  });
}

firebase.auth().signInAnonymously().catch(e => {
  setStatus('로그인 실패', true);
  alert('로그인에 실패했습니다. 저장이 되지 않습니다.\n' + e.message);
});

firebase.auth().onAuthStateChanged(async user => {
  if (!user) return;
  setStatus('기수 목록 조회 중…');
  let cohorts = [];
  try {
    const snap = await db.ref('/trials').once('value');
    cohorts = Object.keys(snap.val() || {}).filter(k => !k.startsWith('_'));
  } catch (e) {
    setStatus('읽기 실패', true);
    return alert('기수 목록을 읽지 못했습니다: ' + e.message);
  }

  const sel = $('#cohortSel'); sel.innerHTML = '';
  for (const c of cohorts) sel.append(el('option', { value: c }, c));
  sel.addEventListener('change', () => subscribe(sel.value));

  const want = location.hash.slice(1);
  const start = cohorts.includes(want) ? want : cohorts[cohorts.length - 1];
  if (!start) { READY = true; render(); return; }
  sel.value = start;
  subscribe(start);
});
</script>
